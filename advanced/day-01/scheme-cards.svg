<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Цепочка вызовов для next меньше или равно today: каждый шаг со знаком вопроса возвращает ошибку valueOf наверх до catch">
    <rect x="10" y="10" width="440" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="24" y="29" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">next &lt;= today · 13.10.1</text>
    <text x="24" y="46" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">r = ? IsLessThan(today, next, false)</text>

    <rect x="10" y="70" width="440" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="24" y="89" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">IsLessThan · 7.2.12, LeftFirst = false</text>
    <text x="24" y="106" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">py = ? ToPrimitive(next, number)</text>

    <rect x="10" y="130" width="440" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="24" y="149" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">ToPrimitive · 7.1.1: Symbol.toPrimitive нет</text>
    <text x="24" y="166" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">return ? OrdinaryToPrimitive(next, number)</text>

    <rect x="10" y="190" width="440" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="24" y="209" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">OrdinaryToPrimitive · 7.1.1.1: number — сначала valueOf</text>
    <text x="24" y="226" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">result = ? Call(valueOf, next)</text>

    <rect x="10" y="250" width="440" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="24" y="269" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">PlainDate.prototype.valueOf · предложение Temporal</text>
    <text x="24" y="286" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">throw TypeError → запись throw</text>

    <line x1="230" y1="54" x2="230" y2="68" stroke="#6366f1" stroke-width="2"/>
    <line x1="230" y1="114" x2="230" y2="128" stroke="#6366f1" stroke-width="2"/>
    <line x1="230" y1="174" x2="230" y2="188" stroke="#6366f1" stroke-width="2"/>
    <line x1="230" y1="234" x2="230" y2="248" stroke="#6366f1" stroke-width="2"/>

    <path d="M 458 272 L 520 272 L 520 32 L 466 32" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <polygon points="458,32 470,26 470,38" fill="#ef4444"/>
    <text x="530" y="120" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">каждый ?</text>
    <text x="530" y="138" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">возвращает</text>
    <text x="530" y="156" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">запись throw</text>
    <text x="530" y="174" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">выше — до catch</text>

    <text x="320" y="318" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Вниз — вызовы шагов со знаком ?, вверх — ошибка, пока её не поймает catch</text>
</svg>
