<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img" aria-label="Кто что определяет: стандарт ECMA-262, реализация Chrome, хозяин — все браузеры и стандарт HTML">
    <rect x="10" y="10" width="200" height="180" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="110" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3730a3">ECMA-262 · язык</text>
    <text x="24" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">типы, операторы, объекты</text>
    <text x="24" y="82" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">Array, Math, JSON, Promise</text>
    <text x="24" y="102" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">строгий режим, модули</text>
    <text x="24" y="132" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#3730a3">нет ввода и вывода:</text>
    <text x="24" y="152" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">console, alert, setTimeout —</text>
    <text x="24" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">в тексте ни разу</text>

    <rect x="220" y="10" width="200" height="180" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="320" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400e">Реализация · Chrome</text>
    <text x="234" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">implementation-defined:</text>
    <text x="234" y="80" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">Date("12.10.2026")</text>
    <text x="234" y="106" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">…-approximated:</text>
    <text x="234" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">Math.sin(Math.PI)</text>
    <text x="234" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">свои расширения:</text>
    <text x="234" y="168" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">captureStackTrace</text>

    <rect x="430" y="10" width="200" height="180" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="530" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">Хозяин · все браузеры</text>
    <text x="444" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">стандарт HTML</text>
    <text x="444" y="88" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">host-defined, прил. D:</text>
    <text x="444" y="106" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">очередь таймеров,</text>
    <text x="444" y="124" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">глобальный объект</text>
    <text x="444" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">окружение хозяина:</text>
    <text x="444" y="168" font-family="Consolas, monospace" font-size="11.5" fill="#166534">console, document</text>

    <rect x="10" y="204" width="620" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="320" y="223" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Реализации и хозяину отдано только то, что стандарт сам пометил;</text>
    <text x="320" y="241" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">всё остальное обязано работать, как написано (глава 2).</text>
</svg>
