<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-label="Карта ECMA-262 2026: обозначения, среда выполнения, язык, библиотека, модель памяти, приложения и дни курса 3">
    <text x="320" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e1b4b">ECMA-262, редакция 2026: главы 1–4 — вступление и обзор (сегодня)</text>

