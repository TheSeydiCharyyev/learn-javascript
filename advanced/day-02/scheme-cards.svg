<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="Строка const step равно this.progress.get(id)?.step ?? 1 разобрана на шестнадцать токенов четырёх видов">
    <text x="10" y="22" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1e1b4b">16 токенов, пробелы выброшены</text>

    <rect x="10" y="34" width="52" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="36" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3730a3">const</text>
    <rect x="68" y="34" width="44" height="34" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="90" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">step</text>
    <rect x="118" y="34" width="24" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="130" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">=</text>
    <rect x="148" y="34" width="44" height="34" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/><text x="170" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#3730a3">this</text>
    <rect x="198" y="34" width="20" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="208" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">.</text>
    <rect x="224" y="34" width="72" height="34" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="260" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">progress</text>
    <rect x="302" y="34" width="20" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="312" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">.</text>
    <rect x="328" y="34" width="36" height="34" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="346" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">get</text>
    <rect x="370" y="34" width="20" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="380" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">(</text>
    <rect x="396" y="34" width="28" height="34" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="410" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">id</text>
    <rect x="430" y="34" width="20" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="440" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">)</text>
    <rect x="456" y="34" width="28" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/><text x="470" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">?.</text>
    <rect x="490" y="34" width="44" height="34" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="512" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">step</text>
    <rect x="540" y="34" width="28" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/><text x="554" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">??</text>
    <rect x="574" y="34" width="20" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/><text x="584" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">1</text>
    <rect x="600" y="34" width="20" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="610" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">;</text>

    <rect x="10" y="92" width="14" height="14" rx="3" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="32" y="104" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">зарезервированное слово (IdentifierName из списка ReservedWord): const, this</text>
    <rect x="10" y="116" width="14" height="14" rx="3" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="32" y="128" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">имя (IdentifierName): step, progress, get, id — get здесь просто имя метода</text>
    <rect x="10" y="140" width="14" height="14" rx="3" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="32" y="152" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">знак пунктуации (Punctuator); ?. и ?? — по одному токену: самый длинный кусок</text>
    <rect x="10" y="164" width="14" height="14" rx="3" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="32" y="176" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">числовой литерал (NumericLiteral): 1 — подробно завтра</text>
    <text x="10" y="200" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">После ?. стоит буква s, а не цифра, — поэтому проверка впереди пропускает необязательную цепочку.</text>
</svg>
