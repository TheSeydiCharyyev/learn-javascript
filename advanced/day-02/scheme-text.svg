<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Путь от текста к выполнению: кодовые точки, лексическая грамматика, поток токенов, синтаксическая грамматика, дерево разбора, ранние ошибки, выполнение">
    <rect x="10" y="10" width="190" height="66" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#3730a3">1. Исходный текст</text>
    <text x="105" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">кодовые точки, глава 11</text>
    <text x="105" y="67" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3730a3">let mark = 4; // оценка</text>

    <rect x="225" y="10" width="190" height="66" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#5b21b6">2. Лексика ::</text>
    <text x="320" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6">глава 12, слева направо,</text>
    <text x="320" y="67" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6">самый длинный кусок</text>

    <rect x="440" y="10" width="190" height="66" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="535" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#075985">3. Элементы ввода</text>
    <text x="535" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#075985">let · mark · = · 4 · ;</text>
    <text x="535" y="67" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#075985">без пробелов и комментария</text>

    <line x1="200" y1="43" x2="223" y2="43" stroke="#6366f1" stroke-width="2"/>
    <line x1="415" y1="43" x2="438" y2="43" stroke="#6366f1" stroke-width="2"/>

    <rect x="440" y="110" width="190" height="66" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="535" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">4. Синтаксис :</text>
    <text x="535" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">главы 13–16, цель —</text>
    <text x="535" y="167" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">Script или Module</text>

    <rect x="225" y="110" width="190" height="66" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">5. Дерево разбора</text>
    <text x="320" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">Script → … →</text>
    <text x="320" y="167" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">LexicalDeclaration</text>

    <rect x="10" y="110" width="190" height="66" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">6. Ранние ошибки</text>
    <text x="105" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">до первой строки</text>
    <text x="105" y="167" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">(день 1, раздел 11)</text>

    <line x1="535" y1="76" x2="535" y2="108" stroke="#6366f1" stroke-width="2"/>
    <line x1="440" y1="143" x2="417" y2="143" stroke="#6366f1" stroke-width="2"/>
    <line x1="225" y1="143" x2="202" y2="143" stroke="#6366f1" stroke-width="2"/>

    <rect x="10" y="210" width="620" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="320" y="234" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">7. Выполнение — алгоритмы дня 1</text>
    <text x="320" y="254" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ошибка на шагах 2–6 — SyntaxError, и скрипт не начинается.</text>
    <text x="320" y="272" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ошибка на шаге 7 — уже во время работы, после выполненных строк.</text>
    <line x1="105" y1="176" x2="105" y2="208" stroke="#6366f1" stroke-width="2"/>
</svg>
