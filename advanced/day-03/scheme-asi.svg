<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img" aria-label="Три правила вставки точки с запятой и общий запрет: не пустая инструкция и не заголовок for">
    <rect x="10" y="10" width="290" height="50" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="155" y="31" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#3730a3">Правило 1. Токен не подходит</text>
    <text x="155" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#3730a3">грамматике (offending token)</text>

    <rect x="10" y="96" width="290" height="62" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="155" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Перед ним перевод строки,</text>
    <text x="155" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">или это «}», или «)» конца do-while?</text>

    <rect x="10" y="196" width="140" height="48" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="80" y="217" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">да</text>
    <text x="80" y="235" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">; перед токеном</text>
    <rect x="160" y="196" width="140" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="230" y="217" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">нет</text>
    <text x="230" y="235" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">SyntaxError</text>

    <line x1="155" y1="60" x2="155" y2="94" stroke="#6366f1" stroke-width="2"/>
    <line x1="100" y1="158" x2="80" y2="194" stroke="#6366f1" stroke-width="2"/>
    <line x1="210" y1="158" x2="230" y2="194" stroke="#6366f1" stroke-width="2"/>

    <rect x="340" y="10" width="290" height="62" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="485" y="31" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#5b21b6">Правило 2. Конец текста,</text>
    <text x="485" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6">а программа не сложилась —</text>
    <text x="485" y="64" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6">; в самом конце</text>

    <rect x="340" y="96" width="290" height="80" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="485" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#9a3412">Правило 3. Перевод строки там,</text>
    <text x="485" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9a3412">где [no LineTerminator here]</text>
    <text x="485" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">; перед токеном:</text>
    <text x="485" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9a3412">return⏎5 — это return; 5;</text>

    <rect x="10" y="272" width="620" height="40" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="320" y="289" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Запрет для всех трёх правил</text>
    <text x="320" y="305" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">; не вставляется, если станет пустой инструкцией или одной из двух ; в заголовке for</text>
</svg>
