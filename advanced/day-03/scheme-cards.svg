<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 235" role="img" aria-label="Строка счётчика разобрана на токены: шаблон дал голову, середину и хвост, между ними обычные токены">
    <text x="10" y="22" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1e1b4b">14 токенов: шаблон — это три из них</text>

    <rect x="10" y="34" width="62" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="41" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">counter</text>
    <rect x="78" y="34" width="20" height="32" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="88" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">.</text>
    <rect x="104" y="34" width="88" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="148" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">textContent</text>
    <rect x="198" y="34" width="24" height="32" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="210" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">=</text>
    <text x="236" y="55" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">обычные токены, цель InputElementDiv</text>

    <rect x="10" y="88" width="114" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/><text x="67" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">`На сегодня: ${</text>
    <rect x="130" y="88" width="48" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="154" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">cards</text>
    <rect x="184" y="88" width="20" height="32" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="194" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">.</text>
    <rect x="210" y="88" width="54" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="237" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">length</text>
    <rect x="270" y="88" width="60" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/><text x="300" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">} из ${</text>
    <rect x="336" y="88" width="42" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="357" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">deck</text>
    <rect x="384" y="88" width="20" height="32" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="394" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">.</text>
    <rect x="410" y="88" width="42" height="32" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/><text x="431" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#075985">size</text>
    <rect x="458" y="88" width="28" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2.5"/><text x="472" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">}`</text>
    <rect x="492" y="88" width="20" height="32" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/><text x="502" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9a3412">;</text>

    <text x="67" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">TemplateHead</text>
    <text x="300" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">TemplateMiddle</text>
    <text x="472" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">TemplateTail</text>

    <text x="10" y="176" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Между частями шаблона — обычные токены выражений: cards . length и deck . size.</text>
    <text x="10" y="198" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">После length грамматика ждёт конец подстановки — цель InputElementTemplateTail, и «} из ${» — один токен.</text>
    <text x="10" y="220" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаблон без подстановок, «`На сегодня всё`», был бы одним токеном NoSubstitutionTemplate.</text>
</svg>
