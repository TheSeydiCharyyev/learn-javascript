<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Два числовых литерала по частям: 1_050.95e-2 и 0xA0_B0n с названиями частей из грамматики">
    <text x="10" y="28" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1e1b4b">Десятичный литерал 1_050.95e-2</text>
    <rect x="10" y="38" width="170" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="95" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3730a3">1_050</text>
    <text x="95" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3730a3">DecimalIntegerLiteral</text>
    <rect x="190" y="38" width="60" height="54" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="220" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9a3412">.</text>
    <text x="220" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">точка</text>
    <rect x="260" y="38" width="120" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="320" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3730a3">95</text>
    <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3730a3">DecimalDigits</text>
    <rect x="390" y="38" width="110" height="54" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="445" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#075985">e-2</text>
    <text x="445" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">ExponentPart</text>
    <rect x="510" y="38" width="120" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="570" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#065f46">10.5095</text>
    <text x="570" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">значение</text>

    <text x="10" y="122" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1e1b4b">Шестнадцатеричный BigInt 0xA0_B0n</text>
    <rect x="10" y="132" width="110" height="54" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="65" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#9a3412">0x</text>
    <text x="65" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">приставка</text>
    <rect x="130" y="132" width="160" height="54" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
    <text x="210" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#3730a3">A0_B0</text>
    <text x="210" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#3730a3">HexDigits[+Sep]</text>
    <rect x="300" y="132" width="160" height="54" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="380" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#075985">n</text>
    <text x="380" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">BigIntLiteralSuffix</text>
    <rect x="470" y="132" width="160" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="550" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#065f46">41136n</text>
    <text x="550" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">значение, точное</text>

    <text x="10" y="214" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">_ стоит только между двумя цифрами: не в начале, не в конце, не два подряд,</text>
    <text x="10" y="234" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">не рядом с точкой, e и приставкой. При подсчёте значения разделители пропускаются.</text>
</svg>
