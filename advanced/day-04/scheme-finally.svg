<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="Функция g: блок try даёт запись throw, finally даёт запись return, итог — запись return">
    <rect x="10" y="10" width="190" height="84" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="105" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">B — блок try</text>
    <text x="105" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[[Type]]: throw</text>
    <text x="105" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[[Value]]: Error</text>

    <rect x="225" y="10" width="190" height="84" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="320" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#9a3412">F — finally</text>
    <text x="320" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9a3412">[[Type]]: return</text>
    <text x="320" y="74" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9a3412">[[Value]]: "ошибки нет"</text>

    <rect x="440" y="10" width="190" height="84" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="535" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">итог try</text>
    <text x="535" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">F не обычная —</text>
    <text x="535" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">возвращается F</text>

    <line x1="200" y1="52" x2="223" y2="52" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="415" y1="52" x2="438" y2="52" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="10" y="120" width="620" height="64" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="320" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Если бы finally завершился обычно, итогом стала бы B — и ошибка вылетела бы дальше.</text>
    <text x="320" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Запись return дошла до вызова g, и вызов вернул её [[Value]] как обычный результат.</text>
</svg>
