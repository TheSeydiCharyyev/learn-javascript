<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="Три Reference Record: свойство card.word, переменная word и ненайденное имя nope, и что с каждой делает GetValue">
    <rect x="10" y="10" width="200" height="112" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="110" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#075985">card.word</text>
    <text x="110" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#075985">[[Base]]: объект card</text>
    <text x="110" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#075985">[[ReferencedName]]: "word"</text>
    <text x="110" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#075985">GetValue: card.[[Get]]("word")</text>

    <rect x="220" y="10" width="200" height="112" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="320" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#5b21b6">word</text>
    <text x="320" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">[[Base]]: Environment Record</text>
    <text x="320" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">[[ReferencedName]]: "word"</text>
    <text x="320" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6">GetValue: значение привязки</text>

    <rect x="430" y="10" width="200" height="112" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="530" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#991b1b">nope</text>
    <text x="530" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[[Base]]: unresolvable</text>
    <text x="530" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[[ReferencedName]]: "nope"</text>
    <text x="530" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">GetValue: ReferenceError</text>

    <text x="10" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">typeof смотрит на ссылку раньше GetValue: для unresolvable — «undefined» без ошибки.</text>
    <text x="10" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">PutValue для unresolvable: в нестрогом коде — новое свойство глобального объекта,</text>
    <text x="10" y="194" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">в строгом ([[Strict]] — true) — ReferenceError.</text>
</svg>
