<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Слева восемь типов языка, справа типы спецификации в трёх группах: записи, коллекции и прочие">
    <rect x="10" y="10" width="250" height="236" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="135" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#5b21b6">Типы языка, 6.1 — восемь</text>
    <text x="135" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">в переменных и свойствах</text>
    <rect x="24" y="66" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="76" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Undefined</text>
    <rect x="142" y="66" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="194" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Null</text>
    <rect x="24" y="106" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="76" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Boolean</text>
    <rect x="142" y="106" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="194" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">String</text>
    <rect x="24" y="146" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="76" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Symbol</text>
    <rect x="142" y="146" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="194" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Number</text>
    <rect x="24" y="186" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="76" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">BigInt</text>
    <rect x="142" y="186" width="104" height="30" rx="6" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/><text x="194" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">Object</text>
    <text x="135" y="236" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">функция — Object с [[Call]]</text>

    <rect x="280" y="10" width="350" height="236" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="455" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Типы спецификации, 6.2</text>
    <text x="455" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">только внутри алгоритмов</text>
    <rect x="294" y="66" width="322" height="56" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="455" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">записи (Record)</text>
    <text x="455" y="106" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">Completion, Reference, Property Descriptor, PrivateElement…</text>
    <rect x="294" y="130" width="322" height="44" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="455" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">коллекции</text>
    <text x="455" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">List «1, 2», Set, Relation</text>
    <rect x="294" y="180" width="322" height="58" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="455" y="197" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">прочие</text>
    <text x="455" y="213" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">Enum, Environment Record, Abstract Closure,</text>
    <text x="455" y="229" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">Data Block, Private Name</text>

    <text x="10" y="272" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Слева — то, что можно напечатать в консоли. Справа — то, через что алгоритм это получает:</text>
    <text x="10" y="290" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">ошибка «вылетает» как запись throw, имя переменной ищется через Reference Record.</text>
</svg>
