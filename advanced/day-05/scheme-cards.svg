<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Обычный объект переводит ключ в строку, поэтому 1 и строка 1 — один ключ; Map сравнивает ключи по SameValue, и это разные ключи">
    <rect x="10" y="10" width="300" height="140" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#065f46">обычный объект</text>
    <text x="160" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">plain["1"]   plain[1]</text>
    <text x="160" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">ключ идёт через ToPropertyKey:</text>
    <text x="160" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">1 → «1», и это один ключ</text>
    <text x="160" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">нашёл в обоих случаях</text>

    <rect x="330" y="10" width="300" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="480" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Map</text>
    <text x="480" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">progress.get("1")</text>
    <text x="480" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">ключи сравнивает SameValue:</text>
    <text x="480" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">строка «1» и число 1 — разные типы</text>
    <text x="480" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">undefined</text>

    <text x="10" y="178" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Лечение — перевести ключ явно при чтении (Number(…)) или хранить в Map строки с самого начала;</text>
    <text x="10" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">== «находит» совпадение, но строгое сравнение и Map — нет, и это правильно.</text>
</svg>
