<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 312" role="img" aria-label="Лестница IsLooselyEqual: восемь ступеней от одного типа до ответа false">
    <rect x="10" y="10" width="620" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="22" y="31" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#5b21b6"><tspan font-weight="700">1.</tspan> Один тип — ответ даёт IsStrictlyEqual, как у ===</text>
    <rect x="10" y="48" width="620" height="32" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="22" y="69" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46"><tspan font-weight="700">2.</tspan> null и undefined (в любом порядке) — true; с чем-то ещё они не равны ничему</text>
    <rect x="10" y="86" width="620" height="32" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="22" y="107" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#075985"><tspan font-weight="700">3.</tspan> Number и String — строку через ToNumber, начать заново</text>
    <rect x="10" y="124" width="620" height="32" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="22" y="145" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#075985"><tspan font-weight="700">4.</tspan> BigInt и String — строку через StringToBigInt; не вышло — false</text>
    <rect x="10" y="162" width="620" height="32" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="22" y="183" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412"><tspan font-weight="700">5.</tspan> Boolean с любой стороны — его через ToNumber (true — 1, false — 0), начать заново</text>
    <rect x="10" y="200" width="620" height="32" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="22" y="221" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412"><tspan font-weight="700">6.</tspan> Объект и примитив — объект через ToPrimitive без подсказки, начать заново</text>
    <rect x="10" y="238" width="620" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="22" y="259" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="700">7.</tspan> BigInt и Number — сравнить математические значения (бесконечность не равна ничему)</text>
    <rect x="10" y="276" width="620" height="32" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="22" y="297" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b"><tspan font-weight="700">8.</tspan> Всё остальное — false: например, symbol и строка, null и 0</text>
</svg>
