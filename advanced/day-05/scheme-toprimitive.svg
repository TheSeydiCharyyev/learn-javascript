<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 286" role="img" aria-label="Путь ToPrimitive: не объект — вернуть, есть Symbol.toPrimitive — вызвать с подсказкой, иначе OrdinaryToPrimitive по порядку методов">
    <rect x="10" y="10" width="300" height="48" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="160" y="31" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#5b21b6">ToPrimitive(input, hint)</text>
    <text x="160" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">не объект — вернуть как есть</text>

    <rect x="10" y="84" width="300" height="62" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="160" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a3412">есть метод Symbol.toPrimitive?</text>
    <text x="160" y="123" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">вызвать с "default", "string" или "number";</text>
    <text x="160" y="139" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">так поступают Date и Symbol, подробно — день 17</text>

    <rect x="10" y="172" width="300" height="62" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="193" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">нет — OrdinaryToPrimitive</text>
    <text x="160" y="211" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">string: toString, потом valueOf</text>
    <text x="160" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">number или без подсказки: valueOf, потом toString</text>

    <line x1="160" y1="58" x2="160" y2="82" stroke="#8b5cf6" stroke-width="2"/>
    <line x1="160" y1="146" x2="160" y2="170" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="330" y="10" width="300" height="224" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="480" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">кто какую подсказку даёт</text>
    <text x="346" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">number</text>
    <text x="346" y="76" font-family="Consolas, monospace" font-size="11" fill="#334155">+x, x * 1, x &lt; y, Number(x)</text>
    <text x="346" y="106" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">string</text>
    <text x="346" y="124" font-family="Consolas, monospace" font-size="11" fill="#334155">String(x), `${x}`, obj[x]</text>
    <text x="346" y="154" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">без подсказки (как number)</text>
    <text x="346" y="172" font-family="Consolas, monospace" font-size="11" fill="#334155">x + y, x == y</text>
    <text x="346" y="204" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Результат — первый примитив;</text>
    <text x="346" y="222" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">если оба метода дали объект — TypeError</text>

    <text x="10" y="262" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Подсказка — пожелание, не приказ: valueOf может вернуть строку, и при hint number</text>
    <text x="10" y="280" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">ToPrimitive вернёт строку — дальше ToNumber переведёт её в число.</text>
</svg>
