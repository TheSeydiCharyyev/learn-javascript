<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Цвет 0xFF851B как три байта: FF — красный 255, 85 — зелёный 133, 1B — синий 27; с прозрачностью 0xFF851BCC сдвиг >> 24 даёт -1, а >>> 24 даёт 255">
    <rect x="10" y="10" width="60" height="40" rx="8" fill="#FF851B" stroke="#c2410c" stroke-width="1.5"/>
    <text x="84" y="28" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#334155">const color = 0xFF851B;</text>
    <text x="84" y="46" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">одно число 16745755 — три байта по 8 разрядов</text>

    <rect x="10" y="64" width="200" height="72" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">11111111</text>
    <text x="110" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">FF — красный, 255</text>
    <text x="110" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">color &gt;&gt; 16</text>

    <rect x="220" y="64" width="200" height="72" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="320" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#065f46">10000101</text>
    <text x="320" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">85 — зелёный, 133</text>
    <text x="320" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#065f46">(color &gt;&gt; 8) &amp; 0xFF</text>

    <rect x="430" y="64" width="200" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="530" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e40af">00011011</text>
    <text x="530" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1e40af">1B — синий, 27</text>
    <text x="530" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">color &amp; 0xFF</text>

    <text x="10" y="160" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Обратно — сдвинуть каждый байт на место и сложить разряды: (r &lt;&lt; 16) | (g &lt;&lt; 8) | b.</text>

    <rect x="10" y="174" width="620" height="66" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="194" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">С прозрачностью — четвёртый байт: 0xFF851BCC = 4286913484, больше 2³¹ − 1</text>
    <text x="22" y="213" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">rgba &gt;&gt; 24 даёт −1: ToInt32 сделал число отрицательным, слева вдвинулись единицы</text>
    <text x="22" y="231" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">rgba &gt;&gt;&gt; 24 даёт 255: ToUint32 и нули слева — верхний байт целиком</text>
</svg>
