<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" role="img" aria-label="Число -9 в 32 разрядах и результаты сдвигов: >> 2 вдвигает слева копии знака и даёт -3, >>> 2 вдвигает нули и даёт 1073741821, << 2 вдвигает нули справа и даёт -36">
    <text x="128" y="16" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">разряд 31</text>
    <text x="352" y="16" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">0</text>

    <rect x="10" y="24" width="620" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="42" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#334155">9</text>
    <text x="125" y="42" font-family="Consolas, monospace" font-size="12" fill="#334155"><tspan fill="#dc2626" font-weight="700">0</tspan>0000000 00000000 00000000 00001001</text>
    <text x="400" y="42" font-family="Consolas, monospace" font-size="12" fill="#334155">= 9</text>

    <rect x="10" y="56" width="620" height="26" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="74" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#334155">-9</text>
    <text x="125" y="74" font-family="Consolas, monospace" font-size="12" fill="#334155"><tspan fill="#dc2626" font-weight="700">1</tspan>1111111 11111111 11111111 11110111</text>
    <text x="400" y="74" font-family="Consolas, monospace" font-size="12" fill="#334155">= -9</text>

    <rect x="10" y="88" width="620" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="110" y="106" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">-9 &gt;&gt; 2</text>
    <text x="125" y="106" font-family="Consolas, monospace" font-size="12" fill="#334155"><tspan fill="#ea580c" font-weight="700">11</tspan>111111 11111111 11111111 11111101</text>
    <text x="400" y="106" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">= -3</text>
    <text x="500" y="106" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">слева копии знака</text>

    <rect x="10" y="120" width="620" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="110" y="138" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">-9 &gt;&gt;&gt; 2</text>
    <text x="125" y="138" font-family="Consolas, monospace" font-size="12" fill="#334155"><tspan fill="#ea580c" font-weight="700">00</tspan>111111 11111111 11111111 11111101</text>
    <text x="400" y="138" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">= 1073741821</text>
    <text x="500" y="138" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">слева нули</text>

    <rect x="10" y="152" width="620" height="26" rx="6" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1"/>
    <text x="110" y="170" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">-9 &lt;&lt; 2</text>
    <text x="125" y="170" font-family="Consolas, monospace" font-size="12" fill="#334155">11111111 11111111 11111111 110111<tspan fill="#ea580c" font-weight="700">00</tspan></text>
    <text x="400" y="170" font-family="Consolas, monospace" font-size="12" fill="#5b21b6">= -36</text>
    <text x="500" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">справа нули</text>

    <text x="10" y="200" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Красным — знаковый разряд 31, его вес −2³¹. Оранжевым — разряды, которые вдвинул сдвиг;</text>
    <text x="10" y="218" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">выпавшие с другого края разряды пропадают. Только &gt;&gt;&gt; читает результат без знака.</text>
</svg>
