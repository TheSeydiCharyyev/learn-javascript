<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="Пять шагов ToInt32 на двух примерах: 3e9 становится -1294967296, -2.9 становится -2">
    <text x="22" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">шаг ToInt32 (7.1.6)</text>
    <text x="450" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#5b21b6">3e9</text>
    <text x="570" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#5b21b6">-2.9</text>

    <rect x="10" y="30" width="620" height="34" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="22" y="51" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="700">1.</tspan> ToNumber — число из любого значения</text>
    <text x="450" y="51" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">3000000000</text>
    <text x="570" y="51" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">-2.9</text>

    <rect x="10" y="70" width="620" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="22" y="91" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b"><tspan font-weight="700">2.</tspan> NaN, ±Infinity, +0 или −0 — сразу ответ +0</text>
    <text x="450" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">дальше</text>
    <text x="570" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">дальше</text>

    <rect x="10" y="110" width="620" height="34" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="22" y="131" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155"><tspan font-weight="700">3.</tspan> truncate — отбросить дробь</text>
    <text x="450" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">3000000000</text>
    <text x="570" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">-2</text>

    <rect x="10" y="150" width="620" height="34" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="22" y="171" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#075985"><tspan font-weight="700">4.</tspan> modulo 2³² — остаток всегда от 0 до 2³² − 1</text>
    <text x="450" y="171" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#075985">3000000000</text>
    <text x="570" y="171" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#075985">4294967294</text>

    <rect x="10" y="190" width="620" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="22" y="211" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46"><tspan font-weight="700">5.</tspan> 2³¹ и больше — вычесть 2³²</text>
    <text x="450" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#065f46">-1294967296</text>
    <text x="570" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#065f46">-2</text>

    <text x="10" y="250" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Итог всегда от −2³¹ до 2³¹ − 1. ToUint32 — те же шаги без пятого: от 0 до 2³² − 1.</text>
</svg>
