<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="Код, операция главы 7 и внутренний метод под ней: шесть примеров от Object.keys до for...of">
    <text x="20" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">код</text>
    <text x="230" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">операция 7.3 / 7.4</text>
    <text x="440" y="20" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">внутренний метод (день 4)</text>

    <rect x="10" y="30" width="620" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="51" font-family="Consolas, monospace" font-size="11.5" fill="#334155">Object.keys(o)</text>
    <text x="230" y="51" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">EnumerableOwnProperties</text>
    <text x="440" y="51" font-family="Consolas, monospace" font-size="11" fill="#334155">[[OwnPropertyKeys]]</text>

    <rect x="10" y="68" width="620" height="32" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="20" y="89" font-family="Consolas, monospace" font-size="11.5" fill="#334155">Object.assign(t, s)</text>
    <text x="230" y="89" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Get, затем Set(…, true)</text>
    <text x="440" y="89" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Get]], [[Set]]</text>

    <rect x="10" y="106" width="620" height="32" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="127" font-family="Consolas, monospace" font-size="11.5" fill="#334155">{ ...s }</text>
    <text x="230" y="127" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">CopyDataProperties</text>
    <text x="440" y="127" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Get]], [[DefineOwnProperty]]</text>

    <rect x="10" y="144" width="620" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="165" font-family="Consolas, monospace" font-size="11.5" fill="#334155">[1, 2].map(f)</text>
    <text x="230" y="165" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Call</text>
    <text x="440" y="165" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Call]]</text>

    <rect x="10" y="182" width="620" height="32" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="203" font-family="Consolas, monospace" font-size="11.5" fill="#334155">Words.from(list)</text>
    <text x="230" y="203" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Construct</text>
    <text x="440" y="203" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Construct]]</text>

    <rect x="10" y="220" width="620" height="32" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="20" y="241" font-family="Consolas, monospace" font-size="11.5" fill="#334155">for (x of it)</text>
    <text x="230" y="241" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">GetIterator, IteratorClose</text>
    <text x="440" y="241" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">вызовы next и return</text>
</svg>
