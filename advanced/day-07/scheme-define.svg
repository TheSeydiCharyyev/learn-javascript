<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="Object.assign записывает через Set и задевает сеттеры и прототип получателя; spread определяет собственные свойства нового объекта">
    <rect x="10" y="10" width="300" height="150" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="160" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#9a3412">Object.assign(target, src)</text>
    <text x="160" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">Get из src, потом Set(target, key, v, true)</text>
    <text x="160" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">[[Set]] идёт по прототипам target:</text>
    <text x="160" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">сеттер — зовёт его (и __proto__ тоже),</text>
    <text x="160" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9a3412">«только чтение» — false, и Throw — TypeError</text>
    <text x="160" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">запись</text>

    <rect x="330" y="10" width="300" height="150" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#065f46">{ ...src }</text>
    <text x="480" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">Get из src, потом CreateDataPropertyOrThrow</text>
    <text x="480" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">[[DefineOwnProperty]] на новом объекте:</text>
    <text x="480" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">прототип не спрашивают,</text>
    <text x="480" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#065f46">всегда своё свойство-значение</text>
    <text x="480" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">определение</text>

    <text x="10" y="186" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Так же делятся и другие места языка: присваивание this.x = … — запись,</text>
    <text x="10" y="204" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">поле класса x = …, литерал { x: 1 } и Object.defineProperty — определение.</text>
</svg>
