<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="for...of по шагам: GetIterator создаёт запись, на каждом шаге цикл зовёт next, читает done и value; при выходе раньше конца IteratorClose зовёт return">
    <rect x="10" y="10" width="300" height="58" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="160" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">GetIterator(obj, sync)</text>
    <text x="160" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b21b6">[Symbol.iterator](), объект?, next — один раз</text>

    <rect x="10" y="88" width="300" height="78" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="160" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">шаг цикла (14.7.5.7)</text>
    <text x="160" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">Call([[NextMethod]]), результат — объект?</text>
    <text x="160" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">IteratorComplete, потом IteratorValue</text>

    <line x1="160" y1="68" x2="160" y2="86" stroke="#8b5cf6" stroke-width="2"/>

    <rect x="330" y="10" width="300" height="58" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="480" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">{ [[Iterator]], [[NextMethod]],</text>
    <text x="480" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">[[Done]] }</text>

    <rect x="330" y="88" width="300" height="36" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="480" y="111" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">done истинно — цикл кончился, return не зовут</text>

    <rect x="330" y="130" width="300" height="36" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="480" y="153" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">break, return, throw — IteratorClose: return()</text>

    <text x="10" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Тело цикла бросило — ошибка тела важнее любой ошибки из return; вышли тихо,</text>
    <text x="10" y="214" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">а return вернул не объект — TypeError. Так же закрывает и деструктуризация [first] = it.</text>
</svg>
