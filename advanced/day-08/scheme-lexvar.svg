<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="var a внутри блока if поднимается в список имён var всей функции, let b остаётся в лексическом списке блока">
    <defs>
        <marker id="d8-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="380" height="170" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="32" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">function f() {</text>
    <text x="22" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">VarDeclaredNames тела: «a»</text>

    <rect x="40" y="68" width="330" height="96" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="52" y="90" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#075985">if (ok) {</text>
    <text x="52" y="110" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">LexicallyDeclaredNames блока: «b»</text>
    <text x="72" y="134" font-family="Consolas, monospace" font-size="12" fill="#334155">var a = 1;</text>
    <text x="72" y="154" font-family="Consolas, monospace" font-size="12" fill="#334155">let b = 2;</text>
    <path d="M 160 128 L 330 128 L 330 44" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#d8-up)"/>

    <text x="410" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">var — сквозь блоки, if и циклы</text>
    <text x="410" y="50" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">до тела функции или скрипта</text>
    <text x="410" y="80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">let, const, class — в своём блоке</text>
    <text x="410" y="98" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">функция в блоке — тоже лексическая</text>
    <text x="410" y="128" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">функция наверху тела —</text>
    <text x="410" y="146" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">как var (8.2.8–8.2.11)</text>

    <text x="10" y="204" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ранняя ошибка (14.2.1): имя дважды в лексическом списке блока или и там, и среди его имён var.</text>
</svg>
