<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="Где NamedEvaluation даёт функции имя и где нет">
    <rect x="10" y="10" width="300" height="170" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="160" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">имя будет — NamedEvaluation</text>
    <text x="22" y="58" font-family="Consolas, monospace" font-size="11" fill="#065f46">const f = () =&gt; {}</text>
    <text x="22" y="80" font-family="Consolas, monospace" font-size="11" fill="#065f46">x ||= function () {}</text>
    <text x="22" y="102" font-family="Consolas, monospace" font-size="11" fill="#065f46">{ key: () =&gt; {} }</text>
    <text x="22" y="124" font-family="Consolas, monospace" font-size="11" fill="#065f46">{ a = () =&gt; {} } = obj</text>
    <text x="22" y="146" font-family="Consolas, monospace" font-size="11" fill="#065f46">class { field = () =&gt; {} }</text>
    <text x="22" y="168" font-family="Consolas, monospace" font-size="11" fill="#065f46">const g = (function () {})</text>

    <rect x="330" y="10" width="300" height="170" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="480" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">имени не будет — «»</text>
    <text x="342" y="58" font-family="Consolas, monospace" font-size="11" fill="#991b1b">obj.p = () =&gt; {}</text>
    <text x="342" y="80" font-family="Consolas, monospace" font-size="11" fill="#991b1b">const h = (0, function () {})</text>
    <text x="342" y="102" font-family="Consolas, monospace" font-size="11" fill="#991b1b">const k = x || function () {}</text>
    <text x="342" y="124" font-family="Consolas, monospace" font-size="11" fill="#991b1b">listen(() =&gt; {})</text>
    <text x="342" y="146" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[function () {}]</text>
    <text x="342" y="168" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">слева не имя или справа не определение</text>

    <text x="10" y="204" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Нужны оба условия: безымянное определение функции (IsAnonymousFunctionDefinition) и место с именем.</text>
</svg>
