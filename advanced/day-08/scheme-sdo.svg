<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 250" role="img" aria-label="Дерево разбора объявления let с деструктуризацией и операции над ним: статические — BoundNames, IsConstantDeclaration; выполнения — Evaluation, BindingInitialization, NamedEvaluation">
    <rect x="10" y="10" width="360" height="190" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="32" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0c4a6e">let [a, b = () =&gt; 1] = list;</text>
    <text x="22" y="62" font-family="Consolas, monospace" font-size="11" fill="#334155">LexicalDeclaration</text>
    <text x="42" y="84" font-family="Consolas, monospace" font-size="11" fill="#334155">LetOrConst: let</text>
    <text x="42" y="106" font-family="Consolas, monospace" font-size="11" fill="#334155">LexicalBinding</text>
    <text x="62" y="128" font-family="Consolas, monospace" font-size="11" fill="#334155">ArrayBindingPattern [a, b = …]</text>
    <text x="82" y="150" font-family="Consolas, monospace" font-size="11" fill="#334155">SingleNameBinding b = () =&gt; 1</text>
    <text x="62" y="172" font-family="Consolas, monospace" font-size="11" fill="#334155">Initializer = list</text>

    <rect x="390" y="10" width="240" height="90" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="510" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">статические — до выполнения</text>
    <text x="402" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">BoundNames → «a, b»</text>
    <text x="402" y="72" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">IsConstantDeclaration → false</text>
    <text x="402" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">ранние ошибки: нет ли повтора имён</text>

    <rect x="390" y="110" width="240" height="90" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="510" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">выполнения — Evaluation</text>
    <text x="402" y="154" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">Evaluation: list → значение</text>
    <text x="402" y="172" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">BindingInitialization: итератор (день 7)</text>
    <text x="402" y="190" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">NamedEvaluation «b» для () =&gt; 1</text>

    <text x="10" y="226" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Каждая операция — набор кусков, по одному на правило грамматики; узел дерева выбирает свой кусок,</text>
    <text x="10" y="244" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">а для правила «A : B» без своего куска операция передаётся к B.</text>
</svg>
