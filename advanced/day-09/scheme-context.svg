<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 230" role="img" aria-label="Стек контекстов в момент выполнения foo: сверху контекст foo, под ним bar, внизу скрипт; у каждого Function, Realm и переменные">
    <defs>
        <marker id="d9-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0369a1"/>
        </marker>
        <marker id="d9-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="400" height="52" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="22" y="31" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">foo — выполняемый контекст</text>
    <text x="22" y="51" font-family="Consolas, monospace" font-size="11" fill="#0c4a6e">Function: foo · Realm: страница · b = 21, a = 10</text>
    <rect x="10" y="72" width="400" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="93" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">bar — ждёт ответа foo</text>
    <text x="22" y="113" font-family="Consolas, monospace" font-size="11" fill="#334155">Function: bar · Realm: страница · x = 7, y = 3</text>
    <rect x="10" y="134" width="400" height="52" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="155" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">скрипт — ждёт ответа bar</text>
    <text x="22" y="175" font-family="Consolas, monospace" font-size="11" fill="#334155">Function: null · foo, bar, baz (ещё без значения)</text>

    <path d="M 440 170 L 440 30" stroke="#0369a1" stroke-width="2" fill="none" marker-end="url(#d9-up)"/>
    <text x="452" y="70" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#0369a1">вызов кладёт</text>
    <text x="452" y="88" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#0369a1">новый контекст</text>
    <text x="452" y="106" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#0369a1">наверх</text>
    <path d="M 600 30 L 600 170" stroke="#c2410c" stroke-width="2" fill="none" marker-end="url(#d9-down)"/>
    <text x="452" y="136" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#c2410c">return снимает</text>
    <text x="452" y="154" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#c2410c">его со стека</text>

    <text x="10" y="214" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Стек опустел — задание закончено (раздел 12).</text>
</svg>
