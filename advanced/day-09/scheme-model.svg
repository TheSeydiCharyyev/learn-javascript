<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 262" role="img" aria-label="Агент окна: один поток, стек контекстов, очередь заданий и куча; внутри два реалма — страницы и рамки. Рядом другой агент — worker со своим стеком, очередью, кучей и реалмом">
    <rect x="10" y="10" width="440" height="214" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">агент окна страницы — один поток</text>

    <rect x="22" y="44" width="130" height="118" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="87" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">стек контекстов</text>
    <rect x="34" y="72" width="106" height="22" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="87" y="87" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0c4a6e">foo</text>
    <rect x="34" y="100" width="106" height="22" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="87" y="115" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0c4a6e">bar</text>
    <rect x="34" y="128" width="106" height="22" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="87" y="143" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0c4a6e">скрипт</text>

    <rect x="164" y="44" width="130" height="118" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="229" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">очередь заданий</text>
    <text x="176" y="86" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">микрозадачи:</text>
    <text x="176" y="102" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">then, await</text>
    <text x="176" y="128" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">задачи:</text>
    <text x="176" y="144" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">таймер, щелчок</text>

    <rect x="306" y="44" width="130" height="118" rx="8" fill="#ffffff" stroke="#7dd3fc" stroke-width="1.5"/>
    <text x="371" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">куча объектов</text>
    <text x="318" y="86" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">массивы,</text>
    <text x="318" y="102" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">функции,</text>
    <text x="318" y="118" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">окна обоих</text>
    <text x="318" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">реалмов</text>

    <rect x="22" y="174" width="200" height="38" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="122" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">реалм страницы</text>
    <text x="122" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">window, Array, Object…</text>
    <rect x="236" y="174" width="200" height="38" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="336" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">реалм рамки iframe</text>
    <text x="336" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">свой window, свой Array</text>

    <rect x="470" y="10" width="160" height="214" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="550" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">другой агент</text>
    <text x="550" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">worker (курс 4)</text>
    <text x="482" y="82" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">свой поток</text>
    <text x="482" y="104" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">свой стек</text>
    <text x="482" y="126" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">своя очередь</text>
    <text x="482" y="148" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">своя куча</text>
    <text x="482" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">свой реалм: self</text>

    <text x="10" y="248" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Реалмов в агенте сколько угодно; стек, очередь и поток — по одному на агент.</text>
</svg>
