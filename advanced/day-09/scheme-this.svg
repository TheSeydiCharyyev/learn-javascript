<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Поиск this: от блока внутри стрелки по OuterEnv к записи стрелки, затем к записи метода, где this есть; до глобальной записи поиск не доходит">
    <defs>
        <marker id="d9-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="250" height="180" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="34" font-family="Consolas, monospace" font-size="11" fill="#334155">const obj = {</text>
    <text x="35" y="54" font-family="Consolas, monospace" font-size="11" fill="#334155">method() {</text>
    <text x="48" y="74" font-family="Consolas, monospace" font-size="11" fill="#334155">const arrow = () =&gt; {</text>
    <text x="61" y="94" font-family="Consolas, monospace" font-size="11" fill="#334155">{</text>
    <text x="74" y="114" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0c4a6e">return this.name;</text>
    <text x="61" y="134" font-family="Consolas, monospace" font-size="11" fill="#334155">}</text>
    <text x="48" y="154" font-family="Consolas, monospace" font-size="11" fill="#334155">};</text>
    <text x="48" y="174" font-family="Consolas, monospace" font-size="11" fill="#334155">return arrow(); } };</text>

    <rect x="290" y="10" width="340" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="302" y="32" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">запись блока { } — HasThisBinding: нет</text>
    <path d="M 460 44 L 460 58" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d9-out)"/>
    <rect x="290" y="60" width="340" height="34" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="302" y="82" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">запись стрелки arrow — this лексический: нет</text>
    <path d="M 460 94 L 460 108" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d9-out)"/>
    <rect x="290" y="110" width="340" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="302" y="132" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">запись метода method — да: this = obj</text>
    <rect x="290" y="160" width="340" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="302" y="182" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">глобальная запись — да: this = window (не дошли)</text>

    <text x="10" y="222" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Стрелки вниз — поле [[OuterEnv]]; поиск идёт до первой записи с this. GetNewTarget — тем же путём.</text>
</svg>
