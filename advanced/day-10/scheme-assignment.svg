<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" role="img" aria-label="Шаги трёх форм присваивания: обычное — ссылка, правая часть, PutValue; составное — ссылка, GetValue, правая часть, операция, PutValue; логическое — ссылка, GetValue, и если значение уже подходит — конец без правой части и без записи">
    <rect x="10" y="10" width="196" height="178" rx="10" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="108" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#075985">a = b</text>
    <text x="22" y="58" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">1. ссылка a</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">2. вычислить b</text>
    <text x="22" y="102" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">3. PutValue</text>
    <text x="22" y="124" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">результат — b</text>

    <rect x="222" y="10" width="196" height="178" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="320" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#9a3412">a += b</text>
    <text x="234" y="58" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">1. ссылка a</text>
    <text x="234" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">2. GetValue — прочитать a</text>
    <text x="234" y="102" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">3. вычислить b</text>
    <text x="234" y="124" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">4. операция (13.15.3)</text>
    <text x="234" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">5. PutValue</text>

    <rect x="434" y="10" width="196" height="178" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="532" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#065f46">a ||= b</text>
    <text x="446" y="58" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">1. ссылка a</text>
    <text x="446" y="80" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">2. GetValue — прочитать a</text>
    <text x="446" y="102" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">3. a истинно — вернуть a:</text>
    <text x="446" y="120" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">ни b, ни записи</text>
    <text x="446" y="142" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">4. иначе вычислить b</text>
    <text x="446" y="164" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">5. PutValue</text>

    <text x="10" y="214" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ссылка всегда первой; составное читает до правой части; логическое может не записывать вовсе.</text>
</svg>
