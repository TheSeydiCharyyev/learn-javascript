<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="Дерево разбора f() + g() * h(): умножение — правый ребёнок сложения; вызовы считаются слева направо: f первым, g вторым, h третьим, потом умножение, потом сложение">
    <rect x="250" y="10" width="140" height="40" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="320" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#075985">+</text>
    <text x="320" y="43" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#075985">считается последним (5)</text>
    <rect x="90" y="96" width="120" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="150" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">f()</text>
    <text x="150" y="129" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">первым (1)</text>
    <rect x="400" y="96" width="140" height="40" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="470" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#075985">*</text>
    <text x="470" y="129" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#075985">четвёртым (4)</text>
    <rect x="330" y="180" width="120" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="390" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">g()</text>
    <text x="390" y="213" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">вторым (2)</text>
    <rect x="490" y="180" width="120" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="550" y="198" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">h()</text>
    <text x="550" y="213" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">третьим (3)</text>
    <path d="M 290 50 L 180 96" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 350 50 L 450 96" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 450 136 L 400 180" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 490 136 L 540 180" stroke="#64748b" stroke-width="2" fill="none"/>
    <text x="10" y="170" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Грамматика решает, кто чей ребёнок;</text>
    <text x="10" y="188" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">шаги — в каком порядке их считать:</text>
    <text x="10" y="206" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">левый операнд, правый, операция.</text>
</svg>
