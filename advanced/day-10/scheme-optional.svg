<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="Цепочка obj?.a.b(f()): если obj — null или undefined, вся цепочка даёт undefined и f не вызывается; если obj есть, а obj.a — null, TypeError на .b">
    <text x="20" y="34" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#0c4a6e">obj<tspan fill="#c2410c">?.</tspan>a.b(f())</text>
    <rect x="10" y="50" width="300" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="72" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">obj — null или undefined</text>
    <text x="22" y="92" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">вся цепочка — undefined, f() не вызвана</text>
    <rect x="330" y="50" width="300" height="60" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="342" y="72" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">obj есть, а obj.a — null</text>
    <text x="342" y="92" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">TypeError на .b: ?. защищает только obj</text>
    <rect x="10" y="124" width="620" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="143" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">obj.a?.b — защищает a; (obj?.a).b — скобки кончают цепочку, и .b считается отдельно;</text>
    <text x="22" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">obj?.a?.b — защищены оба звена.</text>
    <text x="10" y="188" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Проверка null стоит один раз — перед всей цепочкой (13.3.9.1).</text>
</svg>
