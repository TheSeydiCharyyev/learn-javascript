<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="Цикл for с let: окружение заголовка, где f видит i = 0; копия перед условием первой итерации, тело; копия перед шагом, i++ в новой копии; и так далее">
    <rect x="10" y="10" width="190" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">заголовок</text>
    <text x="22" y="50" font-family="Consolas, monospace" font-size="11" fill="#334155">i = 0, f = () =&gt; i</text>
    <text x="22" y="66" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">f навсегда видит это i</text>

    <rect x="225" y="10" width="190" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="237" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">копия 1: итерация 1</text>
    <text x="237" y="50" font-family="Consolas, monospace" font-size="11" fill="#065f46">i = 0 → условие, тело</text>
    <text x="237" y="66" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">замыкание тела — это i</text>

    <rect x="440" y="10" width="190" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="452" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">копия 2: итерация 2</text>
    <text x="452" y="50" font-family="Consolas, monospace" font-size="11" fill="#065f46">i = 0 → i++ → 1</text>
    <text x="452" y="66" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">условие, тело — уже здесь</text>

    <path d="M 200 42 L 223 42" stroke="#64748b" stroke-width="2" fill="none"/>
    <path d="M 415 42 L 438 42" stroke="#64748b" stroke-width="2" fill="none"/>

    <rect x="10" y="100" width="620" height="60" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="122" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">var: копий нет</text>
    <text x="22" y="142" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">одна привязка на весь цикл; все замыкания видят последнее значение — 3, 3, 3</text>

    <rect x="10" y="170" width="620" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="22" y="195" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">const: копируемых имён нет; первая итерация проходит, шаг i++ — TypeError</text>

    <text x="10" y="230" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Копия делается перед условием и перед шагом (CreatePerIterationEnvironment, 14.7.4.4).</text>
</svg>
