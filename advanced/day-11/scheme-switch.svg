<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="switch с default посередине: сначала проверить ветки A до default, потом ветки B после default, потом выполнить default и снова тела B без проверки">
    <defs>
        <marker id="d11-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="20" width="140" height="58" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="80" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">1. ветки A</text>
    <text x="80" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">проверить по очереди</text>
    <rect x="170" y="20" width="140" height="58" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="240" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">2. ветки B</text>
    <text x="240" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">тоже проверить</text>
    <rect x="330" y="20" width="140" height="58" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="400" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">3. default</text>
    <text x="400" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">если нигде не совпало</text>
    <rect x="490" y="20" width="140" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="560" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">4. тела B</text>
    <text x="560" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">без новых проверок</text>
    <path d="M 150 49 L 168 49" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d11-arrow)"/>
    <path d="M 310 49 L 328 49" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d11-arrow)"/>
    <path d="M 470 49 L 488 49" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d11-arrow)"/>
    <text x="10" y="112" font-family="Consolas, monospace" font-size="11" fill="#334155">case a: …   default: …   case b: …; break;   case c: …</text>
    <text x="10" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">совпало в A — тела A, default, B подряд до break; совпало в B — тела B от совпавшей;</text>
    <text x="10" y="152" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">нигде — default и за ним тела B. Селекторы B считаются раньше default.</text>
    <text x="10" y="190" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаги CaseBlockEvaluation (14.12.2) для блока с default посередине.</text>
</svg>
