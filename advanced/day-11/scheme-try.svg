<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="try catch finally: запись B от try; если B — throw, catch даёт запись C, иначе C = B; finally даёт F; F обычная — результат C, иначе F">
    <defs>
        <marker id="d11-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="20" width="180" height="70" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="100" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#075985">try → запись B</text>
    <text x="100" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">любая: обычная, return,</text>
    <text x="100" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">break, throw</text>
    <rect x="230" y="20" width="180" height="70" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="320" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a3412">catch → запись C</text>
    <text x="320" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">только если B — throw;</text>
    <text x="320" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">иначе C = B</text>
    <rect x="450" y="20" width="180" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="540" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">finally → запись F</text>
    <text x="540" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">выполняется всегда</text>
    <path d="M 190 55 L 228 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d11-step)"/>
    <path d="M 410 55 L 448 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d11-step)"/>
    <rect x="10" y="110" width="620" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="134" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">ответ: F обычная — C, иначе F</text>
    <text x="22" y="156" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">внезапный finally (return, break, continue, throw) побеждает всё; пустое значение — UpdateEmpty(…, undefined)</text>
    <text x="10" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаги TryStatement : try Block Catch Finally (14.15.3).</text>
</svg>
