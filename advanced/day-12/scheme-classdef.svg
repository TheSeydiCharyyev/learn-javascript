<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 228" role="img" aria-label="Шаги ClassDefinitionEvaluation: 1–3 classEnv и extends, имя класса без значения; 4–6 proto и F; 7 элементы по порядку, ключи и методы сразу, поля и блоки отложены; 8 имя класса получает значение F; 9 static поля и блоки по порядку, this — сам класс; позже, на каждом new, поля экземпляра и тело конструктора">
    <defs>
        <marker id="d12-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="200" height="72" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">1–3. classEnv и extends</text>
    <text x="22" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">имя класса — без значения</text>
    <text x="22" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">extends считается здесь</text>

    <rect x="220" y="10" width="200" height="72" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="232" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">4–6. proto и F</text>
    <text x="232" y="52" font-family="Consolas, monospace" font-size="11" fill="#075985">F.prototype = proto</text>
    <text x="232" y="70" font-family="Consolas, monospace" font-size="11" fill="#075985">proto.constructor = F</text>

    <rect x="430" y="10" width="200" height="72" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="442" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">7. элементы по порядку</text>
    <text x="442" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">ключи и методы — сразу</text>
    <text x="442" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">поля и блоки — отложены</text>

    <path d="M 210 46 L 218 46" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-step)"/>
    <path d="M 420 46 L 428 46" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-step)"/>
    <path d="M 530 82 L 530 98 L 110 98 L 110 116" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-step)"/>

    <rect x="10" y="118" width="200" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="140" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">8. имя класса</text>
    <text x="22" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">получает значение F</text>
    <text x="22" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">дальше обращаться можно</text>

    <rect x="220" y="118" width="200" height="72" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="232" y="140" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">9. static по порядку</text>
    <text x="232" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">поля и блоки вперемешку</text>
    <text x="232" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">this — сам класс</text>

    <rect x="430" y="118" width="200" height="72" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="442" y="140" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">позже, на каждом new</text>
    <text x="442" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">поля экземпляра,</text>
    <text x="442" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">потом тело конструктора</text>

    <path d="M 210 154 L 218 154" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-step)"/>
    <path d="M 420 154 L 428 154" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-step)" stroke-dasharray="4 3"/>

    <text x="10" y="216" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаги ClassDefinitionEvaluation (15.7.14): 1–9 — один раз, когда вычисляется class.</text>
</svg>
