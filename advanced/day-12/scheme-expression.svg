<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 226" role="img" aria-label="Две схемы: выражение function factorial — внешнее окружение с fact, окружение funcEnv с неизменяемым factorial, strict false, окружение вызова с n; объявление class Card — внешняя привязка Card как let, окружение classEnv с неизменяемым Card, strict true, без значения до шага 8, и методы и поля класса">
    <defs>
        <marker id="d12-name" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <text x="10" y="20" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">const fact = function factorial(n) { … }</text>
    <rect x="10" y="30" width="190" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">внешнее</text>
    <text x="22" y="72" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">fact; factorial здесь нет</text>
    <rect x="225" y="30" width="190" height="62" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="237" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">funcEnv: factorial</text>
    <text x="237" y="72" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">неизменяемая, strict = false</text>
    <rect x="440" y="30" width="190" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="452" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">вызов</text>
    <text x="452" y="72" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">n, arguments</text>
    <path d="M 223 61 L 203 61" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-name)"/>
    <path d="M 438 61 L 418 61" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-name)"/>

    <text x="10" y="118" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">class Card { … }</text>
    <rect x="10" y="128" width="190" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">внешнее: Card</text>
    <text x="22" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">как let — можно переписать</text>
    <rect x="225" y="128" width="190" height="62" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="237" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">classEnv: Card</text>
    <text x="237" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">неизменяемая, strict = true</text>
    <rect x="440" y="128" width="190" height="62" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="452" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">методы и поля</text>
    <text x="452" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">видят внутреннее Card</text>
    <path d="M 223 159 L 203 159" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-name)"/>
    <path d="M 438 159 L 418 159" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-name)"/>

    <text x="10" y="216" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Имя выражения и имя класса живут в своём окружении между внешним и телом.</text>
</svg>
