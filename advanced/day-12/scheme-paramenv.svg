<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" role="img" aria-label="Окружения вызова one: внешнее с var x = внешний; окружение параметров со стрелкой a и arguments, умолчания считаются здесь; окружение var тела с x = тело, только если в параметрах есть код; окружение let и const. Стрелка a видит параметры и всё левее, var x тела — нет">
    <defs>
        <marker id="d12-outer" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="140" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">внешнее</text>
    <text x="22" y="52" font-family="Consolas, monospace" font-size="11" fill="#334155">x = "внешний"</text>
    <text x="22" y="72" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">стрелка нашла x</text>
    <text x="22" y="88" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">здесь</text>

    <rect x="170" y="10" width="140" height="92" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="182" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">параметры</text>
    <text x="182" y="52" font-family="Consolas, monospace" font-size="11" fill="#075985">a = () =&gt; x</text>
    <text x="182" y="72" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#075985">и arguments;</text>
    <text x="182" y="88" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#075985">умолчания — здесь</text>

    <rect x="330" y="10" width="140" height="92" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="342" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">var тела</text>
    <text x="342" y="52" font-family="Consolas, monospace" font-size="11" fill="#9a3412">x = "тело"</text>
    <text x="342" y="72" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">отдельно, только</text>
    <text x="342" y="88" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">если в параметрах код</text>

    <rect x="490" y="10" width="140" height="92" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="502" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">let и const тела</text>
    <text x="502" y="52" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">у строгой функции —</text>
    <text x="502" y="68" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">окружение var</text>

    <path d="M 168 56 L 153 56" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-outer)"/>
    <path d="M 328 56 L 313 56" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-outer)"/>
    <path d="M 488 56 L 473 56" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d12-outer)"/>

    <text x="10" y="128" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Окружения вызова one() (10.2.11); стрелки — [[OuterEnv]]: a видит всё левее себя, var x тела — нет.</text>
</svg>
