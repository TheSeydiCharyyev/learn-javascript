<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 236" role="img" aria-label="GlobalDeclarationInstantiation: сначала проверки — let, const, class без лексического и неудаляемого свойства, var и function без лексического, функцию и var можно объявить; потом создание: лексические без значения, функции объектами, var со значением undefined. Лексические имена идут в декларативную половину глобальной записи, var и function — в объектную, то есть в окно">
    <defs>
        <marker id="d13-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="10" width="290" height="112" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">проверки — ничего не создано</text>
    <text x="22" y="52" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">1. let, const, class: нет лексического</text>
    <text x="22" y="68" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">и неудаляемого свойства окна</text>
    <text x="22" y="86" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">2. var и function: нет лексического</text>
    <text x="22" y="104" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">3–4. функцию и var можно объявить</text>

    <path d="M 155 124 L 155 141" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>

    <rect x="10" y="144" width="290" height="58" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="164" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#065f46">5. создание</text>
    <text x="22" y="180" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">let, const, class — без значения;</text>
    <text x="22" y="195" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">функции — объектами, var — undefined</text>

    <rect x="330" y="10" width="300" height="192" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="342" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">глобальная запись страницы</text>
    <rect x="345" y="44" width="270" height="66" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="357" y="64" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">объектная половина = окно</text>
    <text x="357" y="82" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">var, function; NaN, undefined, top</text>
    <text x="357" y="98" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">и свойства вида globalThis.x = 1</text>
    <rect x="345" y="124" width="270" height="66" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="357" y="144" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#854d0e">декларативная половина</text>
    <text x="357" y="162" font-family="Segoe UI, sans-serif" font-size="11" fill="#854d0e">let, const, class</text>
    <text x="357" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#854d0e">всех скриптов страницы</text>

    <path d="M 302 160 L 341 160" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>
    <path d="M 302 152 L 318 152 L 318 77 L 341 77" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>

    <text x="10" y="226" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Конфликт на шагах 1–4 — SyntaxError или TypeError; по тексту скрипт не получает ни одного имени.</text>
</svg>
