<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="Окружения eval. Прямой нестрогий: новое лексическое окружение для let, const, class, над ним окружения вызывающего, var идёт в его VariableEnvironment. Прямой строгий: новое окружение для let, const, class и var, окружения вызывающего видны, но var туда не идёт. Косвенный нестрогий: новое окружение для let, const, class, над ним глобальная запись, var становится удаляемым свойством окна. Строгий косвенный: var в новом окружении, над ним глобальная запись">
    <text x="20" y="24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">прямой, нестрогий</text>
    <rect x="10" y="36" width="196" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="22" y="56" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">новое лексическое</text>
    <text x="22" y="74" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">let, const, class</text>
    <rect x="10" y="116" width="196" height="54" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="22" y="136" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">окружения вызывающего</text>
    <text x="22" y="154" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">var — в VariableEnvironment</text>
    <path d="M 108 92 L 108 113" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>

    <text x="232" y="24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">прямой, строгий</text>
    <rect x="222" y="36" width="196" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="234" y="56" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">новое лексическое</text>
    <text x="234" y="74" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">let, const, class и var</text>
    <rect x="222" y="116" width="196" height="54" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="234" y="136" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#075985">окружения вызывающего</text>
    <text x="234" y="154" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">видны, но var туда не идёт</text>
    <path d="M 320 92 L 320 113" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>

    <text x="444" y="24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">косвенный, нестрогий</text>
    <rect x="434" y="36" width="196" height="54" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="446" y="56" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#065f46">новое лексическое</text>
    <text x="446" y="74" font-family="Segoe UI, sans-serif" font-size="11" fill="#065f46">let, const, class</text>
    <rect x="434" y="116" width="196" height="54" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="446" y="136" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">глобальная запись</text>
    <text x="446" y="154" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">var — удаляемое свойство окна</text>
    <path d="M 532 92 L 532 113" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d13-arrow)"/>

    <text x="10" y="188" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Стрелка — [[OuterEnv]] (19.2.1.1). Строгий косвенный: var в новом, над ним глобальная запись.</text>
</svg>
