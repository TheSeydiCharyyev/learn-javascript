<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 172" role="img" aria-label="[[Construct]]. base: this создаётся сразу из prototype newTarget, потом поля, тело, return объекта заменяет this, иначе this. derived: this нет, тело, this создаёт super() у родителя вместе с полями, return объекта заменяет, undefined — this или ReferenceError без super, иначе TypeError">
    <text x="10" y="40" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">base</text>
    <rect x="62" y="16" width="170" height="44" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="72" y="35" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">this — из prototype</text>
    <text x="72" y="51" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">newTarget</text>
    <rect x="252" y="16" width="120" height="44" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="262" y="35" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">поля, потом</text>
    <text x="262" y="51" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">тело</text>
    <rect x="392" y="16" width="238" height="44" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="402" y="35" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">return объекта — он;</text>
    <text x="402" y="51" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">иначе this (примитив не важен)</text>
    <path d="M 234 38 L 248 38" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>
    <path d="M 374 38 L 388 38" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>

    <text x="10" y="112" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">derived</text>
    <rect x="62" y="88" width="170" height="44" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="72" y="107" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">this нет: его даст</text>
    <text x="72" y="123" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">super() вместе с полями</text>
    <rect x="252" y="88" width="120" height="44" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="262" y="107" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">тело</text>
    <rect x="392" y="88" width="238" height="44" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="402" y="107" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">объект — он; undefined — this</text>
    <text x="402" y="123" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">(нет — ReferenceError); иначе TypeError</text>
    <path d="M 234 110 L 248 110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>
    <path d="M 374 110 L 388 110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>

    <text x="10" y="162" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Прототип нового объекта в обоих случаях — от newTarget, а не от того класса, чьё тело выполняется.</text>
</svg>
