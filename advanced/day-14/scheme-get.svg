<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 176" role="img" aria-label="Цепочка child, base, Object.prototype, null. child.who: у child своего who нет, [[Get]] идёт к base с Receiver = child; у base геттер who, он вызван с this = child и читает child.name">
    <defs>
        <marker id="d14-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="30" width="170" height="74" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="22" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">child (Receiver)</text>
    <text x="22" y="72" font-family="Consolas, monospace" font-size="11" fill="#9d174d">name: "child"</text>
    <text x="22" y="90" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">своего who нет</text>

    <rect x="235" y="30" width="170" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="247" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">base</text>
    <text x="247" y="72" font-family="Consolas, monospace" font-size="11" fill="#334155">get who()</text>
    <text x="247" y="90" font-family="Consolas, monospace" font-size="11" fill="#334155">name: "base"</text>

    <rect x="460" y="30" width="170" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="472" y="52" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Object.prototype</text>
    <text x="472" y="72" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">дальше — null:</text>
    <text x="472" y="90" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">ответ undefined</text>

    <path d="M 182 67 L 231 67" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>
    <path d="M 407 67 L 456 67" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d14-arrow)"/>
    <text x="186" y="22" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">[[Prototype]]</text>
    <text x="411" y="22" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">[[Prototype]]</text>

    <path d="M 320 106 C 320 140, 95 140, 95 108" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#d14-arrow)"/>
    <text x="336" y="132" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">геттер вызван с this = child</text>
    <text x="10" y="168" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">child.who: [[Get]] у base с Receiver = child; геттер вызван с this = child и читает "child".</text>
</svg>
