<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 214" role="img" aria-label="OrdinarySetWithOwnDescriptor. Своего свойства нет: есть прототип — его [[Set]] с тем же Receiver, нет — как записываемые данные. Данные: незаписываемые — false; у Receiver аксессор или незаписываемое — false; у Receiver своё записываемое — [[DefineOwnProperty]] только value; своего нет — CreateDataProperty. Аксессор: нет сеттера — false, есть — Call сеттера с Receiver, true">
    <rect x="10" y="10" width="196" height="160" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">своего нет</text>
    <text x="22" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">есть прототип —</text>
    <text x="22" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">его [[Set]], Receiver тот же</text>
    <text x="22" y="96" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">прототипа нет — как</text>
    <text x="22" y="112" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">записываемые данные →</text>

    <rect x="222" y="10" width="196" height="160" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="234" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">данные</text>
    <text x="234" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">writable: false — false</text>
    <text x="234" y="76" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">у Receiver аксессор или</text>
    <text x="234" y="92" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">незаписываемое — false</text>
    <text x="234" y="114" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">своё записываемое —</text>
    <text x="234" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">define только value</text>
    <text x="234" y="152" font-family="Segoe UI, sans-serif" font-size="11" fill="#9d174d">своего нет — CreateDataProperty</text>

    <rect x="434" y="10" width="196" height="160" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="446" y="32" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#075985">аксессор</text>
    <text x="446" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">нет сеттера — false</text>
    <text x="446" y="76" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">есть — Call(сеттер,</text>
    <text x="446" y="92" font-family="Segoe UI, sans-serif" font-size="11" fill="#075985">Receiver, «V»), true</text>

    <text x="10" y="200" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">false: строгий код — TypeError (PutValue, день 4), нестрогий — молча.</text>
</svg>
