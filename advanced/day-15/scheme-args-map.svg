<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" role="img" aria-label="Вызов f(1) функции f(a, b). У arguments свойства 0, length, callee. Скрытая [[ParameterMap]] держит только индекс 0 — геттер и сеттер. Окружение f: a равно 1, b undefined. arguments[0] и a связаны через map в обе стороны; b не передан, связи нет">
    <rect x="10" y="36" width="180" height="104" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="22" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">arguments, вызов f(1)</text>
    <text x="22" y="80" font-family="Consolas, monospace" font-size="11" fill="#9d174d">"0": 1</text>
    <text x="22" y="98" font-family="Consolas, monospace" font-size="11" fill="#9d174d">"length": 1</text>
    <text x="22" y="116" font-family="Consolas, monospace" font-size="11" fill="#9d174d">"callee": f</text>

    <rect x="230" y="36" width="180" height="104" rx="8" fill="#ffffff" stroke="#be185d" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="242" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">[[ParameterMap]]</text>
    <text x="242" y="80" font-family="Consolas, monospace" font-size="11" fill="#9d174d">"0": get / set</text>
    <text x="242" y="98" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">только индекс 0:</text>
    <text x="242" y="116" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">b не передан</text>

    <rect x="450" y="36" width="180" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">окружение f</text>
    <text x="462" y="80" font-family="Consolas, monospace" font-size="11" fill="#334155">a: 1</text>
    <text x="462" y="98" font-family="Consolas, monospace" font-size="11" fill="#334155">b: undefined</text>
    <text x="462" y="116" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">привязки параметров</text>

    <path d="M 192 76 L 226 76" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#d15-arrow)"/>
    <path d="M 414 76 L 446 76" stroke="#475569" stroke-width="2" fill="none" marker-start="url(#d15-arrow)" marker-end="url(#d15-arrow)"/>

    <text x="10" y="168" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">arguments[0] = 5 — сеттер map пишет в a; a = 7 — геттер map отдаёт 7 в arguments[0].</text>
    <text x="10" y="190" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">arguments[1] = 5 — обычное свойство: индекса 1 в map нет, b не меняется.</text>
</svg>
