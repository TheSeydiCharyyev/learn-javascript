<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="Цепочка second, first, show. У second [[BoundThis]] второй и аргумент 2, цель first. У first [[BoundThis]] первый и аргумент 1, цель show. Вызов second(3) — Call(first, второй, [2, 3]), потом Call(show, первый, [1, 2, 3]): this внешней обёртки выброшен">
    <defs>
        <marker id="d15-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="36" width="190" height="92" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="22" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">second</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[BoundThis]] = «второй»</text>
    <text x="22" y="98" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[BoundArguments]] = 2</text>
    <text x="22" y="116" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">цель — first</text>

    <rect x="225" y="36" width="190" height="92" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="237" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">first</text>
    <text x="237" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[BoundThis]] = «первый»</text>
    <text x="237" y="98" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[BoundArguments]] = 1</text>
    <text x="237" y="116" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">цель — show</text>

    <rect x="440" y="36" width="190" height="92" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="452" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">show</text>
    <text x="452" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">обычная функция</text>
    <text x="452" y="98" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">this = «первый»</text>
    <text x="452" y="116" font-family="Consolas, monospace" font-size="11" fill="#334155">a, b, c = 1, 2, 3</text>

    <path d="M 202 82 L 221 82" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d15-arrow)"/>
    <path d="M 417 82 L 436 82" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d15-arrow)"/>
    <text x="198" y="26" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">цель</text>
    <text x="413" y="26" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">цель</text>

    <text x="10" y="158" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">second(3): Call(first, «второй», [2, 3]), потом Call(show, «первый», [1, 2, 3]).</text>
    <text x="10" y="180" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">this внешней обёртки выброшен: внутренний [[Call]] ставит свой [[BoundThis]].</text>
</svg>
