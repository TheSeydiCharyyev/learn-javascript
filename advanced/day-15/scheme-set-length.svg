<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="Массив a, b, c, d; элемент 1 неудаляемый. a.length = 0: удалён индекс 3, удалён индекс 2, индекс 1 не удалился — стоп. length было 4, стало 2, ответ false, в строгом коде TypeError">
    <path d="M 407 38 C 407 18, 177 18, 177 38" stroke="#ec4899" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#d15-arrow)"/>
    <text x="236" y="14" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">удаление идёт с конца</text>

    <rect x="10" y="40" width="105" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">индекс 0</text>
    <text x="22" y="84" font-family="Consolas, monospace" font-size="11" fill="#334155">"a"</text>

    <rect x="125" y="40" width="105" height="64" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="137" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">индекс 1</text>
    <text x="137" y="80" font-family="Consolas, monospace" font-size="11" fill="#9d174d">"b"</text>
    <text x="137" y="96" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">неудаляемый</text>

    <rect x="240" y="40" width="105" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="252" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">индекс 2</text>
    <text x="252" y="84" font-family="Consolas, monospace" font-size="11" fill="#64748b">"c"</text>

    <rect x="355" y="40" width="105" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="367" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">индекс 3</text>
    <text x="367" y="84" font-family="Consolas, monospace" font-size="11" fill="#64748b">"d"</text>

    <rect x="490" y="40" width="140" height="64" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="502" y="62" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">length</text>
    <text x="502" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">было 4</text>
    <text x="502" y="96" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">стало 1 + 1 = 2</text>

    <text x="22" y="124" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">не тронут</text>
    <text x="137" y="124" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">3) false — стоп</text>
    <text x="252" y="124" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">2) удалён</text>
    <text x="367" y="124" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">1) удалён</text>

    <text x="10" y="158" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">a.length = 0: записать 0 и удалять индексы ≥ 0 с конца, начиная с 3.</text>
    <text x="10" y="180" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Индекс 1 не удалился: length = 2, ответ false — в строгом коде TypeError.</text>
</svg>
