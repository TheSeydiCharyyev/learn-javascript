<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 196" role="img" aria-label="[[Get]] прокси после ловушки: targetDesc — дескриптор цели. Нет или configurable — ответ ловушки. Неудаляемые незаписываемые данные — ответ должен совпасть со значением. Неудаляемый аксессор без геттера — ответ должен быть undefined. Иначе TypeError">
    <rect x="10" y="20" width="180" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">trapResult</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">ответ ловушки get</text>

    <rect x="230" y="20" width="200" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="242" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">targetDesc</text>
    <text x="242" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">target.[[GetOwnProperty]](P)</text>

    <rect x="470" y="20" width="160" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="482" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">нет или удаляемое</text>
    <text x="482" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">ответ — trapResult</text>

    <rect x="230" y="104" width="200" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="242" y="126" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">данные, writable: false</text>
    <text x="242" y="146" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">SameValue с value, иначе TypeError</text>

    <rect x="470" y="104" width="160" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="482" y="126" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">аксессор без get</text>
    <text x="482" y="146" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">только undefined</text>

    <path d="M 192 48 L 226 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <path d="M 432 48 L 466 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <path d="M 330 78 L 330 100" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <path d="M 400 78 C 400 92, 550 88, 550 100" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <text x="10" y="188" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Розовые ветки — только у неудаляемого свойства цели: его ловушка не может «перекрасить».</text>
</svg>
