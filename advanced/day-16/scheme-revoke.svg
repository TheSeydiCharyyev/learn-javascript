<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 164" role="img" aria-label="Proxy.revocable даёт объект с proxy и revoke. revoke хранит прокси в слоте [[RevocableProxy]]. После revoke у прокси [[ProxyTarget]] и [[ProxyHandler]] — null, у revoke слот null; любая операция над прокси — TypeError из ValidateNonRevokedProxy">
    <rect x="10" y="20" width="180" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">revoke</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">[[RevocableProxy]]:</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">прокси → null</text>

    <rect x="235" y="20" width="190" height="74" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="247" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">proxy</text>
    <text x="247" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[ProxyTarget]]: цель → null</text>
    <text x="247" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[ProxyHandler]]: → null</text>

    <rect x="470" y="20" width="160" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="482" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#64748b">цель, обработчик</text>
    <text x="482" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">ссылок от прокси нет —</text>
    <text x="482" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">сборщик может убрать</text>

    <path d="M 192 57 L 231 57" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#d16-arrow)"/>
    <path d="M 427 57 L 466 57" stroke="#475569" stroke-width="2" fill="none" stroke-dasharray="5 4" marker-end="url(#d16-arrow)"/>
    <text x="10" y="128" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">После revoke() любая операция над прокси — шаг 1 общей схемы: ValidateNonRevokedProxy,</text>
    <text x="10" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">TypeError. typeof по-прежнему работает: он смотрит на [[Call]], а не на ловушки.</text>
</svg>
