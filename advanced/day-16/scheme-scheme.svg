<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 212" role="img" aria-label="Операция над прокси: шаг 1 — не отозван ли; шаг 2 — GetMethod у обработчика. Ловушки нет — тот же метод у цели. Ловушка есть — Call(trap, handler, target, ...), потом сверка ответа с целью по инвариантам; нарушен — TypeError, иначе ответ">
    <defs>
        <marker id="d16-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="20" width="190" height="70" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">proxy.x</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">1. отозван? — TypeError</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">2. GetMethod(handler, "get")</text>

    <rect x="245" y="20" width="180" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="257" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">ловушки нет</text>
    <text x="257" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">3. target.[[Get]](x, proxy)</text>
    <text x="257" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">ответ цели — ответ прокси</text>

    <rect x="245" y="112" width="180" height="70" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="257" y="134" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">ловушка есть</text>
    <text x="257" y="154" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">4. Call(trap, handler,</text>
    <text x="257" y="172" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">«target, x, proxy»)</text>

    <rect x="470" y="112" width="160" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="482" y="134" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">5. сверка с целью</text>
    <text x="482" y="154" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">нарушен инвариант —</text>
    <text x="482" y="172" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">TypeError, иначе ответ</text>

    <path d="M 202 55 L 241 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <path d="M 105 92 C 105 147, 170 147, 241 147" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <path d="M 427 147 L 466 147" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d16-arrow)"/>
    <text x="10" y="204" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ловушку ищут при каждой операции заново — обработчик можно менять на ходу.</text>
</svg>
