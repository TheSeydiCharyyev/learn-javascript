<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 206" role="img" aria-label="Reflect.get(t, k, r) зовёт t.[[Get]](k, r): дескриптор берётся у цели, геттер вызывается с this = r. Reflect.set(t, k, v, r) зовёт t.[[Set]](k, v, r): у цели записываемые данные — CreateDataProperty(r, k, v), запись идёт в r">
    <rect x="10" y="20" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Reflect.get(t, k, r)</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">r — Receiver</text>

    <rect x="235" y="20" width="180" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="247" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">t.[[Get]](k, r)</text>
    <text x="247" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">дескриптор k — у цели</text>

    <rect x="450" y="20" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">геттер</text>
    <text x="462" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">вызван с this = r</text>

    <rect x="10" y="108" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Reflect.set(t, k, v, r)</text>
    <text x="22" y="150" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">r — Receiver</text>

    <rect x="235" y="108" width="180" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="247" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">t.[[Set]](k, v, r)</text>
    <text x="247" y="150" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">у цели — writable: true</text>

    <rect x="450" y="108" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">CreateDataProperty</text>
    <text x="462" y="150" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">(r, k, v) — пишут в r</text>

    <path d="M 202 48 L 231 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 417 48 L 446 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 202 136 L 231 136" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 417 136 L 446 136" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <text x="10" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Что можно — решает дескриптор цели; чей this и куда пишут — решает Receiver.</text>
</svg>
