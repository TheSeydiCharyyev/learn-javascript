<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Внутренний метод цели зовут три стороны: код неявно (t.x, in, delete, Object.keys, new), Reflect явно по имени метода, а ловушка прокси пересылает операцию через Reflect">
    <defs>
        <marker id="d17-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="20" width="180" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">код</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">t.x, x in t, delete t.x</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Object.keys(t), new C()</text>

    <rect x="230" y="20" width="180" height="70" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="242" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">внутренний метод цели</text>
    <text x="242" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[Get]], [[HasProperty]],</text>
    <text x="242" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">[[Delete]] … всего 13</text>

    <rect x="450" y="20" width="180" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Reflect</text>
    <text x="462" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Reflect.get(t, "x", r)</text>
    <text x="462" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">те же 13 — по имени</text>

    <rect x="450" y="118" width="180" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="462" y="140" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">ловушка прокси</text>
    <text x="462" y="160" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">get(t, key, receiver)</text>

    <path d="M 192 55 L 226 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 448 55 L 414 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 540 116 L 540 94" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <text x="10" y="192" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Код зовёт метод неявно, Reflect — явно, а ловушка прокси пересылает через Reflect.</text>
</svg>
