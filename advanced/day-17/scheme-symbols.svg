<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Операция языка (instanceof, ToPrimitive, concat, toString, map) делает Get или GetMethod по встроенному символу у объекта или его прототипа. Есть ответ — язык вызывает метод или берёт значение; undefined — алгоритм по умолчанию">
    <rect x="10" y="20" width="190" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">операция языка</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">instanceof, ToPrimitive,</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">concat, toString, map</text>

    <rect x="240" y="20" width="170" height="70" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="252" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">Get или GetMethod</text>
    <text x="252" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">(obj, %Symbol.x%)</text>
    <text x="252" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">у объекта или прототипа</text>

    <rect x="450" y="20" width="180" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="462" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">есть ответ</text>
    <text x="462" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">вызвать или взять его</text>

    <rect x="450" y="104" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="126" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">undefined</text>
    <text x="462" y="146" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">алгоритм по умолчанию</text>

    <path d="M 202 55 L 236 55" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 412 48 L 446 48" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <path d="M 325 92 C 325 132, 380 132, 446 132" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d17-arrow)"/>
    <text x="10" y="184" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">По умолчанию: OrdinaryToPrimitive, OrdinaryHasInstance, builtinTag у toString,</text>
    <text x="10" y="206" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">IsArray у concat, конструктор по умолчанию у species.</text>
</svg>
