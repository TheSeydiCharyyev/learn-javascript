<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 240" role="img" aria-label="Свойства globalThis кладут четыре источника: ECMA-262 (19.1–19.4, 59 свойств — parseInt, Math, Map), ECMA-402 (Intl), хозяин (HTML: window, document, alert) и программа (var и function на верхнем уровне)">
    <defs>
        <marker id="d18-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#475569"/>
        </marker>
    </defs>
    <rect x="10" y="20" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">ECMA-262, 19.1–19.4</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">59: parseInt, Math, Map…</text>

    <rect x="10" y="150" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">ECMA-402</text>
    <text x="22" y="192" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">Intl</text>

    <rect x="230" y="82" width="180" height="60" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="242" y="106" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">globalThis</text>
    <text x="242" y="126" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">в браузере — window</text>

    <rect x="450" y="20" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">хозяин (HTML)</text>
    <text x="462" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">window, document, alert</text>

    <rect x="450" y="150" width="180" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="462" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">программа</text>
    <text x="462" y="192" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">var и function наверху</text>

    <path d="M 202 56 L 228 96" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 202 170 L 228 130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 448 56 L 412 96" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 448 170 L 412 130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <text x="10" y="230" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Свойства ECMA-262 неперечисляемые, а операции хозяина вроде alert — перечисляемые.</text>
</svg>
