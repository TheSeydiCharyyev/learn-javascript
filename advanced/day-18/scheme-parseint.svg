<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 210" role="img" aria-label="parseInt: 1 ToString и пробелы; 2 знак; 3 R = ToInt32(radix), не 0 и вне 2–36 — NaN; 4 при R = 0 или 16 снять 0x, R = 0 значит 10; 5 цифры до первой чужой, пусто — NaN; 6 число со знаком, ноль с минусом — −0">
    <rect x="10" y="20" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">1. строка</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">ToString, пробелы долой</text>

    <rect x="225" y="20" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="237" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">2. знак</text>
    <text x="237" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">«-» — sign −1, знак снять</text>

    <rect x="440" y="20" width="190" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="452" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">3. R = ToInt32(radix)</text>
    <text x="452" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">не 0 и не 2–36 — NaN</text>

    <rect x="440" y="110" width="190" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="452" y="132" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">4. R = 0 или 16</text>
    <text x="452" y="152" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">снять «0x»; 0 значит 10</text>

    <rect x="225" y="110" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="237" y="132" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">5. цифры до чужой</text>
    <text x="237" y="152" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">пусто — NaN</text>

    <rect x="10" y="110" width="190" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="132" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">6. число × sign</text>
    <text x="22" y="152" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">ноль с минусом — −0</text>

    <path d="M 202 48 L 221 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 417 48 L 436 48" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 535 78 L 535 106" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 438 138 L 419 138" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 223 138 L 204 138" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <text x="10" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">R = 0 дают и undefined, и NaN: ToInt32 превращает их в 0, и система — десятичная.</text>
</svg>
