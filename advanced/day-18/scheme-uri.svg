<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img" aria-label="Encode: кодовая единица из unescapedSet (буквы, цифры, подчёркивание и -.!~*'(), у encodeURI ещё ;/?:@&amp;=+$,#) остаётся как есть; иначе CodePointAt: одинокая половинка — URIError, иначе UTF-8 в 1–4 байта, каждый — %XX">
    <rect x="10" y="20" width="190" height="70" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="22" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">кодовая единица C</text>
    <text x="22" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">в unescapedSet?</text>
    <text x="22" y="80" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">буквы, цифры, _ -.!~*'()</text>

    <rect x="245" y="20" width="170" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="257" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">да — как есть</text>
    <text x="257" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">encodeURI: ещё ;/?:@&amp;=+$,#</text>

    <rect x="245" y="112" width="170" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="257" y="134" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">нет — CodePointAt</text>
    <text x="257" y="154" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">пара половинок — одна</text>

    <rect x="460" y="20" width="170" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="472" y="42" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">UTF-8: 1–4 байта</text>
    <text x="472" y="62" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">каждый — %XX</text>

    <rect x="460" y="112" width="170" height="56" rx="8" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text x="472" y="134" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9d174d">одинокая половинка</text>
    <text x="472" y="154" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9d174d">URIError</text>

    <path d="M 202 48 L 241 48" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 105 92 C 105 140, 170 140, 241 140" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 417 140 L 456 140" stroke="#ec4899" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <path d="M 417 124 C 440 110, 520 100, 545 80" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#d18-arrow)"/>
    <text x="10" y="192" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Decode идёт обратно: %XX → байты → кодовая точка; плохой байт — URIError.</text>
</svg>
