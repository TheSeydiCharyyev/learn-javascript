<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 322" role="img" aria-label="Путь присваивания state.filter = Аман: PutValue зовёт [[Set]] прокси с получателем-прокси; у прокси нет ловушки set, и шаг 6.a зовёт [[Set]] цели с тем же получателем; OrdinarySet и OrdinarySetWithOwnDescriptor у цели спрашивают получателя: шаг 2.c — [[GetOwnProperty]], шаг 2.h — [[DefineOwnProperty]], то есть ловушку defineProperty. Если получатель — цель, оба шага идут к цели напрямую и ловушка молчит">
    <rect x="20" y="16" width="410" height="44" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="32" y="34" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">state.filter = "Аман"</text>
    <text x="32" y="51" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">PutValue (6.2.5.6, шаг 3.d): [[Set]] прокси, получатель — прокси</text>
    <path d="M 225 60 L 225 70" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 225 78 L 220 70 L 230 70 Z" fill="#a16207"/>

    <rect x="20" y="78" width="410" height="44" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="32" y="96" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">10.5.9 [[Set]] прокси</text>
    <text x="32" y="113" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">ловушки set нет → шаг 6.a: [[Set]] цели, тот же получатель</text>
    <path d="M 225 122 L 225 132" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 225 140 L 220 132 L 230 132 Z" fill="#a16207"/>

    <rect x="20" y="140" width="410" height="44" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="32" y="158" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">10.1.9.1 → 10.1.9.2 у цели</text>
    <text x="32" y="175" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">OrdinarySetWithOwnDescriptor: дальше спрашивают получателя</text>
    <path d="M 225 184 L 225 194" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 225 202 L 220 194 L 230 194 Z" fill="#a16207"/>

    <rect x="20" y="202" width="410" height="44" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="32" y="220" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">шаг 2.c: получатель.[[GetOwnProperty]]</text>
    <text x="32" y="237" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">ловушка getOwnPropertyDescriptor, если она есть</text>
    <path d="M 225 246 L 225 256" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 225 264 L 220 256 L 230 256 Z" fill="#a16207"/>

    <rect x="20" y="264" width="410" height="44" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="32" y="282" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">шаг 2.h: получатель.[[DefineOwnProperty]]</text>
    <text x="32" y="299" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">ловушка defineProperty: проверка и notify()</text>

    <rect x="440" y="202" width="170" height="106" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
    <text x="450" y="222" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#991b1b">Если получатель — цель</text>
    <text x="450" y="240" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">(Reflect.set без receiver,</text>
    <text x="450" y="256" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">раздел 13), шаги 2.c и 2.h</text>
    <text x="450" y="272" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">идут к цели напрямую:</text>
    <text x="450" y="288" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">ловушка молчит</text>
</svg>
