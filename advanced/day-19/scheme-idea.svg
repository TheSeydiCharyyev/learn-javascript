<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 248" role="img" aria-label="Слушатель только пишет в state. Запись проходит через ловушку defineProperty прокси, ловушка проверяет значение, кладёт его в цель и зовёт notify. notify ставит одну микрозадачу, в ней подписчики render и save обновляют страницу и localStorage. Пользователь щёлкает по странице — и круг повторяется">
    <rect x="14" y="20" width="150" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="89" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Слушатель</text>
    <text x="89" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">submit, click, input</text>

    <rect x="234" y="20" width="160" height="56" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="314" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">task.status = …</text>
    <text x="314" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">только пишет в state</text>
    <path d="M 164 48 L 224 48" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 234 48 L 224 43 L 224 53 Z" fill="#a16207"/>

    <rect x="456" y="20" width="150" height="56" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="531" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Прокси</text>
    <text x="531" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#854d0e">defineProperty</text>
    <path d="M 394 48 L 446 48" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 456 48 L 446 43 L 446 53 Z" fill="#a16207"/>

    <rect x="456" y="140" width="150" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="531" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#854d0e">notify()</text>
    <text x="531" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">одна микрозадача</text>
    <path d="M 531 76 L 531 130" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 531 140 L 526 130 L 536 130 Z" fill="#a16207"/>
    <text x="521" y="112" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#854d0e">проверено, записано</text>

    <rect x="234" y="140" width="160" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="314" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Подписчики</text>
    <text x="314" y="183" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#854d0e">render(), save()</text>
    <path d="M 456 168 L 404 168" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 394 168 L 404 163 L 404 173 Z" fill="#a16207"/>

    <rect x="14" y="140" width="150" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="89" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">Страница</text>
    <text x="89" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">и localStorage</text>
    <path d="M 234 168 L 174 168" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 164 168 L 174 163 L 174 173 Z" fill="#a16207"/>

    <path d="M 89 140 L 89 86" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 89 76 L 84 86 L 94 86 Z" fill="#94a3b8"/>
    <text x="99" y="114" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">щелчок, ввод</text>

    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Слушатель не зовёт render: перерисовку заказывает ловушка — одну на всё действие.</text>
</svg>
