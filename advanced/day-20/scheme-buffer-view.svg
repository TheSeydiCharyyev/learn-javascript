<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Буфер из восьми байтов и три вида на нём: Uint8Array видит восемь элементов по байту, Uint16Array — четыре по два байта, Uint32Array со смещением 4 и длиной 1 — один элемент из байтов с 4 по 7">
    <text x="20" y="30" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#065f46">ArrayBuffer(8)</text>
    <text x="20" y="48" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">байты 0…7</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="middle">
        <rect x="140" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="168" y="42">0</text>
        <rect x="196" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="224" y="42">1</text>
        <rect x="252" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="280" y="42">2</text>
        <rect x="308" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="336" y="42">3</text>
        <rect x="364" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="392" y="42">4</text>
        <rect x="420" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="448" y="42">5</text>
        <rect x="476" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="504" y="42">6</text>
        <rect x="532" y="20" width="56" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="560" y="42">7</text>
    </g>

    <text x="20" y="92" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#047857">Uint8Array</text>
    <text x="20" y="108" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">8 элементов</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle">
        <rect x="142" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="168" y="98">[0]</text>
        <rect x="198" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="224" y="98">[1]</text>
        <rect x="254" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="280" y="98">[2]</text>
        <rect x="310" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="336" y="98">[3]</text>
        <rect x="366" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="392" y="98">[4]</text>
        <rect x="422" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="448" y="98">[5]</text>
        <rect x="478" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="504" y="98">[6]</text>
        <rect x="534" y="80" width="52" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="560" y="98">[7]</text>
    </g>

    <text x="20" y="140" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#047857">Uint16Array</text>
    <text x="20" y="156" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">4 элемента</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#334155" text-anchor="middle">
        <rect x="142" y="128" width="108" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="196" y="146">[0]</text>
        <rect x="254" y="128" width="108" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="308" y="146">[1]</text>
        <rect x="366" y="128" width="108" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="420" y="146">[2]</text>
        <rect x="478" y="128" width="108" height="28" rx="4" fill="#ffffff" stroke="#047857"/><text x="532" y="146">[3]</text>
    </g>

    <text x="20" y="188" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#047857">Uint32Array</text>
    <text x="20" y="204" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">смещение 4, длина 1</text>
    <rect x="366" y="176" width="220" height="28" rx="4" fill="#ffffff" stroke="#047857"/>
    <text x="476" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">[0]</text>

    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Байты одни и те же: запись через любой вид видна всем остальным.</text>
</svg>
