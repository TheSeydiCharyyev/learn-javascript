<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Путь записи ta[key] = v: ключ-строка проходит CanonicalNumericIndexString; не число — обычное свойство; число — TypedArraySetElement: сначала ToNumber или ToBigInt значения, потом IsValidIntegerIndex; индекс годится — байты пишутся с преобразованием вида, не годится — запись молча пропадает">
    <rect x="200" y="14" width="220" height="40" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="310" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#065f46">ta[key] = v</text>
    <path d="M 310 54 L 310 66" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M 310 74 L 305 66 L 315 66 Z" fill="#047857"/>

    <rect x="160" y="74" width="300" height="44" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="93" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#065f46">CanonicalNumericIndexString</text>
    <text x="310" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">7.1.21: число в обычной записи?</text>

    <path d="M 160 96 L 130 96 L 130 150" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 130 158 L 125 150 L 135 150 Z" fill="#94a3b8"/>
    <text x="124" y="120" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">нет: "01", "foo"</text>
    <rect x="20" y="158" width="220" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="130" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">обычное свойство объекта</text>

    <path d="M 460 96 L 490 96 L 490 150" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M 490 158 L 485 150 L 495 150 Z" fill="#047857"/>
    <text x="498" y="120" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">да: "5", "-0"</text>
    <rect x="380" y="158" width="220" height="40" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="490" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#065f46">ToNumber(v)</text>
    <text x="490" y="191" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">10.4.5.18, шаги 1–2: valueOf</text>

    <path d="M 490 198 L 490 210" fill="none" stroke="#047857" stroke-width="2"/>
    <path d="M 490 218 L 485 210 L 495 210 Z" fill="#047857"/>
    <rect x="380" y="218" width="220" height="38" rx="8" fill="#ffffff" stroke="#047857" stroke-width="2"/>
    <text x="490" y="236" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#065f46">IsValidIntegerIndex</text>
    <text x="490" y="250" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">годится — байты, нет — тишина</text>
</svg>
