<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Изменяемый буфер: при длине 8 вид track видит восемь байтов, fixed — первые четыре; после resize(3) track видит три байта, а fixed выходит за границы и получает длину 0; после resize(4) fixed снова в границах">
    <text x="20" y="36" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">resize(8)</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="130" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="152" y="37">0</text>
        <rect x="174" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="196" y="37">0</text>
        <rect x="218" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="240" y="37">5</text>
        <rect x="262" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="284" y="37">0</text>
        <rect x="306" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="328" y="37">0</text>
        <rect x="350" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="372" y="37">0</text>
        <rect x="394" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="416" y="37">0</text>
        <rect x="438" y="20" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="460" y="37">9</text>
    </g>
    <rect x="130" y="50" width="352" height="12" rx="3" fill="#10b981"/>
    <text x="490" y="60" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">track: 8</text>
    <rect x="130" y="66" width="176" height="12" rx="3" fill="#047857"/>
    <text x="314" y="76" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">fixed: 4</text>

    <text x="20" y="114" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">resize(3)</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="130" y="98" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="152" y="115">0</text>
        <rect x="174" y="98" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="196" y="115">0</text>
        <rect x="218" y="98" width="44" height="26" fill="#ecfdf5" stroke="#10b981"/><text x="240" y="115">5</text>
    </g>
    <rect x="130" y="128" width="132" height="12" rx="3" fill="#10b981"/>
    <text x="270" y="138" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">track: 3</text>
    <rect x="130" y="144" width="176" height="12" rx="3" fill="#fef2f2" stroke="#ef4444" stroke-dasharray="4 3"/>
    <text x="314" y="154" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">fixed: за границей — длина 0, методы бросают</text>

    <text x="20" y="190" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">resize(4)</text>
    <text x="130" y="190" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">fixed снова в границах: 4 элемента, байт 3 — новый ноль, 9 не вернулась</text>
</svg>
