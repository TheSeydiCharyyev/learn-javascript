<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" role="img" aria-label="Три байта FB FF 01 — 24 бита — режутся на четыре куска по шесть бит: 62, 63, 60, 1, это знаки плюс, косая черта, 8 и B; в алфавите base64url вместо плюса и косой черты — минус и подчёркивание">
    <g font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="middle">
        <rect x="70" y="20" width="160" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="150" y="40">FB = 11111011</text>
        <rect x="230" y="20" width="160" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="310" y="40">FF = 11111111</text>
        <rect x="390" y="20" width="160" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="470" y="40">01 = 00000001</text>
        <rect x="70" y="74" width="120" height="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="130" y="94">111110 = 62</text>
        <rect x="190" y="74" width="120" height="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="250" y="94">111111 = 63</text>
        <rect x="310" y="74" width="120" height="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="370" y="94">111100 = 60</text>
        <rect x="430" y="74" width="120" height="30" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="490" y="94">000001 = 1</text>
    </g>
    <g font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#065f46" text-anchor="middle">
        <text x="130" y="128">+</text><text x="250" y="128">/</text><text x="370" y="128">8</text><text x="490" y="128">B</text>
    </g>
    <text x="310" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">base64url: «+» → «-», «/» → «_», чтобы строка жила в адресе</text>
</svg>
