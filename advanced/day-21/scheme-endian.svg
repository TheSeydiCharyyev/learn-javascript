<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 176" role="img" aria-label="Число 0x01020304 в четырёх байтах: big-endian — 01 02 03 04, старший байт по меньшему адресу; little-endian — 04 03 02 01, младший байт по меньшему адресу; DataView без второго аргумента пишет big-endian, типизированные массивы — порядком машины">
    <text x="20" y="38" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">big-endian</text>
    <text x="20" y="54" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">старший первым</text>
    <g font-family="Consolas, monospace" font-size="13" fill="#1e293b" text-anchor="middle">
        <rect x="170" y="22" width="60" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="200" y="44">01</text>
        <rect x="230" y="22" width="60" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="260" y="44">02</text>
        <rect x="290" y="22" width="60" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="320" y="44">03</text>
        <rect x="350" y="22" width="60" height="34" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="380" y="44">04</text>
    </g>
    <text x="424" y="38" font-family="Consolas, monospace" font-size="11" fill="#065f46">dv.setUint32(0, n)</text>
    <text x="424" y="54" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">PNG, сеть</text>

    <text x="20" y="104" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">little-endian</text>
    <text x="20" y="120" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">младший первым</text>
    <g font-family="Consolas, monospace" font-size="13" fill="#1e293b" text-anchor="middle">
        <rect x="170" y="88" width="60" height="34" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="200" y="110">04</text>
        <rect x="230" y="88" width="60" height="34" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="260" y="110">03</text>
        <rect x="290" y="88" width="60" height="34" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="320" y="110">02</text>
        <rect x="350" y="88" width="60" height="34" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="380" y="110">01</text>
    </g>
    <text x="424" y="104" font-family="Consolas, monospace" font-size="11" fill="#065f46">dv.setUint32(0, n, true)</text>
    <text x="424" y="120" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">BMP, WAV, наша машина</text>

    <text x="200" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">байт 0</text>
    <text x="380" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">байт 3</text>
    <path d="M 232 148 L 346 148" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 354 148 L 346 144 L 346 152 Z" fill="#94a3b8"/>
</svg>
