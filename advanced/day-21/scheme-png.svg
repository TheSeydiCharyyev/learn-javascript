<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="Заголовок PNG по байтам: 0–7 подпись, 8–11 длина куска 13, 12–15 имя IHDR, 16–19 ширина 640, 20–23 высота 480, 24 глубина 8; числа big-endian">
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="30" width="160" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="100" y="54">подпись</text>
        <rect x="180" y="30" width="80" height="40" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="220" y="54">длина 13</text>
        <rect x="260" y="30" width="80" height="40" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="300" y="54">IHDR</text>
        <rect x="340" y="30" width="100" height="40" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="390" y="54">ширина 640</text>
        <rect x="440" y="30" width="100" height="40" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="490" y="54">высота 480</text>
        <rect x="540" y="30" width="60" height="40" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="570" y="54">8</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#475569" text-anchor="middle">
        <text x="100" y="90">0–7</text>
        <text x="220" y="90">8–11</text>
        <text x="300" y="90">12–15</text>
        <text x="390" y="90">16–19</text>
        <text x="490" y="90">20–23</text>
        <text x="570" y="90">24</text>
    </g>
    <text x="310" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#065f46">dv.getUint32(16) — ширина, dv.getUint32(20) — высота</text>
</svg>
