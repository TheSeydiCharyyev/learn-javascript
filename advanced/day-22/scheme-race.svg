<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Потерянное прибавление: поток А читает 5, поток Б читает 5, А пишет 6, Б пишет 6; два ++, а счётчик вырос на 1. Atomics.add читает и пишет одним неделимым шагом">
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
        <text x="130" y="24" fill="#065f46">поток А: counts[0]++</text>
        <text x="340" y="24" fill="#0369a1">поток Б: counts[0]++</text>
        <text x="520" y="24" fill="#334155">counts[0]</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="30" y="36" width="200" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="130" y="55">читает: 5</text>
        <rect x="240" y="72" width="200" height="30" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="340" y="91">читает: 5</text>
        <rect x="30" y="108" width="200" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="130" y="127">пишет: 5 + 1 = 6</text>
        <rect x="240" y="144" width="200" height="30" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/><text x="340" y="163">пишет: 5 + 1 = 6</text>
    </g>
    <g font-family="Consolas, monospace" font-size="13" fill="#1e293b" text-anchor="middle">
        <rect x="460" y="36" width="120" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="520" y="56">5</text>
        <rect x="460" y="72" width="120" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="520" y="92">5</text>
        <rect x="460" y="108" width="120" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="520" y="128">6</text>
        <rect x="460" y="144" width="120" height="30" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="520" y="164">6, а не 7</text>
    </g>
    <text x="310" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">Б прочитал 5 раньше, чем А записал 6: два ++, а счётчик вырос на 1</text>
    <text x="310" y="222" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#065f46">Atomics.add(counts, 0, 1) — чтение и запись одним неделимым шагом</text>
</svg>
