<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 206" role="img" aria-label="ArrayBuffer через postMessage копируется: у страницы и у Worker по своему блоку, страница видит 0. SharedArrayBuffer передаётся новым объектом, но блок байтов один: Worker записал 99, страница видит 99">
