<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="Очередь ожидающих ячейки a[0]: А через wait, Б и В через waitAsync. notify(a, 0, 1) будит первого и возвращает 1, notify(a, 0) будит остальных и возвращает 2, следующий notify возвращает 0. wait усыпляет поток и работает только в Worker; waitAsync сразу даёт обещание и работает и на странице">
    <defs>
        <marker id="d22-next" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#047857"/>
        </marker>
    </defs>
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">Очередь ожидающих ячейки a[0]</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="34" width="110" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="75" y="55">А: wait</text>
        <rect x="150" y="34" width="110" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="205" y="55">Б: waitAsync</text>
        <rect x="280" y="34" width="110" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="335" y="55">В: waitAsync</text>
    </g>
    <line x1="130" y1="51" x2="147" y2="51" stroke="#047857" stroke-width="2" marker-end="url(#d22-next)"/>
    <line x1="260" y1="51" x2="277" y2="51" stroke="#047857" stroke-width="2" marker-end="url(#d22-next)"/>
    <text x="205" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">первым встал в очередь — первым разбужен</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#065f46">
        <text x="420" y="44">notify(a, 0, 1) → 1</text>
        <text x="420" y="74">notify(a, 0) → 2</text>
        <text x="420" y="104">notify(a, 0) → 0</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="420" y="58">будит А</text>
        <text x="420" y="88">будит Б и В</text>
        <text x="420" y="118">очередь пуста</text>
    </g>
    <rect x="20" y="132" width="580" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b">
        <text x="34" y="152">wait усыпляет поток — только в Worker; waitAsync сразу даёт обещание — и на странице</text>
        <text x="34" y="171">разбудили — «ok»; не дождался — «timed-out»; в ячейке не то значение — сразу «not-equal»</text>
    </g>
</svg>
