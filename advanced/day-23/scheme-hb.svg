<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Флаг готовности. Поток А: запись data, потом Atomics.store флага — порядок агента. Страница: Atomics.load флага читает 1, потом чтение data — порядок агента. Запись флага synchronizes-with его чтение, потому что оба seq-cst и диапазоны равны. Вместе это happens-before от записи data к её чтению — гонки данных нет">
    <defs>
        <marker id="d23-ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#047857"/>
        </marker>
        <marker id="d23-sw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#0369a1"/>
        </marker>
        <marker id="d23-hb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
        <text x="130" y="22" fill="#065f46">поток producer.js</text>
        <text x="490" y="22" fill="#065f46">страница main.js</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="30" y="34" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="130" y="55">data[i] = i * 0.5</text>
        <rect x="30" y="122" width="200" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="130" y="143">Atomics.store(flag, 0, 1)</text>
        <rect x="390" y="34" width="200" height="34" rx="6" fill="#ffffff" stroke="#047857" stroke-width="2"/><text x="490" y="55">Atomics.load(flag, 0) → 1</text>
        <rect x="390" y="122" width="200" height="34" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="490" y="143">sum += data[i]</text>
    </g>
    <line x1="130" y1="68" x2="130" y2="119" stroke="#047857" stroke-width="2" marker-end="url(#d23-ao)"/>
    <line x1="490" y1="68" x2="490" y2="119" stroke="#047857" stroke-width="2" marker-end="url(#d23-ao)"/>
    <line x1="230" y1="134" x2="387" y2="58" stroke="#0369a1" stroke-width="2" marker-end="url(#d23-sw)"/>
    <line x1="230" y1="48" x2="387" y2="140" stroke="#c2410c" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#d23-hb)"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5">
        <text x="20" y="98" fill="#047857">порядок агента</text>
        <text x="500" y="98" fill="#047857">порядок агента</text>
        <text x="250" y="80" fill="#0369a1">synchronizes-with</text>
        <text x="250" y="118" fill="#c2410c">happens-before</text>
    </g>
    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">оба события флага — seq-cst, диапазоны равны, чтение берёт значение записи (29.6.5)</text>
    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">запись data happens-before её чтения — гонки данных нет, хотя data читают обычным доступом</text>
</svg>
