<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Слева: чередования шагов потоков А и Б дают 0 1, 1 0 или 1 1 — из шести ни одно не даёт 0 0. Справа: у каждого потока свой буфер записи; А положил x = 1 в буфер и прочитал y из памяти — 0, Б так же — 0; получилось 0 0">
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#065f46">Если шаги только чередуются</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <text x="20" y="46">А: x = 1; А: r1 = y; Б: y = 1; Б: r2 = x</text>
        <text x="20" y="66">Б: y = 1; Б: r2 = x; А: x = 1; А: r1 = y</text>
        <text x="20" y="86">А: x = 1; Б: y = 1; А: r1 = y; Б: r2 = x</text>
        <text x="20" y="106">Б: y = 1; А: x = 1; Б: r2 = x; А: r1 = y</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#065f46" text-anchor="end">
        <text x="330" y="46">0 1</text>
        <text x="330" y="66">1 0</text>
        <text x="330" y="86">1 1</text>
        <text x="330" y="106">1 1</text>
    </g>
    <text x="20" y="130" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">ещё два порядка — тоже 1 1; из шести 0 0 не даёт ни один</text>

    <text x="370" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">Если у потока буфер записи</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="370" y="34" width="110" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="425" y="55">буфер А: x = 1</text>
        <rect x="490" y="34" width="110" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="545" y="55">буфер Б: y = 1</text>
        <rect x="370" y="92" width="230" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="485" y="113">память: x = 0, y = 0</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="370" y="86">А читает y из памяти — 0</text>
        <text x="370" y="144">Б читает x из памяти — 0</text>
    </g>
    <text x="310" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#c2410c">обычные x[r], y[r]: 0 0 — примерно в каждом восьмом раунде</text>
    <text x="310" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#065f46">Atomics.store / Atomics.load: 0 0 — ни разу</text>
</svg>
