        <rect x="460" y="20" width="50" height="30" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="485" y="40">00</text>
        <rect x="110" y="70" width="50" height="30" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/><text x="135" y="90">FF</text>
