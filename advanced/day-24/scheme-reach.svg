<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Пометка и очистка: от корня — глобального объекта и переменных — сборщик идёт по ссылкам и помечает достижимые объекты колода и карточка. Объекты a и b ссылаются друг на друга, но от корня до них дороги нет — цикл недостижим и собирается целиком">
    <defs>
        <marker id="d24-ref" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
        <marker id="d24-dead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="70" width="120" height="40" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="80" y="94">корень</text>
        <rect x="200" y="30" width="120" height="40" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="260" y="54">колода</text>
        <rect x="200" y="110" width="120" height="40" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="260" y="134">карточка</text>
        <rect x="420" y="30" width="80" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="460" y="54">a</text>
        <rect x="420" y="110" width="80" height="40" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="460" y="134">b</text>
    </g>
    <line x1="140" y1="82" x2="197" y2="54" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-ref)"/>
    <line x1="260" y1="70" x2="260" y2="107" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-ref)"/>
    <line x1="450" y1="70" x2="450" y2="107" stroke="#94a3b8" stroke-width="2" marker-end="url(#d24-dead)"/>
    <line x1="470" y1="110" x2="470" y2="73" stroke="#94a3b8" stroke-width="2" marker-end="url(#d24-dead)"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="20" y="130">глобальный объект,</text>
        <text x="20" y="144">переменные, стек</text>
        <text x="515" y="84">a.other = b</text>
        <text x="515" y="100">b.other = a</text>
    </g>
    <text x="310" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">помечено всё, до чего можно дойти от корня; цикл a ⇄ b не помечен — его соберут целиком</text>
    <text x="310" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">подсчёт ссылок здесь ошибся бы: у a и b по одной ссылке, но обе — внутри цикла</text>
</svg>
