<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 208" role="img" aria-label="FinalizationRegistry хранит список ячеек Cells: в каждой цель (слабо), сохранённое значение и токен; у ячейки galam цель уже убрана. Сборщик освободил цель — в ячейке цель пуста; хозяин ставит задание очистки; CleanupFinalizationRegistry убирает ячейку и вызывает обратный вызов с сохранённым значением">
    <defs>
        <marker id="d24-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">registry.[[Cells]]</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="250" height="56" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
        <text x="32" y="54">цель: {…} (слабо)</text>
        <text x="32" y="72">значение: "kitap", токен: empty</text>
        <rect x="20" y="102" width="250" height="56" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
        <text x="32" y="122">цель: empty</text>
        <text x="32" y="140">значение: "galam", токен: {…}</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="330" y="34" width="270" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="465" y="55">сборщик: цель недостижима</text>
        <rect x="330" y="88" width="270" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="465" y="109">хозяин ставит задание очистки</text>
        <rect x="330" y="142" width="270" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="465" y="163">callback("galam") — ячейку убрали</text>
    </g>
    <line x1="465" y1="68" x2="465" y2="85" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-step)"/>
    <line x1="465" y1="122" x2="465" y2="139" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-step)"/>
    <line x1="330" y1="51" x2="273" y2="120" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-step)"/>
    <text x="310" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">9.9.3 — цель становится empty; 9.9.4.1 — задание очистки; 9.12 — убрать ячейку и вызвать callback</text>
</svg>
