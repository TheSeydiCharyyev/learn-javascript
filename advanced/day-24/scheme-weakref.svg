<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="Слева: переменная card держит объект сильной ссылкой, WeakRef — слабой, сборщик объект не тронет. Справа: card = null, сильных ссылок нет; после сборки слот WeakRefTarget пуст, deref возвращает undefined">
    <defs>
        <marker id="d24-strong" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
        <marker id="d24-weak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
    </defs>
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">До: есть сильная ссылка</text>
    <text x="340" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">После card = null и сборки</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="40" width="100" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="70" y="61">card</text>
        <rect x="20" y="110" width="100" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="70" y="131">ref</text>
        <rect x="180" y="74" width="120" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="240" y="95">{ word: "kitap" }</text>
        <rect x="340" y="40" width="110" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="395" y="61">card: null</text>
        <rect x="340" y="110" width="110" height="34" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="395" y="131">ref</text>
        <rect x="480" y="110" width="120" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="540" y="131">empty</text>
    </g>
    <line x1="120" y1="57" x2="177" y2="85" stroke="#c2410c" stroke-width="2" marker-end="url(#d24-strong)"/>
    <line x1="120" y1="127" x2="177" y2="99" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#d24-weak)"/>
    <line x1="450" y1="127" x2="477" y2="127" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#d24-weak)"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="130" y="48">сильная</text>
        <text x="130" y="150">слабая</text>
        <text x="480" y="100">[[WeakRefTarget]]</text>
    </g>
    <text x="310" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#c2410c">ref.deref() → объект, пока есть сильная ссылка; после сборки → undefined</text>
</svg>
