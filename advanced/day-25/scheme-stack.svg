<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Слева блок: using a, потом using b и c, потом тело. Каждое объявление кладёт запись в стек ресурсов блока, сверху последняя — c, под ней b, внизу a. В конце блока DisposeResources проходит стек с конца: сначала закрыт c, потом b, потом a">
    <defs>
        <marker id="d25-step" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">
        <text x="20" y="22">блок</text>
        <text x="280" y="22">стек ресурсов блока</text>
        <text x="460" y="22">конец блока (7.5.4)</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="220" height="126" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
        <text x="32" y="56">using a = res("a");</text>
        <text x="32" y="76">using b = res("b"),</text>
        <text x="68" y="96">c = res("c");</text>
        <text x="32" y="116">log.push("тело");</text>
        <text x="32" y="146">}</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="280" y="34" width="140" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="350" y="53">запись c</text>
        <rect x="280" y="72" width="140" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="350" y="91">запись b</text>
        <rect x="280" y="110" width="140" height="30" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="350" y="129">запись a</text>
        <rect x="460" y="34" width="140" height="30" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="530" y="53">1. закрыт c</text>
        <rect x="460" y="72" width="140" height="30" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="530" y="91">2. закрыт b</text>
        <rect x="460" y="110" width="140" height="30" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="530" y="129">3. закрыт a</text>
    </g>
    <line x1="242" y1="88" x2="276" y2="88" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-step)"/>
    <line x1="422" y1="49" x2="456" y2="49" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-step)"/>
    <line x1="422" y1="87" x2="456" y2="87" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-step)"/>
    <line x1="422" y1="125" x2="456" y2="125" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-step)"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="280" y="160">при объявлении: AddDisposableResource</text>
        <text x="280" y="180">в конце блока: с последней записи к первой</text>
    </g>
</svg>
