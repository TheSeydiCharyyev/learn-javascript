<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="Слева три события: тело бросает Failed to read, при закрытии бросает writer, потом бросает reader. Справа итог: внешний SuppressedError, его error — ошибка reader; в suppressed — внутренний SuppressedError, его error — ошибка writer, а suppressed — исходная ошибка Failed to read">
    <defs>
        <marker id="d25-down" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#c2410c"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c">
        <text x="20" y="22">что случилось по порядку</text>
        <text x="290" y="22">что поймал catch</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="230" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
        <text x="32" y="55">1. тело: "Failed to read"</text>
        <rect x="20" y="92" width="230" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
        <text x="32" y="113">2. закрываем writer: бросил</text>
        <rect x="20" y="150" width="230" height="34" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
        <text x="32" y="171">3. закрываем reader: бросил</text>
        <rect x="290" y="34" width="310" height="170" rx="6" fill="#fff7ed" stroke="#c2410c" stroke-width="2"/>
        <text x="302" y="54">e: SuppressedError</text>
        <text x="302" y="74">error: "…lock on reader"</text>
        <text x="302" y="96">suppressed:</text>
        <rect x="306" y="104" width="278" height="88" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="2"/>
        <text x="318" y="124">SuppressedError</text>
        <text x="318" y="144">error: "…lock on writer"</text>
        <text x="318" y="164">suppressed: "Failed to read"</text>
        <text x="318" y="182" fill="#475569">исходная ошибка — глубже всех</text>
    </g>
    <line x1="135" y1="70" x2="135" y2="89" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-down)"/>
    <line x1="135" y1="128" x2="135" y2="147" stroke="#c2410c" stroke-width="2" marker-end="url(#d25-down)"/>
</svg>
