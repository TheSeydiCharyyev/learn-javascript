<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Таблица по микрозадачам. Синхронно: вызов 1 закрывает another 1, вызов 2 — another 2. Микрозадача 1: вызов 1 закрывает optional; вызов 2 видит null — только флаг — и сразу закрывает required 2. Микрозадача 2: вызов 1 закрывает required 1. MDN ждёт required 1 раньше required 2, а по шагам 7.5.4 наоборот">
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#c2410c" text-anchor="middle">
        <text x="230" y="22">синхронно</text>
        <text x="380" y="22">микрозадача 1</text>
        <text x="530" y="22">микрозадача 2</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <text x="20" y="60">example(1, true)</text>
        <text x="20" y="128">example(2, false)</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b" text-anchor="middle">
        <rect x="160" y="34" width="140" height="50" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="230" y="64">another 1</text>
        <rect x="310" y="34" width="140" height="50" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="380" y="64">optional</text>
        <rect x="460" y="34" width="140" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="530" y="64">required 1</text>
        <rect x="160" y="102" width="140" height="50" rx="6" fill="#ffffff" stroke="#c2410c" stroke-width="2"/><text x="230" y="132">another 2</text>
        <rect x="310" y="102" width="140" height="50" rx="6" fill="#fff7ed" stroke="#f97316" stroke-width="2"/><text x="380" y="122">null: только флаг</text><text x="380" y="142">required 2</text>
        <rect x="460" y="102" width="140" height="50" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="530" y="132">—</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="20" y="180">MDN: required 1, потом required 2 — будто null дал лишнее ожидание.</text>
        <text x="20" y="200">Шаги 7.5.4 (и Chrome): required 2 — в микрозадаче 1, вместе с optional.</text>
    </g>
</svg>
