<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="ResolveLocale. Слева: запрос, пара по основе тега (шаги 1–4, нет пары — язык по умолчанию без расширения), разбор расширения -u- (шаг 10). Справа для каждого важного ключа (шаг 13): значение по умолчанию из данных языка, затем значение из -u-, если оно поддержано, затем опция — она перекрывает и убирает ключ из тега. Шаг 14: оставшиеся ключи вставляются обратно в тег">
    <defs>
        <marker id="d26-flow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f46e5"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">
        <text x="20" y="22">тег</text>
        <text x="250" y="22">каждый важный ключ (шаг 13)</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="200" height="46" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="53">запрос: ru-u-nu-arab</text>
        <text x="32" y="71">шаг 1.b: -u- в сторону</text>
        <rect x="20" y="92" width="200" height="46" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="111">пара по основе: ru</text>
        <text x="32" y="129">нет пары — по умолчанию</text>
        <rect x="20" y="150" width="200" height="46" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="169">шаг 10: ключи из -u-</text>
        <text x="32" y="187">nu = arab</text>
        <rect x="250" y="34" width="350" height="46" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="53">1. по умолчанию из данных языка</text>
        <text x="262" y="71">nu = latn (13.c)</text>
        <rect x="250" y="92" width="350" height="46" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="111">2. из -u-, если поддержано: nu = arab</text>
        <text x="262" y="129">ключ останется в теге (13.f)</text>
        <rect x="250" y="150" width="350" height="46" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="169">3. опция numberingSystem — перекрывает,</text>
        <text x="262" y="187">и ключ уходит из тега (13.k)</text>
    </g>
    <line x1="120" y1="80" x2="120" y2="89" stroke="#4f46e5" stroke-width="2" marker-end="url(#d26-flow)"/>
    <line x1="120" y1="138" x2="120" y2="147" stroke="#4f46e5" stroke-width="2" marker-end="url(#d26-flow)"/>
    <line x1="425" y1="80" x2="425" y2="89" stroke="#4f46e5" stroke-width="2" marker-end="url(#d26-flow)"/>
    <line x1="425" y1="138" x2="425" y2="147" stroke="#4f46e5" stroke-width="2" marker-end="url(#d26-flow)"/>
    <line x1="222" y1="173" x2="246" y2="115" stroke="#4f46e5" stroke-width="2" marker-end="url(#d26-flow)"/>
    <text x="20" y="216" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Шаг 14: оставшиеся ключи — обратно в тег: resolvedOptions().locale показывает, откуда взялась настройка.</text>
</svg>
