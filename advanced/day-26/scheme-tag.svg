<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Тег tk-Latn-TM-u-ca-gregory-nu-latn-x-kurs по частям: tk — язык, Latn — письменность, TM — регион, u-ca-gregory-nu-latn — расширение Unicode с ключами ca (календарь) и nu (цифры), x-kurs — частная часть, которую Intl не читает">
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">tk-Latn-TM-u-ca-gregory-nu-latn-x-kurs</text>
    <g font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="36" width="60" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="50" y="58">tk</text>
        <rect x="88" y="36" width="80" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="128" y="58">Latn</text>
        <rect x="176" y="36" width="60" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="206" y="58">TM</text>
        <rect x="244" y="36" width="220" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="354" y="58">u-ca-gregory-nu-latn</text>
        <rect x="472" y="36" width="128" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/><text x="536" y="58">x-kurs</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle">
        <text x="50" y="92">язык</text>
        <text x="128" y="92">письменность</text>
        <text x="206" y="92">регион</text>
        <text x="354" y="92">расширение Unicode</text>
        <text x="354" y="110">ca — календарь, nu — цифры</text>
        <text x="536" y="92">частная часть</text>
        <text x="536" y="110">Intl не читает</text>
    </g>
    <text x="20" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Без -u- и -x- это «основа» тега; ResolveLocale ищет пару по основе, а из -u- берёт только важные ключи.</text>
</svg>
