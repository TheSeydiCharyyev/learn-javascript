<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Уровни сравнения Collator. Первый уровень — основа буквы, второй — знаки над буквой, третий — регистр. base: a и á равны, a и A равны, е и ё равны. accent: a и á различны, a и A равны, е и ё различны. case: a и á равны, a и A различны, е и ё равны. variant: все три пары различны. Сортировка по умолчанию — variant, для поиска обычно берут base">
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">
        <text x="300" y="22">a / á</text>
        <text x="410" y="22">a / A</text>
        <text x="520" y="22">е / ё</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="230" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="32" y="53">base — только основа</text>
        <rect x="20" y="70" width="230" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="32" y="89">accent — основа и знаки</text>
        <rect x="20" y="106" width="230" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="32" y="125">case — основа и регистр</text>
        <rect x="20" y="142" width="230" height="28" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="32" y="161">variant — всё</text>
    </g>
    <g font-family="Consolas, monospace" font-size="13" font-weight="700" text-anchor="middle">
        <rect x="260" y="34" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="300" y="53" fill="#0e7490">=</text>
        <rect x="370" y="34" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="410" y="53" fill="#0e7490">=</text>
        <rect x="480" y="34" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="520" y="53" fill="#0e7490">=</text>
        <rect x="260" y="70" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="300" y="89" fill="#3730a3">≠</text>
        <rect x="370" y="70" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="410" y="89" fill="#0e7490">=</text>
        <rect x="480" y="70" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="520" y="89" fill="#3730a3">≠</text>
        <rect x="260" y="106" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="300" y="125" fill="#0e7490">=</text>
        <rect x="370" y="106" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="410" y="125" fill="#3730a3">≠</text>
        <rect x="480" y="106" width="80" height="28" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="520" y="125" fill="#0e7490">=</text>
        <rect x="260" y="142" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="300" y="161" fill="#3730a3">≠</text>
        <rect x="370" y="142" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="410" y="161" fill="#3730a3">≠</text>
        <rect x="480" y="142" width="80" height="28" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="520" y="161" fill="#3730a3">≠</text>
    </g>
    <text x="20" y="196" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Сортировка по умолчанию — variant (10.1.1, шаг 19); для поиска без знаков и регистра берут base.</text>
</svg>
