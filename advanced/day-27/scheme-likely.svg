<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-label="maximize и minimize. tk после maximize становится tk-Latn-TM, а minimize возвращает tk. und-TM после maximize — tk-Latn-TM: язык выбран по региону. zh-Hant-TW после minimize — zh-TW: регион оставлен, письменность убрана, потому что из региона она выводится. Расширение -u- оба метода не трогают">
