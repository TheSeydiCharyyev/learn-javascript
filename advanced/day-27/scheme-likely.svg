        <rect x="250" y="76" width="140" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="320" y="98">tk-Latn-TM</text>
        <rect x="20" y="132" width="120" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="80" y="154">zh-Hant-TW</text>
        <rect x="250" y="132" width="140" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="320" y="154">zh-TW</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">
