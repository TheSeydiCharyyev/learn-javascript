<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Конструктор Intl.Locale по шагам на примере тега tk-TM-u-ca-persian и опций region TR, script Latn, calendar gregory. Шаги 1, 7–11: нужен new, тег — строка или объект Locale, тег записан правильно, иначе TypeError или RangeError. Шаг 13: канонизация. Шаг 14: UpdateLanguageId подменяет язык, письменность, регион и варианты — получается tk-Latn-TR. Шаг 35: MakeLocaleRecord подменяет ключи расширения — календарь gregory. Итог: tk-Latn-TR-u-ca-gregory">
    <defs>
        <marker id="d27-ctor" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f46e5"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">
        <text x="20" y="22">шаги 15.1.1</text>
        <text x="310" y="22">new Intl.Locale("tk-TM-u-ca-persian", опции)</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="260" height="36" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="57">1, 7–11: new, тип и запись тега</text>
        <rect x="20" y="88" width="260" height="36" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="111">13: канонизация</text>
        <rect x="20" y="142" width="260" height="36" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="165">14: UpdateLanguageId</text>
        <rect x="20" y="196" width="260" height="36" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="219">35: MakeLocaleRecord</text>
        <rect x="310" y="34" width="290" height="36" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="322" y="57">иначе TypeError или RangeError</text>
        <rect x="310" y="88" width="290" height="36" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="322" y="111">tk-TM-u-ca-persian (sh → sr-Latn)</text>
        <rect x="310" y="142" width="290" height="36" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="322" y="165">region: "TR", script: "Latn"</text>
        <rect x="310" y="196" width="290" height="36" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="322" y="219">calendar: "gregory" вместо persian</text>
        <rect x="20" y="250" width="580" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="270">[[Locale]] = "tk-Latn-TR-u-ca-gregory"</text>
    </g>
    <line x1="150" y1="70" x2="150" y2="85" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="150" y1="124" x2="150" y2="139" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="150" y1="178" x2="150" y2="193" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="150" y1="232" x2="150" y2="247" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="282" y1="52" x2="306" y2="52" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="282" y1="106" x2="306" y2="106" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="282" y1="160" x2="306" y2="160" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
    <line x1="282" y1="214" x2="306" y2="214" stroke="#4f46e5" stroke-width="2" marker-end="url(#d27-ctor)"/>
</svg>
