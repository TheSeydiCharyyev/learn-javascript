<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="CreatePartsFromList собирает список с конца. Список: Аман, Мерет, Сапар, Огулгерек. Шаг 5: сначала только последний элемент, Огулгерек. При i равном 2 шаблон End «{0} и {1}» даёт «Сапар и Огулгерек». При i равном 1 шаблон Middle «{0}, {1}» даёт «Мерет, Сапар и Огулгерек». При i равном 0 шаблон Start «{0}, {1}» даёт «Аман, Мерет, Сапар и Огулгерек». В шаблоне {0} — новый элемент, {1} — всё, что уже собрано">
    <defs>
        <marker id="d28-list" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f46e5"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">
        <text x="20" y="22">шаги 14.5.2</text>
        <text x="250" y="22">["Аман", "Мерет", "Сапар", "Огулгерек"]</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="200" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="56">5: последний</text>
        <rect x="20" y="86" width="200" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="108">i = 2: End "{0} и {1}"</text>
        <rect x="20" y="138" width="200" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="160">i = 1: Middle "{0}, {1}"</text>
        <rect x="20" y="190" width="200" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="212">i = 0: Start "{0}, {1}"</text>
        <rect x="250" y="34" width="350" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="56">Огулгерек</text>
        <rect x="250" y="86" width="350" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="108">Сапар и Огулгерек</text>
        <rect x="250" y="138" width="350" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="160">Мерет, Сапар и Огулгерек</text>
        <rect x="250" y="190" width="350" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="262" y="212">Аман, Мерет, Сапар и Огулгерек</text>
    </g>
    <line x1="222" y1="51" x2="246" y2="51" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="222" y1="103" x2="246" y2="103" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="222" y1="155" x2="246" y2="155" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="222" y1="207" x2="246" y2="207" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="425" y1="68" x2="425" y2="83" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="425" y1="120" x2="425" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <line x1="425" y1="172" x2="425" y2="187" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-list)"/>
    <text x="20" y="242" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">В шаблоне {0} — новый элемент, {1} — всё, что уже собрано; у двух элементов — один шаблон Pair.</text>
</svg>
