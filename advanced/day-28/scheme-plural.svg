<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 236" role="img" aria-label="Как select выбирает категорию. Шаг 4 ResolvePlural печатает число по опциям цифр, шаг 10 выбирает категорию по этой строке, а слово берётся из нашей таблицы форм. 1.0001 при дробях от 0 до 3 печатается как 1 — категория one, слово урок. 1 при дробях от 1 печатается как 1.0 — категория other, слово урока. 1.5 при дробях 0 печатается как 2 — категория few, слово урока">
    <defs>
        <marker id="d28-plural" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f46e5"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5" text-anchor="middle">
        <text x="70" y="20">число</text>
        <text x="265" y="20">строка s (шаг 4)</text>
        <text x="445" y="20">категория (шаг 10)</text>
        <text x="590" y="20">слово</text>
    </g>
    <g font-family="Consolas, monospace" font-size="12" fill="#1e293b" text-anchor="middle">
        <rect x="20" y="32" width="100" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="70" y="54">1.0001</text>
        <rect x="220" y="32" width="90" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="265" y="54">"1"</text>
        <rect x="400" y="32" width="90" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="445" y="54">one</text>
        <rect x="550" y="32" width="80" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="590" y="54">урок</text>
        <rect x="20" y="94" width="100" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="70" y="116">1</text>
        <rect x="220" y="94" width="90" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="265" y="116">"1.0"</text>
        <rect x="400" y="94" width="90" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="445" y="116">other</text>
        <rect x="550" y="94" width="80" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="590" y="116">урока</text>
        <rect x="20" y="156" width="100" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/><text x="70" y="178">1.5</text>
        <rect x="220" y="156" width="90" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/><text x="265" y="178">"2"</text>
        <rect x="400" y="156" width="90" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/><text x="445" y="178">few</text>
        <rect x="550" y="156" width="80" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/><text x="590" y="178">урока</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#4f46e5" text-anchor="middle">
        <text x="168" y="43">дробей 0–3</text>
        <text x="354" y="43">правило ru</text>
        <text x="519" y="43">таблица</text>
        <text x="168" y="105">дробей от 1</text>
        <text x="168" y="167">дробей 0</text>
    </g>
    <line x1="122" y1="52" x2="216" y2="52" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="312" y1="52" x2="396" y2="52" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="492" y1="52" x2="546" y2="52" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="122" y1="114" x2="216" y2="114" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="312" y1="114" x2="396" y2="114" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="492" y1="114" x2="546" y2="114" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="122" y1="176" x2="216" y2="176" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="312" y1="176" x2="396" y2="176" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <line x1="492" y1="176" x2="546" y2="176" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-plural)"/>
    <text x="20" y="222" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">ResolvePlural (17.5.2): категорию выбирают по напечатанной строке, а не по самому числу.</text>
</svg>
