<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 330" role="img" aria-label="PartitionRelativeTimePattern по шагам на примере format(-21, «days»). Шаг 1: NaN или бесконечность — RangeError. Шаг 2: days становится day, неизвестная единица — RangeError. Шаг 7: при numeric auto ищется готовая фраза по ToString(value), например вчера. Шаг 8: минус ноль и отрицательные — прошлое, остальные — будущее. Шаги 11–12: NumberFormat печатает 21, PluralRules даёт one. Шаг 14: шаблон «{0} день назад» — итог «21 день назад»">
    <defs>
        <marker id="d28-rel" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4f46e5"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#4f46e5">
        <text x="20" y="22">шаги 18.5.2</text>
        <text x="330" y="22">rtf.format(-21, "days")</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" fill="#1e293b">
        <rect x="20" y="34" width="280" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="56">1: NaN, +∞ или −∞?</text>
        <rect x="20" y="86" width="280" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="108">2: SingularRelativeTimeUnit</text>
        <rect x="20" y="138" width="280" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="160">7: auto — фраза для ToString(value)?</text>
        <rect x="20" y="190" width="280" height="34" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="212">8: −0 или меньше — past</text>
        <rect x="20" y="242" width="280" height="34" rx="6" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="264">11–12: NumberFormat и PluralRules</text>
        <rect x="330" y="34" width="270" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="342" y="56">да — RangeError</text>
        <rect x="330" y="86" width="270" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="342" y="108">"days" → "day", иначе RangeError</text>
        <rect x="330" y="138" width="270" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="342" y="160">есть — "вчера", дальше не идём</text>
        <rect x="330" y="190" width="270" height="34" rx="6" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
        <text x="342" y="212">-21 — past</text>
        <rect x="330" y="242" width="270" height="34" rx="6" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
        <text x="342" y="264">"21" и one</text>
        <rect x="20" y="290" width="580" height="30" rx="6" fill="#ecfeff" stroke="#0891b2" stroke-width="2"/>
        <text x="32" y="310">14: шаблон past/one "{0} день назад" → "21 день назад"</text>
    </g>
    <line x1="160" y1="68" x2="160" y2="83" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="160" y1="120" x2="160" y2="135" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="160" y1="172" x2="160" y2="187" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="160" y1="224" x2="160" y2="239" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="160" y1="276" x2="160" y2="287" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="302" y1="51" x2="326" y2="51" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="302" y1="103" x2="326" y2="103" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="302" y1="155" x2="326" y2="155" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="302" y1="207" x2="326" y2="207" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
    <line x1="302" y1="259" x2="326" y2="259" stroke="#4f46e5" stroke-width="2" marker-end="url(#d28-rel)"/>
</svg>
