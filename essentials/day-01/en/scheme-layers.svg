<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Three layers of a page: HTML, CSS and JavaScript">
    <rect x="10" y="20" width="170" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1e40af">HTML</text>
    <text x="95" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">content</text>
    <text x="95" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">heading, text,</text>
    <text x="95" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">button, image</text>
    <text x="95" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">&lt;button&gt;Buy&lt;/button&gt;</text>

    <rect x="195" y="20" width="170" height="170" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="280" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#15803d">CSS</text>
    <text x="280" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">appearance</text>
    <text x="280" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">color, size,</text>
    <text x="280" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">spacing, font</text>
    <text x="280" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#15803d">background: green;</text>

    <rect x="380" y="20" width="170" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#b45309">JavaScript</text>
    <text x="465" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">behavior</text>
    <text x="465" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">on click: count,</text>
    <text x="465" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">send, change</text>
    <text x="465" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">onclick = buy;</text>
</svg>
