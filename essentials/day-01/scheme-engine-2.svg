<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Одно и то же ядро языка внутри двух окружений: браузер добавляет document, alert, события и localStorage; Node.js добавляет process, файлы и сервер">
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="10" y="10" width="290" height="180" rx="14" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
        <text x="155" y="36" font-size="15" font-weight="700" fill="#1e40af">Браузер</text>
        <text x="155" y="58" font-size="12" fill="#475569">добавляет: document, alert,</text>
        <text x="155" y="75" font-size="12" fill="#475569">события, localStorage</text>
        <rect x="35" y="95" width="240" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
        <text x="155" y="121" font-size="13" font-weight="700" fill="#b45309">ядро языка (ECMAScript)</text>
        <text x="155" y="142" font-size="11.5" fill="#475569">числа, строки, функции, Math, JSON</text>
        <text x="155" y="160" font-size="11.5" fill="#475569">одинаковое везде</text>
        <rect x="320" y="10" width="290" height="180" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
        <text x="465" y="36" font-size="15" font-weight="700" fill="#15803d">Node.js</text>
        <text x="465" y="58" font-size="12" fill="#475569">добавляет: process, файлы,</text>
        <text x="465" y="75" font-size="12" fill="#475569">сервер</text>
        <rect x="345" y="95" width="240" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
        <text x="465" y="121" font-size="13" font-weight="700" fill="#b45309">ядро языка (ECMAScript)</text>
        <text x="465" y="142" font-size="11.5" fill="#475569">числа, строки, функции, Math, JSON</text>
        <text x="465" y="160" font-size="11.5" fill="#475569">одинаковое везде</text>
    </g>
</svg>
