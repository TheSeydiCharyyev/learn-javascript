<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Путь кода: файл, браузер, движок, страница">
    <rect x="8" y="45" width="130" height="70" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="73" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e293b">Ваш файл</text>
    <text x="73" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#475569">app.js</text>

    <path d="M142 80 H178" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
    <rect x="182" y="45" width="130" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="247" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1e40af">Браузер</text>
    <text x="247" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">читает страницу</text>

    <path d="M316 80 H352" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
    <rect x="356" y="45" width="130" height="70" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="421" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#b45309">Движок</text>
    <text x="421" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">выполняет код</text>

    <path d="M490 80 H526" stroke="#64748b" stroke-width="2" marker-end="url(#a1)"/>
    <rect x="530" y="45" width="82" height="70" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
