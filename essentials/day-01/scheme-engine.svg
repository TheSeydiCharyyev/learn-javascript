    <text x="571" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">меняется</text>

    <defs>
        <marker id="a1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
