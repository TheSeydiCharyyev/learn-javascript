<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-label="Три слоя страницы: HTML, CSS и JavaScript">
    <rect x="10" y="20" width="170" height="170" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#1e40af">HTML</text>
    <text x="95" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">содержимое</text>
    <text x="95" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">заголовок, текст,</text>
    <text x="95" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">кнопка, картинка</text>
    <text x="95" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e40af">&lt;button&gt;Купить&lt;/button&gt;</text>

    <rect x="195" y="20" width="170" height="170" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="280" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#15803d">CSS</text>
    <text x="280" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">внешний вид</text>
    <text x="280" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">цвет, размер,</text>
    <text x="280" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">отступы, шрифт</text>
    <text x="280" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#15803d">background: green;</text>

    <rect x="380" y="20" width="170" height="170" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="465" y="50" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="17" font-weight="700" fill="#b45309">JavaScript</text>
    <text x="465" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#1e293b">поведение</text>
    <text x="465" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">нажали — считаем,</text>
    <text x="465" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">отправляем, меняем</text>
    <text x="465" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">onclick = buy;</text>
</svg>
