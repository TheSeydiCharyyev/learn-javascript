<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="Loading order: markup, styles, a script with defer">
    <rect x="10" y="30" width="170" height="52" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="53" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e40af">1. Reads HTML</text>
    <text x="95" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">builds the page</text>

    <path d="M184 56 H214" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <rect x="218" y="30" width="170" height="52" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="303" y="53" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#15803d">2. Downloads files</text>
    <text x="303" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">styles and scripts</text>

    <path d="M392 56 H422" stroke="#64748b" stroke-width="2" marker-end="url(#b)"/>
    <rect x="426" y="30" width="164" height="52" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="508" y="53" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#b45309">3. Runs the code</text>
    <text x="508" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">the page is ready</text>

    <text x="300" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">the word defer moves running the script to the third step</text>
    <defs><marker id="b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
</svg>
