<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 220" role="img" aria-label="Окно VS Code: панель значков, список файлов, редактор, терминал">
    <rect x="10" y="20" width="44" height="180" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
    <text x="32" y="115" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155" transform="rotate(-90 32 115)">значки</text>

    <rect x="60" y="20" width="130" height="180" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="125" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1e293b">Файлы</text>
    <text x="125" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#475569">index.html</text>
    <text x="125" y="94" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#475569">app.js</text>

    <rect x="196" y="20" width="394" height="125" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <text x="393" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0">Редактор</text>
    <text x="216" y="74" font-family="Consolas, monospace" font-size="13" fill="#93c5fd">const</text>
    <text x="262" y="74" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">name =</text>
    <text x="330" y="74" font-family="Consolas, monospace" font-size="13" fill="#86efac">"Мары"</text>
    <text x="216" y="98" font-family="Consolas, monospace" font-size="13" fill="#fcd34d">console</text>
    <text x="282" y="98" font-family="Consolas, monospace" font-size="13" fill="#e2e8f0">.log(name)</text>

    <rect x="196" y="151" width="394" height="49" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2"/>
    <text x="393" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#94a3b8">Терминал — понадобится позже, в курсе 2</text>
</svg>
