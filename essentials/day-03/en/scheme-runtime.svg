<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="The language in the middle; the browser and Node.js add their own abilities">
    <rect x="20" y="10" width="260" height="66" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">The browser adds</text>
    <text x="150" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e40af">document, console, alert</text>
    <text x="150" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e40af">fetch, localStorage</text>

    <rect x="340" y="10" width="260" height="66" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="470" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#15803d">Node.js adds</text>
    <text x="470" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">files, network, processes</text>
    <text x="470" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">console, npm modules</text>

    <path d="M 150 76 L 150 100 L 250 100 L 250 118" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 470 76 L 470 100 L 370 100 L 370 118" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <rect x="150" y="118" width="320" height="72" rx="10" fill="#1e293b"/>
    <text x="310" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#fcd34d">The language itself (ECMAScript)</text>
    <text x="310" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">numbers, strings, objects, functions</text>
    <text x="310" y="179" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#e2e8f0">if, for, try, class, Math, JSON</text>

    <text x="310" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">The same language inside — different abilities outside.</text>
    <text x="310" y="236" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">That is why the browser cannot work with files, and Node.js has no page.</text>
</svg>
