<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="Разбор сообщения об ошибке на части">
    <rect x="8" y="8" width="584" height="62" rx="8" fill="#1e293b"/>
    <text x="22" y="34" font-family="Consolas, monospace" font-size="12.5">
        <tspan fill="#fca5a5">Uncaught </tspan><tspan fill="#fcd34d">TypeError</tspan><tspan fill="#e2e8f0">: Cannot set properties of null (setting 'textContent')</tspan>
    </text>
    <text x="22" y="56" font-family="Consolas, monospace" font-size="12.5">
        <tspan fill="#94a3b8">    at </tspan><tspan fill="#7dd3fc">app.js:27:47</tspan>
    </text>

    <rect x="20" y="90" width="14" height="14" rx="3" fill="#fca5a5"/>
    <text x="44" y="102" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Uncaught — ошибку никто не перехватил, программа остановилась</text>

    <rect x="20" y="118" width="14" height="14" rx="3" fill="#fcd34d"/>
    <text x="44" y="130" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">TypeError — вид ошибки: сделали со значением то, чего оно не умеет</text>

    <rect x="20" y="146" width="14" height="14" rx="3" fill="#cbd5e1"/>
    <text x="44" y="158" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Текст — что именно не так: записывали свойство у null</text>

    <rect x="20" y="174" width="14" height="14" rx="3" fill="#7dd3fc"/>
    <text x="44" y="186" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">app.js:27:47 — файл, строка 27, столбец 47. Кликается</text>
</svg>
