<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 215" role="img" aria-label="Дерево типов: семь примитивов и объекты">
    <rect x="200" y="8" width="220" height="34" rx="8" fill="#1e293b"/>
    <text x="310" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Любое значение</text>

    <path d="M 310 42 L 310 56 L 160 56 L 160 70" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 42 L 310 56 L 465 56 L 465 70" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <rect x="20" y="70" width="280" height="32" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="160" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400e">Примитивы — 7 типов</text>

    <rect x="330" y="70" width="270" height="32" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="465" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Объекты — всё остальное</text>

    <rect x="20" y="115" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="52" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">Number</text>
    <rect x="90" y="115" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="122" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">BigInt</text>
    <rect x="160" y="115" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="192" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">String</text>
    <rect x="230" y="115" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="262" y="132" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">Boolean</text>

    <rect x="20" y="149" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="52" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">Symbol</text>
    <rect x="90" y="149" width="84" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="132" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">Undefined</text>
    <rect x="180" y="149" width="64" height="26" rx="6" fill="#fff" stroke="#fcd34d" stroke-width="2"/>
    <text x="212" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">Null</text>

    <rect x="330" y="115" width="270" height="60" rx="6" fill="#fff" stroke="#93c5fd" stroke-width="2"/>
    <text x="465" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e40af">{ } объект &#160; [ ] массив &#160; функция</text>
    <text x="465" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1e40af">Date &#160; Error &#160; Map &#160; Promise</text>
    <text x="465" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">и всё, что вы создадите сами</text>

    <text x="310" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Примитив заменяют целиком. Объект можно менять по частям.</text>
</svg>
