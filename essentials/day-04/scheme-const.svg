<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="const запирает имя, но не содержимое">
    <text x="310" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">const basket = ["хлеб", "чай"];</text>

    <rect x="40" y="46" width="140" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#991b1b">basket</text>
    <text x="110" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">имя</text>

    <line x1="182" y1="74" x2="262" y2="74" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 262 74 L 254 70 L 254 78 Z" fill="#94a3b8"/>
    <rect x="213" y="52" width="18" height="14" rx="2" fill="#ef4444"/>
    <path d="M 216 52 L 216 46 A 6 6 0 0 1 228 46 L 228 52" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="222" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">замок тут</text>

    <rect x="272" y="46" width="308" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="426" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">["хлеб", "чай"]</text>
    <text x="426" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">содержимое — открыто</text>

    <text x="40" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">basket = [];</text>
    <text x="180" y="136" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">TypeError: Assignment to constant variable.</text>

    <text x="40" y="158" font-family="Consolas, monospace" font-size="11.5" fill="#166534">basket.push("рис");</text>
    <text x="180" y="158" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">работает, ошибки нет</text>

    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#475569">const держит имя, а не содержимое.</text>
</svg>
