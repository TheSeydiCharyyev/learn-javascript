<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Три вложенные области видимости: глобальная, функции и блока">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#475569">Глобальная область — весь файл</text>
    <rect x="8" y="30" width="604" height="214" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>

    <text x="44" y="54" font-family="Consolas, monospace" font-size="12.5" fill="#a16207">function count() {</text>
    <rect x="34" y="62" width="552" height="152" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>

    <text x="74" y="86" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">if (true) {</text>
    <rect x="62" y="94" width="496" height="74" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>

    <text x="82" y="120" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">const a = 1;&#160;&#160; let b = 2;&#160;&#160; var c = 3;</text>
    <text x="82" y="146" font-family="Segoe UI, sans-serif" font-size="12" fill="#1d4ed8">здесь видны все три: a, b, c</text>

    <text x="82" y="192" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">здесь видна только c — var вышла за скобки</text>

    <text x="40" y="232" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">а здесь не видно ни одной: функция закрыта для внешнего мира</text>
</svg>
