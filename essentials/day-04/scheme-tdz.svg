<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Мёртвая зона от начала блока до строки объявления">
    <text x="40" y="36" font-family="Consolas, monospace" font-size="12" fill="#475569">{ начало блока</text>
    <text x="336" y="36" font-family="Consolas, monospace" font-size="12" fill="#166534">let foo = 2;</text>

    <line x1="40" y1="40" x2="40" y2="52" stroke="#94a3b8" stroke-width="2"/>
    <line x1="330" y1="40" x2="330" y2="52" stroke="#94a3b8" stroke-width="2"/>

    <rect x="40" y="52" width="290" height="34" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="185" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">мёртвая зона</text>

    <rect x="330" y="52" width="250" height="34" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="455" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">foo доступна</text>

    <text x="40" y="118" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Обращение к foo в красной зоне &#8594; ReferenceError</text>
    <text x="40" y="142" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">То же место, но переменная объявлена через var &#8594; undefined, тихо</text>
    <text x="40" y="166" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Даже typeof в красной зоне падает с ошибкой</text>

    <text x="40" y="192" font-family="Segoe UI, sans-serif" font-size="12" font-style="italic" fill="#64748b">Отсюда правило: объявляйте переменную до того, как она понадобится.</text>
</svg>
