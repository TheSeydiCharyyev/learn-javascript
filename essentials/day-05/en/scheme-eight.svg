<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Primitives are immutable, objects are mutable">
    <rect x="8" y="8" width="296" height="176" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="156" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400e">7 primitives — immutable</text>

    <text x="28" y="58" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Number&#160;&#160;&#160;&#160;&#160;42&#160;&#160;&#160;3.14&#160;&#160;&#160;-7</text>
    <text x="28" y="78" font-family="Consolas, monospace" font-size="12" fill="#1e293b">BigInt&#160;&#160;&#160;&#160;&#160;9007199254740993n</text>
    <text x="28" y="98" font-family="Consolas, monospace" font-size="12" fill="#1e293b">String&#160;&#160;&#160;&#160;&#160;"Mary"&#160;&#160;&#160;""</text>
    <text x="28" y="118" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Boolean&#160;&#160;&#160;&#160;true&#160;&#160;&#160;false</text>
    <text x="28" y="138" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Symbol&#160;&#160;&#160;&#160;&#160;Symbol("id")</text>
    <text x="28" y="158" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Undefined&#160;&#160;undefined</text>
    <text x="28" y="176" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Null&#160;&#160;&#160;&#160;&#160;&#160;&#160;null</text>

    <rect x="316" y="8" width="296" height="176" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="464" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">Object — mutable</text>

    <text x="336" y="58" font-family="Consolas, monospace" font-size="12" fill="#1e293b">{ name: "Aman" }&#160;&#160;object</text>
    <text x="336" y="78" font-family="Consolas, monospace" font-size="12" fill="#1e293b">[5, 4, 3]&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;array</text>
    <text x="336" y="98" font-family="Consolas, monospace" font-size="12" fill="#1e293b">function () { }&#160;&#160;function</text>
    <text x="336" y="118" font-family="Consolas, monospace" font-size="12" fill="#1e293b">new Date()&#160;&#160;&#160;&#160;&#160;&#160;&#160;date</text>
    <text x="336" y="138" font-family="Consolas, monospace" font-size="12" fill="#1e293b">Map, Set, Error...</text>

    <text x="464" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">the only mutable type</text>
    <text x="464" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">and the only one passed by reference</text>

    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">A primitive can only be replaced whole. An object can be changed piece by piece.</text>
    <text x="310" y="224" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">This explains all the behavior of const from yesterday’s lesson.</text>
</svg>
