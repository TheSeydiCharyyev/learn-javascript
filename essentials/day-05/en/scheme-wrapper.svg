<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="A primitive is wrapped in a wrapper object for a moment">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">"Mary".length</text>

    <rect x="14" y="40" width="130" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="79" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#92400e">"Mary"</text>
    <text x="79" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#92400e">primitive</text>

    <line x1="148" y1="65" x2="228" y2="65" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 228 65 L 220 61 L 220 69 Z" fill="#94a3b8"/>
    <text x="188" y="56" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">asked for</text>
    <text x="188" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#64748b">.length</text>

    <rect x="232" y="34" width="176" height="62" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" stroke-dasharray="6 4"/>
    <text x="320" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">a String object</text>
    <text x="320" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">a wrapper — for one moment</text>
    <text x="320" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">it is the one with length</text>

    <line x1="412" y1="65" x2="492" y2="65" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 492 65 L 484 61 L 484 69 Z" fill="#94a3b8"/>
    <text x="452" y="56" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">took</text>

    <rect x="496" y="40" width="110" height="50" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="551" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">4</text>

    <text x="320" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-style="italic" fill="#64748b">right after that the wrapper is thrown away</text>

    <rect x="14" y="138" width="592" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="310" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">null and undefined have no wrapper</text>
    <text x="310" y="176" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">null.length &#8594; TypeError: Cannot read properties of null</text>
</svg>
