<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Шесть ложных значений — false, ноль в любом виде, пустая строка, NaN, null, undefined — и примеры истинных, которые выглядят пустыми">
    <rect x="8" y="26" width="296" height="148" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="156" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#991b1b">Ложны — только эти шесть</text>
    <text x="40" y="78" font-family="Consolas, monospace" font-size="13" fill="#991b1b">false</text>
    <text x="180" y="78" font-family="Consolas, monospace" font-size="13" fill="#991b1b">NaN</text>
    <text x="40" y="106" font-family="Consolas, monospace" font-size="13" fill="#991b1b">0  -0  0n</text>
    <text x="180" y="106" font-family="Consolas, monospace" font-size="13" fill="#991b1b">null</text>
    <text x="40" y="134" font-family="Consolas, monospace" font-size="13" fill="#991b1b">""</text>
    <text x="180" y="134" font-family="Consolas, monospace" font-size="13" fill="#991b1b">undefined</text>
    <text x="156" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">список закрытый, больше ничего</text>

    <rect x="316" y="26" width="296" height="148" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="464" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">Истинно всё остальное</text>
    <text x="340" y="74" font-family="Consolas, monospace" font-size="12.5" fill="#166534">"0"&#160;&#160;&#160;&#160;&#160;&#160;строка непустая</text>
    <text x="340" y="96" font-family="Consolas, monospace" font-size="12.5" fill="#166534">" "&#160;&#160;&#160;&#160;&#160;&#160;пробел — символ</text>
    <text x="340" y="118" font-family="Consolas, monospace" font-size="12.5" fill="#166534">[]&#160;&#160;&#160;{ }&#160;&#160;это объекты</text>
    <text x="340" y="140" font-family="Consolas, monospace" font-size="12.5" fill="#166534">-1&#160;&#160;&#160;&#160;&#160;&#160;ложен только 0</text>
    <text x="340" y="162" font-family="Consolas, monospace" font-size="12.5" fill="#166534">new Boolean(false)</text>

    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Запомнить надо левый столбец: он короткий и закрытый.</text>
</svg>
