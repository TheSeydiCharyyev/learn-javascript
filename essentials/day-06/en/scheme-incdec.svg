<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="The difference between the postfix and prefix forms of increment">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">let i = 5;</text>

    <rect x="12" y="36" width="290" height="126" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="157" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#92400e">i++</text>
    <text x="157" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">postfix: the sign after</text>
    <text x="32" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">1. gives back the old value</text>
    <text x="32" y="126" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">2. then increases</text>
    <text x="32" y="150" font-family="Consolas, monospace" font-size="12.5" fill="#991b1b">returned 5, i became 6</text>

    <rect x="318" y="36" width="290" height="126" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="463" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1d4ed8">++i</text>
    <text x="463" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">prefix: the sign before</text>
    <text x="338" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">1. increases first</text>
    <text x="338" y="126" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">2. gives back the new value</text>
    <text x="338" y="150" font-family="Consolas, monospace" font-size="12.5" fill="#166534">returned 6, i became 6</text>

    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">In both cases the variable becomes 6. What differs is what is given back.</text>
</svg>
