<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Разница постфиксной и префиксной формы инкремента">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">let i = 5;</text>

    <rect x="12" y="36" width="290" height="126" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="157" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#92400e">i++</text>
    <text x="157" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">постфиксная: знак после</text>
    <text x="32" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">1. отдаёт старое значение</text>
    <text x="32" y="126" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">2. потом увеличивает</text>
    <text x="32" y="150" font-family="Consolas, monospace" font-size="12.5" fill="#991b1b">вернул 5, i стал 6</text>

    <rect x="318" y="36" width="290" height="126" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="463" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1d4ed8">++i</text>
    <text x="463" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">префиксная: знак перед</text>
    <text x="338" y="104" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">1. сначала увеличивает</text>
    <text x="338" y="126" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">2. отдаёт новое значение</text>
    <text x="338" y="150" font-family="Consolas, monospace" font-size="12.5" fill="#166534">вернул 6, i стал 6</text>

    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Переменная в обоих случаях станет 6. Разное — то, что отдано наружу.</text>
</svg>
