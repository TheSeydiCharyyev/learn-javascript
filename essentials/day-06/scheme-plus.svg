<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Как плюс выбирает между сложением и склейкой">
    <rect x="210" y="8" width="200" height="34" rx="8" fill="#1e293b"/>
    <text x="310" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">a + b</text>

    <path d="M 310 42 L 310 58" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="170" y="58" width="280" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#334155">Хоть один операнд — строка?</text>

    <path d="M 310 90 L 310 104 L 150 104 L 150 120" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 90 L 310 104 L 470 104 L 470 120" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="222" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">да</text>
    <text x="400" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">нет</text>

    <rect x="20" y="120" width="260" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="150" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">Склейка строк</text>
    <text x="150" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">2 + "3"&#160;&#8594;&#160;"23"</text>

    <rect x="340" y="120" width="260" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="470" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">Сложение чисел</text>
    <text x="470" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">2 + 3&#160;&#8594;&#160;5</text>

    <text x="310" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Остальные операторы такого выбора не делают — они всегда считают числами.</text>
</svg>
