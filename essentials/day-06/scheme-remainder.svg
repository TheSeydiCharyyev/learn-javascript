<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-label="Деление с остатком: десять предметов по три">
    <text x="310" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">Раскладываем 10 предметов по 3</text>

    <rect x="20" y="42" width="118" height="46" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <circle cx="49" cy="65" r="11" fill="#22c55e"/><circle cx="79" cy="65" r="11" fill="#22c55e"/><circle cx="109" cy="65" r="11" fill="#22c55e"/>

    <rect x="146" y="42" width="118" height="46" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <circle cx="175" cy="65" r="11" fill="#22c55e"/><circle cx="205" cy="65" r="11" fill="#22c55e"/><circle cx="235" cy="65" r="11" fill="#22c55e"/>

    <rect x="272" y="42" width="118" height="46" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <circle cx="301" cy="65" r="11" fill="#22c55e"/><circle cx="331" cy="65" r="11" fill="#22c55e"/><circle cx="361" cy="65" r="11" fill="#22c55e"/>

    <rect x="410" y="42" width="60" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <circle cx="440" cy="65" r="11" fill="#ef4444"/>

    <text x="205" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">три полные группы</text>
    <text x="440" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">остаток</text>

    <text x="20" y="144" font-family="Consolas, monospace" font-size="13" fill="#166534">Math.floor(10 / 3)&#160;&#8594; 3</text>
    <text x="260" y="144" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">сколько целых поместилось</text>

    <text x="20" y="172" font-family="Consolas, monospace" font-size="13" fill="#991b1b">10 % 3&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#8594; 1</text>
    <text x="260" y="172" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">сколько осталось</text>
</svg>
