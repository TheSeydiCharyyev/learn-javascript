<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="How strict and loose comparison differ">
    <rect x="210" y="8" width="200" height="34" rx="8" fill="#1e293b"/>
    <text x="310" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#f8fafc">a &#8801; b ?</text>

    <path d="M 310 42 L 310 56 L 150 56 L 150 72" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 42 L 310 56 L 470 56 L 470 72" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <rect x="20" y="72" width="260" height="104" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="94" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#166534">===</text>
    <text x="150" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">different types?</text>
    <text x="150" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">false right away</text>
    <text x="150" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">5 === "5" &#8594; false</text>

    <rect x="340" y="72" width="260" height="104" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="470" y="94" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#991b1b">==</text>
    <text x="470" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">different types?</text>
    <text x="470" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">convert, then compare</text>
    <text x="470" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">5 == "5" &#8594; true</text>

    <text x="310" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">There are a dozen conversion rules. === has only one rule.</text>
</svg>
