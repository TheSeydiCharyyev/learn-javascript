<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="For which values the fallback works">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">x || "fallback"&#160;&#160;&#160;versus&#160;&#160;&#160;x ?? "fallback"</text>

    <rect x="14" y="36" width="288" height="126" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="158" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#991b1b">||</text>
    <text x="158" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">works on six values</text>
    <text x="40" y="102" font-family="Consolas, monospace" font-size="12" fill="#991b1b">null&#160;&#160;&#160;undefined&#160;&#160;&#160;NaN</text>
    <text x="40" y="124" font-family="Consolas, monospace" font-size="12" fill="#991b1b">false&#160;&#160;&#160;0&#160;&#160;&#160;""</text>
    <text x="158" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">0 and "" are legitimate data!</text>

    <rect x="318" y="36" width="288" height="126" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="462" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#166534">??</text>
    <text x="462" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">works only on two</text>
    <text x="380" y="106" font-family="Consolas, monospace" font-size="12" fill="#166534">null&#160;&#160;&#160;undefined</text>
    <text x="462" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">0, "" and false pass as they are</text>
    <text x="462" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">“there is no value” — and nothing else</text>

    <text x="310" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Need a replacement only for a missing value? Take ??</text>
</svg>
