<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="When the second operand is not evaluated">
    <rect x="14" y="14" width="288" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="158" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#92400e">a &amp;&amp; b</text>
    <text x="158" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">a is falsy &#8594; the answer is already clear</text>
    <text x="158" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">b is not evaluated</text>

    <rect x="318" y="14" width="288" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="462" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1d4ed8">a || b</text>
    <text x="462" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">a is truthy &#8594; the answer is already clear</text>
    <text x="462" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">b is not evaluated</text>

    <rect x="14" y="108" width="592" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">This is not an optimization but part of the language — techniques are built on it</text>
    <text x="310" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">const name = input || "Guest";</text>
    <text x="310" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">user &amp;&amp; user.name</text>
</svg>
