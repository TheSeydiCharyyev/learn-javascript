<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Для каких значений срабатывает запасной вариант">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">x || "запасное"&#160;&#160;&#160;против&#160;&#160;&#160;x ?? "запасное"</text>

    <rect x="14" y="36" width="288" height="126" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="158" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#991b1b">||</text>
    <text x="158" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">сработает на шести значениях</text>
    <text x="40" y="102" font-family="Consolas, monospace" font-size="12" fill="#991b1b">null&#160;&#160;&#160;undefined&#160;&#160;&#160;NaN</text>
    <text x="40" y="124" font-family="Consolas, monospace" font-size="12" fill="#991b1b">false&#160;&#160;&#160;0&#160;&#160;&#160;""</text>
    <text x="158" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">0 и "" — законные данные!</text>

    <rect x="318" y="36" width="288" height="126" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="462" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#166534">??</text>
    <text x="462" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">сработает только на двух</text>
    <text x="380" y="106" font-family="Consolas, monospace" font-size="12" fill="#166534">null&#160;&#160;&#160;undefined</text>
    <text x="462" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">0, "" и false проходят как есть</text>
    <text x="462" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">«значения нет» — и только</text>

    <text x="310" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Нужна замена только для отсутствующего значения — берите ??</text>
</svg>
