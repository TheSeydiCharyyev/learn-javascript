<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Когда второй операнд не вычисляется">
    <rect x="14" y="14" width="288" height="78" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="158" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#92400e">a &amp;&amp; b</text>
    <text x="158" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">a ложно &#8594; ответ уже ясен</text>
    <text x="158" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">b не вычисляется</text>

    <rect x="318" y="14" width="288" height="78" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="462" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#1d4ed8">a || b</text>
    <text x="462" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">a истинно &#8594; ответ уже ясен</text>
    <text x="462" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">b не вычисляется</text>

    <rect x="14" y="108" width="592" height="76" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">Это не оптимизация, а часть языка — на ней строят приёмы</text>
    <text x="310" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">const name = input || "Гость";</text>
    <text x="310" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">user &amp;&amp; user.name</text>
</svg>
