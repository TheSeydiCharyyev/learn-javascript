<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="A step-by-step breakdown of three comparisons">
    <text x="20" y="22" font-family="Consolas, monospace" font-size="13" fill="#166534">"0" == 0</text>
    <text x="150" y="22" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">different types &#8594; both to numbers</text>
    <text x="380" y="22" font-family="Consolas, monospace" font-size="12" fill="#475569">0 == 0</text>
    <text x="480" y="22" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">&#8594; true</text>
    <line x1="20" y1="34" x2="600" y2="34" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="62" font-family="Consolas, monospace" font-size="13" fill="#166534">"" == 0</text>
    <text x="150" y="62" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">different types &#8594; both to numbers</text>
    <text x="380" y="62" font-family="Consolas, monospace" font-size="12" fill="#475569">0 == 0</text>
    <text x="480" y="62" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">&#8594; true</text>
    <line x1="20" y1="74" x2="600" y2="74" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="102" font-family="Consolas, monospace" font-size="13" fill="#991b1b">"0" == ""</text>
    <text x="150" y="102" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">the types MATCH &#8594; no conversion</text>
    <text x="380" y="102" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">as text</text>
    <text x="480" y="102" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#991b1b">&#8594; false</text>

    <rect x="20" y="126" width="580" height="50" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="146" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">Number("0") &#8594; 0&#160;&#160;&#160;&#160;&#160;Number("") &#8594; 0</text>
    <text x="310" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">Two different strings give one and the same number — that is the whole secret.</text>

    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#475569">The third pair never gets to numbers — it has nothing to convert.</text>
    <text x="310" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Three pairs — three different paths. Hence the lack of transitivity.</text>
</svg>
