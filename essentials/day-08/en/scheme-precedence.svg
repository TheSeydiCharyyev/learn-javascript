<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Step-by-step evaluation of an expression by precedence">
    <text x="20" y="24" font-family="Consolas, monospace" font-size="13" fill="#1e293b">price * count - discount &gt; 200 &amp;&amp; isMember</text>

    <text x="20" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">step 1 &#160;&#160;turn 5</text>
    <text x="150" y="58" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">100 * 3</text>
    <text x="250" y="58" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">&#8594; 300</text>
    <text x="350" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">multiplication comes first</text>
    <line x1="20" y1="68" x2="600" y2="68" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="94" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">step 2 &#160;&#160;turn 6</text>
    <text x="150" y="94" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">300 - 10</text>
    <text x="250" y="94" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">&#8594; 290</text>
    <text x="350" y="94" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">then subtraction</text>
    <line x1="20" y1="104" x2="600" y2="104" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">step 3 &#160;&#160;turn 7</text>
    <text x="150" y="130" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">290 &gt; 200</text>
    <text x="250" y="130" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">&#8594; true</text>
    <text x="350" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">comparison after arithmetic</text>
    <line x1="20" y1="140" x2="600" y2="140" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="166" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">step 4 &#160;&#160;turn 9</text>
    <text x="150" y="166" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">true &amp;&amp; true</text>
    <text x="250" y="166" font-family="Consolas, monospace" font-size="12.5" fill="#166534">&#8594; true</text>
    <text x="350" y="166" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">logic at the very end</text>

    <rect x="20" y="186" width="580" height="34" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#166534">The order is always the same: arithmetic &#8594; comparison &#8594; logic. No parentheses needed.</text>
</svg>
