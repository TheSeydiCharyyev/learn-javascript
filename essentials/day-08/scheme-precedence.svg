<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Пошаговое вычисление выражения по приоритетам">
    <text x="20" y="24" font-family="Consolas, monospace" font-size="13" fill="#1e293b">price * count - discount &gt; 200 &amp;&amp; isMember</text>

    <text x="20" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">шаг 1 &#160;&#160;очередь 5</text>
    <text x="150" y="58" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">100 * 3</text>
    <text x="250" y="58" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">&#8594; 300</text>
    <text x="350" y="58" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">умножение раньше всего</text>
    <line x1="20" y1="68" x2="600" y2="68" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="94" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">шаг 2 &#160;&#160;очередь 6</text>
    <text x="150" y="94" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">300 - 10</text>
    <text x="250" y="94" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">&#8594; 290</text>
    <text x="350" y="94" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">потом вычитание</text>
    <line x1="20" y1="104" x2="600" y2="104" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">шаг 3 &#160;&#160;очередь 7</text>
    <text x="150" y="130" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">290 &gt; 200</text>
    <text x="250" y="130" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">&#8594; true</text>
    <text x="350" y="130" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">сравнение после арифметики</text>
    <line x1="20" y1="140" x2="600" y2="140" stroke="#e2e8f0" stroke-width="1"/>

    <text x="20" y="166" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">шаг 4 &#160;&#160;очередь 9</text>
    <text x="150" y="166" font-family="Consolas, monospace" font-size="12.5" fill="#1e293b">true &amp;&amp; true</text>
    <text x="250" y="166" font-family="Consolas, monospace" font-size="12.5" fill="#166534">&#8594; true</text>
    <text x="350" y="166" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">логика в самом конце</text>

    <rect x="20" y="186" width="580" height="34" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#166534">Порядок всегда один: арифметика &#8594; сравнение &#8594; логика. Скобки не нужны.</text>
</svg>
