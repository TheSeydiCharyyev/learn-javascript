<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Три контекста приведения типов">
    <rect x="210" y="8" width="200" height="34" rx="8" fill="#1e293b"/>
    <text x="310" y="30" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Любое значение</text>

    <path d="M 310 42 L 310 56 L 110 56 L 110 70" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 42 L 310 70" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 42 L 310 56 L 510 56 L 510 70" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <rect x="14" y="70" width="192" height="88" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="110" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#1d4ed8">к строке</text>
    <text x="110" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">String(x)</text>
    <text x="110" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e40af">шаблонные строки,</text>
    <text x="110" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e40af">+ со строкой</text>

    <rect x="214" y="70" width="192" height="88" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#92400e">к числу</text>
    <text x="310" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">Number(x)</text>
    <text x="310" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">арифметика,</text>
    <text x="310" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">сравнение по порядку</text>

    <rect x="414" y="70" width="192" height="88" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="510" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">к логическому</text>
    <text x="510" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">Boolean(x)</text>
    <text x="510" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">if, while,</text>
    <text x="510" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">&amp;&amp; || !</text>

    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">Каждый оператор заранее знает, какое приведение ему нужно.</text>
</svg>
