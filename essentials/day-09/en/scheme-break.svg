<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="With break and without break: different paths of execution">
    <text x="155" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">with break</text>
    <text x="465" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#991b1b">without break</text>

    <rect x="40" y="34" width="230" height="36" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="155" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">case "draw" &#8594; drawing</text>
    <rect x="40" y="88" width="230" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="155" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">case "eat"</text>
    <rect x="40" y="142" width="230" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="155" y="165" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">default</text>
    <path d="M 275 52 L 300 52 L 300 196 L 155 196" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="300" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534" transform="rotate(90 300 120)">exit</text>

    <rect x="350" y="34" width="230" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="465" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">case "draw" &#8594; drawing</text>
    <rect x="350" y="88" width="230" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="465" y="111" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">case "eat" &#8594; eating</text>
    <rect x="350" y="142" width="230" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="465" y="165" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">default &#8594; nothing</text>
    <path d="M 465 70 L 465 88" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 465 124 L 465 142" fill="none" stroke="#ef4444" stroke-width="2"/>

    <text x="310" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">A match chooses where to START. Only break stops it.</text>
</svg>
