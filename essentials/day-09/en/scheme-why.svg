<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="A fork: the condition chooses one of two roads">
    <rect x="240" y="8" width="140" height="32" rx="8" fill="#1e293b"/>
    <text x="310" y="29" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#f8fafc">the program runs</text>

    <path d="M 310 40 L 310 56" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 56 L 400 86 L 310 116 L 220 86 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="91" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">condition?</text>

    <path d="M 220 86 L 140 86 L 140 130" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="176" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">true</text>
    <path d="M 400 86 L 480 86 L 480 130" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="444" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">false</text>

    <rect x="50" y="130" width="180" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="140" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">if { } block</text>

    <rect x="390" y="130" width="180" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="480" y="155" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">else { } block</text>

    <path d="M 140 170 L 140 194 L 310 194" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 480 170 L 480 194 L 310 194" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">then there is one program again</text>
</svg>
