<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Одно значение в двух лестницах с разным порядком веток">
    <text x="155" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">score = 95, неверный порядок</text>
    <text x="465" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">score = 95, верный порядок</text>

    <rect x="15" y="30" width="280" height="36" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
    <text x="30" y="53" font-family="Consolas, monospace" font-size="12" fill="#991b1b">if (score &gt;= 50)&#160;&#160;&#8594;&#160;"3"</text>
    <text x="278" y="53" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#991b1b">&#10003;</text>

    <rect x="15" y="76" width="280" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="97" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">else if (score &gt;= 75)&#160;&#8594;&#160;"4"</text>

    <rect x="15" y="118" width="280" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="139" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">else if (score &gt;= 90)&#160;&#8594;&#160;"5"</text>

    <text x="155" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">сработала первая — остальные</text>
    <text x="155" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">не проверяются никогда</text>
    <text x="155" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#991b1b">отличник получил "3"</text>

    <rect x="325" y="30" width="280" height="36" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
    <text x="340" y="53" font-family="Consolas, monospace" font-size="12" fill="#166534">if (score &gt;= 90)&#160;&#160;&#8594;&#160;"5"</text>
    <text x="588" y="53" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#166534">&#10003;</text>

    <rect x="325" y="76" width="280" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="340" y="97" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">else if (score &gt;= 75)&#160;&#8594;&#160;"4"</text>

    <rect x="325" y="118" width="280" height="32" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="340" y="139" font-family="Consolas, monospace" font-size="12" fill="#94a3b8">else if (score &gt;= 50)&#160;&#8594;&#160;"3"</text>

    <text x="465" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">сработала первая — и это</text>
    <text x="465" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">именно та, что нужна</text>
    <text x="465" y="220" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">отличник получил "5"</text>

    <text x="310" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Серые ветки в обоих случаях не выполняются. Разница — какая сработала первой.</text>
</svg>
