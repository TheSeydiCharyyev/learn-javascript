<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 260" role="img" aria-label="The order in which a for loop runs">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">for (let i = 0; i &lt; 3; i++) { ... }</text>

    <rect x="215" y="34" width="190" height="32" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1d4ed8">1. start: i = 0</text>
    <text x="418" y="55" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">once</text>

    <path d="M 310 66 L 310 82" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <path d="M 310 82 L 410 112 L 310 142 L 210 112 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">2. condition: i &lt; 3?</text>

    <path d="M 410 112 L 500 112 L 500 220" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="455" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#991b1b">false</text>
    <rect x="410" y="220" width="180" height="30" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="500" y="240" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">exit the loop</text>

    <path d="M 310 142 L 310 158" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="330" y="155" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">true</text>

    <rect x="205" y="158" width="210" height="32" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">3. loop body { ... }</text>

    <path d="M 310 190 L 310 206" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="215" y="206" width="190" height="32" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1d4ed8">4. step: i++</text>

    <path d="M 215 222 L 130 222 L 130 112 L 210 112" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 210 112 L 200 108 L 200 116 Z" fill="#3b82f6"/>
    <text x="130" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8" transform="rotate(-90 130 168)">back to condition</text>
</svg>
