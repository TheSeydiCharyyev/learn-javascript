<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Три цикла: где у каждого начало, условие и шаг">
    <rect x="10" y="26" width="192" height="150" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="106" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">for</text>
    <text x="24" y="50" font-family="Consolas, monospace" font-size="11" fill="#166534">for (let i=0; i&lt;3; i++) {</text>
    <text x="34" y="70" font-family="Consolas, monospace" font-size="11" fill="#475569">тело</text>
    <text x="24" y="90" font-family="Consolas, monospace" font-size="11" fill="#166534">}</text>
    <text x="24" y="120" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">начало, условие и шаг</text>
    <text x="24" y="136" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">все в заголовке</text>
    <text x="24" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">когда знаем, сколько раз</text>

    <rect x="214" y="26" width="192" height="150" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1d4ed8">while</text>
    <text x="228" y="42" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">let i = 0;</text>
    <text x="228" y="60" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">while (i &lt; 3) {</text>
    <text x="238" y="78" font-family="Consolas, monospace" font-size="11" fill="#475569">тело</text>
    <text x="238" y="96" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">i++;</text>
    <text x="228" y="114" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">}</text>
    <text x="228" y="140" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">шаг внутри тела</text>
    <text x="228" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">когда не знаем, сколько</text>

    <rect x="418" y="26" width="192" height="150" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="514" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#92400e">do...while</text>
    <text x="432" y="42" font-family="Consolas, monospace" font-size="11" fill="#92400e">let i = 0;</text>
    <text x="432" y="60" font-family="Consolas, monospace" font-size="11" fill="#92400e">do {</text>
    <text x="442" y="78" font-family="Consolas, monospace" font-size="11" fill="#475569">тело</text>
    <text x="442" y="96" font-family="Consolas, monospace" font-size="11" fill="#92400e">i++;</text>
    <text x="432" y="114" font-family="Consolas, monospace" font-size="11" fill="#92400e">} while (i &lt; 3);</text>
    <text x="432" y="140" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#92400e">условие ПОСЛЕ тела</text>
    <text x="432" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">хотя бы один раз</text>

    <rect x="10" y="190" width="600" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Все три печатают 0 1 2 — это один механизм в трёх обёртках.</text>
    <text x="310" y="223" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Выбирают по тому, что удобнее читать.</text>
</svg>
