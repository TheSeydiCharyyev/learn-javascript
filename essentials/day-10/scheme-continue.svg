<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Разница между break и continue">
    <text x="155" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#991b1b">break</text>
    <text x="465" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">continue</text>

    <rect x="30" y="30" width="250" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="155" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">тело цикла</text>
    <line x1="50" y1="64" x2="260" y2="64" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="82" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">break;</text>
    <line x1="50" y1="94" x2="260" y2="94" stroke="#cbd5e1" stroke-width="1"/>
    <text x="60" y="112" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">остаток тела</text>
    <line x1="50" y1="124" x2="260" y2="124" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 155 82 L 300 82 L 300 168" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 300 168 L 296 158 L 304 158 Z" fill="#ef4444"/>
    <text x="155" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">цикл закончился совсем</text>
    <text x="155" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">шаг не выполняется</text>

    <rect x="340" y="30" width="250" height="110" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="465" y="52" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">тело цикла</text>
    <line x1="360" y1="64" x2="570" y2="64" stroke="#cbd5e1" stroke-width="1"/>
    <text x="370" y="82" font-family="Consolas, monospace" font-size="11.5" fill="#166534">continue;</text>
    <line x1="360" y1="94" x2="570" y2="94" stroke="#cbd5e1" stroke-width="1"/>
    <text x="370" y="112" font-family="Consolas, monospace" font-size="11.5" fill="#cbd5e1">остаток тела</text>
    <line x1="360" y1="124" x2="570" y2="124" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M 465 82 L 600 82 L 600 20 L 465 20 L 465 30" fill="none" stroke="#22c55e" stroke-width="2.5"/>
    <path d="M 465 30 L 461 20 L 469 20 Z" fill="#22c55e"/>
    <text x="465" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">следующий проход</text>
    <text x="465" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">шаг выполняется, цикл жив</text>
</svg>
