<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="for...of gives values, for...in gives keys">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1e293b">const marks = [5, 4, 3];</text>

    <rect x="14" y="36" width="288" height="128" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="158" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">for (const x of marks)</text>
    <text x="158" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">gives VALUES</text>
    <text x="158" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">5&#160;&#160;&#160;4&#160;&#160;&#160;3</text>
    <text x="158" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#475569">typeof x &#8594; "number"</text>
    <text x="158" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">for arrays — this one</text>

    <rect x="318" y="36" width="288" height="128" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="462" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#991b1b">for (const x in marks)</text>
    <text x="462" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">gives KEYS</text>
    <text x="462" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#991b1b">"0"&#160;&#160;"1"&#160;&#160;"2"</text>
    <text x="462" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#475569">typeof x &#8594; "string"</text>
    <text x="462" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">for objects — this one</text>

    <text x="310" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#475569">The difference is one word: of — values, in — names.</text>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#475569">And the keys are strings, not numbers!</text>
</svg>
