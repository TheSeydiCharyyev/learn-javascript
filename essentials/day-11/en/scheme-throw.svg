<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="The error goes up the chain of calls to the nearest catch">
    <rect x="60" y="14" width="330" height="60" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="76" y="34" font-family="Consolas, monospace" font-size="12" fill="#166534">function level1() {</text>
    <text x="90" y="52" font-family="Consolas, monospace" font-size="12" fill="#166534">try { level2() } catch (e) { ... }</text>
    <text x="76" y="68" font-family="Consolas, monospace" font-size="12" fill="#166534">}</text>
    <text x="400" y="48" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">caught here</text>

    <rect x="90" y="84" width="300" height="44" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="106" y="104" font-family="Consolas, monospace" font-size="12" fill="#475569">function level2() { level3() }</text>
    <text x="400" y="110" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">no catch — it flies on</text>

    <rect x="120" y="138" width="270" height="44" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="136" y="158" font-family="Consolas, monospace" font-size="12" fill="#991b1b">function level3() {</text>
    <text x="150" y="174" font-family="Consolas, monospace" font-size="12" fill="#991b1b">throw new RangeError(...)</text>
    <text x="400" y="164" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">thrown here</text>

    <path d="M 46 160 L 46 46" fill="none" stroke="#ef4444" stroke-width="2.5"/>
    <path d="M 46 46 L 42 58 L 50 58 Z" fill="#ef4444"/>
    <text x="30" y="106" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#991b1b" transform="rotate(-90 30 106)">the error goes up</text>

    <rect x="60" y="196" width="500" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="217" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">The rest of level2 and level3 will not run. The program goes on after catch.</text>
</svg>
