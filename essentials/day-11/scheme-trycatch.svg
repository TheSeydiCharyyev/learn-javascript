<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="Как выполняется try...catch">
    <rect x="180" y="10" width="260" height="30" rx="8" fill="#1e293b"/>
    <text x="310" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#f8fafc">try { ... }</text>

    <path d="M 310 40 L 310 56" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 56 L 400 84 L 310 112 L 220 84 Z" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="89" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#92400e">ошибка?</text>

    <path d="M 220 84 L 130 84 L 130 124" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="172" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">нет</text>
    <rect x="30" y="124" width="200" height="32" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="130" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#166534">try доработал до конца</text>

    <path d="M 400 84 L 490 84 L 490 124" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="448" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#991b1b">да</text>
    <rect x="390" y="124" width="200" height="32" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="490" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">catch { ... }</text>
    <text x="490" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">остаток try пропущен</text>

    <path d="M 130 156 L 130 190 L 310 190" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 490 156 L 490 190 L 310 190" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="200" y="190" width="220" height="26" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#1d4ed8">программа продолжается</text>
</svg>
