<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Цепочка вызовов и возврат значений обратно">
    <rect x="30" y="16" width="250" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="46" y="41" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">makeReport("Аман", marks)</text>

    <rect x="70" y="76" width="250" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="86" y="101" font-family="Consolas, monospace" font-size="12" fill="#92400e">selectValid(marks)</text>

    <rect x="110" y="136" width="250" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="126" y="161" font-family="Consolas, monospace" font-size="12" fill="#166534">isValidMark(5)</text>

    <path d="M 155 56 L 155 76" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 155 76 L 151 66 L 159 66 Z" fill="#94a3b8" transform="rotate(180 155 71)"/>
    <path d="M 195 116 L 195 136" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 195 136 L 191 126 L 199 126 Z" fill="#94a3b8" transform="rotate(180 195 131)"/>

    <text x="215" y="70" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">вызывает &#8595;</text>
    <text x="255" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">вызывает &#8595;</text>

    <path d="M 400 156 L 440 156 L 440 96 L 400 96" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="448" y="160" font-family="Consolas, monospace" font-size="11.5" fill="#166534">return true</text>
    <path d="M 400 96 L 480 96 L 480 36 L 400 36" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="488" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">return [5,4,...]</text>
    <path d="M 400 36 L 520 36" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 520 36 L 512 32 L 512 40 Z" fill="#3b82f6"/>
    <text x="528" y="26" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">return</text>
    <text x="528" y="42" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">строка</text>

    <rect x="30" y="196" width="560" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="212" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Вниз идут вызовы с аргументами, вверх — результаты через return.</text>
    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Это та же цепочка, по которой вчера поднималась ошибка.</text>
</svg>
