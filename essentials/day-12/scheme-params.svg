<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="Как аргументы попадают в параметры и возвращается результат">
    <rect x="20" y="30" width="150" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="95" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#1d4ed8">add(2, 3)</text>
    <text x="95" y="22" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">вызов с аргументами</text>

    <path d="M 172 50 L 238 50" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 238 50 L 230 46 L 230 54 Z" fill="#3b82f6"/>

    <rect x="242" y="14" width="250" height="110" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="258" y="38" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">function add(x, y) {</text>
    <text x="278" y="62" font-family="Consolas, monospace" font-size="11.5" fill="#475569">x = 2&#160;&#160;&#160;y = 3</text>
    <text x="278" y="86" font-family="Consolas, monospace" font-size="12.5" fill="#166534">return x + y;</text>
    <text x="258" y="110" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">}</text>
    <text x="367" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">параметры — имена для значений</text>

    <path d="M 494 50 L 560 50" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M 560 50 L 552 46 L 552 54 Z" fill="#22c55e"/>
    <rect x="500" y="76" width="100" height="36" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="550" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#166534">5</text>
    <text x="550" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">результат</text>

    <rect x="20" y="166" width="580" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Аргументы подставляются в параметры по порядку, слева направо.</text>
    <text x="310" y="201" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Имена значения не имеют — важен только порядок.</text>
</svg>
