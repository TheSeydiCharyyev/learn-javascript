<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Один блок кода против четырёх функций">
    <text x="140" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#991b1b">одна функция на всё</text>
    <rect x="30" y="28" width="220" height="140" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="140" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">processMarks()</text>
    <line x1="50" y1="66" x2="230" y2="66" stroke="#fca5a5" stroke-width="1"/>
    <text x="60" y="84" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">отобрать годные</text>
    <text x="60" y="104" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">сложить</text>
    <text x="60" y="124" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">поделить</text>
    <text x="60" y="144" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">выбрать вердикт</text>
    <text x="60" y="162" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">собрать строку</text>
    <text x="140" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">проверить можно только целиком</text>

    <rect x="300" y="28" width="130" height="30" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="365" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">selectValid()</text>
    <rect x="300" y="66" width="130" height="30" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="365" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">average()</text>
    <rect x="300" y="104" width="130" height="30" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="365" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">verdict()</text>
    <rect x="300" y="142" width="130" height="30" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="365" y="162" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">countFives()</text>

    <path d="M 434 43 L 470 43 L 470 100" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 434 81 L 470 81" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 434 119 L 470 119" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 434 157 L 470 157 L 470 100" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 470 100 L 496 100" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 496 100 L 488 96 L 488 104 Z" fill="#94a3b8"/>

    <rect x="500" y="84" width="100" height="32" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="550" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">makeReport()</text>
    <text x="440" y="18" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">четыре функции + сборка</text>
    <text x="440" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">каждую можно проверить отдельно</text>

    <rect x="30" y="206" width="560" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="222" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Слева, чтобы найти ошибку в среднем балле, надо прочитать всё.</text>
    <text x="310" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Справа — вызвать average([5, 4]) и посмотреть на ответ.</text>
</svg>
