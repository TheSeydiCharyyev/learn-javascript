<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Three forms of writing a function and their properties">
    <rect x="10" y="26" width="196" height="184" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="108" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#166534">declaration</text>
    <text x="22" y="48" font-family="Consolas, monospace" font-size="10.5" fill="#166534">function add(a, b) {</text>
    <text x="32" y="64" font-family="Consolas, monospace" font-size="10.5" fill="#475569">return a + b;</text>
    <text x="22" y="80" font-family="Consolas, monospace" font-size="10.5" fill="#166534">}</text>
    <line x1="22" y1="92" x2="194" y2="92" stroke="#86efac" stroke-width="1"/>
    <text x="24" y="110" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">&#10003; hoisted</text>
    <text x="24" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">&#10003; its own name</text>
    <text x="24" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">&#10003; this, arguments</text>
    <text x="24" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">&#10003; can be a method</text>
    <text x="24" y="196" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">program functions</text>

    <rect x="214" y="26" width="196" height="184" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="312" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#92400e">expression</text>
    <text x="226" y="48" font-family="Consolas, monospace" font-size="10.5" fill="#92400e">const add = function (a, b) {</text>
    <text x="236" y="64" font-family="Consolas, monospace" font-size="10.5" fill="#475569">return a + b;</text>
    <text x="226" y="80" font-family="Consolas, monospace" font-size="10.5" fill="#92400e">};</text>
    <line x1="226" y1="92" x2="398" y2="92" stroke="#fcd34d" stroke-width="1"/>
    <text x="228" y="110" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">&#10007; not hoisted</text>
    <text x="228" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">&#10003; name from the variable</text>
    <text x="228" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">&#10003; this, arguments</text>
    <text x="228" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">&#10003; can be a method</text>
    <text x="228" y="196" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#92400e">old code, IIFE</text>

    <rect x="418" y="26" width="192" height="184" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="514" y="18" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#1d4ed8">arrow</text>
    <text x="430" y="48" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">const add =</text>
    <text x="440" y="64" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">(a, b) =&gt; a + b;</text>
    <line x1="430" y1="92" x2="598" y2="92" stroke="#93c5fd" stroke-width="1"/>
    <text x="432" y="110" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">&#10007; not hoisted</text>
    <text x="432" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">&#10003; name from the variable</text>
    <text x="432" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">&#10007; no this, arguments</text>
    <text x="432" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">&#10007; cannot be a method</text>
    <text x="432" y="196" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">short callbacks</text>

    <text x="310" y="234" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Called the same way. The difference: hoisting, the name and three small things.</text>
</svg>
