<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Превращение обычной функции в стрелочную за три шага">
    <text x="20" y="20" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#475569">было: функция-выражение</text>
    <rect x="14" y="28" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="30" y="48" font-family="Consolas, monospace" font-size="12.5" fill="#334155">const f = function (a) { return a + 100; };</text>

    <text x="20" y="80" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">шаг 1: убрали function, поставили =&gt;</text>
    <rect x="14" y="88" width="592" height="30" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="108" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">const f = (a) =&gt; { return a + 100; };</text>

    <text x="20" y="140" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">шаг 2: убрали { } и return — возврат подразумевается</text>
    <rect x="14" y="148" width="592" height="30" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="30" y="168" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">const f = (a) =&gt; a + 100;</text>

    <text x="20" y="200" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">шаг 3: убрали скобки у единственного параметра</text>
    <rect x="14" y="208" width="592" height="22" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="224" font-family="Consolas, monospace" font-size="12.5" fill="#166534">const f = a =&gt; a + 100;</text>
</svg>
