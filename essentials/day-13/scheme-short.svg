<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Как решить, сокращать стрелочную функцию или нет">
    <rect x="210" y="8" width="200" height="30" rx="8" fill="#1e293b"/>
    <text x="310" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" fill="#f8fafc">пишем стрелочную</text>

    <path d="M 310 38 L 310 52" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="170" y="52" width="280" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">тело — одно выражение?</text>

    <path d="M 310 82 L 310 96 L 150 96 L 150 112" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="220" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">да</text>
    <path d="M 310 82 L 310 96 L 470 96 L 470 112" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <text x="400" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#92400e">нет</text>

    <rect x="20" y="112" width="260" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="150" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">это объект { }?</text>

    <path d="M 150 142 L 150 154 L 70 154 L 70 172" fill="none" stroke="#ef4444" stroke-width="2"/>
    <text x="98" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#991b1b">да</text>
    <path d="M 150 142 L 150 154 L 230 154 L 230 172" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="258" y="168" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">нет</text>

    <rect x="10" y="172" width="120" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="70" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">() =&gt; ({ a: 1 })</text>
    <text x="70" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">круглые скобки!</text>

    <rect x="150" y="172" width="120" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="210" y="190" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">(n) =&gt; n * 2</text>
    <text x="210" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#166534">без скобок и return</text>

    <rect x="370" y="112" width="200" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="470" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">(n) =&gt; { ... return x; }</text>
    <text x="470" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#92400e">return ОБЯЗАТЕЛЕН</text>

    <text x="470" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">появились { } —</text>
    <text x="470" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#475569">неявный возврат выключен</text>

    <text x="310" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Две развилки — и вы всегда знаете, что писать.</text>
</svg>
