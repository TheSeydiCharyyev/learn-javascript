    <rect x="428" y="12" width="78" height="30" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="467" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">"bäş"</text>

    <path d="M 129 44 L 129 96" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 129 104 L 124 92 L 134 92 Z" fill="#3b82f6"/>
    <path d="M 211 44 L 211 96" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 211 104 L 206 92 L 216 92 Z" fill="#3b82f6"/>
    <path d="M 293 44 L 293 70 L 400 70 L 400 96" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 379 44 L 379 70" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 467 44 L 467 70 L 400 70" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 400 104 L 395 92 L 405 92 Z" fill="#8b5cf6"/>

    <rect x="92" y="108" width="74" height="34" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="129" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">first</text>
    <rect x="174" y="108" width="74" height="34" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="211" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">second</text>
    <rect x="290" y="108" width="220" height="34" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">...others</text>

    <path d="M 400 144 L 400 176" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 400 184 L 395 172 L 405 172 Z" fill="#8b5cf6"/>

    <rect x="230" y="188" width="340" height="34" rx="5" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="400" y="210" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">["üç", "dört", "bäş"]</text>
    <text x="12" y="210" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#6d28d9">a real array</text>

    <text x="310" y="242" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Named parameters take the beginning, the rest parameter takes the whole tail</text>
