<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="A rest parameter collects the remaining arguments into an array">
    <text x="12" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Call</text>
    <rect x="92" y="12" width="74" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="129" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">"bir"</text>
    <rect x="174" y="12" width="74" height="30" rx="5" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="211" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">"iki"</text>
    <rect x="256" y="12" width="74" height="30" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="293" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">"üç"</text>
    <rect x="338" y="12" width="82" height="30" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
