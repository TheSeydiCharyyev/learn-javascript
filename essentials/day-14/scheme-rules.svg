<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Порядок параметров в списке: обязательные, с умолчаниями, остаточный">
    <rect x="14" y="26" width="592" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="18" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">Правильный порядок</text>
    <rect x="26" y="38" width="170" height="28" rx="5" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="111" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">name, marks</text>
    <text x="206" y="57" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">&#8594;</text>
    <rect x="228" y="38" width="190" height="28" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="323" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">sep = ", "</text>
    <text x="428" y="57" font-family="Segoe UI, sans-serif" font-size="14" fill="#94a3b8">&#8594;</text>
    <rect x="450" y="38" width="144" height="28" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="522" y="57" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">...rest</text>
    <text x="111" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">обязательные</text>
    <text x="323" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">с умолчаниями</text>
    <text x="522" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">остаточный, один</text>

    <rect x="14" y="116" width="592" height="100" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="14" y="110" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Так нельзя</text>
    <text x="30" y="140" font-family="Consolas, monospace" font-size="11.5" fill="#7f1d1d">f(...rest, last)</text>
    <text x="250" y="140" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">после остаточного ничего не бывает</text>
    <text x="30" y="164" font-family="Consolas, monospace" font-size="11.5" fill="#7f1d1d">f(...a, ...b)</text>
    <text x="250" y="164" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">остаточный может быть только один</text>
    <text x="30" y="188" font-family="Consolas, monospace" font-size="11.5" fill="#7f1d1d">f(...rest = [])</text>
    <text x="250" y="188" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">умолчание ему не нужно и запрещено</text>
    <text x="30" y="208" font-family="Consolas, monospace" font-size="11.5" fill="#7f1d1d">f(...rest,)</text>
    <text x="250" y="208" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">запятая после него — тоже ошибка</text>
</svg>
