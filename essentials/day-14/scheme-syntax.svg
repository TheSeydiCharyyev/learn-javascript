<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Как аргументы попадают в параметры и когда срабатывает умолчание">
    <text x="12" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Вызов</text>
    <rect x="96" y="12" width="150" height="32" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="171" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">"Аман"</text>
    <rect x="272" y="12" width="230" height="32" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="387" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">второго аргумента нет</text>

    <path d="M 171 46 L 171 84" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 171 92 L 166 80 L 176 80 Z" fill="#94a3b8"/>
    <path d="M 387 46 L 387 84" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 387 92 L 382 80 L 392 80 Z" fill="#94a3b8"/>

    <text x="12" y="118" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Параметры</text>
    <rect x="96" y="96" width="150" height="36" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="171" y="119" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">name</text>
    <rect x="272" y="96" width="230" height="36" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="387" y="119" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">greeting = "Salam"</text>

    <path d="M 171 134 L 171 168" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 171 176 L 166 164 L 176 164 Z" fill="#94a3b8"/>
    <path d="M 387 134 L 387 168" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 387 176 L 382 164 L 392 164 Z" fill="#f59e0b"/>

    <text x="12" y="202" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Внутри</text>
    <rect x="96" y="180" width="150" height="36" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <text x="171" y="203" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">"Аман"</text>
    <rect x="272" y="180" width="230" height="36" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="387" y="203" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#92400e">"Salam"</text>
    <text x="512" y="203" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#92400e">умолчание</text>

    <text x="310" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">Пустое место в вызове заполняется значением из заголовка функции</text>
</svg>
