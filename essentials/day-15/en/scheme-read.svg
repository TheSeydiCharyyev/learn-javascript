<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Four layers of reading someone else’s function">
    <rect x="14" y="14" width="592" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="30" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1. What it gives</text>
    <text x="150" y="32" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">return r;  &#160;r is a string</text>
    <text x="150" y="48" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">look at return FIRST — it tells you what the function is for</text>

    <rect x="14" y="66" width="592" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="84" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. What it takes</text>
    <text x="150" y="84" font-family="Consolas, monospace" font-size="11.5" fill="#a16207">a is iterated, its elements have length</text>
    <text x="150" y="100" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">b is compared with a number — so it is a number</text>

    <rect x="14" y="118" width="592" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="30" y="136" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">3. Which branches</text>
    <text x="150" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">if (x.length &gt; b) — we take not all, only by a condition</text>
    <text x="150" y="152" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">one branch: what did not pass is simply skipped</text>

    <rect x="14" y="170" width="592" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="188" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">4. The name</text>
    <text x="150" y="188" font-family="Consolas, monospace" font-size="11.5" fill="#166534">longNames(names, minLength)</text>
    <text x="150" y="204" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">we invent the name ourselves — and write it into the code right away</text>
</svg>
