<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Three places where a function breaks: input, body and output">
    <rect x="14" y="40" width="150" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="89" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1. Input</text>
    <text x="89" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1e40af">is the input right?</text>
    <text x="89" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">the right type,</text>
    <text x="89" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">the right order</text>

    <path d="M 164 76 L 222 76" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 230 76 L 218 71 L 218 81 Z" fill="#94a3b8"/>

    <rect x="232" y="40" width="156" height="72" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. Body</text>
    <text x="310" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#a16207">is it calculated right?</text>
    <text x="310" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">branches, bounds,</text>
    <text x="310" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">counters</text>

    <path d="M 388 76 L 446 76" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 454 76 L 442 71 L 442 81 Z" fill="#94a3b8"/>

    <rect x="456" y="40" width="150" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="531" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">3. Output</text>
    <text x="531" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">is the output right?</text>
    <text x="531" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">is there a return,</text>
    <text x="531" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">the right type</text>

    <text x="89" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">console.log at the start</text>
    <text x="531" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#166534">console.log before return</text>
    <path d="M 89 116 L 89 126" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M 531 116 L 531 126" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3"/>

    <text x="310" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#475569">Boundaries first, then the middle.</text>
    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">Two prints answer the question “whose error is it — mine or the caller’s”.</text>
</svg>
