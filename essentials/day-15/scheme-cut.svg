<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Пирамида вызовов: makeReport собирает результат из трёх функций">
    <rect x="180" y="14" width="260" height="42" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#92400e">makeReport(names, present)</text>
    <text x="310" y="49" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#a16207">собирает отчёт</text>

    <path d="M 250 58 L 250 78 L 96 78 L 96 100" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 96 108 L 91 96 L 101 96 Z" fill="#94a3b8"/>
    <path d="M 310 58 L 310 100" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 108 L 305 96 L 315 96 Z" fill="#94a3b8"/>
    <path d="M 370 58 L 370 78 L 524 78 L 524 100" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 524 108 L 519 96 L 529 96 Z" fill="#94a3b8"/>

    <rect x="14" y="110" width="164" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="96" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">countPresent</text>
    <text x="96" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#15803d">число</text>

    <rect x="228" y="110" width="164" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">listMissing</text>
    <text x="310" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#15803d">строка</text>

    <rect x="442" y="110" width="164" height="52" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="524" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">percentOf</text>
    <text x="524" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#15803d">число</text>

    <text x="14" y="190" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Верхняя функция знает <tspan font-weight="700">что</tspan> делается и в каком порядке.</text>
    <text x="14" y="208" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Нижние знают <tspan font-weight="700">как</tspan> и друг о друге не догадываются.</text>
    <text x="14" y="228" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Поэтому любую нижнюю можно чинить, не трогая остальные.</text>
</svg>
