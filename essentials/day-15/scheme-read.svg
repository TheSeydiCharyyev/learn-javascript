<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Четыре слоя чтения чужой функции">
    <rect x="14" y="14" width="592" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="30" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">1. Что отдаёт</text>
    <text x="150" y="32" font-family="Consolas, monospace" font-size="11.5" fill="#1e40af">return r;  &#160;r — строка</text>
    <text x="150" y="48" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">смотрим на return ПЕРВЫМ — он говорит, зачем функция нужна</text>

    <rect x="14" y="66" width="592" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="30" y="84" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">2. Что принимает</text>
    <text x="150" y="84" font-family="Consolas, monospace" font-size="11.5" fill="#a16207">a — перебирается, у элементов есть length</text>
    <text x="150" y="100" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">b сравнивается с числом — значит, число</text>

    <rect x="14" y="118" width="592" height="44" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="30" y="136" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">3. Какие ветки</text>
    <text x="150" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">if (x.length &gt; b) — берём не всё, а по условию</text>
    <text x="150" y="152" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">ветка одна: что не прошло — просто пропущено</text>

    <rect x="14" y="170" width="592" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="30" y="188" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">4. Имя</text>
    <text x="150" y="188" font-family="Consolas, monospace" font-size="11.5" fill="#166534">longNames(names, minLength)</text>
    <text x="150" y="204" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">имя придумываем сами — и сразу вписываем в код</text>
</svg>
