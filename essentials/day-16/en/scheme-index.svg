<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="A string as a row of cells: indices from the start and from the end">
    <text x="14" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">String</text>
    <text x="14" y="50" font-family="Consolas, monospace" font-size="12" fill="#0369a1">"Gülnar"</text>

    <rect x="120" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="158" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">G</text>
    <rect x="200" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="238" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">ü</text>
    <rect x="280" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="318" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">l</text>
    <rect x="360" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="398" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">n</text>
    <rect x="440" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="478" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">a</text>
    <rect x="520" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="558" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">r</text>

    <text x="14" y="88" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">From the start</text>
    <text x="158" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">0</text>
    <text x="238" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">1</text>
    <text x="318" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">2</text>
    <text x="398" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">3</text>
    <text x="478" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">4</text>
    <text x="558" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">5</text>

    <text x="14" y="112" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">From the end</text>
    <text x="158" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-6</text>
    <text x="238" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-5</text>
    <text x="318" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-4</text>
    <text x="398" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-3</text>
    <text x="478" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-2</text>
    <text x="558" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-1</text>

    <text x="14" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Only <tspan font-family="Consolas, monospace" fill="#0369a1">at()</tspan> understands negative ones.</text>
    <text x="14" y="170" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569"><tspan font-family="Consolas, monospace" fill="#0369a1">name[-1]</tspan> and <tspan font-family="Consolas, monospace" fill="#0369a1">charAt(-1)</tspan> will not give you the last character.</text>
    <text x="14" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569"><tspan font-weight="700">length = 6</tspan>, but the last index is 5. This difference of one is the source of half of all errors.</text>
</svg>
