<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="String methods by four tasks: find, cut, adjust, build">
    <rect x="10" y="14" width="292" height="108" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="24" y="36" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#1d4ed8">FIND</text>
    <text x="24" y="58" font-family="Consolas, monospace" font-size="11" fill="#1e40af">indexOf</text>
    <text x="120" y="58" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">a position or −1</text>
    <text x="24" y="76" font-family="Consolas, monospace" font-size="11" fill="#1e40af">lastIndexOf</text>
    <text x="120" y="76" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">the same, from the end</text>
    <text x="24" y="94" font-family="Consolas, monospace" font-size="11" fill="#1e40af">includes</text>
    <text x="120" y="94" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">true / false</text>
    <text x="24" y="112" font-family="Consolas, monospace" font-size="11" fill="#1e40af">startsWith endsWith</text>

    <rect x="318" y="14" width="292" height="108" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="332" y="36" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#166534">CUT</text>
    <text x="332" y="58" font-family="Consolas, monospace" font-size="11" fill="#15803d">slice</text>
    <text x="428" y="58" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">a piece; write this one</text>
    <text x="332" y="76" font-family="Consolas, monospace" font-size="11" fill="#15803d">substring</text>
    <text x="428" y="76" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">only read it</text>
    <text x="332" y="94" font-family="Consolas, monospace" font-size="11" fill="#15803d">at</text>
    <text x="428" y="94" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">one char, also from the end</text>
    <text x="332" y="112" font-family="Consolas, monospace" font-size="11" fill="#15803d">charAt</text>
    <text x="428" y="112" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">past the edge — <tspan font-family="Consolas, monospace">""</tspan></text>

    <rect x="10" y="134" width="292" height="108" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="24" y="156" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#92400e">ADJUST</text>
    <text x="24" y="178" font-family="Consolas, monospace" font-size="11" fill="#a16207">trim</text>
    <text x="120" y="178" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">spaces at the edges</text>
    <text x="24" y="196" font-family="Consolas, monospace" font-size="11" fill="#a16207">trimStart trimEnd</text>
    <text x="24" y="214" font-family="Consolas, monospace" font-size="11" fill="#a16207">toLowerCase</text>
    <text x="120" y="214" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">before comparing</text>
    <text x="24" y="232" font-family="Consolas, monospace" font-size="11" fill="#a16207">toUpperCase</text>

    <rect x="318" y="134" width="292" height="108" rx="10" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="332" y="156" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#6d28d9">BUILD</text>
    <text x="332" y="178" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">`${}`</text>
    <text x="428" y="178" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">the main way</text>
    <text x="332" y="196" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">+ concat</text>
    <text x="428" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">two or three pieces</text>
    <text x="332" y="214" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">padStart padEnd</text>
    <text x="428" y="214" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">columns</text>
    <text x="332" y="232" font-family="Consolas, monospace" font-size="11" fill="#7c3aed">repeat</text>
    <text x="428" y="232" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">lines</text>

    <text x="310" y="258" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">First choose the group by the task, then the method inside the group</text>
</svg>
