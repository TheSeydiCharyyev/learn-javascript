<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Строка как ряд ячеек: индексы с начала и с конца">
    <text x="14" y="30" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Строка</text>
    <text x="14" y="50" font-family="Consolas, monospace" font-size="12" fill="#0369a1">"Гүлнар"</text>

    <rect x="120" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="158" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">Г</text>
    <rect x="200" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="238" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">ү</text>
    <rect x="280" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="318" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">л</text>
    <rect x="360" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="398" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">н</text>
    <rect x="440" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="478" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">а</text>
    <rect x="520" y="22" width="76" height="40" rx="6" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="558" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#0c4a6e">р</text>

    <text x="14" y="88" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">С начала</text>
    <text x="158" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">0</text>
    <text x="238" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">1</text>
    <text x="318" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">2</text>
    <text x="398" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">3</text>
    <text x="478" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">4</text>
    <text x="558" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#166534">5</text>

    <text x="14" y="112" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#b45309">С конца</text>
    <text x="158" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-6</text>
    <text x="238" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-5</text>
    <text x="318" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-4</text>
    <text x="398" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-3</text>
    <text x="478" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-2</text>
    <text x="558" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#b45309">-1</text>

    <text x="14" y="150" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Отрицательные понимает только <tspan font-family="Consolas, monospace" fill="#0369a1">at()</tspan>.</text>
    <text x="14" y="170" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569"><tspan font-family="Consolas, monospace" fill="#0369a1">name[-1]</tspan> и <tspan font-family="Consolas, monospace" fill="#0369a1">charAt(-1)</tspan> последний символ не отдадут.</text>
    <text x="14" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569"><tspan font-weight="700">length = 6</tspan>, а последний индекс — 5. Разница на единицу — источник половины ошибок.</text>
</svg>
