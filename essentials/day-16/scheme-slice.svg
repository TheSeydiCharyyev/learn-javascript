<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Как slice считает границы, включая отрицательные">
    <text x="14" y="26" font-family="Consolas, monospace" font-size="13" fill="#0369a1">"Туркменистан"</text>

    <rect x="140" y="38" width="352" height="36" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="150" y="62" font-family="Consolas, monospace" font-size="15" fill="#0c4a6e">Т у р к м е н и с т а н</text>

    <text x="145" y="92" font-family="Consolas, monospace" font-size="11" fill="#166534">0</text>
    <text x="235" y="92" font-family="Consolas, monospace" font-size="11" fill="#166534">4</text>
    <text x="478" y="92" font-family="Consolas, monospace" font-size="11" fill="#166534">12</text>
    <text x="235" y="108" font-family="Consolas, monospace" font-size="11" fill="#b45309">-8</text>
    <text x="316" y="108" font-family="Consolas, monospace" font-size="11" fill="#b45309">-6</text>

    <rect x="140" y="124" width="92" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
    <text x="186" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#166534">Турк</text>
    <text x="246" y="142" font-family="Consolas, monospace" font-size="11.5" fill="#475569">slice(0, 4)</text>

    <rect x="232" y="156" width="260" height="26" rx="4" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="362" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">менистан</text>
    <text x="500" y="174" font-family="Consolas, monospace" font-size="11.5" fill="#475569">slice(4)</text>

    <rect x="316" y="188" width="176" height="26" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="404" y="206" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">нистан</text>
    <text x="500" y="206" font-family="Consolas, monospace" font-size="11.5" fill="#475569">slice(-6)</text>
</svg>
