<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Why 0.1 + 0.2 gives 0.30000000000000004">
    <text x="14" y="26" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">In the decimal system</text>
    <rect x="14" y="36" width="284" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="28" y="58" font-family="Consolas, monospace" font-size="11.5" fill="#166534">1/3 = 0.3333333… </text>
    <text x="28" y="78" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">cannot be written exactly — we cut it off</text>

    <text x="322" y="26" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">In the binary system</text>
    <rect x="322" y="36" width="284" height="56" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="336" y="58" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">0.1 = 0.000110011… </text>
    <text x="336" y="78" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">the same trouble, but with the number 0.1</text>

    <path d="M 310 100 L 310 118" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 126 L 305 114 L 315 114 Z" fill="#94a3b8"/>

    <rect x="14" y="130" width="592" height="30" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="310" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">0.1 + 0.2 = 0.30000000000000004</text>

    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Two cut-off fractions were added — and the error became visible</text>
</svg>
