<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Three ways to turn a string into a number and how they differ">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">String</text>
    <text x="150" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0369a1">Number()</text>
    <text x="290" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">parseInt()</text>
    <text x="440" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#6d28d9">parseFloat()</text>
    <line x1="14" y1="30" x2="606" y2="30" stroke="#cbd5e1" stroke-width="1.5"/>

    <text x="14" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#334155">"42"</text>
    <text x="150" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">42</text>
    <text x="290" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#166534">42</text>
    <text x="440" y="52" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">42</text>

    <text x="14" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#334155">"4.5"</text>
    <text x="150" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">4.5</text>
    <text x="290" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">4</text>
    <text x="440" y="76" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">4.5</text>

    <text x="14" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#334155">"42px"</text>
    <text x="150" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>
    <text x="290" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#166534">42</text>
    <text x="440" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">42</text>

    <text x="14" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#334155">"px42"</text>
    <text x="150" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>
    <text x="290" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>
    <text x="440" y="124" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>

    <text x="14" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#334155">""</text>
    <text x="150" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#b45309">0</text>
    <text x="290" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>
    <text x="440" y="148" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">NaN</text>

    <line x1="14" y1="162" x2="606" y2="162" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="14" y="182" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">When to use:</text>
    <text x="150" y="182" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0369a1">the whole string</text>
    <text x="150" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0369a1">must be a number</text>
    <text x="290" y="182" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#166534">a number + a tail,</text>
    <text x="290" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#166534">integer part needed</text>
    <text x="440" y="182" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#6d28d9">a number + a tail,</text>
    <text x="440" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#6d28d9">fractional part needed</text>
</svg>
