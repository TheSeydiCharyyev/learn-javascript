<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Разбор даты на части: какие методы что возвращают">
    <rect x="130" y="14" width="360" height="40" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="310" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0c4a6e">new Date(2026, 8, 22, 14, 5)</text>
    <text x="310" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">22 сентября 2026 года, 14:05</text>

    <path d="M 310 78 L 310 94" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 102 L 305 90 L 315 90 Z" fill="#94a3b8"/>

    <rect x="14" y="106" width="114" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="71" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#166534">getFullYear()</text>
    <text x="71" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">2026</text>

    <rect x="136" y="106" width="114" height="54" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text x="193" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#991b1b">getMonth()</text>
    <text x="193" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#991b1b">8</text>

    <rect x="258" y="106" width="104" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="310" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#166534">getDate()</text>
    <text x="310" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">22</text>

    <rect x="370" y="106" width="114" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="427" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#166534">getHours()</text>
    <text x="427" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">14</text>

    <rect x="492" y="106" width="114" height="54" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="549" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#166534">getMinutes()</text>
    <text x="549" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#166534">5</text>

    <text x="193" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#991b1b">единственный с нуля</text>
    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Год, день, часы и минуты — как у людей. Месяц — на единицу меньше.</text>
</svg>
