<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Диапазон Math.random и превращение его в целое число">
    <text x="14" y="24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Шаг 1. Math.random()</text>
    <rect x="152" y="12" width="420" height="24" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <text x="152" y="54" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">0</text>
    <text x="560" y="54" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">1</text>
    <text x="362" y="29" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0c4a6e">попадает сюда: ноль можно, единицу нельзя</text>

    <text x="14" y="86" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Шаг 2. × 6</text>
    <rect x="152" y="74" width="420" height="24" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="152" y="116" font-family="Consolas, monospace" font-size="11.5" fill="#166534">0</text>
    <text x="560" y="116" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">6</text>
    <text x="362" y="91" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#166534">растянули отрезок: 0 … 5.999…</text>

    <text x="14" y="148" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Шаг 3. Math.floor</text>
    <rect x="152" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="187" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">0</text>
    <rect x="222" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="257" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">1</text>
    <rect x="292" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="327" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">2</text>
    <rect x="362" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="397" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">3</text>
    <rect x="432" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="467" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">4</text>
    <rect x="502" y="136" width="70" height="24" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="537" y="153" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">5</text>

    <text x="14" y="186" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Шаг 4. + 1</text>
    <text x="152" y="186" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">1 2 3 4 5 6 — шесть исходов, все одинаково вероятны</text>
    <text x="310" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Шесть равных клеток получаются именно потому, что единица в отрезок не входит</text>
</svg>
