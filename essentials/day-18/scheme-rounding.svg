<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Куда попадает число при четырёх способах округления">
    <line x1="40" y1="60" x2="580" y2="60" stroke="#94a3b8" stroke-width="2"/>
    <line x1="120" y1="52" x2="120" y2="68" stroke="#475569" stroke-width="2"/>
    <text x="120" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">4</text>
    <line x1="480" y1="52" x2="480" y2="68" stroke="#475569" stroke-width="2"/>
    <text x="480" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">5</text>
    <circle cx="408" cy="60" r="5" fill="#0ea5e9"/>
    <text x="408" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#0369a1">4.8</text>

    <text x="40" y="120" font-family="Consolas, monospace" font-size="11.5" fill="#166534">Math.round(4.8)</text>
    <path d="M 408 108 L 470 108" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M 478 108 L 466 103 L 466 113 Z" fill="#22c55e"/>
    <text x="500" y="112" font-family="Consolas, monospace" font-size="11.5" fill="#166534">5</text>

    <text x="40" y="146" font-family="Consolas, monospace" font-size="11.5" fill="#b45309">Math.floor(4.8)</text>
    <path d="M 400 134 L 130 134" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 122 134 L 134 129 L 134 139 Z" fill="#f59e0b"/>
    <text x="500" y="138" font-family="Consolas, monospace" font-size="11.5" fill="#b45309">4</text>

    <text x="40" y="172" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">Math.ceil(4.1)</text>
    <path d="M 160 160 L 470 160" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 478 160 L 466 155 L 466 165 Z" fill="#8b5cf6"/>
    <text x="500" y="164" font-family="Consolas, monospace" font-size="11.5" fill="#6d28d9">5</text>

    <text x="40" y="198" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">Math.trunc(4.8)</text>
    <path d="M 400 186 L 130 186" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 122 186 L 134 181 L 134 191 Z" fill="#0ea5e9"/>
    <text x="500" y="190" font-family="Consolas, monospace" font-size="11.5" fill="#0369a1">4</text>

    <text x="310" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">На положительных числах floor и trunc совпадают. Разницу видно только на минусах</text>
</svg>
