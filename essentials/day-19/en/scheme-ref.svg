<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 170" role="img" aria-label="Two variables refer to one array in memory">
    <rect x="20" y="30" width="120" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e40af">a</text>

    <rect x="20" y="100" width="120" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="80" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e40af">b</text>

    <path d="M145 52 C 220 52, 240 75, 300 82" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)"/>
    <path d="M145 122 C 220 122, 240 99, 300 92" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#ar)"/>

    <rect x="310" y="55" width="230" height="60" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="425" y="92" text-anchor="middle" font-family="Consolas, monospace" font-size="17" fill="#92400e">[ 1, 2, 3, 4 ]</text>
    <text x="425" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">one array in memory</text>

    <defs><marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#64748b"/></marker></defs>
</svg>
