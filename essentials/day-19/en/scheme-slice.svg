<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" role="img" aria-label="slice returns a copy, splice changes the source array">
    <text x="10" y="24" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#15803d">slice(1, 3) — a copy, the original is intact</text>
    <rect x="10" y="36" width="280" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="150" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#334155">[ "a", "b", "c", "d" ]</text>
    <path d="M300 58 H338" stroke="#22c55e" stroke-width="2.5" marker-end="url(#g2)"/>
    <rect x="345" y="36" width="170" height="44" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="430" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#15803d">[ "b", "c" ]</text>
    <text x="10" y="100" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">the source array stayed ["a", "b", "c", "d"]</text>

    <text x="10" y="146" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#b91c1c">splice(1, 2, "X") — cuts into the live array</text>
    <rect x="10" y="158" width="280" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="150" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#334155">[ "a", "b", "c", "d" ]</text>
    <path d="M300 180 H338" stroke="#ef4444" stroke-width="2.5" marker-end="url(#r2)"/>
    <rect x="345" y="158" width="170" height="44" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="430" y="186" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#991b1b">[ "a", "X", "d" ]</text>
    <text x="10" y="222" font-family="Segoe UI, sans-serif" font-size="13" fill="#475569">this is the source array itself: it has changed</text>

    <defs>
        <marker id="g2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#22c55e"/></marker>
        <marker id="r2" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#ef4444"/></marker>
    </defs>
</svg>
