<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" role="img" aria-label="push и pop работают с конца массива, unshift и shift с начала">
    <rect x="150" y="70" width="300" height="50" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="300" y="101" text-anchor="middle" font-family="Consolas, monospace" font-size="16" fill="#1e40af">[ 1, 2, 3, 4 ]</text>

    <path d="M120 60 H145" stroke="#22c55e" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="20" y="50" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#15803d">unshift(0)</text>
    <text x="20" y="66" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">добавить в начало</text>

    <path d="M145 135 H120" stroke="#ef4444" stroke-width="2.5" marker-end="url(#r)"/>
    <text x="20" y="150" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">shift()</text>
    <text x="20" y="166" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">убрать из начала</text>

    <path d="M480 60 H455" stroke="#22c55e" stroke-width="2.5" marker-end="url(#g)"/>
    <text x="455" y="50" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#15803d">push(5)</text>
    <text x="455" y="66" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">добавить в конец</text>

    <path d="M455 135 H480" stroke="#ef4444" stroke-width="2.5" marker-end="url(#r)"/>
    <text x="455" y="150" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#b91c1c">pop()</text>
    <text x="455" y="166" font-family="Segoe UI, sans-serif" font-size="12" fill="#475569">убрать из конца</text>

    <defs>
        <marker id="g" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#22c55e"/></marker>
        <marker id="r" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="#ef4444"/></marker>
    </defs>
</svg>
