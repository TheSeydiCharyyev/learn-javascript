<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" role="img" aria-label="Массив из пяти элементов с индексами от нуля до четырёх">
    <text x="10" y="28" font-family="Consolas, monospace" font-size="15" fill="#1e293b">const fruits = ["алма", "армыт", "üzüm", "erik", "hurma"];</text>

    <rect x="20" y="55" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="72" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">"алма"</text>
    <text x="72" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e40af">0</text>

    <rect x="133" y="55" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="185" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">"армыт"</text>
    <text x="185" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e40af">1</text>

    <rect x="246" y="55" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="298" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">"üzüm"</text>
    <text x="298" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e40af">2</text>

    <rect x="359" y="55" width="105" height="46" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="411" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#92400e">"erik"</text>
    <text x="411" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#1e40af">3</text>

    <rect x="472" y="55" width="105" height="46" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="524" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="15" fill="#991b1b">"hurma"</text>
    <text x="524" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" font-weight="700" fill="#991b1b">4</text>
    <text x="524" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#991b1b">последний = length - 1</text>
</svg>
