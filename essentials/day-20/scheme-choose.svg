<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Карта выбора метода перебора по нужному результату">
    <rect x="180" y="10" width="260" height="34" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">Что должно получиться?</text>

    <path d="M 310 44 L 310 58" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <line x1="90" y1="58" x2="530" y2="58" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 90 58 L 90 72" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 236 58 L 236 72" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 384 58 L 384 72" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 530 58 L 530 72" fill="none" stroke="#94a3b8" stroke-width="2"/>

    <rect x="14" y="74" width="152" height="60" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="90" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0369a1">ничего,</text>
    <text x="90" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0369a1">просто действие</text>
    <text x="90" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#0c4a6e">forEach</text>

    <rect x="174" y="74" width="124" height="60" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="236" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">список той же</text>
    <text x="236" y="108" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">длины</text>
    <text x="236" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#065f46">map</text>

    <rect x="306" y="74" width="156" height="60" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="384" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#92400e">список короче</text>
    <text x="384" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#92400e">filter</text>
    <text x="384" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#a16207">или flatMap</text>

    <rect x="470" y="74" width="136" height="60" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="538" y="94" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6d28d9">одно значение</text>
    <text x="538" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#6d28d9">reduce</text>
    <text x="538" y="128" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#7c3aed">сумма, максимум…</text>

    <rect x="14" y="152" width="592" height="82" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Частные случаи одного значения:</text>
    <text x="28" y="192" font-family="Consolas, monospace" font-size="11" fill="#475569">find</text>
    <text x="120" y="192" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">первый подходящий элемент</text>
    <text x="320" y="192" font-family="Consolas, monospace" font-size="11" fill="#475569">some / every</text>
    <text x="440" y="192" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">да или нет</text>
    <text x="28" y="212" font-family="Consolas, monospace" font-size="11" fill="#475569">findIndex</text>
    <text x="120" y="212" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">его позиция, иначе −1</text>
    <text x="320" y="212" font-family="Consolas, monospace" font-size="11" fill="#475569">sort</text>
    <text x="440" y="212" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">тот же список, но по порядку</text>
    <text x="28" y="228" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94a3b8">Нужно выйти на середине — берите обычный цикл с break.</text>
</svg>
