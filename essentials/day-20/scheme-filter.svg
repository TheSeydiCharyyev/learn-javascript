<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Как массив меняется на каждом шаге цепочки">
    <text x="14" y="24" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Было</text>
    <rect x="96" y="10" width="420" height="26" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="306" y="28" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">5  4  3  5  2  9  0  4</text>
    <text x="530" y="28" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">8 штук</text>

    <path d="M 306 38 L 306 52" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 306 60 L 301 48 L 311 48 Z" fill="#f59e0b"/>
    <text x="322" y="54" font-family="Consolas, monospace" font-size="11" fill="#92400e">.filter(2 ≤ m ≤ 5)</text>

    <text x="14" y="82" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Отобрали</text>
    <rect x="96" y="66" width="315" height="26" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="253" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">5  4  3  5  2  4</text>
    <text x="530" y="84" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">6 штук</text>

    <path d="M 253 94 L 253 108" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 253 116 L 248 104 L 258 104 Z" fill="#10b981"/>
    <text x="270" y="110" font-family="Consolas, monospace" font-size="11" fill="#047857">.map(m * 10)</text>

    <text x="14" y="138" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Изменили</text>
    <rect x="96" y="122" width="315" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="253" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#047857">50 40 30 50 20 40</text>
    <text x="530" y="140" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">те же 6</text>

    <path d="M 253 150 L 253 164" fill="none" stroke="#8b5cf6" stroke-width="2"/>
    <path d="M 253 172 L 248 160 L 258 160 Z" fill="#8b5cf6"/>
    <text x="270" y="166" font-family="Consolas, monospace" font-size="11" fill="#6d28d9">.reduce(сумма)</text>

    <text x="14" y="194" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">Свернули</text>
    <rect x="96" y="178" width="88" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="140" y="196" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#6d28d9">230</text>
    <text x="200" y="196" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">одно число</text>
</svg>
