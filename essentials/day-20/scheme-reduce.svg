<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Как reduce накапливает сумму по шагам">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">marks.reduce((sum, mark) =&gt; sum + mark, 0)</text>

    <rect x="14" y="36" width="100" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="64" y="59" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">начало 0</text>

    <path d="M 114 54 L 152 54" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 160 54 L 148 49 L 148 59 Z" fill="#10b981"/>

    <rect x="162" y="36" width="130" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="227" y="53" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">0 + 5</text>
    <text x="227" y="67" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#065f46">= 5</text>

    <path d="M 292 54 L 330 54" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 338 54 L 326 49 L 326 59 Z" fill="#10b981"/>

    <rect x="340" y="36" width="130" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="405" y="53" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">5 + 4</text>
    <text x="405" y="67" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#065f46">= 9</text>

    <path d="M 470 54 L 490 54 L 490 96 L 150 96 L 150 116" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 150 124 L 145 112 L 155 112 Z" fill="#10b981"/>

    <rect x="86" y="126" width="130" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="151" y="143" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">9 + 3</text>
    <text x="151" y="157" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#065f46">= 12</text>

    <path d="M 216 144 L 254 144" fill="none" stroke="#475569" stroke-width="2"/>
    <path d="M 262 144 L 250 139 L 250 149 Z" fill="#475569"/>

    <rect x="264" y="126" width="120" height="36" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="324" y="149" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#92400e">итог 12</text>

    <text x="400" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Накопленное идёт</text>
    <text x="400" y="164" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">в следующий шаг</text>
    <text x="14" y="196" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Элементы массива — 5, 4, 3. Каждый шаг берёт накопленное слева и элемент сверху.</text>
</svg>
