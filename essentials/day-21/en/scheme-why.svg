<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Two parallel arrays turn into a list of objects">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Before: linked only by order</text>
    <rect x="14" y="32" width="270" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="149" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">"bread"   "tea"   "butter"</text>
    <rect x="14" y="64" width="270" height="26" rx="5" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="149" y="82" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">3.5      12      25</text>
    <path d="M 60 58 L 60 64" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 149 58 L 149 64" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
    <path d="M 238 58 L 238 64" fill="none" stroke="#fca5a5" stroke-width="1.5" stroke-dasharray="3 2"/>
    <text x="14" y="112" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">Rearranged one — the link broke</text>

    <path d="M 292 60 L 326 60" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 334 60 L 322 55 L 322 65 Z" fill="#10b981"/>

    <text x="346" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">Now: the link is inside</text>
    <rect x="346" y="32" width="260" height="30" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="476" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#047857">{ name: "bread", price: 3.5 }</text>
    <rect x="346" y="66" width="260" height="30" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="476" y="86" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#047857">{ name: "tea", price: 12 }</text>
    <rect x="346" y="100" width="260" height="30" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="476" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#047857">{ name: "butter", price: 25 }</text>
    <text x="346" y="150" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#047857">Sort as you like — the pair will not break</text>

    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">An array is “many of the same kind, in order”.</text>
    <text x="310" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">An object is “one whole of different parts, each with its own name”.</text>
</svg>
