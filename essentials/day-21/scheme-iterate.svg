<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Что возвращают Object.keys, values и entries">
    <rect x="200" y="10" width="220" height="70" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="310" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">name:  "Аман"</text>
    <text x="310" y="48" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">age:   17</text>
    <text x="310" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">city:  "Мары"</text>

    <path d="M 240 80 L 150 80 L 150 104" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 150 112 L 145 100 L 155 100 Z" fill="#94a3b8"/>
    <path d="M 310 80 L 310 104" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 310 112 L 305 100 L 315 100 Z" fill="#94a3b8"/>
    <path d="M 380 80 L 470 80 L 470 104" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 470 112 L 465 100 L 475 100 Z" fill="#94a3b8"/>

    <text x="150" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#0369a1">keys</text>
    <rect x="24" y="138" width="252" height="26" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="150" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0369a1">["name", "age", "city"]</text>

    <text x="310" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#92400e">values</text>
    <rect x="284" y="138" width="52" height="26" rx="5" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="310" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#92400e">[…]</text>

    <text x="470" y="130" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#6d28d9">entries</text>
    <rect x="344" y="138" width="252" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="470" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="9" fill="#6d28d9">[["name","Аман"], ["age",17], …]</text>

    <text x="310" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Все три отдают массив — значит, дальше работают map, filter и reduce</text>
</svg>
