<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Две переменные ссылаются на один объект, копия создаёт второй">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">const b = a — одна ссылка на двоих</text>
    <rect x="24" y="34" width="70" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="59" y="53" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">a</text>
    <rect x="24" y="70" width="70" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="59" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">b</text>
    <path d="M 94 48 L 168 62" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 176 64 L 163 62 L 167 53 Z" fill="#ef4444"/>
    <path d="M 94 84 L 168 70" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 176 68 L 163 70 L 167 79 Z" fill="#ef4444"/>
    <rect x="180" y="50" width="96" height="32" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="228" y="71" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">{ x: 2 }</text>
    <text x="24" y="126" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">Правка через любую из них видна обеим</text>

    <text x="330" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">Object.assign({}, a) — второй объект</text>
    <rect x="340" y="34" width="70" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="53" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">a</text>
    <rect x="340" y="70" width="70" height="28" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="375" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">copy</text>
    <path d="M 410 48 L 486 48" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 494 48 L 482 43 L 482 53 Z" fill="#10b981"/>
    <path d="M 410 84 L 486 84" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 494 84 L 482 79 L 482 89 Z" fill="#10b981"/>
    <rect x="498" y="32" width="96" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="546" y="53" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#047857">{ x: 1 }</text>
    <rect x="498" y="68" width="96" height="32" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="546" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#047857">{ x: 2 }</text>
    <text x="330" y="126" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#047857">Правки независимы</text>

    <text x="310" y="162" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Присваивание копирует ссылку, а не содержимое.</text>
    <text x="310" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Чтобы получить второй объект, копию делают явно.</text>
</svg>
