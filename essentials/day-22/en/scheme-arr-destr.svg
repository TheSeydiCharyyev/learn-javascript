<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-label="How the values of an array go to the variables">
    <text x="14" y="24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">On the right — an array</text>
    <rect x="200" y="10" width="70" height="30" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="235" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#047857">5</text>
    <rect x="280" y="10" width="70" height="30" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="315" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#047857">4</text>
    <rect x="360" y="10" width="70" height="30" rx="5" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
    <text x="395" y="30" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#94a3b8">3</text>

    <path d="M 235 42 L 235 76" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 235 84 L 230 72 L 240 72 Z" fill="#10b981"/>
    <path d="M 315 42 L 315 76" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 315 84 L 310 72 L 320 72 Z" fill="#10b981"/>
    <text x="440" y="60" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94a3b8">nobody took the third —</text>
    <text x="440" y="74" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#94a3b8">it just stays in the array</text>

    <text x="14" y="106" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">On the left — a pattern</text>
    <rect x="200" y="88" width="70" height="32" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="235" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0369a1">first</text>
    <rect x="280" y="88" width="70" height="32" rx="5" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="315" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0369a1">second</text>

    <text x="310" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#334155">const [first, second] = marks;</text>
    <text x="310" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">You make up the names, the array sets the order</text>
</svg>
