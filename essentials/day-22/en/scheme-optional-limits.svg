<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="How the chain breaks off with optional access">
    <text x="14" y="24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">With address</text>
    <rect x="120" y="10" width="110" height="28" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="175" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">student</text>
    <path d="M 230 24 L 258 24" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 266 24 L 254 19 L 254 29 Z" fill="#10b981"/>
    <rect x="270" y="10" width="110" height="28" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="325" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">.address?</text>
    <path d="M 380 24 L 408 24" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 416 24 L 404 19 L 404 29 Z" fill="#10b981"/>
    <rect x="420" y="10" width="86" height="28" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="1.5"/>
    <text x="463" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">.city</text>
    <text x="516" y="29" font-family="Consolas, monospace" font-size="11" fill="#065f46">"Mary"</text>

    <text x="14" y="84" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">No address</text>
    <rect x="120" y="70" width="110" height="28" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="175" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">student</text>
    <path d="M 230 84 L 258 84" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 266 84 L 254 79 L 254 89 Z" fill="#ef4444"/>
    <rect x="270" y="70" width="110" height="28" rx="5" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="325" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">.address?</text>
    <path d="M 380 84 L 470 84" fill="none" stroke="#fca5a5" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="420" y="70" width="86" height="28" rx="5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="463" y="89" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">.city</text>
    <text x="516" y="89" font-family="Consolas, monospace" font-size="11" fill="#991b1b">undefined</text>
    <text x="270" y="116" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">the sign fired — the whole rest of the chain is skipped</text>

    <rect x="14" y="134" width="592" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="28" y="154" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">That is why one sign is usually enough:</text>
    <text x="28" y="174" font-family="Consolas, monospace" font-size="11" fill="#475569">student.address?.city.length</text>
    <text x="260" y="174" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">— will not crash, although there is no sign after <tspan font-family="Consolas, monospace">city</tspan></text>
</svg>
