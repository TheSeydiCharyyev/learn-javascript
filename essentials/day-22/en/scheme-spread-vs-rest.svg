<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="Three dots collect in a declaration and spread out in a call">
    <rect x="14" y="14" width="284" height="92" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="156" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0369a1">IN A DECLARATION — collect</text>
    <text x="156" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0c4a6e">function f(...args)</text>
    <text x="156" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0c4a6e">const [a, ...rest] = arr</text>
    <text x="156" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">many values → one array</text>

    <rect x="322" y="14" width="284" height="92" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="464" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">IN A CALL AND A LITERAL — spread</text>
    <text x="464" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#065f46">f(...args)</text>
    <text x="464" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#065f46">[...arr]   { ...obj }</text>
    <text x="464" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">one array → many values</text>

    <text x="310" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">One and the same array goes there and back:</text>

    <rect x="60" y="146" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="120" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">5, 4, 3</text>
    <path d="M 184 161 L 240 161" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 248 161 L 236 156 L 236 166 Z" fill="#0ea5e9"/>
    <text x="216" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#0369a1">...args</text>

    <rect x="252" y="146" width="116" height="30" rx="5" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="310" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0369a1">[5, 4, 3]</text>

    <path d="M 372 161 L 428 161" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 436 161 L 424 156 L 424 166 Z" fill="#10b981"/>
    <text x="404" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#047857">...arr</text>

    <rect x="440" y="146" width="120" height="30" rx="5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="166" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">5, 4, 3</text>

    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Left of <tspan font-family="Consolas, monospace">=</tspan> or in the parentheses of a declaration — collect. Anywhere else — spread.</text>
</svg>
