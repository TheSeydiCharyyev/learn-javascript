<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="What is allowed in JSON and what is forbidden">
    <rect x="14" y="14" width="288" height="182" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="158" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">Allowed — six kinds of values</text>
    <text x="30" y="60" font-family="Consolas, monospace" font-size="11" fill="#065f46">{"name": "Aman"}</text>
    <text x="200" y="60" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">object</text>
    <text x="30" y="82" font-family="Consolas, monospace" font-size="11" fill="#065f46">[1, 2, 3]</text>
    <text x="200" y="82" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">array</text>
    <text x="30" y="104" font-family="Consolas, monospace" font-size="11" fill="#065f46">"text"</text>
    <text x="200" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">string</text>
    <text x="30" y="126" font-family="Consolas, monospace" font-size="11" fill="#065f46">42   4.5   -7</text>
    <text x="200" y="126" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">number</text>
    <text x="30" y="148" font-family="Consolas, monospace" font-size="11" fill="#065f46">true   false</text>
    <text x="200" y="148" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">yes and no</text>
    <text x="30" y="170" font-family="Consolas, monospace" font-size="11" fill="#065f46">null</text>
    <text x="200" y="170" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">empty</text>
    <text x="30" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#047857">And nothing else.</text>

    <rect x="318" y="14" width="288" height="182" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="462" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Not allowed — though fine in JavaScript</text>
    <text x="334" y="60" font-family="Consolas, monospace" font-size="11" fill="#991b1b">{name: 1}</text>
    <text x="470" y="60" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">a key without quotes</text>
    <text x="334" y="82" font-family="Consolas, monospace" font-size="11" fill="#991b1b">{'a': 1}</text>
    <text x="470" y="82" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">single quotes</text>
    <text x="334" y="104" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[1, 2, ]</text>
    <text x="470" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">a trailing comma</text>
    <text x="334" y="126" font-family="Consolas, monospace" font-size="11" fill="#991b1b">// comment</text>
    <text x="470" y="126" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">comments</text>
    <text x="334" y="148" font-family="Consolas, monospace" font-size="11" fill="#991b1b">undefined</text>
    <text x="470" y="148" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">and functions</text>
    <text x="334" y="170" font-family="Consolas, monospace" font-size="11" fill="#991b1b">NaN   Infinity</text>
    <text x="470" y="170" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">no such numbers</text>
    <text x="334" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">The first three cause almost all errors.</text>
</svg>
