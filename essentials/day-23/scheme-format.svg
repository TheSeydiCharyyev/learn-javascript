<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Что разрешено в JSON и что запрещено">
    <rect x="14" y="14" width="288" height="182" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="158" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">Можно — шесть видов значений</text>
    <text x="30" y="60" font-family="Consolas, monospace" font-size="11" fill="#065f46">{"name": "Аман"}</text>
    <text x="200" y="60" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">объект</text>
    <text x="30" y="82" font-family="Consolas, monospace" font-size="11" fill="#065f46">[1, 2, 3]</text>
    <text x="200" y="82" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">массив</text>
    <text x="30" y="104" font-family="Consolas, monospace" font-size="11" fill="#065f46">"текст"</text>
    <text x="200" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">строка</text>
    <text x="30" y="126" font-family="Consolas, monospace" font-size="11" fill="#065f46">42   4.5   -7</text>
    <text x="200" y="126" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">число</text>
    <text x="30" y="148" font-family="Consolas, monospace" font-size="11" fill="#065f46">true   false</text>
    <text x="200" y="148" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">да и нет</text>
    <text x="30" y="170" font-family="Consolas, monospace" font-size="11" fill="#065f46">null</text>
    <text x="200" y="170" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">пусто</text>
    <text x="30" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#047857">И больше ничего.</text>

    <rect x="318" y="14" width="288" height="182" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="462" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Нельзя — хотя в JavaScript можно</text>
    <text x="334" y="60" font-family="Consolas, monospace" font-size="11" fill="#991b1b">{name: 1}</text>
    <text x="470" y="60" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">ключ без кавычек</text>
    <text x="334" y="82" font-family="Consolas, monospace" font-size="11" fill="#991b1b">{'a': 1}</text>
    <text x="470" y="82" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">одинарные кавычки</text>
    <text x="334" y="104" font-family="Consolas, monospace" font-size="11" fill="#991b1b">[1, 2, ]</text>
    <text x="470" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">висячая запятая</text>
    <text x="334" y="126" font-family="Consolas, monospace" font-size="11" fill="#991b1b">// комментарий</text>
    <text x="470" y="126" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">комментарии</text>
    <text x="334" y="148" font-family="Consolas, monospace" font-size="11" fill="#991b1b">undefined</text>
    <text x="470" y="148" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">и функции</text>
    <text x="334" y="170" font-family="Consolas, monospace" font-size="11" fill="#991b1b">NaN   Infinity</text>
    <text x="470" y="170" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">таких чисел нет</text>
    <text x="334" y="188" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">Первые три — причина почти всех ошибок.</text>
</svg>
