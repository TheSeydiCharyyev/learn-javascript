<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Круг превращения объекта в строку и обратно">
    <rect x="24" y="58" width="150" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="99" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#047857">Объект</text>
    <text x="99" y="100" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">в памяти программы</text>

    <path d="M 178 76 L 250 76" fill="none" stroke="#0ea5e9" stroke-width="2"/>
    <path d="M 258 76 L 246 71 L 246 81 Z" fill="#0ea5e9"/>
    <text x="218" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0369a1">stringify</text>

    <rect x="262" y="58" width="176" height="56" rx="8" fill="#f0f9ff" stroke="#0ea5e9" stroke-width="2"/>
    <text x="350" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#0369a1">Строка</text>
    <text x="350" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#0c4a6e">{"name":"Аман","age":17}</text>

    <path d="M 442 96 L 514 96" fill="none" stroke="#10b981" stroke-width="2"/>
    <path d="M 522 96 L 510 91 L 510 101 Z" fill="#10b981"/>
    <text x="482" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#047857">parse</text>

    <rect x="446" y="20" width="150" height="56" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="521" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#047857">Снова объект</text>
    <text x="521" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#065f46">но уже другой</text>

    <text x="310" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Строку можно сохранить в файл, отправить на сервер, положить в браузер.</text>
    <text x="310" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Объект — нельзя: он существует только внутри работающей программы.</text>
</svg>
