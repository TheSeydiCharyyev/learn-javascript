<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 224" role="img" aria-label="closest climbs from the element to its ancestors and returns the first one that fits">
    <defs>
        <marker id="d24-arrow-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle">
        <rect x="30" y="10" width="170" height="26" rx="5" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="115" y="27" fill="#5b21b6">html</text>
        <rect x="30" y="52" width="170" height="26" rx="5" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="115" y="69" fill="#5b21b6">body</text>
        <rect x="30" y="94" width="170" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="115" y="111" fill="#5b21b6">main</text>
        <rect x="30" y="136" width="170" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
        <text x="115" y="153" fill="#5b21b6">ul#list</text>
        <rect x="30" y="178" width="170" height="26" rx="5" fill="#8b5cf6"/>
        <text x="115" y="195" fill="#ffffff">li.student.absent</text>
    </g>
    <g stroke="#a78bfa" stroke-width="1.5">
        <path d="M 115 178 L 115 164" marker-end="url(#d24-arrow-c)"/>
        <path d="M 115 136 L 115 122" marker-end="url(#d24-arrow-c)"/>
        <path d="M 115 94 L 115 80" marker-end="url(#d24-arrow-c)"/>
        <path d="M 115 52 L 115 38" marker-end="url(#d24-arrow-c)"/>
    </g>

    <g font-family="Consolas, monospace" font-size="10.5" fill="#334155">
        <path d="M 250 191 L 206 191" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d24-arrow-c)"/>
        <text x="256" y="195">closest(".student") — the element itself</text>
        <path d="M 250 149 L 206 149" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d24-arrow-c)"/>
        <text x="256" y="153">closest("ul") — one step up</text>
        <path d="M 250 107 L 206 107" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d24-arrow-c)"/>
        <text x="256" y="111">closest("main") — two steps</text>
        <text x="256" y="27" fill="#991b1b">closest("footer") — reached the top: null</text>
    </g>
    <text x="256" y="62" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">The check goes from the bottom up and stops</text>
    <text x="256" y="78" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">at the first match. closest does not look down.</text>
</svg>
