<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="Одна и та же строка через textContent и через innerHTML">
    <text x="310" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">const name = "&lt;i&gt;Аман&lt;/i&gt;";</text>

    <rect x="14" y="38" width="286" height="118" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="157" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#047857">p.textContent = name</text>
    <rect x="34" y="72" width="246" height="40" rx="4" fill="#ffffff" stroke="#a7f3d0"/>
    <text x="157" y="97" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0f172a">&lt;i&gt;Аман&lt;/i&gt;</text>
    <text x="157" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">строка показана как есть — безопасно</text>

    <rect x="320" y="38" width="286" height="118" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="463" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">p.innerHTML = name</text>
    <rect x="340" y="72" width="246" height="40" rx="4" fill="#ffffff" stroke="#fecaca"/>
    <text x="463" y="97" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-style="italic" fill="#0f172a">Аман</text>
    <text x="463" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">строка стала разметкой: сегодня курсив,</text>
    <text x="463" y="148" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">завтра — чужой код</text>

    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#475569">Данные — через textContent. innerHTML — только для своих строк.</text>
</svg>
