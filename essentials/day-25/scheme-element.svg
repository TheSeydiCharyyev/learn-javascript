<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 246" role="img" aria-label="Родословная пункта списка: Node, Element, HTMLElement, HTMLLIElement и что даёт каждый уровень">
    <defs>
        <marker id="d25-up" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="20" y="8" width="170" height="30" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="105" y="27" fill="#475569">EventTarget</text>
        <rect x="20" y="52" width="170" height="30" rx="6" fill="#f5f3ff" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="105" y="71" fill="#5b21b6">Node</text>
        <rect x="20" y="96" width="170" height="30" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="105" y="115" fill="#5b21b6">Element</text>
        <rect x="20" y="140" width="170" height="30" rx="6" fill="#ddd6fe" stroke="#8b5cf6" stroke-width="1.5"/>
        <text x="105" y="159" fill="#5b21b6">HTMLElement</text>
        <rect x="20" y="184" width="170" height="30" rx="6" fill="#8b5cf6"/>
        <text x="105" y="203" fill="#ffffff">HTMLLIElement</text>
    </g>
    <g stroke="#8b5cf6" stroke-width="1.5">
        <path d="M 105 184 L 105 173" marker-end="url(#d25-up)"/>
        <path d="M 105 140 L 105 129" marker-end="url(#d25-up)"/>
        <path d="M 105 96 L 105 85" marker-end="url(#d25-up)"/>
        <path d="M 105 52 L 105 41" marker-end="url(#d25-up)"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">
        <text x="208" y="27" fill="#64748b">события — день 27</text>
        <text x="208" y="71">textContent, parentNode, childNodes…</text>
        <text x="208" y="115">innerHTML, id, className, classList, атрибуты, querySelector, closest</text>
        <text x="208" y="159">innerText, style, dataset, hidden</text>
        <text x="208" y="203">свойства своего тега; у ссылки такой уровень даёт href</text>
    </g>
    <text x="20" y="238" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Текстовый узел доходит только до Node: classList и style у него нет — он не элемент.</text>
</svg>
