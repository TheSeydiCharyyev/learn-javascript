<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Атрибуты тега и отражающие их свойства элемента">
    <g font-family="Consolas, monospace" font-size="12">
        <text x="20" y="30" fill="#334155">&lt;li</text>
        <text x="52" y="30" fill="#6d28d9">id="s2"</text>
        <text x="112" y="30" fill="#0369a1">class="student absent"</text>
        <text x="276" y="30" fill="#047857">data-id="2"</text>
        <text x="360" y="30" fill="#b45309">hidden</text>
        <text x="408" y="30" fill="#334155">&gt;Мерет&lt;/li&gt;</text>
    </g>
    <g stroke-width="1.5" fill="none">
        <path d="M 77 38 L 59 70" stroke="#8b5cf6"/>
        <path d="M 185 38 L 150 70" stroke="#0ea5e9"/>
        <path d="M 185 38 L 222 70" stroke="#0ea5e9"/>
        <path d="M 312 38 L 318 70" stroke="#10b981"/>
        <path d="M 382 38 L 418 70" stroke="#f59e0b"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle">
        <rect x="24" y="70" width="70" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/>
        <text x="59" y="87" fill="#6d28d9">el.id</text>
        <rect x="104" y="70" width="92" height="26" rx="5" fill="#f0f9ff" stroke="#0ea5e9"/>
        <text x="150" y="87" fill="#0369a1">className</text>
        <rect x="202" y="70" width="84" height="26" rx="5" fill="#f0f9ff" stroke="#0ea5e9"/>
        <text x="244" y="87" fill="#0369a1">classList</text>
        <rect x="292" y="70" width="104" height="26" rx="5" fill="#ecfdf5" stroke="#10b981"/>
        <text x="344" y="87" fill="#047857">dataset.id</text>
        <rect x="404" y="70" width="84" height="26" rx="5" fill="#fffbeb" stroke="#f59e0b"/>
        <text x="446" y="87" fill="#b45309">el.hidden</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="59" y="114">"s2"</text>
        <text x="150" y="114">"student absent"</text>
        <text x="244" y="114">список классов</text>
        <text x="344" y="114">"2" — строка</text>
        <text x="446" y="114">true / false</text>
    </g>
    <rect x="20" y="136" width="580" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="310" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">getAttribute("…")   setAttribute("…", …)   hasAttribute   removeAttribute</text>
    <text x="310" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">работают с любым атрибутом, всегда строками</text>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Имя свойства не всегда совпадает с атрибутом: class — className, data-group-name — dataset.groupName</text>
</svg>
