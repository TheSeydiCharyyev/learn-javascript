<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="The build order: create from the top down, attach from the bottom up, insert once">
    <defs>
        <marker id="d26-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
        <marker id="d26-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#10b981"/>
        </marker>
    </defs>
    <text x="120" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">1. Create from the top down</text>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="70" y="32" width="100" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="120" y="49" fill="#5b21b6">li</text>
        <rect x="20" y="92" width="90" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/><text x="65" y="109" fill="#5b21b6">b</text>
        <rect x="130" y="92" width="90" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/><text x="175" y="109" fill="#5b21b6">span</text>
    </g>
    <text x="120" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">three separate objects</text>
    <text x="120" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">fill each one with text</text>

    <path d="M 236 90 L 280 90" stroke="#8b5cf6" stroke-width="2" marker-end="url(#d26-b)"/>

    <text x="400" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#5b21b6">2. Attach from the bottom up</text>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="350" y="32" width="100" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="400" y="49" fill="#5b21b6">li</text>
        <rect x="300" y="92" width="90" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/><text x="345" y="109" fill="#5b21b6">b</text>
        <rect x="410" y="92" width="90" height="26" rx="5" fill="#f5f3ff" stroke="#8b5cf6"/><text x="455" y="109" fill="#5b21b6">span</text>
    </g>
    <path d="M 345 90 L 385 62" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-b)"/>
    <path d="M 455 90 L 415 62" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-b)"/>
    <text x="400" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6d28d9">li.append(name, marks)</text>

    <path d="M 400 150 L 400 170 L 548 170 L 548 64" stroke="#10b981" stroke-width="2" fill="none" marker-end="url(#d26-g)"/>
    <rect x="508" y="32" width="100" height="26" rx="5" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="558" y="49" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#047857">#list</text>
    <text x="474" y="188" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#047857">3. onto the page — once</text>
</svg>
