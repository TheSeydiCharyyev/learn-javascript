<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Четыре места вставки: before, prepend, append, after">
    <defs>
        <marker id="d26-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <rect x="170" y="14" width="200" height="28" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="4 3"/>
    <text x="270" y="33" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#6d28d9">новый сосед сверху</text>

    <rect x="170" y="54" width="200" height="120" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="184" y="72" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">&lt;ul id="list"&gt;</text>
    <rect x="190" y="80" width="160" height="22" rx="4" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="4 3"/>
    <text x="270" y="95" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6d28d9">новый первый ребёнок</text>
    <rect x="190" y="106" width="160" height="20" rx="4" fill="#ede9fe" stroke="#8b5cf6"/>
    <text x="270" y="120" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Аман … Огулджан</text>
    <rect x="190" y="130" width="160" height="22" rx="4" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="4 3"/>
    <text x="270" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6d28d9">новый последний ребёнок</text>
    <text x="184" y="167" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">&lt;/ul&gt;</text>

    <rect x="170" y="184" width="200" height="28" rx="5" fill="#ffffff" stroke="#a78bfa" stroke-dasharray="4 3"/>
    <text x="270" y="203" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#6d28d9">новый сосед снизу</text>

    <g font-family="Consolas, monospace" font-size="12" fill="#334155">
        <path d="M 470 28 L 376 28" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-a)"/>
        <text x="478" y="32">list.before(…)</text>
        <path d="M 470 91 L 356 91" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-a)"/>
        <text x="478" y="95">list.prepend(…)</text>
        <path d="M 470 141 L 356 141" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-a)"/>
        <text x="478" y="145">list.append(…)</text>
        <path d="M 470 198 L 376 198" stroke="#8b5cf6" stroke-width="1.5" marker-end="url(#d26-a)"/>
        <text x="478" y="202">list.after(…)</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b" text-anchor="end">
        <text x="156" y="32">снаружи</text>
        <text x="156" y="95">внутри</text>
        <text x="156" y="145">внутри</text>
        <text x="156" y="202">снаружи</text>
    </g>
</svg>
