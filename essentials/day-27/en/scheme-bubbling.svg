<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="The three phases of an event: capturing from the top down, the target, bubbling from the bottom up">
    <defs>
        <marker id="d27-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a3b8"/>
        </marker>
        <marker id="d27-v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="235" y="8" width="150" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="310" y="24" fill="#475569">window</text>
        <rect x="235" y="40" width="150" height="24" rx="5" fill="#f1f5f9" stroke="#94a3b8"/><text x="310" y="56" fill="#475569">document</text>
        <rect x="235" y="72" width="150" height="24" rx="5" fill="#f5f3ff" stroke="#a78bfa"/><text x="310" y="88" fill="#5b21b6">html</text>
        <rect x="235" y="104" width="150" height="24" rx="5" fill="#f5f3ff" stroke="#a78bfa"/><text x="310" y="120" fill="#5b21b6">body</text>
        <rect x="235" y="136" width="150" height="24" rx="5" fill="#f5f3ff" stroke="#a78bfa"/><text x="310" y="152" fill="#5b21b6">main</text>
        <rect x="235" y="168" width="150" height="24" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="310" y="184" fill="#5b21b6">ul#list</text>
        <rect x="235" y="200" width="150" height="24" rx="5" fill="#8b5cf6"/><text x="310" y="216" fill="#ffffff">li — the target</text>
    </g>
    <path d="M 215 16 L 215 206" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#d27-a)"/>
    <path d="M 405 206 L 405 20" stroke="#8b5cf6" stroke-width="2.5" marker-end="url(#d27-v)"/>
    <g font-family="Segoe UI, sans-serif" font-size="11.5">
        <text x="200" y="100" text-anchor="end" fill="#475569" font-weight="700">1. Capturing</text>
        <text x="200" y="118" text-anchor="end" fill="#64748b">from the top down</text>
        <text x="200" y="136" text-anchor="end" fill="#64748b">heard only</text>
        <text x="200" y="152" text-anchor="end" fill="#64748b">with { capture: true }</text>
        <text x="420" y="100" fill="#6d28d9" font-weight="700">3. Bubbling</text>
        <text x="420" y="118" fill="#475569">from the bottom up</text>
        <text x="420" y="136" fill="#475569">almost all listeners</text>
        <text x="420" y="152" fill="#475569">work here</text>
        <text x="310" y="244" text-anchor="middle" fill="#334155">2. Target: the event came to the element that was clicked</text>
    </g>
</svg>
