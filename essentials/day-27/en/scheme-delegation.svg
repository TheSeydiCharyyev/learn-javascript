<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Delegation: one listener on the list catches clicks on all the items">
    <defs>
        <marker id="d27-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <rect x="30" y="14" width="300" height="172" rx="8" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="46" y="36" font-family="Consolas, monospace" font-size="11.5" fill="#5b21b6">ul#list — one listener here</text>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#334155">
        <rect x="50" y="48" width="260" height="22" rx="4" fill="#ffffff" stroke="#c4b5fd"/><text x="180" y="63">Aman</text>
        <rect x="50" y="74" width="260" height="22" rx="4" fill="#ffffff" stroke="#c4b5fd"/><text x="180" y="89">Meret</text>
        <rect x="50" y="100" width="260" height="22" rx="4" fill="#8b5cf6"/><text x="180" y="115" fill="#ffffff">Gülnar — clicked here</text>
        <rect x="50" y="126" width="260" height="22" rx="4" fill="#ffffff" stroke="#c4b5fd"/><text x="180" y="141">Sapar</text>
        <rect x="50" y="152" width="260" height="22" rx="4" fill="#ffffff" stroke="#c4b5fd"/><text x="180" y="167">Ilýas — added by code later</text>
    </g>
    <path d="M 312 111 C 350 111, 350 30, 336 30" stroke="#8b5cf6" stroke-width="2" fill="none" marker-end="url(#d27-d)"/>
    <g font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">
        <text x="372" y="62">the event bubbled up to ul</text>
        <text x="372" y="92"><tspan font-family="Consolas, monospace" fill="#6d28d9">target</tspan> — the item Gülnar</text>
        <text x="372" y="112"><tspan font-family="Consolas, monospace" fill="#6d28d9">currentTarget</tspan> — ul</text>
        <text x="372" y="142">the new item Ilýas is</text>
        <text x="372" y="160">served too: the listener</text>
        <text x="372" y="178">hangs on the parent</text>
    </g>
</svg>
