<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 150" role="img" aria-label="The loading order: parsing HTML, defer scripts, DOMContentLoaded, images, load">
    <defs>
        <marker id="d27-t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
        </marker>
    </defs>
    <path d="M 20 60 L 600 60" stroke="#64748b" stroke-width="2" marker-end="url(#d27-t)"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <rect x="24" y="40" width="130" height="40" rx="6" fill="#f5f3ff" stroke="#a78bfa"/>
        <text x="89" y="57" fill="#5b21b6">parsing HTML</text><text x="89" y="72" fill="#64748b">the tree is built</text>
        <rect x="166" y="40" width="120" height="40" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
        <text x="226" y="57" fill="#5b21b6">defer scripts</text><text x="226" y="72" fill="#64748b">our app.js</text>
        <rect x="298" y="40" width="134" height="40" rx="6" fill="#8b5cf6"/>
        <text x="365" y="64" fill="#ffffff">DOMContentLoaded</text>
        <rect x="444" y="40" width="94" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
        <text x="491" y="57" fill="#475569">images,</text><text x="491" y="72" fill="#475569">styles</text>
        <rect x="548" y="40" width="50" height="40" rx="6" fill="#10b981"/>
        <text x="573" y="64" fill="#ffffff">load</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="89" y="104">"loading"</text>
        <text x="296" y="104">"interactive"</text>
        <text x="573" y="104">"complete"</text>
    </g>
    <text x="310" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Below — the value of document.readyState in each stretch</text>
