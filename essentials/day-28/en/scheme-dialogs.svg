<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 176" role="img" aria-label="Three dialogs and what they return">
    <g font-family="Segoe UI, sans-serif">
        <rect x="14" y="14" width="186" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="107" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">alert("Saved")</text>
        <rect x="34" y="50" width="146" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="107" y="70" text-anchor="middle" font-size="11" fill="#334155">Saved   [OK]</text>
        <text x="107" y="106" text-anchor="middle" font-size="11" fill="#475569">returns</text>
        <text x="107" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6d28d9">undefined</text>

        <rect x="217" y="14" width="186" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="310" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">confirm("Delete?")</text>
        <rect x="237" y="50" width="146" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="310" y="70" text-anchor="middle" font-size="11" fill="#334155">Delete? [OK] [Cancel]</text>
        <text x="310" y="106" text-anchor="middle" font-size="11" fill="#475569">OK — Cancel</text>
        <text x="310" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6d28d9">true — false</text>

        <rect x="420" y="14" width="186" height="130" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="513" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">prompt("Name?", "Guest")</text>
        <rect x="440" y="50" width="146" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
        <text x="513" y="70" text-anchor="middle" font-size="11" fill="#334155">[Guest      ] [OK] [Cancel]</text>
        <text x="513" y="106" text-anchor="middle" font-size="11" fill="#475569">text — empty — Cancel</text>
        <text x="513" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#6d28d9">"Ilýas" — "" — null</text>
    </g>
    <text x="310" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">While the window is open, the page and the code stand still and wait for an answer</text>
</svg>
