<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="When a word is typed, input comes on every letter, and change comes once, when the field has lost focus">
    <defs>
        <marker id="d28-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#64748b"/>
        </marker>
    </defs>
    <text x="20" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">We type “Ilýas”, then leave the field (Tab or a click elsewhere)</text>
    <path d="M 20 80 L 600 80" stroke="#64748b" stroke-width="2" marker-end="url(#d28-a)"/>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle">
        <rect x="30" y="40" width="70" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="65" y="57" fill="#5b21b6">"I"</text>
        <rect x="110" y="40" width="70" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="145" y="57" fill="#5b21b6">"Il"</text>
        <rect x="190" y="40" width="70" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="225" y="57" fill="#5b21b6">"Ilý"</text>
        <rect x="270" y="40" width="70" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="305" y="57" fill="#5b21b6">"Ilýa"</text>
        <rect x="350" y="40" width="80" height="26" rx="5" fill="#ede9fe" stroke="#8b5cf6"/><text x="390" y="57" fill="#5b21b6">"Ilýas"</text>
        <rect x="470" y="94" width="110" height="26" rx="5" fill="#8b5cf6"/><text x="525" y="111" fill="#ffffff">change "Ilýas"</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="30" y="110">input — on every letter: five times</text>
        <text x="470" y="140">change — once,</text>
        <text x="470" y="156">on leaving the field</text>
    </g>
    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">For a checkbox both events come at once on a click: first input, then change</text>
</svg>
