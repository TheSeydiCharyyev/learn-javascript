<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Submitting a form with and without preventDefault">
    <defs>
        <marker id="d28-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#8b5cf6"/>
        </marker>
    </defs>
    <rect x="20" y="70" width="130" height="50" rx="8" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="85" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#5b21b6">A click or Enter</text>
    <text x="85" y="109" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">submit</text>
    <path d="M 154 88 L 214 44" stroke="#8b5cf6" stroke-width="2" marker-end="url(#d28-b)"/>
    <path d="M 154 104 L 214 150" stroke="#8b5cf6" stroke-width="2" marker-end="url(#d28-b)"/>

    <rect x="220" y="14" width="380" height="64" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="236" y="36" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">Without preventDefault</text>
    <text x="236" y="54" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">the browser sends the data and loads the page anew:</text>
    <text x="236" y="70" font-family="Consolas, monospace" font-size="10.5" fill="#991b1b">?name=…&amp;marks=5+4+5&amp;present=on&amp;group=JS-1 — all wiped</text>

    <rect x="220" y="122" width="380" height="64" rx="8" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="236" y="144" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#047857">With event.preventDefault()</text>
    <text x="236" y="162" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">the page stays in place, the data is in the fields,</text>
    <text x="236" y="178" font-family="Segoe UI, sans-serif" font-size="11" fill="#047857">then our code works: check, add, clear</text>
</svg>
