<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="A loop: an action changes the data, render builds the page from the data">
    <defs>
        <marker id="d29-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <rect x="30" y="80" width="160" height="60" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="110" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Data</text>
    <text x="110" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#854d0e">tasks, filter</text>

    <rect x="230" y="14" width="160" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="310" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#854d0e">render()</text>
    <text x="310" y="57" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">builds the page anew</text>

    <rect x="430" y="80" width="160" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="510" y="105" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">The page</text>
    <text x="510" y="124" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">what the person sees</text>

    <rect x="230" y="150" width="160" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="310" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Listeners</text>
    <text x="310" y="193" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">change the data</text>

    <path d="M 150 78 C 170 40, 200 40, 226 42" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d29-a)"/>
    <path d="M 394 42 C 430 42, 460 50, 490 76" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d29-a)"/>
    <path d="M 490 144 C 460 172, 430 178, 394 178" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d29-a)"/>
    <path d="M 226 178 C 190 178, 160 170, 140 144" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d29-a)"/>
    <text x="482" y="184" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">a click, Enter</text>
    <text x="140" y="44" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">after every</text>
    <text x="140" y="58" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">change</text>
</svg>
