<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 130" role="img" aria-label="Путь от элемента к объекту: closest li, dataset.id, Number, find">
    <defs>
        <marker id="d29-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle">
        <rect x="10" y="40" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="60" y="64" fill="#334155">✕ или ☑</text>
        <rect x="140" y="40" width="100" height="40" rx="6" fill="#f1f5f9" stroke="#94a3b8"/><text x="190" y="64" fill="#334155">&lt;li&gt;</text>
        <rect x="270" y="40" width="80" height="40" rx="6" fill="#fef2f2" stroke="#ef4444"/><text x="310" y="64" fill="#991b1b">"2"</text>
        <rect x="380" y="40" width="80" height="40" rx="6" fill="#fefce8" stroke="#eab308"/><text x="420" y="64" fill="#854d0e">2</text>
        <rect x="490" y="40" width="120" height="40" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="550" y="64" fill="#854d0e">{ id: 2, … }</text>
    </g>
    <g stroke="#a16207" stroke-width="1.5">
        <path d="M 112 60 L 136 60" marker-end="url(#d29-c)"/>
        <path d="M 242 60 L 266 60" marker-end="url(#d29-c)"/>
        <path d="M 352 60 L 376 60" marker-end="url(#d29-c)"/>
        <path d="M 462 60 L 486 60" marker-end="url(#d29-c)"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10" fill="#a16207" text-anchor="middle">
        <text x="124" y="30">closest("li")</text>
        <text x="254" y="100">dataset.id</text>
        <text x="364" y="30">Number</text>
        <text x="474" y="100">find</text>
    </g>
    <text x="310" y="124" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">Строка "2" из разметки и число 2 из данных не равны: без Number связь рвётся</text>
</svg>
