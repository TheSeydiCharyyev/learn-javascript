<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Из объекта задачи makeItem строит пункт списка с флажком, текстом и кнопкой">
    <defs>
        <marker id="d29-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <rect x="14" y="40" width="200" height="90" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="30" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#854d0e">{ id: 1,</text>
    <text x="44" y="84" font-family="Consolas, monospace" font-size="11.5" fill="#854d0e">text: "Повторить…",</text>
    <text x="44" y="104" font-family="Consolas, monospace" font-size="11.5" fill="#854d0e">done: true }</text>
    <path d="M 220 85 L 262 85" stroke="#a16207" stroke-width="2" marker-end="url(#d29-b)"/>
    <text x="241" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#a16207">makeItem</text>

    <rect x="270" y="24" width="336" height="122" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="286" y="46" font-family="Consolas, monospace" font-size="11" fill="#475569">&lt;li data-id="1" class="done"&gt;</text>
    <rect x="290" y="58" width="80" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="330" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#334155">☑ input</text>
    <rect x="378" y="58" width="140" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="448" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b" text-decoration="line-through">Повторить день 26</text>
    <rect x="526" y="58" width="66" height="30" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="559" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#334155">✕ .delete</text>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
        <text x="330" y="106">checked ← done</text>
        <text x="448" y="106">textContent ← text</text>
        <text x="559" y="106">удалить</text>
    </g>
    <text x="286" y="134" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">data-id ← id, класс done ← done: так пункт помнит своё дело</text>
</svg>
