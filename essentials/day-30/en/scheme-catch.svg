<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="The chain then, then, catch, finally: on success the value goes through then, on an error straight to catch, finally always runs">
    <defs>
        <marker id="d30-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4338ca"/>
        </marker>
        <marker id="d30-d" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dc2626"/>
        </marker>
        <marker id="d30-e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#16a34a"/>
        </marker>
    </defs>
    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
        <rect x="10" y="50" width="96" height="40" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="58" y="75" fill="#3730a3">promise</text>
        <rect x="136" y="50" width="96" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="184" y="75" fill="#166534">then</text>
        <rect x="262" y="50" width="96" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="310" y="75" fill="#166534">then</text>
        <rect x="388" y="50" width="96" height="40" rx="8" fill="#fef2f2" stroke="#dc2626"/><text x="436" y="75" fill="#991b1b">catch</text>
        <rect x="514" y="50" width="96" height="40" rx="8" fill="#ffffff" stroke="#4338ca"/><text x="562" y="75" fill="#3730a3">finally</text>
    </g>
    <g stroke="#16a34a" stroke-width="2">
        <path d="M 108 70 L 132 70" marker-end="url(#d30-e)"/>
        <path d="M 234 70 L 258 70" marker-end="url(#d30-e)"/>
    </g>
    <path d="M 360 64 C 420 20, 480 20, 530 46" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#d30-e)"/>
    <path d="M 486 70 L 510 70" stroke="#4338ca" stroke-width="2" marker-end="url(#d30-c)"/>
    <path d="M 58 92 C 90 150, 420 150, 470 94" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#d30-d)"/>
    <path d="M 310 92 C 330 110, 380 112, 402 96" stroke="#dc2626" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#d30-d)"/>
    <text x="200" y="22" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">success: the value goes from step to step, catch is skipped</text>
    <text x="240" y="160" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">an error: the remaining then steps are skipped</text>
</svg>
