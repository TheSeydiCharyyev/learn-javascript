<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="setTimeout puts the function off for later, the code goes on, the function fires a second later">
    <defs>
        <marker id="d30-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4338ca"/>
        </marker>
    </defs>
    <rect x="20" y="20" width="270" height="104" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="34" y="42" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">now: the code from top to bottom</text>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">
        <text x="34" y="66">console.log("1: before")</text>
        <text x="34" y="88">setTimeout(…, 1000)</text>
        <text x="34" y="110">console.log("2: after")</text>
    </g>
    <rect x="400" y="52" width="200" height="56" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
    <text x="500" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3730a3">after 1000 ms</text>
    <text x="500" y="96" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">console.log("3: timer")</text>
    <path d="M 292 84 L 396 80" stroke="#4338ca" stroke-width="2" stroke-dasharray="6 4" fill="none" marker-end="url(#d30-a)"/>
    <text x="346" y="58" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">put it off</text>
    <text x="346" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">for later</text>
    <path d="M 30 160 L 596 160" stroke="#94a3b8" stroke-width="2" marker-end="url(#d30-a)"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="34" y="180">0 ms</text>
        <text x="500" y="180" text-anchor="middle">1000 ms</text>
        <text x="590" y="150" text-anchor="end">time</text>
    </g>
    <text x="310" y="202" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">in the console: 1: before → 2: after → 3: timer</text>
</svg>
