<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="localStorage is shared by all the tabs of one server address, every tab has its own sessionStorage">
    <rect x="10" y="10" width="600" height="196" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="26" y="34" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#334155">http://127.0.0.1:5500 — one server address (origin)</text>
    <rect x="30" y="50" width="560" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="310" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#3730a3">localStorage</text>
    <text x="310" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">one for all the tabs and all the projects of this address; lives until deleted</text>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <rect x="30" y="110" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
        <text x="115" y="130" fill="#334155" font-weight="700">tab 1: group</text>
        <text x="115" y="152" fill="#4338ca" font-family="Consolas, monospace">sessionStorage</text>
        <rect x="225" y="110" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
        <text x="310" y="130" fill="#334155" font-weight="700">tab 2: group</text>
        <text x="310" y="152" fill="#4338ca" font-family="Consolas, monospace">sessionStorage</text>
        <rect x="420" y="110" width="170" height="64" rx="8" fill="#ffffff" stroke="#94a3b8"/>
        <text x="505" y="130" fill="#334155" font-weight="700">tab 3: todo</text>
        <text x="505" y="152" fill="#4338ca" font-family="Consolas, monospace">sessionStorage</text>
    </g>
    <text x="310" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">every tab has its own sessionStorage: close the tab — and it is gone</text>
</svg>
