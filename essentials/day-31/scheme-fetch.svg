<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Страница отправляет запрос, Live Server отвечает статусом и телом, fetch даёт Response, json даёт данные">
    <defs>
        <marker id="d31-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#4338ca"/>
        </marker>
    </defs>
    <rect x="20" y="20" width="170" height="70" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text x="105" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3730a3">страница</text>
    <text x="105" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#3730a3">fetch("group.json")</text>
    <rect x="430" y="20" width="170" height="70" rx="10" fill="#ffffff" stroke="#4338ca" stroke-width="2"/>
    <text x="515" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3730a3">Live Server</text>
    <text x="515" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#475569">127.0.0.1:5500</text>
    <path d="M 194 40 L 426 40" stroke="#4338ca" stroke-width="2" marker-end="url(#d31-a)"/>
    <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">запрос: дай group.json</text>
    <path d="M 426 72 L 194 72" stroke="#16a34a" stroke-width="2" marker-end="url(#d31-a)"/>
    <text x="310" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">ответ: статус 200 + тело (строка JSON)</text>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="20" y="130" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="95" y="157" fill="#334155">fetch(адрес)</text>
        <rect x="235" y="130" width="150" height="44" rx="8" fill="#f1f5f9" stroke="#94a3b8"/><text x="310" y="157" fill="#334155">Response</text>
        <rect x="450" y="130" width="150" height="44" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="525" y="157" fill="#3730a3">данные</text>
    </g>
    <path d="M 172 152 L 231 152" stroke="#4338ca" stroke-width="2" marker-end="url(#d31-a)"/>
    <path d="M 387 152 L 446 152" stroke="#4338ca" stroke-width="2" marker-end="url(#d31-a)"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569" text-anchor="middle">
        <text x="202" y="194">промис 1:</text><text x="202" y="206">статус пришёл</text>
        <text x="417" y="194">промис 2: json()</text><text x="417" y="206">тело прочитано</text>
    </g>
</svg>
