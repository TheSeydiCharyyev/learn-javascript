<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="makeCard builds a card from a book object: a heading, a line with the author and a favorites button">
    <defs>
        <marker id="d32-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <rect x="10" y="26" width="206" height="118" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="11" fill="#854d0e">
        <text x="22" y="48">{ id: 5,</text>
        <text x="36" y="68">title: "The Hobbit",</text>
        <text x="36" y="88">author: "John Tolkien",</text>
        <text x="36" y="108">year: 1937,</text>
        <text x="36" y="128">genre: "fantasy" }</text>
    </g>
    <path d="M 222 85 L 262 85" stroke="#a16207" stroke-width="2" marker-end="url(#d32-b)"/>
    <text x="242" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#a16207">makeCard</text>
    <rect x="270" y="14" width="340" height="142" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="284" y="34" font-family="Consolas, monospace" font-size="11" fill="#475569">&lt;li class="card" data-id="5"&gt;</text>
    <rect x="286" y="44" width="200" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="296" y="62" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">The Hobbit</text>
    <rect x="286" y="76" width="200" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="296" y="94" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">John Tolkien, 1937 · fantasy</text>
    <rect x="286" y="108" width="120" height="26" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="296" y="126" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">☆ to favorites</text>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="496" y="62">← title</text>
        <text x="496" y="94">← author, year, genre</text>
        <text x="416" y="126">← is id in favorites</text>
    </g>
    <text x="284" y="150" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">data-id ← id: this is how the card remembers its book</text>
</svg>
