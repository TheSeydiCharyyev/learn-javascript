    </defs>
    <rect x="14" y="16" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="89" y="37" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">catalog.json</text>
    <text x="89" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">сервер</text>
    <rect x="14" y="170" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="89" y="191" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">localStorage</text>
    <text x="89" y="209" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">избранное</text>

    <rect x="220" y="70" width="170" height="106" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="305" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Данные</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#854d0e" text-anchor="middle">
        <text x="305" y="113">books, favorites</text>
        <text x="305" y="133">query, genre</text>
        <text x="305" y="153">onlyFavorites</text>
    </g>

    <rect x="450" y="92" width="156" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="528" y="117" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">Страница</text>
    <text x="528" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">карточки, счётчик</text>

    <path d="M 166 44 C 200 50, 214 70, 232 76" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d32-a)"/>
    <text x="176" y="28" font-family="Consolas, monospace" font-size="10.5" fill="#a16207">load(): fetch</text>
    <path d="M 166 190 C 196 186, 212 176, 230 170" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d32-a)"/>
    <text x="120" y="240" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">читаем при старте, пишем в render</text>
    <path d="M 392 110 L 446 118" stroke="#a16207" stroke-width="2" marker-end="url(#d32-a)"/>
    <text x="419" y="100" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#a16207">render()</text>
    <path d="M 528 154 C 520 214, 400 222, 350 180" stroke="#a16207" stroke-width="2" fill="none" marker-end="url(#d32-a)"/>
    <text x="470" y="226" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">слушатели меняют данные</text>
