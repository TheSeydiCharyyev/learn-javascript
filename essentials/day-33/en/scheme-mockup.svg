<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="The mockup of the page: a heading, topic buttons, a card with a word, the I know and Again buttons, a counter, a Start over button">
    <rect x="10" y="10" width="330" height="280" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="30" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#334155">Word cards</text>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <rect x="30" y="54" width="46" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="53" y="70" fill="#334155" font-weight="700">all</text>
        <rect x="82" y="54" width="58" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="111" y="70" fill="#334155">school</text>
        <rect x="146" y="54" width="50" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="171" y="70" fill="#334155">food</text>
        <rect x="202" y="54" width="52" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="228" y="70" fill="#334155">home</text>
    </g>
    <rect x="30" y="92" width="290" height="100" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="175" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#334155">book</text>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="30" y="206" width="80" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="70" y="225" fill="#334155">I know</text>
        <rect x="118" y="206" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="168" y="225" fill="#334155">Again</text>
    </g>
    <text x="30" y="256" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Learned: 0 of 8</text>
    <rect x="30" y="264" width="130" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="95" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Start over</text>

    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <path d="M 260 66 L 360 66" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="62">topic buttons — from the data,</text>
        <text x="366" y="76">like the genres on day 32</text>
        <path d="M 322 142 L 360 142" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="138">the card: the word; on a click —</text>
        <text x="366" y="152">the translation (flipped)</text>
        <path d="M 222 220 L 360 220" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="216">“I know” — into learned and storage;</text>
        <text x="366" y="230">“Again” — the next card</text>
        <path d="M 130 252 L 360 262" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="266">the counter and “Start over” —</text>
        <text x="366" y="280">from the data and storage</text>
    </g>
</svg>
