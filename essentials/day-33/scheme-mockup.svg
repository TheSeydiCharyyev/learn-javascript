<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Макет страницы: заголовок, кнопки тем, карточка со словом, кнопки Знаю и Повторить, счётчик, кнопка Начать сначала">
    <rect x="10" y="10" width="330" height="280" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text x="30" y="40" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#334155">Карточки слов</text>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <rect x="30" y="54" width="46" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="53" y="70" fill="#334155" font-weight="700">все</text>
        <rect x="82" y="54" width="56" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="110" y="70" fill="#334155">школа</text>
        <rect x="144" y="54" width="46" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="167" y="70" fill="#334155">еда</text>
        <rect x="196" y="54" width="46" height="24" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="219" y="70" fill="#334155">дом</text>
    </g>
    <rect x="30" y="92" width="290" height="100" rx="12" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="175" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="26" fill="#334155">book</text>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="30" y="206" width="80" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="70" y="225" fill="#334155">Знаю</text>
        <rect x="118" y="206" width="100" height="28" rx="4" fill="#f1f5f9" stroke="#94a3b8"/><text x="168" y="225" fill="#334155">Повторить</text>
    </g>
    <text x="30" y="256" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Выучено: 0 из 8</text>
    <rect x="30" y="264" width="130" height="20" rx="4" fill="#f1f5f9" stroke="#94a3b8"/>
    <text x="95" y="278" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Начать сначала</text>

    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <path d="M 248 66 L 360 66" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="62">кнопки тем — из данных,</text>
        <text x="366" y="76">как жанры на дне 32</text>
        <path d="M 322 142 L 360 142" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="138">карточка: слово; по щелчку —</text>
        <text x="366" y="152">перевод (flipped)</text>
        <path d="M 222 220 L 360 220" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="216">«Знаю» — в learned и хранилище;</text>
        <text x="366" y="230">«Повторить» — следующая карточка</text>
        <path d="M 130 252 L 360 262" stroke="#a16207" stroke-dasharray="4 3"/>
        <text x="366" y="266">счётчик и «Начать сначала» —</text>
        <text x="366" y="280">из данных и хранилища</text>
    </g>
</svg>
