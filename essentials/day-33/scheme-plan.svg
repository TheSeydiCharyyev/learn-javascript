<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 190" role="img" aria-label="Четыре дня итогового проекта: 33 план и первый шаг, 34 возможности, 35 доработка, 36 защита">
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">
        <rect x="10" y="14" width="140" height="162" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="80" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">День 33</text>
        <text x="22" y="60">замысел, таблица</text><text x="22" y="78">данные и проверки</text><text x="22" y="96">макет, рама</text><text x="22" y="114">каркас, deck</text><text x="22" y="132">первое слово</text><text x="22" y="150">план задач</text>

        <rect x="163" y="14" width="140" height="162" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="233" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">День 34</text>
        <text x="175" y="60">переворот</text><text x="175" y="78">«Знаю», «Повторить»</text><text x="175" y="96">кнопки тем</text><text x="175" y="114">сохранение</text><text x="175" y="132">«Начать сначала»</text>

        <rect x="316" y="14" width="140" height="162" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="386" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">День 35</text>
        <text x="328" y="60">телефон</text><text x="328" y="78">крайние случаи</text><text x="328" y="96">из списка «потом»</text><text x="328" y="114">чужой код</text>

        <rect x="469" y="14" width="140" height="162" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="539" y="36" text-anchor="middle" font-size="13" font-weight="700" fill="#854d0e">День 36</text>
        <text x="481" y="60">показ по таблице</text><text x="481" y="78">возможностей</text><text x="481" y="96">разбор решений</text><text x="481" y="114">вопросы</text>
    </g>
</svg>
