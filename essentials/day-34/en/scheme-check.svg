<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="The transitions of a card: the word and the translation on a click; I know and Again lead to the next word; an empty deck — all learned; Start over — the first word again">
    <defs>
        <marker id="d34-c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="20" y="60" width="130" height="56" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="85" y="84" font-size="13" font-weight="700" fill="#854d0e">word</text><text x="85" y="104" font-size="10.5" fill="#475569">flipped = false</text>
        <rect x="240" y="60" width="130" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="305" y="84" font-size="13" font-weight="700" fill="#854d0e">translation</text><text x="305" y="104" font-size="10.5" fill="#475569">flipped = true</text>
        <rect x="460" y="60" width="140" height="56" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="530" y="84" font-size="12.5" font-weight="700" fill="#166534">all learned</text><text x="530" y="104" font-size="10.5" fill="#475569">current() === null</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 152 78 L 236 78" marker-end="url(#d34-c)"/>
        <path d="M 238 100 L 154 100" marker-end="url(#d34-c)"/>
        <path d="M 55 58 C 55 24, 115 24, 115 54" marker-end="url(#d34-c)"/>
        <path d="M 305 118 C 305 146, 110 146, 100 122" marker-end="url(#d34-c)"/>
        <path d="M 372 88 L 456 88" marker-end="url(#d34-c)"/>
        <path d="M 530 118 C 530 196, 50 196, 50 122" stroke-dasharray="5 4" marker-end="url(#d34-c)"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="194" y="72" text-anchor="middle">click</text>
        <text x="194" y="114" text-anchor="middle">click</text>
        <text x="130" y="24">“I know”, “Again” — the next word</text>
        <text x="318" y="140">“I know”, “Again”:</text>
        <text x="318" y="153">flipped = false</text>
        <text x="414" y="72" text-anchor="middle">the last</text>
        <text x="414" y="84" text-anchor="middle">“I know”</text>
        <text x="290" y="196" text-anchor="middle">“Start over”</text>
    </g>
</svg>
