<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="The cycle of a task: take a task, write code, check it; if it does not work — ask the data; if it works — mark it and take the next one">
    <defs>
        <marker id="d34-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="10" y="30" width="130" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="75" y="52" fill="#854d0e" font-weight="700">take a task</text><text x="75" y="70" fill="#475569" font-size="10.5">first in the plan</text>
        <rect x="170" y="30" width="130" height="50" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="235" y="52" fill="#854d0e" font-weight="700">code</text><text x="235" y="70" fill="#475569" font-size="10.5">replace the stub</text>
        <rect x="330" y="30" width="130" height="50" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="395" y="52" fill="#854d0e" font-weight="700">check</text><text x="395" y="70" fill="#475569" font-size="10.5">by hand + console</text>
        <rect x="490" y="30" width="120" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="550" y="52" fill="#166534" font-weight="700">mark it</text><text x="550" y="70" fill="#475569" font-size="10.5">plan + minutes</text>
        <rect x="330" y="130" width="130" height="50" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <text x="395" y="152" fill="#991b1b" font-weight="700">ask the data</text><text x="395" y="170" fill="#475569" font-size="10.5">console, #error</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 142 55 L 166 55" marker-end="url(#d34-a)"/>
        <path d="M 302 55 L 326 55" marker-end="url(#d34-a)"/>
        <path d="M 462 55 L 486 55" marker-end="url(#d34-a)"/>
        <path d="M 550 82 C 550 110, 120 110, 75 84" marker-end="url(#d34-a)"/>
    </g>
    <path d="M 395 82 L 395 126" stroke="#dc2626" stroke-width="2" fill="none" marker-end="url(#d34-a)"/>
    <path d="M 328 155 C 250 160, 240 120, 235 84" stroke="#dc2626" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#d34-a)"/>
    <text x="404" y="112" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">does not work</text>
    <text x="160" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">the next task</text>
</svg>
