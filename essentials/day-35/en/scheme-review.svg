<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Three passes of reading someone else’s code: run it and go through the scenario, make a map of the code, follow one action; every symptom becomes a remark">
    <defs>
        <marker id="d35-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <rect x="10" y="20" width="175" height="80" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="97" y="42" font-size="13" font-weight="700" fill="#854d0e">1. run it</text>
        <text x="97" y="62" fill="#475569">follow the scenario,</text><text x="97" y="78" fill="#475569">write down symptoms</text>
        <rect x="222" y="20" width="175" height="80" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="309" y="42" font-size="13" font-weight="700" fill="#854d0e">2. a map</text>
        <text x="309" y="62" fill="#475569">data, functions,</text><text x="309" y="78" fill="#475569">listeners</text>
        <rect x="434" y="20" width="176" height="80" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="522" y="42" font-size="13" font-weight="700" fill="#854d0e">3. one action</text>
        <text x="522" y="62" fill="#475569">from the click</text><text x="522" y="78" fill="#475569">to screen and storage</text>
        <rect x="160" y="138" width="300" height="50" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="310" y="159" font-size="12.5" font-weight="700" fill="#166534">a remark</text>
        <text x="310" y="177" fill="#475569">where · what I did · what I saw · what I expected</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 187 60 L 218 60" marker-end="url(#d35-a)"/>
        <path d="M 399 60 L 430 60" marker-end="url(#d35-a)"/>
        <path d="M 97 102 C 97 150, 120 160, 156 162" marker-end="url(#d35-a)"/>
        <path d="M 309 102 L 309 134" marker-end="url(#d35-a)"/>
        <path d="M 522 102 C 522 150, 500 160, 464 162" marker-end="url(#d35-a)"/>
    </g>
</svg>
