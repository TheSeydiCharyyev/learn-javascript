<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Shuffling the array 1 2 3 4: i is 3, j is 1, the swap gives 1 4 3 2; i is 2, j is 2, no change; i is 1, j is 0, we get 4 1 3 2; the tail on the right is already in place">
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="10" y="38">start</text>
        <text x="10" y="88">i = 3, j = 1</text>
        <text x="10" y="138">i = 2, j = 2</text>
        <text x="10" y="188">i = 1, j = 0</text>
    </g>
    <g font-family="Consolas, monospace" font-size="15" text-anchor="middle">
        <rect x="120" y="18" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="140" y="39">1</text>
        <rect x="160" y="18" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="180" y="39">2</text>
        <rect x="200" y="18" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="220" y="39">3</text>
        <rect x="240" y="18" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="260" y="39">4</text>

        <rect x="120" y="68" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="140" y="89">1</text>
        <rect x="160" y="68" width="40" height="30" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="180" y="89">4</text>
        <rect x="200" y="68" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="220" y="89">3</text>
        <rect x="240" y="68" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="260" y="89">2</text>

        <rect x="120" y="118" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="140" y="139">1</text>
        <rect x="160" y="118" width="40" height="30" fill="#ffffff" stroke="#94a3b8"/><text x="180" y="139">4</text>
        <rect x="200" y="118" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="220" y="139">3</text>
        <rect x="240" y="118" width="40" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="260" y="139">2</text>

        <rect x="120" y="168" width="40" height="30" fill="#fefce8" stroke="#eab308" stroke-width="2"/><text x="140" y="189">4</text>
        <rect x="160" y="168" width="40" height="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="180" y="189">1</text>
        <rect x="200" y="168" width="40" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="220" y="189">3</text>
        <rect x="240" y="168" width="40" height="30" fill="#dcfce7" stroke="#16a34a"/><text x="260" y="189">2</text>
    </g>
    <g stroke="#a16207" stroke-width="1.5" fill="none">
        <path d="M 180 66 C 180 56, 260 56, 260 66"/>
        <path d="M 140 166 C 140 156, 180 156, 180 166"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="305" y="88">places 3 and 1 swapped</text>
        <text x="305" y="138">j equals i — place 2 stays as it is</text>
        <text x="305" y="188">places 1 and 0 swapped — done</text>
        <text x="305" y="38">the green cells are not touched again</text>
    </g>
</svg>
