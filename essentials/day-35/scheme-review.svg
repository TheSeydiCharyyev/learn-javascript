<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Три прохода чтения чужого кода: запустить и пройти сценарий, составить карту кода, проследить одно действие; каждый симптом превращается в замечание">
