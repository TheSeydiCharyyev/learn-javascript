<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Без строки viewport страница строится шириной 980 и сжимается до 360, всё мелкое; со строкой страница строится шириной 360, размеры обычные">
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <text x="150" y="18" font-size="13" font-weight="700" fill="#991b1b">без строки viewport</text>
        <text x="470" y="18" font-size="13" font-weight="700" fill="#166534">со строкой viewport</text>
        <rect x="85" y="30" width="130" height="200" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
        <rect x="95" y="46" width="110" height="168" fill="#fef2f2" stroke="#fca5a5"/>
        <text x="150" y="60" font-size="6.5" font-weight="700" fill="#334155">Карточки слов</text>
        <rect x="100" y="66" width="100" height="18" rx="3" fill="#ffffff" stroke="#eab308"/>
        <text x="150" y="78" font-size="6" fill="#334155">book</text>
        <rect x="100" y="88" width="14" height="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
        <rect x="116" y="88" width="22" height="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
        <text x="150" y="130" font-size="10.5" fill="#991b1b">страница 980</text>
        <text x="150" y="145" font-size="10.5" fill="#991b1b">сжата в 360</text>
        <text x="150" y="160" font-size="10.5" fill="#991b1b">всё в 2,7 раза мельче</text>
        <rect x="405" y="30" width="130" height="200" rx="16" fill="#ffffff" stroke="#475569" stroke-width="2"/>
        <rect x="415" y="46" width="110" height="168" fill="#f0fdf4" stroke="#86efac"/>
        <text x="470" y="70" font-size="13" font-weight="700" fill="#334155">Карточки</text>
        <rect x="422" y="80" width="96" height="46" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
        <text x="470" y="108" font-size="14" fill="#334155">book</text>
        <rect x="422" y="136" width="38" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
        <text x="441" y="149" font-size="9" fill="#334155">Знаю</text>
        <rect x="464" y="136" width="54" height="18" rx="3" fill="#e2e8f0" stroke="#94a3b8"/>
        <text x="491" y="149" font-size="9" fill="#334155">Повторить</text>
        <text x="470" y="180" font-size="10.5" fill="#166534">страница 360</text>
        <text x="470" y="195" font-size="10.5" fill="#166534">размеры обычные</text>
    </g>
    <path d="M 250 130 L 370 130" stroke="#a16207" stroke-width="2" fill="none"/>
    <path d="M 362 124 L 372 130 L 362 136" stroke="#a16207" stroke-width="2" fill="none"/>
    <text x="310" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#854d0e">&lt;meta name="viewport"&gt;</text>
    <text x="310" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">innerWidth: 980 → 360</text>
</svg>
