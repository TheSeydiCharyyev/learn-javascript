<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Three kinds of questions: where — show the place in the code; what if — check in the console; why not — name the reason or honestly postpone">
    <defs>
        <marker id="d36-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="10" y="14" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="36" font-size="13" font-weight="700" fill="#854d0e">“Where …?”</text>
        <text x="115" y="53" font-size="10.5" fill="#475569">where saved, where the topic</text>
        <rect x="10" y="76" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="98" font-size="13" font-weight="700" fill="#854d0e">“What if …?”</text>
        <text x="115" y="115" font-size="10.5" fill="#475569">one number twice, two tabs</text>
        <rect x="10" y="138" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="160" font-size="13" font-weight="700" fill="#854d0e">“Why not …?”</text>
        <text x="115" y="177" font-size="10.5" fill="#475569">why numbers and not words</text>
        <rect x="360" y="14" width="250" height="48" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="485" y="36" font-size="12.5" font-weight="700" fill="#854d0e">show the place in the code</text>
        <text x="485" y="53" font-size="10.5" fill="#475569">open the file, do not retell it</text>
        <rect x="360" y="76" width="250" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="485" y="98" font-size="12.5" font-weight="700" fill="#166534">check in the console</text>
        <text x="485" y="115" font-size="10.5" fill="#475569">do not guess: do it and look</text>
        <rect x="360" y="138" width="250" height="48" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="485" y="160" font-size="12.5" font-weight="700" fill="#854d0e">name the reason</text>
        <text x="485" y="177" font-size="10.5" fill="#475569">or honestly: “not checked — into ‘later’”</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 222 38 L 356 38" marker-end="url(#d36-a)"/>
        <path d="M 222 100 L 356 100" marker-end="url(#d36-a)"/>
        <path d="M 222 162 L 356 162" marker-end="url(#d36-a)"/>
    </g>
</svg>
