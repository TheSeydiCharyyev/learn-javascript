<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Восемь модулей курса и где каждый работает в Карточках: инструменты в проверках, синтаксис в данных, условия и циклы в перемешивании и try, функции в deck и current, строки и Math в счётчике и shuffle, массивы и JSON в колоде и хранилище, DOM и события в render и слушателях, fetch и хранилище в загрузке">
    <g font-family="Segoe UI, sans-serif" font-size="11">
        <g fill="#fefce8" stroke="#eab308" stroke-width="1.5">
            <rect x="10" y="10" width="190" height="24" rx="5"/><rect x="10" y="40" width="190" height="24" rx="5"/>
            <rect x="10" y="70" width="190" height="24" rx="5"/><rect x="10" y="100" width="190" height="24" rx="5"/>
            <rect x="10" y="130" width="190" height="24" rx="5"/><rect x="10" y="160" width="190" height="24" rx="5"/>
            <rect x="10" y="190" width="190" height="24" rx="5"/><rect x="10" y="220" width="190" height="24" rx="5"/>
        </g>
        <g fill="#854d0e">
            <text x="20" y="26">E1 инструменты</text><text x="20" y="56">E2 синтаксис и операторы</text>
            <text x="20" y="86">E3 условия и циклы</text><text x="20" y="116">E4 функции</text>
            <text x="20" y="146">E5 строки, числа, Math</text><text x="20" y="176">E6 массивы, объекты, JSON</text>
            <text x="20" y="206">E7 DOM и события</text><text x="20" y="236">E8 fetch и хранилище</text>
        </g>
        <g stroke="#a16207" stroke-width="1.5">
            <path d="M 202 22 L 268 22"/><path d="M 202 52 L 268 52"/><path d="M 202 82 L 268 82"/><path d="M 202 112 L 268 112"/>
            <path d="M 202 142 L 268 142"/><path d="M 202 172 L 268 172"/><path d="M 202 202 L 268 202"/><path d="M 202 232 L 268 232"/>
        </g>
        <g fill="#334155" font-family="Consolas, monospace" font-size="10.5">
            <text x="274" y="26">console.assert в checkData, testDeck, testCurrent</text>
            <text x="274" y="56">let/const, ===, ??, тернарный оператор в render</text>
            <text x="274" y="86">for в shuffle, try...catch в readLearned и load</text>
            <text x="274" y="116">deck, current, render — функции с одной работой</text>
            <text x="274" y="146">`Выучено: ${…}`, Math.floor(Math.random() …)</text>
            <text x="274" y="176">filter, some, includes; JSON.parse / stringify</text>
            <text x="274" y="206">querySelector, textContent, hidden, closest</text>
            <text x="274" y="236">await fetch, response.ok, localStorage</text>
        </g>
    </g>
</svg>
