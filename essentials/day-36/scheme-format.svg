<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Семь минут защиты: фраза полминуты, показ три минуты, решение минута, ошибка минута, вопросы полторы минуты">
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="10" y="40" width="40" height="56" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <rect x="50" y="40" width="240" height="56" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <rect x="290" y="40" width="80" height="56" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <rect x="370" y="40" width="80" height="56" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <rect x="450" y="40" width="160" height="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="30" y="73" font-size="11" fill="#854d0e">фраза</text>
        <text x="170" y="66" font-size="13" font-weight="700" fill="#854d0e">показ по сценарию</text>
        <text x="170" y="84" font-size="10.5" fill="#475569">на телефоне, действие → что видно</text>
        <text x="330" y="66" font-size="12" font-weight="700" fill="#854d0e">решение</text>
        <text x="330" y="84" font-size="10.5" fill="#475569">почему так</text>
        <text x="410" y="66" font-size="12" font-weight="700" fill="#991b1b">ошибка</text>
        <text x="410" y="84" font-size="10.5" fill="#475569">как нашли</text>
        <text x="530" y="66" font-size="12" font-weight="700" fill="#166534">вопросы</text>
        <text x="530" y="84" font-size="10.5" fill="#475569">первый — от проверяющего</text>
        <g font-size="10.5" fill="#475569">
            <text x="10" y="116">0</text><text x="50" y="116">0:30</text><text x="290" y="116">3:30</text>
            <text x="370" y="116">4:30</text><text x="450" y="116">5:30</text><text x="605" y="116">7:00</text>
        </g>
        <text x="310" y="24" font-size="12" fill="#475569">польза — сначала, устройство — потом, время на вопросы — гарантировано</text>
        <text x="310" y="150" font-size="11" fill="#475569">хронометрист поднимает руку на границе каждой части</text>
    </g>
</svg>
