<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" role="img" aria-label="Три вложенные области: весь скрипт, вызов outer, вызов inner; имя ищется изнутри наружу">
    <rect x="10" y="10" width="600" height="200" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="26" y="32" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">весь скрипт</text>
    <text x="26" y="50" font-family="Consolas, monospace" font-size="12" fill="#334155">mark = 5&#160;&#160;&#160;outer</text>

    <rect x="26" y="62" width="400" height="136" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="42" y="84" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">вызов outer()</text>
    <text x="42" y="102" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">student = "Сапар"&#160;&#160;&#160;inner</text>

    <rect x="42" y="114" width="250" height="72" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="58" y="136" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">вызов inner()</text>
    <text x="58" y="154" font-family="Consolas, monospace" font-size="12" fill="#166534">mark = 4</text>
    <text x="58" y="176" font-family="Consolas, monospace" font-size="12" fill="#0f172a">console.log(student, mark)</text>

    <text x="446" y="84" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">ищем student:</text>
    <text x="446" y="104" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">1. inner — нет</text>
    <text x="446" y="122" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">2. outer — нашли</text>
    <text x="446" y="152" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">ищем mark:</text>
    <text x="446" y="172" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">1. inner — нашли, 4</text>
    <text x="446" y="190" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">до 5 снаружи не дошли</text>

    <rect x="10" y="222" width="600" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Имя ищется изнутри наружу — по тому, как вложен текст программы.</text>
    <text x="310" y="255" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Первая находка побеждает; не нашли нигде — ReferenceError.</text>
</svg>
