<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-label="Две функции-счётчика, у каждой своё окружение вызова makeCounter со своей count; оба окружения ссылаются наружу на окружение всего скрипта">
    <rect x="60" y="16" width="180" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="150" y="41" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">функция a</text>
    <rect x="380" y="16" width="180" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="470" y="41" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">функция b</text>

    <path d="M 150 56 L 150 104" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 150 110 L 146 100 L 154 100 Z" fill="#3b82f6"/>
    <path d="M 470 56 L 470 104" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 470 110 L 466 100 L 474 100 Z" fill="#3b82f6"/>
    <text x="160" y="88" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">[[Environment]]</text>
    <text x="480" y="88" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">[[Environment]]</text>

    <rect x="40" y="112" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="150" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">первый вызов makeCounter()</text>
    <text x="150" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">count = 4</text>
    <rect x="360" y="112" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="470" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">второй вызов makeCounter()</text>
    <text x="470" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">count = 1</text>

    <path d="M 150 168 L 150 194" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 150 200 L 146 190 L 154 190 Z" fill="#94a3b8"/>
    <path d="M 470 168 L 470 194" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 470 200 L 466 190 L 474 190 Z" fill="#94a3b8"/>
    <text x="160" y="188" font-family="Consolas, monospace" font-size="11" fill="#64748b">[[OuterEnv]]</text>
    <text x="480" y="188" font-family="Consolas, monospace" font-size="11" fill="#64748b">[[OuterEnv]]</text>

    <rect x="40" y="202" width="540" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="223" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">весь скрипт: makeCounter, a, b</text>

    <rect x="40" y="246" width="540" height="36" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="269" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">Два вызова — две записи окружения. a и b не знают о счётчиках друг друга.</text>
</svg>
