<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="С var три колбэка ссылаются на одну переменную i, равную 4; с let каждый колбэк ссылается на свою j со значениями 1, 2, 3">
    <text x="150" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#991b1b">var i</text>
    <text x="470" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#166534">let j</text>

    <rect x="20" y="34" width="110" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="75" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">колбэк 1</text>
    <rect x="20" y="78" width="110" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="75" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">колбэк 2</text>
    <rect x="20" y="122" width="110" height="30" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="75" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">колбэк 3</text>
    <path d="M 132 49 L 196 85" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 132 93 L 196 93" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <path d="M 132 137 L 196 101" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="198" y="73" width="96" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="246" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#991b1b">i = 4</text>
    <text x="157" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">одна переменная на весь цикл</text>

    <rect x="340" y="34" width="110" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="395" y="54" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">колбэк 1</text>
    <rect x="340" y="78" width="110" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="395" y="98" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">колбэк 2</text>
    <rect x="340" y="122" width="110" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="395" y="142" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">колбэк 3</text>
    <path d="M 452 49 L 498 49" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M 452 93 L 498 93" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <path d="M 452 137 L 498 137" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="500" y="34" width="96" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="548" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">j = 1</text>
    <rect x="500" y="78" width="96" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="548" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">j = 2</text>
    <rect x="500" y="122" width="96" height="30" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="548" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#166534">j = 3</text>
    <text x="468" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">на каждый проход — своя j</text>

    <rect x="20" y="196" width="580" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Когда таймеры срабатывают, циклы уже закончились: i давно равна 4.</text>
    <text x="310" y="232" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">С let каждый проход получает свою запись окружения — колбэк помнит свою j.</text>
</svg>
