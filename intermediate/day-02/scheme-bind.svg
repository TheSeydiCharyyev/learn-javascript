<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="bind создаёт новую функцию, которая помнит this и при любом вызове вызывает исходную функцию с ним">
    <rect x="20" y="20" width="170" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="105" y="47" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#92400e">card.show</text>

    <path d="M 192 42 L 252 42" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 260 42 L 250 38 L 250 46 Z" fill="#94a3b8"/>
    <text x="222" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#64748b">.bind(card)</text>

    <rect x="262" y="12" width="200" height="94" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="362" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">новая функция showCard</text>
    <text x="278" y="58" font-family="Consolas, monospace" font-size="11.5" fill="#166534">[[BoundTargetFunction]]</text>
    <text x="300" y="74" font-family="Consolas, monospace" font-size="11.5" fill="#475569">= card.show</text>
    <text x="278" y="94" font-family="Consolas, monospace" font-size="11.5" fill="#166534">[[BoundThis]] = card</text>

    <path d="M 362 106 L 362 140" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 362 148 L 358 138 L 366 138 Z" fill="#94a3b8"/>
    <rect x="262" y="150" width="200" height="30" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="362" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">setTimeout(showCard)</text>

    <text x="478" y="48" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">кто бы ни вызвал —</text>
    <text x="478" y="66" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">таймер, кнопка,</text>
    <text x="478" y="84" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">forEach, — внутри</text>
    <text x="478" y="102" font-family="Consolas, monospace" font-size="11.5" fill="#166534">this = card</text>

    <rect x="20" y="190" width="580" height="24" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="207" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">bind не вызывает функцию — он делает новую, с this, закреплённым навсегда.</text>
</svg>
