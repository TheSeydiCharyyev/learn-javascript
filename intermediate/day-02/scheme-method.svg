<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Одна функция describe и три вызова: через aman, через meret и без точки; в каждом свой this">
    <rect x="220" y="14" width="180" height="40" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="39" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#92400e">function describe</text>

    <path d="M 260 54 L 120 96" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 310 54 L 310 96" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 360 54 L 500 96" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

    <rect x="20" y="98" width="190" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="115" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">aman.describe()</text>
    <rect x="215" y="98" width="190" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#1d4ed8">meret.describe()</text>
    <rect x="410" y="98" width="190" height="40" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="505" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#991b1b">describe()</text>

    <text x="115" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">this = aman</text>
    <text x="310" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#166534">this = meret</text>
    <text x="505" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#991b1b">this = глобальный объект</text>

    <rect x="20" y="180" width="580" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">this определяется в момент вызова — по тому, что стоит слева от точки.</text>
    <text x="310" y="213" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Нет точки — нет объекта: в обычном скрипте this станет глобальным объектом.</text>
</svg>
