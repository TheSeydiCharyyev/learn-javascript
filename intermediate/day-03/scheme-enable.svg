<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Где действует директива use strict: первой строкой файла — весь файл; первой строкой функции — только функция; не первой — нигде">
    <rect x="10" y="12" width="190" height="130" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="105" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">первой строкой файла</text>
    <text x="24" y="60" font-family="Consolas, monospace" font-size="11.5" fill="#166534">"use strict";</text>
    <text x="24" y="80" font-family="Consolas, monospace" font-size="11.5" fill="#334155">let a = 1;</text>
    <text x="24" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#334155">function f() { … }</text>
    <text x="105" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">строгий весь файл</text>

    <rect x="215" y="12" width="190" height="130" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">первой строкой функции</text>
    <text x="229" y="60" font-family="Consolas, monospace" font-size="11.5" fill="#334155">function f() {</text>
    <text x="243" y="80" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">"use strict";</text>
    <text x="243" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#334155">…</text>
    <text x="229" y="116" font-family="Consolas, monospace" font-size="11.5" fill="#334155">}</text>
    <text x="310" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#1d4ed8">строгая только f</text>

    <rect x="420" y="12" width="190" height="130" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="515" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#991b1b">не первой строкой</text>
    <text x="434" y="60" font-family="Consolas, monospace" font-size="11.5" fill="#334155">let a = 1;</text>
    <text x="434" y="80" font-family="Consolas, monospace" font-size="11.5" fill="#991b1b">"use strict";</text>
    <text x="434" y="100" font-family="Consolas, monospace" font-size="11.5" fill="#334155">totl = 5;</text>
    <text x="515" y="130" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">просто строка, режим обычный</text>

    <rect x="10" y="156" width="600" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Перед директивой можно ставить только комментарии и другие такие же строки-директивы.</text>
    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Модули (день 30) и классы (день 8) строгие всегда — директива там не нужна.</text>
    <text x="310" y="213" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Выключить строгий режим внутри строгого кода нельзя.</text>
</svg>
