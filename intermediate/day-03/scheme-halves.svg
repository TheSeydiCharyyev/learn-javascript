<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Глобальная запись окружения из двух частей: объектная — сам глобальный объект со встроенными именами, var и function; декларативная — let, const, class; globalThis видит только объектную">
    <rect x="10" y="10" width="600" height="168" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="32" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">глобальная запись окружения — верх цепочки дня 1</text>

    <rect x="26" y="44" width="280" height="122" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="166" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">объектная часть = глобальный объект</text>
    <text x="42" y="90" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">Math  JSON  undefined  NaN</text>
    <text x="42" y="110" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">document  alert  name</text>
    <text x="42" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">var a = 1;</text>
    <text x="42" y="150" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">function c() { }</text>

    <rect x="316" y="44" width="278" height="122" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text x="455" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#166534">декларативная часть</text>
    <text x="332" y="90" font-family="Consolas, monospace" font-size="11.5" fill="#166534">let b = 2;</text>
    <text x="332" y="110" font-family="Consolas, monospace" font-size="11.5" fill="#166534">const KEY = "cards:learned";</text>
    <text x="332" y="130" font-family="Consolas, monospace" font-size="11.5" fill="#166534">class Card { }</text>
    <text x="332" y="150" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">(классы — день 8)</text>

    <path d="M 166 214 L 166 172" fill="none" stroke="#f59e0b" stroke-width="2"/>
    <path d="M 166 168 L 162 178 L 170 178 Z" fill="#f59e0b"/>
    <rect x="96" y="214" width="140" height="28" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="166" y="233" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#92400e">globalThis</text>

    <text x="455" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">поиск имени из кода смотрит</text>
    <text x="455" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">в обе части; globalThis —</text>
    <text x="455" y="236" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">только в объектную</text>
</svg>
