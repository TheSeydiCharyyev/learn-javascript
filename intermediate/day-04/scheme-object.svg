<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Функция-объект: её можно вызвать; у неё есть внутренний слот Environment, свойства name и length, свои свойства и методы, полученные от Function.prototype">
    <rect x="200" y="14" width="220" height="176" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#92400e">функция greet</text>
    <text x="216" y="64" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">можно вызвать: greet("Аман")</text>
    <line x1="216" y1="76" x2="404" y2="76" stroke="#fcd34d" stroke-width="1"/>
    <text x="216" y="96" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">[[Environment]]</text>
    <text x="216" y="116" font-family="Consolas, monospace" font-size="11.5" fill="#334155">name = "greet"</text>
    <text x="216" y="136" font-family="Consolas, monospace" font-size="11.5" fill="#334155">length = 1</text>
    <text x="216" y="156" font-family="Consolas, monospace" font-size="11.5" fill="#166534">calls = 0</text>
    <text x="216" y="176" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">и prototype — день 7</text>

    <path d="M 198 92 L 150 92" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <rect x="14" y="70" width="134" height="44" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="81" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">окружение, где</text>
    <text x="81" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">создана (день 1)</text>

    <path d="M 198 152 L 150 152" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="14" y="132" width="134" height="40" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="81" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">своё свойство</text>

    <path d="M 422 112 L 470 112" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="472" y="64" width="134" height="96" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="539" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155">общие методы</text>
    <text x="488" y="104" font-family="Consolas, monospace" font-size="11" fill="#334155">call  apply</text>
    <text x="488" y="122" font-family="Consolas, monospace" font-size="11" fill="#334155">bind  toString</text>
    <text x="539" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">у всех функций</text>

    <rect x="14" y="204" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Функция — объект, который можно вызвать: свойства, окружение, общие методы.</text>
</svg>
