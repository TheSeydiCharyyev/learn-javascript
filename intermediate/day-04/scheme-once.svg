<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Вызов обёртки: обёртка проверяет своё состояние в замыкании и только при первом вызове передаёт аргументы и this исходной функции через apply">
    <rect x="14" y="56" width="120" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="74" y="81" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#1d4ed8">start("дом")</text>
    <path d="M 136 76 L 186 76" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 194 76 L 184 72 L 184 80 Z" fill="#94a3b8"/>

    <rect x="196" y="20" width="220" height="112" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="306" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">обёртка</text>
    <text x="212" y="66" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">замыкание:</text>
    <text x="212" y="84" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">done = true</text>
    <text x="212" y="102" font-family="Consolas, monospace" font-size="11.5" fill="#92400e">result = "еда"</text>
    <text x="212" y="122" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">уже вызывали — вернуть result</text>

    <path d="M 418 76 L 468 76" fill="none" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="470" y="56" width="136" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="538" y="81" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#64748b">fn.apply(this, …)</text>
    <text x="538" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">только в первый раз</text>

    <rect x="14" y="148" width="592" height="42" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Снаружи обёртка выглядит как исходная функция: те же аргументы, тот же this.</text>
    <text x="310" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Внутри — решает, звать ли исходную, по своему состоянию в замыкании.</text>
</svg>
