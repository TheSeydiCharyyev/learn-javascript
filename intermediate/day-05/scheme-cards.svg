<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Колода deck: learned и topic перечисляемые и попадают в JSON; cards, percent и служебное _topic скрыты; при загрузке Object.assign вызывает сеттер topic">
    <rect x="14" y="14" width="330" height="176" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="179" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#6b21a8">deck</text>
    <text x="30" y="66" font-family="Consolas, monospace" font-size="12" fill="#334155">learned</text>
    <text x="130" y="66" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">данные</text>
    <text x="246" y="66" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">в JSON</text>
    <text x="30" y="90" font-family="Consolas, monospace" font-size="12" fill="#334155">topic</text>
    <text x="130" y="90" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">get и set</text>
    <text x="246" y="90" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">в JSON</text>
    <line x1="30" y1="102" x2="328" y2="102" stroke="#d8b4fe" stroke-width="1"/>
    <text x="30" y="122" font-family="Consolas, monospace" font-size="12" fill="#64748b">cards</text>
    <text x="130" y="122" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">get</text>
    <text x="246" y="122" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">скрыто</text>
    <text x="30" y="146" font-family="Consolas, monospace" font-size="12" fill="#64748b">percent</text>
    <text x="130" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">get</text>
    <text x="246" y="146" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">скрыто</text>
    <text x="30" y="170" font-family="Consolas, monospace" font-size="12" fill="#64748b">_topic</text>
    <text x="130" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">данные</text>
    <text x="246" y="170" font-family="Segoe UI, sans-serif" font-size="11" fill="#94a3b8">скрыто</text>

    <path d="M 346 78 L 368 78" fill="none" stroke="#22c55e" stroke-width="2"/>
    <path d="M 376 78 L 366 74 L 366 82 Z" fill="#22c55e"/>
    <rect x="378" y="50" width="228" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="392" y="73" font-family="Consolas, monospace" font-size="11.5" fill="#166534">{"learned":[1,2,4],</text>
    <text x="392" y="92" font-family="Consolas, monospace" font-size="11.5" fill="#166534"> "topic":"еда"}</text>

    <rect x="378" y="122" width="228" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="492" y="145" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">загрузка: Object.assign</text>
    <text x="492" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">вызывает сеттер topic</text>

    <rect x="14" y="204" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="227" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Перечисляемое — то, что сохраняем. Вычисляемое и служебное спрятаны.</text>
</svg>
