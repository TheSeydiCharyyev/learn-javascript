<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" role="img" aria-label="Свойство greet.name изнутри: дескриптор со значением и тремя признаками; writable false — запись не сработает, enumerable false — перебор не видит, configurable true — удалить и переопределить можно">
    <rect x="14" y="96" width="116" height="40" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="72" y="121" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" fill="#6b21a8">greet.name</text>
    <path d="M 132 116 L 152 116" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 160 116 L 150 112 L 150 120 Z" fill="#94a3b8"/>

    <rect x="162" y="14" width="200" height="196" rx="12" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="262" y="38" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#92400e">дескриптор</text>
    <text x="180" y="76" font-family="Consolas, monospace" font-size="12" fill="#334155">value: "greet"</text>
    <line x1="178" y1="94" x2="346" y2="94" stroke="#fcd34d" stroke-width="1"/>
    <text x="180" y="116" font-family="Consolas, monospace" font-size="12" fill="#334155">writable: false</text>
    <line x1="178" y1="134" x2="346" y2="134" stroke="#fcd34d" stroke-width="1"/>
    <text x="180" y="156" font-family="Consolas, monospace" font-size="12" fill="#334155">enumerable: false</text>
    <line x1="178" y1="174" x2="346" y2="174" stroke="#fcd34d" stroke-width="1"/>
    <text x="180" y="196" font-family="Consolas, monospace" font-size="12" fill="#334155">configurable: true</text>

    <path d="M 364 72 L 392 72" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="394" y="56" width="212" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="500" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">чтение отдаёт это значение</text>

    <path d="M 364 112 L 392 112" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="394" y="96" width="212" height="32" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">запись = не сработает</text>

    <path d="M 364 152 L 392 152" fill="none" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="394" y="136" width="212" height="32" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">keys, for...in, JSON не видят</text>

    <path d="M 364 192 L 392 192" fill="none" stroke="#22c55e" stroke-width="1.5"/>
    <rect x="394" y="176" width="212" height="32" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="500" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">delete и defineProperty — можно</text>

    <rect x="14" y="226" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="248" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Свойство — значение и три признака. Каждый инструмент языка смотрит на свой.</text>
</svg>
