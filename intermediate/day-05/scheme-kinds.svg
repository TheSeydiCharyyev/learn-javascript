<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="Два вида свойств. Свойство-данные: value, writable, enumerable, configurable; чтение отдаёт value, запись меняет value, если writable. Свойство-аксессор: get, set, enumerable, configurable; чтение вызывает get, запись вызывает set">
    <rect x="14" y="14" width="286" height="196" rx="12" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="157" y="38" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#334155">свойство-данные</text>
    <text x="157" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#64748b">_mark: 5</text>
    <line x1="30" y1="72" x2="284" y2="72" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="94" font-family="Consolas, monospace" font-size="12" fill="#334155">value: 5</text>
    <text x="30" y="112" font-family="Consolas, monospace" font-size="12" fill="#334155">writable: true</text>
    <text x="30" y="130" font-family="Consolas, monospace" font-size="12" fill="#7e22ce">enumerable: true</text>
    <text x="30" y="148" font-family="Consolas, monospace" font-size="12" fill="#7e22ce">configurable: true</text>
    <line x1="30" y1="160" x2="284" y2="160" stroke="#cbd5e1" stroke-width="1"/>
    <text x="30" y="180" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">чтение → отдать value</text>
    <text x="30" y="198" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">запись → новое value, если writable</text>

    <rect x="320" y="14" width="286" height="196" rx="12" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="463" y="38" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700" fill="#6b21a8">свойство-аксессор</text>
    <text x="463" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#64748b">get mark() / set mark(v)</text>
    <line x1="336" y1="72" x2="590" y2="72" stroke="#d8b4fe" stroke-width="1"/>
    <text x="336" y="94" font-family="Consolas, monospace" font-size="12" fill="#334155">get: ƒ</text>
    <text x="336" y="112" font-family="Consolas, monospace" font-size="12" fill="#334155">set: ƒ</text>
    <text x="336" y="130" font-family="Consolas, monospace" font-size="12" fill="#7e22ce">enumerable: true</text>
    <text x="336" y="148" font-family="Consolas, monospace" font-size="12" fill="#7e22ce">configurable: true</text>
    <line x1="336" y1="160" x2="590" y2="160" stroke="#d8b4fe" stroke-width="1"/>
    <text x="336" y="180" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#6b21a8">чтение → вызвать get()</text>
    <text x="336" y="198" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#6b21a8">запись → вызвать set(значение)</text>

    <rect x="14" y="226" width="592" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="244" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Общие признаки — enumerable и configurable (лиловые строки).</text>
    <text x="310" y="261" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">value и writable вместе с get и set в одном дескрипторе не бывают.</text>
</svg>
