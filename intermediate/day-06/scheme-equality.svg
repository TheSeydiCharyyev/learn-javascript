<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Три других сравнения отличаются от строгого === одним правилом: == приводит типы, SameValueZero считает NaN равным NaN, SameValue ещё и различает 0 и -0">
    <rect x="230" y="96" width="160" height="56" rx="10" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="310" y="120" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#6b21a8">===</text>
    <text x="310" y="140" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#6b21a8">IsStrictlyEqual</text>

    <path d="M 228 124 L 160 124" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="14" y="92" width="144" height="64" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="86" y="116" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#991b1b">==</text>
    <text x="86" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">+ приводит типы</text>
    <text x="86" y="150" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">старый код</text>

    <path d="M 392 112 L 450 66" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="452" y="20" width="154" height="64" rx="10" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="529" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#166534">SameValueZero</text>
    <text x="529" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">+ NaN равен NaN</text>
    <text x="529" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">includes, коллекции</text>

    <path d="M 392 136 L 450 182" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <rect x="452" y="160" width="154" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="529" y="182" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1d4ed8">SameValue</text>
    <text x="529" y="198" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">+ NaN равен NaN, 0 ≠ -0</text>
    <text x="529" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">Object.is, defineProperty</text>

    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">объекты — у всех четырёх по ссылке:</text>
    <text x="310" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">тот ли это объект, а не то же ли в нём</text>
</svg>
