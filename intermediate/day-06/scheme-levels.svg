<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Три уровня защиты: preventExtensions запрещает новые свойства; seal добавляет configurable false — нельзя удалять; freeze добавляет writable false — нельзя записывать">
    <rect x="14" y="80" width="186" height="124" rx="10" fill="#faf5ff" stroke="#c084fc" stroke-width="2"/>
    <text x="107" y="102" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#6b21a8">preventExtensions</text>
    <text x="28" y="128" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">добавлять — нельзя</text>
    <text x="28" y="148" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">удалять — можно</text>
    <text x="28" y="168" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">записывать — можно</text>
    <text x="107" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">isExtensible → false</text>

    <rect x="217" y="50" width="186" height="154" rx="10" fill="#f3e8ff" stroke="#a855f7" stroke-width="2"/>
    <text x="310" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#6b21a8">seal</text>
    <text x="231" y="98" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">добавлять — нельзя</text>
    <text x="231" y="118" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">удалять — нельзя</text>
    <text x="231" y="138" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">записывать — можно</text>
    <text x="310" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6b21a8">+ configurable: false</text>
    <text x="310" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">isSealed → true</text>

    <rect x="420" y="20" width="186" height="184" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <text x="513" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#5b21b6">freeze</text>
    <text x="434" y="68" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">добавлять — нельзя</text>
    <text x="434" y="88" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">удалять — нельзя</text>
    <text x="434" y="108" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#991b1b">записывать — нельзя</text>
    <text x="513" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#6b21a8">+ configurable: false</text>
    <text x="513" y="152" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#5b21b6">+ writable: false</text>
    <text x="513" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">isFrozen → true</text>

    <rect x="14" y="218" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="241" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Каждая ступень включает предыдущую и добавляет один признак всем свойствам.</text>
</svg>
