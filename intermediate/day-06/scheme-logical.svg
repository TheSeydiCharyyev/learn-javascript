<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Как работает a ??= b: прочитать a; если a null или undefined — вычислить b и записать; иначе ничего: правая часть не вычисляется, записи нет">
    <rect x="14" y="20" width="150" height="44" rx="8" fill="#faf5ff" stroke="#a855f7" stroke-width="2"/>
    <text x="89" y="47" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#6b21a8">a ??= b</text>
    <path d="M 166 42 L 196 42" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 204 42 L 194 38 L 194 46 Z" fill="#94a3b8"/>

    <rect x="206" y="20" width="208" height="44" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="40" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">прочитать a:</text>
    <text x="310" y="56" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#92400e">null или undefined?</text>

    <path d="M 280 66 L 170 110" fill="none" stroke="#22c55e" stroke-width="2"/>
    <text x="204" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#166534">да</text>
    <rect x="14" y="112" width="282" height="56" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
    <text x="155" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#166534">вычислить b и записать в a</text>
    <text x="155" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">сеттер вызовется, заморозка — ошибка</text>

    <path d="M 340 66 L 450 110" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <text x="420" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#475569">нет</text>
    <rect x="324" y="112" width="282" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="465" y="135" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">ничего: b не вычисляется,</text>
    <text x="465" y="155" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">записи нет, результат — a</text>

    <rect x="14" y="182" width="592" height="38" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="206" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">У ||= вопрос «a ложное?», у &amp;&amp;= — «a истинное?». Остальное так же.</text>
</svg>
