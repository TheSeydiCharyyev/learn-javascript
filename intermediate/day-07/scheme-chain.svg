<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="Три цепочки прототипов: student ведёт прямо в Object.prototype; marks — в Array.prototype, затем в Object.prototype; greet — в Function.prototype, затем в Object.prototype; у Object.prototype прототип null">
    <rect x="14" y="20" width="120" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="74" y="38" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">student</text>
    <text x="74" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">name</text>

    <rect x="14" y="104" width="120" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="74" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">marks</text>
    <text x="74" y="139" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">0, 1, length</text>

    <rect x="14" y="176" width="120" height="44" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="74" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">greet</text>
    <text x="74" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">name, length</text>

    <rect x="174" y="104" width="160" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="254" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">Array.prototype</text>
    <text x="254" y="139" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">map, filter, push…</text>

    <rect x="174" y="176" width="160" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="254" y="194" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">Function.prototype</text>
    <text x="254" y="211" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">call, apply, bind</text>

    <rect x="374" y="76" width="156" height="100" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text x="452" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#92400e">Object.prototype</text>
    <text x="452" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">toString</text>
    <text x="452" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">hasOwnProperty</text>
    <text x="452" y="158" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">valueOf…</text>

    <rect x="556" y="106" width="50" height="40" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="581" y="131" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#475569">null</text>

    <path d="M 136 42 L 420 42 L 420 72" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 420 76 L 416 66 L 424 66 Z" fill="#f97316"/>
    <path d="M 136 126 L 168 126" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 172 126 L 162 122 L 162 130 Z" fill="#f97316"/>
    <path d="M 136 198 L 168 198" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 172 198 L 162 194 L 162 202 Z" fill="#f97316"/>
    <path d="M 336 126 L 368 126" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 372 126 L 362 122 L 362 130 Z" fill="#f97316"/>
    <path d="M 336 198 L 452 198 L 452 182" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 452 178 L 448 188 L 456 188 Z" fill="#f97316"/>
    <path d="M 532 126 L 550 126" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 554 126 L 544 122 L 544 130 Z" fill="#f97316"/>

    <rect x="14" y="236" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="259" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Стрелка — [[Prototype]]. Поиск свойства идёт по стрелкам, пока не дойдёт до null.</text>
</svg>
