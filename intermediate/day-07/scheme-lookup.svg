<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" role="img" aria-label="Поиск aman.initial: у aman своего initial нет, в прототипе studentMethods есть геттер initial, он вызывается с this, равным aman, и возвращает А. Поиск aman.missing проходит aman, studentMethods, Object.prototype и null и даёт undefined">
    <rect x="14" y="20" width="170" height="86" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="99" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#9a3412">aman</text>
    <text x="99" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">name: "Аман"</text>
    <text x="99" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">initial — своего нет</text>
    <path d="M 186 63 L 212 63" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 220 63 L 210 59 L 210 67 Z" fill="#f97316"/>

    <rect x="222" y="20" width="190" height="86" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="317" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#334155">studentMethods</text>
    <text x="317" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">greet()</text>
    <text x="317" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#166534">get initial() — нашли</text>
    <path d="M 414 63 L 432 63" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 440 63 L 430 59 L 430 67 Z" fill="#f97316"/>

    <rect x="442" y="20" width="164" height="86" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="524" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#92400e">Object.prototype</text>
    <text x="524" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">toString…</text>
    <text x="524" y="90" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">→ null</text>

    <text x="310" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">aman.initial: своего нет → в прототипе геттер → вызван с this = aman → «А»</text>
    <text x="310" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">aman.missing: aman → studentMethods → Object.prototype → null → undefined</text>

    <rect x="14" y="180" width="592" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="205" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Ищем по цепочке вверх, а this остаётся тем объектом, с которого начали.</text>
</svg>
