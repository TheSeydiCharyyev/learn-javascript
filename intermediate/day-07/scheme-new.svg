<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 270" role="img" aria-label="Четыре шага new Student: создать объект с прототипом Student.prototype, вызвать Student с this, тело пишет name и marks, вернуть объект. Итоговая цепочка: aman со своими name и marks, затем Student.prototype с average и constructor, затем Object.prototype и null">
    <rect x="14" y="14" width="138" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="83" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">1. создать {}</text>
    <text x="83" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">[[Prototype]] =</text>
    <text x="83" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">Student.prototype</text>
    <path d="M 154 47 L 166 47" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 172 47 L 164 43 L 164 51 Z" fill="#94a3b8"/>

    <rect x="174" y="14" width="138" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="243" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">2. вызвать Student</text>
    <text x="243" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">this = новый объект</text>
    <path d="M 314 47 L 326 47" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 332 47 L 324 43 L 324 51 Z" fill="#94a3b8"/>

    <rect x="334" y="14" width="138" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="403" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">3. тело функции</text>
    <text x="403" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">this.name = …</text>
    <text x="403" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">this.marks = …</text>
    <path d="M 474 47 L 486 47" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 492 47 L 484 43 L 484 51 Z" fill="#94a3b8"/>

    <rect x="494" y="14" width="112" height="66" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="550" y="34" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">4. вернуть</text>
    <text x="550" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">новый объект</text>

    <text x="310" y="110" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#64748b">результат — цепочка прототипов:</text>

    <rect x="14" y="124" width="150" height="62" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="89" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">aman</text>
    <text x="89" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">name, marks</text>
    <text x="89" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">свои данные</text>
    <path d="M 166 155 L 186 155" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 192 155 L 182 151 L 182 159 Z" fill="#f97316"/>

    <rect x="194" y="124" width="170" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="279" y="144" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">Student.prototype</text>
    <text x="279" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">average, constructor</text>
    <text x="279" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">общие методы</text>
    <path d="M 366 155 L 386 155" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 392 155 L 382 151 L 382 159 Z" fill="#f97316"/>

    <rect x="394" y="124" width="140" height="62" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="464" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#92400e">Object.prototype</text>
    <text x="464" y="170" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">toString…</text>
    <path d="M 536 155 L 550 155" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 556 155 L 546 151 L 546 159 Z" fill="#f97316"/>
    <text x="582" y="160" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#475569">null</text>

    <rect x="14" y="204" width="592" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="226" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Данные — в каждом объекте свои, методы — одни на всех в Student.prototype.</text>
    <text x="310" y="246" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">new связывает их: прототип нового объекта — свойство prototype конструктора.</text>
</svg>
