<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="new для класса с полями: создать объект с прототипом Order.prototype, создать поля сверху вниз с this — новым объектом, выполнить тело constructor, вернуть объект">
    <rect x="14" y="20" width="136" height="80" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="82" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">1. создать {}</text>
    <text x="82" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">прототип —</text>
    <text x="82" y="84" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">Order.prototype</text>
    <path d="M 152 60 L 164 60" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 170 60 L 162 56 L 162 64 Z" fill="#94a3b8"/>

    <rect x="172" y="20" width="136" height="80" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="240" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">2. поля</text>
    <text x="240" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">сверху вниз,</text>
    <text x="240" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">this — новый объект</text>
    <path d="M 310 60 L 322 60" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 328 60 L 320 56 L 320 64 Z" fill="#94a3b8"/>

    <rect x="330" y="20" width="136" height="80" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="398" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">3. constructor</text>
    <text x="398" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">тело видит</text>
    <text x="398" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">готовые поля</text>
    <path d="M 468 60 L 480 60" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 486 60 L 478 56 L 478 64 Z" fill="#94a3b8"/>

    <rect x="488" y="20" width="118" height="80" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="547" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#9a3412">4. вернуть</text>
    <text x="547" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">новый объект</text>

    <text x="240" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">total = this.items.length</text>
    <text x="240" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">items ещё нет → TypeError</text>
    <text x="398" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#64748b">this.items = items</text>
    <text x="398" y="144" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">появится только здесь</text>

    <rect x="14" y="158" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">У класса с полями между шагами 1 и 3 дня 7 появляется шаг «поля».</text>
</svg>
