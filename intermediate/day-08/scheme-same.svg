<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 254" role="img" aria-label="Что создаёт объявление класса: тело constructor становится функцией Student, методы попадают в Student.prototype, а у объектов из new — свои данные и прототип Student.prototype">
    <rect x="14" y="14" width="240" height="176" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="30" y="38" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">class Student {</text>
    <text x="44" y="64" font-family="Consolas, monospace" font-size="11.5" fill="#9a3412">constructor(name) {</text>
    <text x="58" y="84" font-family="Consolas, monospace" font-size="11.5" fill="#9a3412">this.name = name;</text>
    <text x="44" y="104" font-family="Consolas, monospace" font-size="11.5" fill="#9a3412">}</text>
    <text x="44" y="132" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">greet() { … }</text>
    <text x="44" y="156" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">get label() { … }</text>
    <text x="30" y="180" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">}</text>

    <path d="M 256 84 L 316 56" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 322 53 L 311 54 L 315 61 Z" fill="#94a3b8"/>
    <rect x="324" y="20" width="282" height="64" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="465" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#334155">функция Student</text>
    <text x="465" y="66" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">её тело — тело constructor; только с new</text>

    <path d="M 256 144 L 316 132" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 322 131 L 312 128 L 313 136 Z" fill="#3b82f6"/>
    <rect x="324" y="100" width="282" height="64" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="465" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1d4ed8">Student.prototype</text>
    <text x="465" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">greet, label, constructor — неперечисляемые</text>

    <rect x="324" y="178" width="282" height="34" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="465" y="200" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9a3412">new Student("Аман") → {name} с этим прототипом</text>

    <rect x="14" y="220" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Класс — запись. Под ней функция-конструктор и prototype, как на дне 7.</text>
</svg>
