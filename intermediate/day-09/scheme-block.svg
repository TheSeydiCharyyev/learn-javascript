<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 220" role="img" aria-label="Когда что выполняется: при объявлении класса, один раз, — статические поля и статические блоки сверху вниз; при каждом new — поля и приватные поля объекта, потом тело constructor">
    <rect x="14" y="20" width="284" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="156" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">объявление класса — один раз</text>
    <text x="32" y="72" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">static { … }</text>
    <text x="32" y="94" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">static list = […]</text>
    <text x="32" y="116" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">static #byName = …</text>
    <text x="32" y="138" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">сверху вниз, this — класс</text>

    <rect x="322" y="20" width="284" height="140" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="464" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a3412">каждый new — каждый раз</text>
    <text x="340" y="72" font-family="Consolas, monospace" font-size="11" fill="#9a3412">#flipped = false</text>
    <text x="340" y="94" font-family="Consolas, monospace" font-size="11" fill="#9a3412">word = …</text>
    <text x="340" y="116" font-family="Consolas, monospace" font-size="11" fill="#9a3412">constructor(…) { … }</text>
    <text x="340" y="138" font-family="Segoe UI, sans-serif" font-size="11" fill="#64748b">поля, потом тело; this — новый объект</text>

    <rect x="14" y="176" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="199" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">static — подготовка класса; всё остальное — подготовка каждого объекта.</text>
</svg>
