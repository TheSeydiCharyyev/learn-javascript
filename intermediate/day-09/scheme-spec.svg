<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Где хранятся приватные поля: у объекта есть свойства и отдельный список PrivateElements; Object.keys, JSON и цепочка прототипов видят только свойства. Имя #cards в классе Viewer ищется в записи приватного окружения Viewer, затем во внешней записи Deck">
    <rect x="14" y="20" width="280" height="160" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="154" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#9a3412">объект account</text>
    <rect x="30" y="56" width="248" height="46" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
    <text x="44" y="75" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">свойства</text>
    <text x="44" y="93" font-family="Consolas, monospace" font-size="11" fill="#334155">owner: "Аман"</text>
    <rect x="30" y="112" width="248" height="61" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="44" y="131" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#475569">[[PrivateElements]]</text>
    <text x="44" y="151" font-family="Consolas, monospace" font-size="11" fill="#475569">#balance: 100</text>
    <text x="44" y="164" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">не свойства: keys, JSON, цепочка не видят</text>

    <rect x="324" y="20" width="282" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="465" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">PrivateEnvironment Deck</text>
    <text x="465" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Names]]: #cards</text>

    <rect x="324" y="120" width="282" height="60" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="465" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#334155">PrivateEnvironment Viewer</text>
    <text x="465" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">[[Names]]: пусто</text>
    <path d="M 465 118 L 465 88" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 465 82 L 461 92 L 469 92 Z" fill="#f97316"/>
    <text x="456" y="106" text-anchor="end" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">[[OuterPrivateEnvironment]]</text>

    <text x="465" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">#cards во Viewer: своего нет → во внешней Deck</text>

    <rect x="14" y="218" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="241" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Приватное поле хранится отдельно от свойств, а имя ищется по классам, вложенным в текст.</text>
</svg>
