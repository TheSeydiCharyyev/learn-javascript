<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 238" role="img" aria-label="Где что лежит: статические элементы на функции Card, методы в Card.prototype, поля и приватные поля в каждом объекте; объект видит прототип, но не статические элементы">
    <rect x="14" y="20" width="186" height="140" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="107" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#1d4ed8">функция Card</text>
    <text x="107" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">static — один раз на класс</text>
    <text x="30" y="88" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">topics</text>
    <text x="30" y="108" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">isTopic()</text>
    <text x="30" y="128" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">#created</text>
    <text x="30" y="148" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">prototype →</text>

    <rect x="234" y="20" width="166" height="140" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="317" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#334155">Card.prototype</text>
    <text x="317" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">методы — общие</text>
    <text x="250" y="88" font-family="Consolas, monospace" font-size="11" fill="#334155">constructor</text>
    <text x="250" y="108" font-family="Consolas, monospace" font-size="11" fill="#334155">flip()</text>
    <text x="250" y="128" font-family="Consolas, monospace" font-size="11" fill="#334155">get flipped</text>

    <rect x="434" y="20" width="172" height="140" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="520" y="42" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9a3412">объект card</text>
    <text x="520" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">своё у каждого</text>
    <text x="450" y="88" font-family="Consolas, monospace" font-size="11" fill="#9a3412">word, topic</text>
    <text x="450" y="108" font-family="Consolas, monospace" font-size="11" fill="#475569">#flipped</text>

    <path d="M 202 148 L 228 148" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 232 148 L 224 144 L 224 152 Z" fill="#94a3b8"/>
    <path d="M 432 124 L 408 124" fill="none" stroke="#f97316" stroke-width="2"/>
    <path d="M 402 124 L 412 120 L 412 128 Z" fill="#f97316"/>
    <text x="450" y="146" font-family="Segoe UI, sans-serif" font-size="10" fill="#9a3412">← [[Prototype]]</text>

    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">card.flip() — найдено в прототипе; card.isTopic — undefined: функцию Card цепочка не проходит</text>

    <rect x="14" y="200" width="592" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="221" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">static — на классе, методы — в прототипе, поля — в каждом объекте.</text>
</svg>
