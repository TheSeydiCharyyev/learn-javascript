<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="Наследование: ExampleCard является Card и получает всё её поведение. Композиция: ReadOnlyWords использует массив в приватном поле и открывает только length и at">
    <rect x="14" y="20" width="284" height="120" rx="10" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="156" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#9a3412">наследование — «является»</text>
    <text x="156" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#9a3412">ExampleCard extends Card</text>
    <text x="156" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">получает ВСЁ поведение Card</text>
    <text x="156" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">может заменить Card везде</text>

    <rect x="322" y="20" width="284" height="120" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="464" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">композиция — «использует»</text>
    <text x="464" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#1d4ed8">ReadOnlyWords { #items }</text>
    <text x="464" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">массив внутри, в приватном поле</text>
    <text x="464" y="118" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">наружу — только length и at</text>

    <rect x="14" y="154" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="176" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Не уверены, что «является», — берите композицию.</text>
</svg>
