<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Порядок new Child: начало конструктора наследника без this; super вызывает родителя; родитель создаёт объект с прототипом Child.prototype, создаёт свои поля, выполняет своё тело; затем поля наследника и остаток конструктора наследника">
    <rect x="14" y="20" width="110" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="69" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">1. Child</text>
    <text x="69" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">начало тела,</text>
    <text x="69" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">this ещё нет</text>
    <text x="69" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9a3412">super()</text>
    <path d="M 126 64 L 136 64" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 142 64 L 134 60 L 134 68 Z" fill="#94a3b8"/>

    <rect x="144" y="20" width="110" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="199" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">2. Base</text>
    <text x="199" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">создаёт объект:</text>
    <text x="199" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">Child.prototype</text>
    <path d="M 256 64 L 266 64" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 272 64 L 264 60 L 264 68 Z" fill="#94a3b8"/>

    <rect x="274" y="20" width="110" height="88" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="329" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">3. Base</text>
    <text x="329" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">поля родителя,</text>
    <text x="329" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">тело родителя</text>
    <path d="M 386 64 L 396 64" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 402 64 L 394 60 L 394 68 Z" fill="#94a3b8"/>

    <rect x="404" y="20" width="98" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="453" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">4. Child</text>
    <text x="453" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">this готов,</text>
    <text x="453" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">поля наследника</text>
    <path d="M 504 64 L 514 64" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 520 64 L 512 60 L 512 68 Z" fill="#94a3b8"/>

    <rect x="522" y="20" width="84" height="88" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text x="564" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#9a3412">5. Child</text>
    <text x="564" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">остаток</text>
    <text x="564" y="78" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">тела</text>

    <text x="310" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">this до super() — ReferenceError; поля наследника ещё не созданы, пока работает родитель</text>

    <rect x="14" y="152" width="592" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Объект создаёт родитель, но с прототипом наследника.</text>
    <text x="310" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Сначала этаж родителя целиком, потом этаж наследника.</text>
</svg>
