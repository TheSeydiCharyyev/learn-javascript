<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Слева: массив marks на каждый вызов Symbol.iterator создаёт новый итератор, каждый проход начинается с начала. Справа: итератор массива на Symbol.iterator возвращает сам себя, поэтому второй проход продолжает первый, а после конца ничего не даёт">
    <rect x="14" y="20" width="292" height="136" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="160" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#115e59">перебираемый объект — источник</text>
    <rect x="30" y="62" width="88" height="40" rx="8" fill="#ffffff" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="74" y="87" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#115e59">marks</text>
    <path d="M 120 76 L 170 66" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 176 65 L 167 62 L 168 70 Z" fill="#14b8a6"/>
    <path d="M 120 88 L 170 108" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 176 110 L 166 103 L 169 111 Z" fill="#14b8a6"/>
    <rect x="178" y="50" width="116" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="236" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">итератор 1: 5, 4, 3</text>
    <rect x="178" y="96" width="116" height="30" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="236" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">итератор 2: 5, 4, 3</text>
    <text x="160" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">каждый for...of — новый итератор с начала</text>

    <rect x="322" y="20" width="284" height="136" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="464" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">перебираемый итератор — проход</text>
    <rect x="340" y="62" width="104" height="40" rx="8" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="392" y="87" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1d4ed8">iterator</text>
    <path d="M 446 72 C 486 52, 486 112, 446 92" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 444 91 L 453 88 L 451 96 Z" fill="#3b82f6"/>
    <text x="488" y="76" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">[Symbol.iterator]()</text>
    <text x="488" y="90" font-family="Segoe UI, sans-serif" font-size="10" fill="#1d4ed8">→ он сам</text>
    <text x="464" y="126" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">проход 1: 5, 4 · проход 2: 3</text>
    <text x="464" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">проход 3: пусто — исчерпан</text>

    <rect x="14" y="170" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="193" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">[Symbol.iterator]() источника — каждый раз новый итератор; у итератора — он сам.</text>
</svg>
