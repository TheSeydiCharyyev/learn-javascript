<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 250" role="img" aria-label="Протокол итерации: for...of вызывает у перебираемого объекта метод Symbol.iterator и получает итератор; затем раз за разом вызывает next и получает объекты value и done; done true — конец цикла">
    <rect x="14" y="20" width="168" height="72" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="98" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#115e59">перебираемый объект</text>
    <text x="98" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#115e59">marks</text>
    <text x="98" y="82" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#64748b">[Symbol.iterator]()</text>
    <path d="M 184 56 L 236 56" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 244 56 L 234 51 L 234 61 Z" fill="#14b8a6"/>
    <text x="214" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0f766e">1 раз</text>
    <rect x="246" y="20" width="150" height="72" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="321" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">итератор</text>
    <text x="321" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">next()</text>
    <text x="321" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">помнит, где остановился</text>
    <path d="M 398 56 L 450 56" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 458 56 L 448 51 L 448 61 Z" fill="#3b82f6"/>
    <text x="428" y="46" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">каждый шаг</text>
    <rect x="460" y="20" width="146" height="72" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="533" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">результат шага</text>
    <text x="533" y="64" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">{ value, done }</text>
    <text x="533" y="82" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">новый объект</text>

    <rect x="14" y="116" width="170" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">{value: 5, done: false}</text>
    <text x="99" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0f766e">тело цикла: mark = 5</text>
    <rect x="204" y="116" width="170" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="289" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">{value: 4, done: false}</text>
    <text x="289" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0f766e">тело цикла: mark = 4</text>
    <rect x="394" y="116" width="212" height="48" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="500" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#991b1b">{value: undefined, done: true}</text>
    <text x="500" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">цикл закончен</text>
    <path d="M 185 140 L 196 140" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 202 140 L 194 136 L 194 144 Z" fill="#94a3b8"/>
    <path d="M 375 140 L 386 140" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 392 140 L 384 136 L 384 144 Z" fill="#94a3b8"/>

    <rect x="14" y="184" width="592" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="207" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Перебираемый объект умеет выдать итератор, итератор умеет сделать шаг.</text>
    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">for...of = взять итератор один раз и звать next(), пока done не станет true.</text>
</svg>
