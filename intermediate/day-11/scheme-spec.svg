<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="for...of по шагам спецификации: GetIterator берёт метод Symbol.iterator и вызывает его, GetIteratorDirect один раз запоминает next, затем цикл: вызвать next, проверить done, выполнить тело; break, return или ошибка ведут к IteratorClose, который вызывает return итератора">
    <rect x="14" y="20" width="182" height="64" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="105" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#115e59">1–2. GetIterator</text>
    <text x="105" y="60" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#115e59">obj[Symbol.iterator]()</text>
    <text x="105" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">нет метода, не объект — ошибка</text>
    <path d="M 198 52 L 214 52" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 220 52 L 212 48 L 212 56 Z" fill="#14b8a6"/>
    <rect x="222" y="20" width="176" height="64" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="310" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#115e59">3. GetIteratorDirect</text>
    <text x="310" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#115e59">запомнить next</text>
    <text x="310" y="76" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">один раз на весь цикл</text>
    <path d="M 400 52 L 416 52" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 422 52 L 414 48 L 414 56 Z" fill="#14b8a6"/>
    <rect x="424" y="20" width="182" height="64" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="515" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1d4ed8">4. шаг: next()</text>
    <text x="515" y="60" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">результат — объект?</text>
    <text x="515" y="76" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">done?</text>

    <path d="M 515 86 L 515 110" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 515 116 L 511 108 L 519 108 Z" fill="#3b82f6"/>
    <text x="525" y="104" font-family="Segoe UI, sans-serif" font-size="10" fill="#1d4ed8">false</text>
    <rect x="424" y="118" width="182" height="48" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="515" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">value → переменная цикла,</text>
    <text x="515" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">тело цикла</text>
    <path d="M 422 150 L 410 150 L 410 72 L 416 72" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 422 72 L 414 68 L 414 76 Z" fill="#3b82f6"/>
    <text x="402" y="108" text-anchor="end" font-family="Segoe UI, sans-serif" font-size="10" fill="#1d4ed8">снова шаг</text>

    <rect x="14" y="118" width="182" height="48" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="105" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">done: true —</text>
    <text x="105" y="156" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">выход, return не нужен</text>
    <rect x="222" y="118" width="134" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="289" y="138" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">5. break, ошибка —</text>
    <text x="289" y="156" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#991b1b">IteratorClose</text>

    <rect x="14" y="186" width="592" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="209" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Проверяется форма: метод есть, вернул объект, next вернул объект.</text>
    <text x="310" y="230" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Смысл — «после done: true снова done: true» — язык не проверяет.</text>
</svg>
