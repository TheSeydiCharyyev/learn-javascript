    <text x="62" y="70" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">своя пауза</text>
    <path d="M 112 56 L 124 56" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 130 56 L 122 52 L 122 60 Z" fill="#14b8a6"/>
