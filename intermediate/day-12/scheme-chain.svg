    <text x="188" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">prototype</text>
    <path d="M 246 56 L 258 56" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 264 56 L 256 52 L 256 60 Z" fill="#14b8a6"/>
    <rect x="266" y="32" width="112" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="322" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">Generator.</text>
    <text x="322" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">prototype</text>
    <text x="322" y="75" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#64748b">next return throw</text>
    <path d="M 380 56 L 392 56" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 398 56 L 390 52 L 390 60 Z" fill="#14b8a6"/>
    <rect x="400" y="32" width="102" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="451" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">Iterator.</text>
    <text x="451" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">prototype</text>
    <text x="451" y="75" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#64748b">день 13</text>
    <path d="M 504 56 L 516 56" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 522 56 L 514 52 L 514 60 Z" fill="#14b8a6"/>
    <rect x="524" y="32" width="82" height="48" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="565" y="52" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#92400e">Object.</text>
    <text x="565" y="68" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#92400e">prototype</text>

    <text x="14" y="146" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">цепочка функции</text>
    <rect x="132" y="128" width="112" height="48" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="188" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1d4ed8">genFunc</text>
    <text x="188" y="167" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">function*</text>
    <path d="M 246 152 L 258 152" fill="none" stroke="#3b82f6" stroke-width="2"/>
