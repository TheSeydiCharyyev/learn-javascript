    <text x="451" y="148" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">Function.</text>
    <text x="451" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#334155">prototype</text>

    <path d="M 188 126 L 188 84" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="196" y="108" font-family="Consolas, monospace" font-size="10" fill="#64748b">.prototype</text>
    <path d="M 322 126 L 322 84" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="330" y="108" font-family="Consolas, monospace" font-size="10" fill="#64748b">.prototype</text>

    <rect x="14" y="196" width="592" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="219" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">next, return и throw — в общем Generator.prototype, [Symbol.iterator] — в Iterator.prototype.</text>
    <text x="310" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">пунктир — свойство prototype; ссылки с gen обратно на genFunc нет, есть только instanceof</text>
</svg>
