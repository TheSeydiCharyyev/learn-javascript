<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Две цепочки. Генератор gen наследует от genFunc.prototype, тот от Generator.prototype с методами next, return, throw, тот от Iterator.prototype, тот от Object.prototype. Функция genFunc наследует от GeneratorFunction.prototype, тот от Function.prototype">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#115e59">цепочка генератора — методы</text>
