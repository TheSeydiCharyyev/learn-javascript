<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Генератор работает кусками. Вызов lessonDay создаёт генератор, тело не начато. Первый next выполняет начало дня до yield лекция, второй — перемену до yield практика, третий — конец дня до конца функции. Между вызовами генератор стоит на паузе">
    <text x="14" y="18" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">вызывающий код</text>
    <rect x="14" y="26" width="138" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="83" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">lessonDay()</text>
    <rect x="166" y="26" width="138" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="235" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">day.next()</text>
    <rect x="318" y="26" width="138" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="387" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">day.next()</text>
    <rect x="470" y="26" width="136" height="38" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="538" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#1d4ed8">day.next()</text>

    <path d="M 215 66 L 215 116" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 215 122 L 211 114 L 219 114 Z" fill="#3b82f6"/>
    <path d="M 255 122 L 255 72" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 255 66 L 251 74 L 259 74 Z" fill="#14b8a6"/>
    <text x="261" y="98" font-family="Consolas, monospace" font-size="10" fill="#0f766e">'лекция'</text>
    <path d="M 367 66 L 367 116" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 367 122 L 363 114 L 371 114 Z" fill="#3b82f6"/>
    <path d="M 407 122 L 407 72" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 407 66 L 403 74 L 411 74 Z" fill="#14b8a6"/>
    <text x="413" y="98" font-family="Consolas, monospace" font-size="10" fill="#0f766e">'практика'</text>
    <path d="M 518 66 L 518 116" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 518 122 L 514 114 L 522 114 Z" fill="#3b82f6"/>
    <path d="M 558 122 L 558 72" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 558 66 L 554 74 L 562 74 Z" fill="#14b8a6"/>
    <text x="552" y="98" text-anchor="end" font-family="Consolas, monospace" font-size="10" fill="#0f766e">done</text>

    <text x="14" y="140" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#0f766e">генератор</text>
    <rect x="14" y="148" width="138" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="83" y="172" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">тело не начато</text>
    <text x="83" y="189" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">(пауза в начале)</text>
    <rect x="166" y="124" width="138" height="78" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="235" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#115e59">начало дня</text>
    <text x="235" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#115e59">yield "лекция"</text>
    <rect x="318" y="124" width="138" height="78" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="387" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#115e59">перемена</text>
    <text x="387" y="178" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#115e59">yield "практика"</text>
    <rect x="470" y="124" width="136" height="78" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="538" y="160" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">конец дня</text>
    <text x="538" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">конец функции</text>

    <rect x="14" y="214" width="592" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Тело выполняется кусками — от yield до yield; между next() генератор на паузе.</text>
</svg>
