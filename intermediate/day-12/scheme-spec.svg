<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Четыре состояния генератора: suspended-start, executing, suspended-yield, completed. next переводит из паузы в executing, yield — в suspended-yield, конец тела, return или ошибка — в completed. return и throw до старта сразу дают completed. Метод, вызванный в executing, — TypeError">
    <rect x="14" y="30" width="150" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="89" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#334155">suspended-start</text>
    <text x="89" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">тело не начато</text>
    <path d="M 166 58 L 228 58" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 236 58 L 226 53 L 226 63 Z" fill="#3b82f6"/>
    <text x="200" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">next()</text>

    <rect x="238" y="30" width="144" height="56" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="310" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1d4ed8">executing</text>
    <text x="310" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">next() здесь — TypeError</text>
    <path d="M 384 48 L 446 48" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 454 48 L 444 43 L 444 53 Z" fill="#14b8a6"/>
    <text x="418" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f766e">yield</text>
    <path d="M 454 70 L 392 70" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 384 70 L 394 65 L 394 75 Z" fill="#3b82f6"/>
    <text x="420" y="102" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#1d4ed8">next / return / throw</text>

    <rect x="456" y="30" width="150" height="56" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="531" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#115e59">suspended-yield</text>
    <text x="531" y="74" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#115e59">пауза на yield</text>

    <path d="M 310 88 L 310 138" fill="none" stroke="#ef4444" stroke-width="2"/>
    <path d="M 310 146 L 305 136 L 315 136 Z" fill="#ef4444"/>
    <text x="318" y="118" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">конец тела, return, ошибка</text>
    <path d="M 89 88 L 89 172 L 228 172" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 236 172 L 226 167 L 226 177 Z" fill="#ef4444"/>
    <text x="98" y="122" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">return() / throw()</text>
    <text x="98" y="136" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">до старта</text>

    <rect x="238" y="148" width="144" height="48" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="310" y="168" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#991b1b">completed</text>
    <text x="310" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">навсегда: done: true</text>

    <rect x="14" y="208" width="592" height="36" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="231" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">DevTools: suspended (оба ожидания), running, closed.</text>
</svg>
