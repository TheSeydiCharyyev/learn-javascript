<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Две семьи методов. Помощники map, filter, take, drop, flatMap возвращают итератор, ленивы, сцепляются и работают с бесконечным. Потребители возвращают результат: toArray, reduce, forEach, join берут все значения; some, every, find, includes останавливаются на ответе и закрывают итератор. Цепочка помощников ничего не считает, пока в конце не встанет потребитель">
    <rect x="14" y="20" width="282" height="128" rx="10" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="155" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#115e59">дают итератор — помощники</text>
    <text x="155" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#115e59">map · filter · take · drop · flatMap</text>
    <text x="155" y="96" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">ничего не считают сами — ленивы</text>
    <text x="155" y="116" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">сцепляются друг с другом</text>
    <text x="155" y="136" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">безопасны с бесконечным</text>

    <path d="M 298 84 L 316 84" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 322 84 L 314 80 L 314 88 Z" fill="#94a3b8"/>

    <rect x="324" y="20" width="282" height="128" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="465" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">дают результат — потребители</text>
    <text x="465" y="70" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">toArray · reduce · forEach · join</text>
    <text x="465" y="88" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">берут все значения — нужен конец</text>
    <text x="465" y="114" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">some · every · find · includes</text>
    <text x="465" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">до ответа, потом закрывают итератор</text>

    <rect x="14" y="164" width="592" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="30" y="187" font-family="Consolas, monospace" font-size="11" fill="#334155">gen().filter(…).map(…).take(5)            ← ещё ничего не посчитано</text>
    <text x="30" y="207" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#334155">gen().filter(…).map(…).take(5).toArray()  ← вся работа здесь</text>
</svg>
