<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 238" role="img" aria-label="Массив: map проходит все значения и строит промежуточный массив, затем filter проходит его и строит результат. Итератор: каждое значение по запросу next проходит map и filter сразу, промежуточных массивов нет">
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#1d4ed8">массив — этажами</text>
    <rect x="14" y="32" width="104" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="66" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">[5, 2, 4]</text>
    <path d="M 120 52 L 150 52" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 156 52 L 148 48 L 148 56 Z" fill="#3b82f6"/>
    <text x="138" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">map</text>
    <rect x="158" y="32" width="124" height="40" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="220" y="50" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">[50, 20, 40]</text>
    <text x="220" y="65" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#92400e">промежуточный массив</text>
    <path d="M 284 52 L 320 52" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <path d="M 326 52 L 318 48 L 318 56 Z" fill="#3b82f6"/>
    <text x="305" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">filter</text>
    <rect x="328" y="32" width="104" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="380" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">[50, 40]</text>
    <text x="448" y="50" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">все значения —</text>
    <text x="448" y="65" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">сразу, на каждом этаже</text>

    <text x="14" y="104" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0f766e">итератор — конвейером</text>
    <rect x="14" y="114" width="104" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="66" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#115e59">values()</text>
    <path d="M 120 134 L 150 134" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 156 134 L 148 130 L 148 138 Z" fill="#14b8a6"/>
    <text x="138" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f766e">5</text>
    <rect x="158" y="114" width="80" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="198" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#115e59">map</text>
    <path d="M 240 134 L 270 134" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 276 134 L 268 130 L 268 138 Z" fill="#14b8a6"/>
    <text x="258" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f766e">50</text>
    <rect x="278" y="114" width="80" height="40" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="318" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#115e59">filter</text>
    <path d="M 360 134 L 390 134" fill="none" stroke="#14b8a6" stroke-width="2"/>
    <path d="M 396 134 L 388 130 L 388 138 Z" fill="#14b8a6"/>
    <text x="378" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#0f766e">50</text>
    <rect x="398" y="114" width="80" height="40" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="438" y="138" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">next()</text>
    <text x="494" y="132" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">одно значение —</text>
    <text x="494" y="147" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">через все звенья</text>
    <path d="M 438 158 C 438 176, 66 176, 66 160" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="252" y="186" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">следующий next() — следующее значение</text>

    <rect x="14" y="198" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Массив считает всё и сразу; итератор — по одному значению и только по запросу.</text>
</svg>
