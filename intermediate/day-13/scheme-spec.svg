<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Цепочка помощников: потребитель toArray тянет значения у take, take у filter, filter у map, map у источника. Каждый помощник — генератор спецификации с меткой Iterator Helper, хранит источник и стоит на паузе. take, отдав нужное, закрывает источник">
    <rect x="14" y="40" width="104" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="66" y="62" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155">источник</text>
    <text x="66" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#64748b">fibonacci()</text>
    <rect x="138" y="40" width="96" height="54" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="186" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#115e59">map</text>
    <text x="186" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#115e59">помощник</text>
    <rect x="254" y="40" width="96" height="54" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="302" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#115e59">filter</text>
    <text x="302" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#115e59">помощник</text>
    <rect x="370" y="40" width="96" height="54" rx="8" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2"/>
    <text x="418" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#115e59">take(5)</text>
    <text x="418" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#115e59">помощник</text>
    <rect x="486" y="40" width="120" height="54" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="546" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1d4ed8">toArray()</text>
    <text x="546" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#1d4ed8">потребитель</text>

    <path d="M 484 56 L 474 56" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 468 56 L 476 52 L 476 60 Z" fill="#3b82f6"/>
    <path d="M 368 56 L 358 56" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 352 56 L 360 52 L 360 60 Z" fill="#3b82f6"/>
    <path d="M 252 56 L 242 56" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 236 56 L 244 52 L 244 60 Z" fill="#3b82f6"/>
    <path d="M 136 56 L 126 56" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
    <path d="M 120 56 L 128 52 L 128 60 Z" fill="#3b82f6"/>
    <text x="310" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">← next(): запрос идёт к источнику</text>

    <path d="M 120 82 L 130 82" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 136 82 L 128 78 L 128 86 Z" fill="#14b8a6"/>
    <path d="M 236 82 L 246 82" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 252 82 L 244 78 L 244 86 Z" fill="#14b8a6"/>
    <path d="M 352 82 L 362 82" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 368 82 L 360 78 L 360 86 Z" fill="#14b8a6"/>
    <path d="M 468 82 L 478 82" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <path d="M 484 82 L 476 78 L 476 86 Z" fill="#14b8a6"/>
    <text x="250" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#0f766e">значения идут обратно через Yield →</text>

    <path d="M 418 96 L 418 136 L 66 136 L 66 100" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 66 96 L 62 104 L 70 104 Z" fill="#ef4444"/>
    <text x="242" y="152" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">take отдал пять — IteratorClose: return() источника</text>

    <rect x="14" y="166" width="592" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="191" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Помощник — генератор спецификации с меткой «Iterator Helper»: на паузе до next().</text>
</svg>
