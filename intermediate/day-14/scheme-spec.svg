<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Внутренний список MapData: записи b, a, 10, 2. delete b делает первую запись пустой. set b снова дописывает новую запись в конец. Перебор идёт по списку и пропускает пустые">
    <text x="14" y="22" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">[[MapData]] после set "b", "a", 10, 2</text>
    <rect x="14" y="32" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="69" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">"b" → 2</text>
    <rect x="134" y="32" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="189" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">"a" → 1</text>
    <rect x="254" y="32" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="309" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">10 → "десять"</text>
    <rect x="374" y="32" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="429" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">2 → "два"</text>

    <text x="14" y="96" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#991b1b">delete("b"), затем set("b", 200)</text>
    <rect x="14" y="106" width="110" height="36" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="69" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">empty</text>
    <rect x="134" y="106" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="189" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">"a" → 1</text>
    <rect x="254" y="106" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="309" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">10 → "десять"</text>
    <rect x="374" y="106" width="110" height="36" rx="6" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="429" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">2 → "два"</text>
    <rect x="494" y="106" width="112" height="36" rx="6" fill="#ecfccb" stroke="#65a30d" stroke-width="2"/>
    <text x="550" y="129" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">"b" → 200</text>
    <text x="550" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#3f6212">новая — в конец</text>
    <text x="69" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#991b1b">помечена пустой</text>

    <rect x="14" y="172" width="592" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Замена значения — на месте; новый ключ — в конец; перебор пропускает empty.</text>
    <text x="310" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Поэтому порядок Map — порядок первой вставки.</text>
</svg>
