<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Map держит ключ крепко: даже когда переменная aman больше не указывает на объект, Map не даёт его освободить. WeakMap держит ключ слабо: когда других ссылок нет, сборщик мусора забирает объект и его запись">
    <rect x="14" y="20" width="292" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="160" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Map — держит крепко</text>
    <rect x="30" y="58" width="90" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="75" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">aman</text>
    <path d="M 122 75 L 182 75" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="152" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#991b1b">ссылки нет</text>
    <rect x="184" y="58" width="108" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="238" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#92400e">{ name }</text>
    <rect x="30" y="118" width="90" height="34" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="75" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1d4ed8">map</text>
    <path d="M 122 135 L 224 98" fill="none" stroke="#3b82f6" stroke-width="2.5"/>
    <path d="M 230 96 L 219 95 L 223 103 Z" fill="#3b82f6"/>
    <text x="200" y="140" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">крепкая ссылка:</text>
    <text x="200" y="156" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#1d4ed8">объект жив</text>

    <rect x="322" y="20" width="284" height="150" rx="10" fill="#f7fee7" stroke="#84cc16" stroke-width="2"/>
    <text x="464" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#3f6212">WeakMap — держит слабо</text>
    <rect x="338" y="58" width="90" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="383" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">aman</text>
    <path d="M 430 75 L 486 75" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="458" y="68" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="9.5" fill="#991b1b">ссылки нет</text>
    <rect x="488" y="58" width="104" height="34" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="540" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#94a3b8">{ name }</text>
    <rect x="338" y="118" width="90" height="34" rx="8" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="383" y="140" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#3f6212">weakMap</text>
    <path d="M 430 135 L 528 98" fill="none" stroke="#84cc16" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="500" y="140" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#3f6212">слабая ссылка:</text>
    <text x="500" y="156" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#3f6212">сборщик заберёт</text>

    <rect x="14" y="184" width="592" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Запись WeakMap живёт столько же, сколько её объект-ключ.</text>
    <text x="310" y="223" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Поэтому ключи — только объекты, а перебрать WeakMap нельзя.</text>
</svg>
