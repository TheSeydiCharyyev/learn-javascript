<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 256" role="img" aria-label="Четыре диаграммы двух пересекающихся кругов a и b. union закрашивает оба круга целиком, intersection — только общую часть, difference — часть a без b, symmetricDifference — оба круга без общей части">
    <defs>
        <clipPath id="venn-a2"><circle cx="212" cy="74" r="36"/></clipPath>
        <clipPath id="venn-a3"><circle cx="364" cy="74" r="36"/></clipPath>
        <clipPath id="venn-a4"><circle cx="516" cy="74" r="36"/></clipPath>
    </defs>

    <rect x="10" y="12" width="144" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="60" cy="74" r="36" fill="#d9f99d"/>
    <circle cx="104" cy="74" r="36" fill="#d9f99d"/>
    <circle cx="60" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <circle cx="104" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <text x="40" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">a</text>
    <text x="124" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">b</text>
    <text x="82" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">union</text>
    <text x="82" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">a ∪ b</text>
    <text x="82" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#4d7c0f">все 5 тем</text>

    <rect x="162" y="12" width="144" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="256" cy="74" r="36" fill="#d9f99d" clip-path="url(#venn-a2)"/>
    <circle cx="212" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <circle cx="256" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <text x="192" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">a</text>
    <text x="276" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">b</text>
    <text x="234" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">intersection</text>
    <text x="234" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">a ∩ b</text>
    <text x="234" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#4d7c0f">классы, циклы</text>

    <rect x="314" y="12" width="144" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="364" cy="74" r="36" fill="#d9f99d"/>
    <circle cx="408" cy="74" r="36" fill="#f8fafc" clip-path="url(#venn-a3)"/>
    <circle cx="364" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <circle cx="408" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <text x="344" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">a</text>
    <text x="428" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">b</text>
    <text x="386" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">difference</text>
    <text x="386" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">a ∖ b</text>
    <text x="386" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#4d7c0f">массивы, объекты</text>

    <rect x="466" y="12" width="144" height="176" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="516" cy="74" r="36" fill="#d9f99d"/>
    <circle cx="560" cy="74" r="36" fill="#d9f99d"/>
    <circle cx="560" cy="74" r="36" fill="#f8fafc" clip-path="url(#venn-a4)"/>
    <circle cx="516" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <circle cx="560" cy="74" r="36" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <text x="496" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">a</text>
    <text x="580" y="79" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#3f6212">b</text>
    <text x="538" y="134" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">symmetricDifference</text>
    <text x="538" y="151" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">(a ∖ b) ∪ (b ∖ a)</text>
    <text x="538" y="170" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#4d7c0f">массивы, объекты, Map</text>

    <rect x="10" y="200" width="600" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="220" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">a — темы группы A: циклы, массивы, объекты, классы; b — группы B: классы, Map, циклы</text>
    <text x="310" y="239" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Каждая операция возвращает новый Set; a и b не меняются.</text>
</svg>
