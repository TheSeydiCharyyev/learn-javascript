<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Объекты group, group.students, aman и meret ссылаются друг на друга по кругу: у aman и meret свойство group снова ведёт к group. Номера показывают порядок, в котором walk добавляет объекты в seen. Обратные ссылки ведут к объекту, который уже отмечен, и обход на них останавливается">
    <rect x="30" y="70" width="140" height="44" rx="8" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="100" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">1. group</text>
    <text x="100" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3f6212">{ title, students }</text>
    <path d="M 170 92 L 230 92" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <path d="M 240 92 L 230 87 L 230 97 Z" fill="#65a30d"/>

    <rect x="240" y="70" width="140" height="44" rx="8" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="310" y="88" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">2. students</text>
    <text x="310" y="104" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3f6212">[aman, meret]</text>
    <path d="M 380 82 L 440.5 63" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <path d="M 450 60 L 442 67.8 L 439 58.2 Z" fill="#65a30d"/>
    <path d="M 380 102 L 440.8 126.1" fill="none" stroke="#65a30d" stroke-width="1.5"/>
    <path d="M 450 130 L 438.8 130.7 L 442.8 121.5 Z" fill="#65a30d"/>

    <rect x="450" y="40" width="140" height="40" rx="8" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="520" y="56" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">3. aman</text>
    <text x="520" y="71" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3f6212">{ name, group }</text>
    <rect x="450" y="110" width="140" height="40" rx="8" fill="#f7fee7" stroke="#84cc16" stroke-width="1.5"/>
    <text x="520" y="126" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">4. meret</text>
    <text x="520" y="141" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#3f6212">{ name, group }</text>

    <path d="M 520 40 C 520 8, 100 8, 100 60" fill="none" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 100 70 L 95 60 L 105 60 Z" fill="#991b1b"/>
    <text x="310" y="40" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">aman.group — уже в seen, стоп</text>
    <path d="M 520 150 C 520 182, 100 182, 100 124" fill="none" stroke="#991b1b" stroke-width="1.5" stroke-dasharray="5 4"/>
    <path d="M 100 114 L 95 124 L 105 124 Z" fill="#991b1b"/>
    <text x="310" y="190" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">meret.group — уже в seen, стоп</text>

    <rect x="14" y="200" width="592" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="219" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Номер — порядок seen.add. Отметки лежат в WeakSet, сами объекты не меняются.</text>
    <text x="310" y="237" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Без seen: group → students → aman → group → … — переполнение стека.</text>
</svg>
