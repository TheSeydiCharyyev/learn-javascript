<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 294" role="img" aria-label="Алгоритм intersection: у this берётся список SetData, у other — запись Set Record с полями Size, Has и Keys. Если размер this не больше Size, перебирается this и вызывается other.has; иначе перебирается other.keys и проверяется наличие в this. Результат — новый обычный Set в порядке перебранного, меньшего множества">
    <rect x="14" y="14" width="290" height="70" rx="10" fill="#f7fee7" stroke="#84cc16" stroke-width="2"/>
    <text x="159" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#3f6212">this = groupA: [[SetData]]</text>
    <rect x="24" y="44" width="64" height="28" rx="6" fill="#ffffff" stroke="#84cc16" stroke-width="1.5"/>
    <text x="56" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#3f6212">циклы</text>
    <rect x="94" y="44" width="64" height="28" rx="6" fill="#ffffff" stroke="#84cc16" stroke-width="1.5"/>
    <text x="126" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#3f6212">массивы</text>
    <rect x="164" y="44" width="64" height="28" rx="6" fill="#ffffff" stroke="#84cc16" stroke-width="1.5"/>
    <text x="196" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#3f6212">объекты</text>
    <rect x="234" y="44" width="64" height="28" rx="6" fill="#ffffff" stroke="#84cc16" stroke-width="1.5"/>
    <text x="266" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#3f6212">классы</text>

    <rect x="316" y="14" width="290" height="70" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="461" y="33" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#1d4ed8">other = groupB → GetSetRecord</text>
    <rect x="326" y="44" width="86" height="28" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="369" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">[[Size]]: 3</text>
    <rect x="418" y="44" width="86" height="28" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="461" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">[[Has]]: has</text>
    <rect x="510" y="44" width="86" height="28" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="553" y="62" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#1d4ed8">[[Keys]]: keys</text>

    <path d="M 159 84 L 230 104" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 461 84 L 390 104" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="170" y="104" width="280" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="123" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">SetDataSize(this) ≤ [[Size]] ?</text>
    <text x="310" y="141" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">у groupA 4, у groupB 3 — нет</text>

    <path d="M 200 150 L 159 170" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="166" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">да</text>
    <path d="M 420 150 L 461 170" fill="none" stroke="#3b82f6" stroke-width="2"/>
    <text x="458" y="158" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" font-weight="700" fill="#1d4ed8">нет</text>

    <rect x="14" y="170" width="290" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="159" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">перебрать список this;</text>
    <text x="159" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">для каждого e вызвать other.has(e)</text>
    <rect x="316" y="170" width="290" height="56" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
    <text x="461" y="192" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#1d4ed8">перебрать other.keys(); оставить то,</text>
    <text x="461" y="210" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1d4ed8">что есть в this → классы, циклы</text>

    <rect x="14" y="240" width="592" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="259" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Результат — новый обычный Set: OrdinaryObjectCreate(%Set.prototype%).</text>
    <text x="310" y="277" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Перебирается меньшее множество — в его порядке и выходит результат.</text>
</svg>
