<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Слушатель вызывает метод класса Group или Student. Если метод принял данные, слушатель зовёт render, и страница перестраивается из группы. Если метод бросил ошибку, catch показывает её текст под формой, данные не меняются">
    <rect x="14" y="20" width="150" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="89" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Слушатель</text>
    <text x="89" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">submit, click</text>

    <rect x="234" y="20" width="160" height="56" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="314" y="44" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#854d0e">group.add(name)</text>
    <text x="314" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">метод класса проверяет</text>
    <path d="M 164 48 L 224 48" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 234 48 L 224 43 L 224 53 Z" fill="#a16207"/>

    <rect x="456" y="20" width="150" height="56" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="531" y="44" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#854d0e">Данные</text>
    <text x="531" y="63" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#854d0e">#students, #topics</text>
    <path d="M 394 48 L 446 48" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 456 48 L 446 43 L 446 53 Z" fill="#a16207"/>
    <text x="425" y="40" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#854d0e">принял</text>

    <rect x="456" y="140" width="150" height="56" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
    <text x="531" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#854d0e">render()</text>
    <text x="531" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">страница из группы</text>
    <path d="M 531 76 L 531 130" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 531 140 L 526 130 L 536 130 Z" fill="#a16207"/>

    <rect x="234" y="140" width="160" height="56" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <text x="314" y="164" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#991b1b">catch (e)</text>
    <text x="314" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b">e.message — под форму</text>
    <path d="M 314 76 L 314 130" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 314 140 L 309 130 L 319 130 Z" fill="#ef4444"/>
    <text x="324" y="108" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#991b1b">throw</text>

    <rect x="14" y="140" width="150" height="56" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="89" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#334155">Страница</text>
    <text x="89" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">что видит учитель</text>
    <path d="M 89 140 L 89 86" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 89 76 L 84 86 L 94 86 Z" fill="#94a3b8"/>
    <text x="99" y="114" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">щелчок, Enter</text>

    <path d="M 531 196 L 531 208 L 89 208 L 89 206" fill="none" stroke="#a16207" stroke-width="2"/>
    <path d="M 89 196 L 84 206 L 94 206 Z" fill="#a16207"/>

    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Проверка — в классе, текст ошибки — для человека, показ — в render.</text>
</svg>
