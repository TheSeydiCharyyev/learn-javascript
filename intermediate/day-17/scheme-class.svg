<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Ось номеров символов Юникода от 0400 до 04FF. Заглавные А–Я занимают 0410–042F, строчные а–я 0430–044F. Буква ё — 0451, вне диапазона а–я. Туркменская ү — 04AF, тоже вне. Диапазон 0400–04FF покрывает весь блок кириллицы">
    <line x1="30" y1="96" x2="590" y2="96" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="10" fill="#475569" text-anchor="middle">
        <line x1="30" y1="90" x2="30" y2="102" stroke="#94a3b8"/><text x="30" y="118">0400</text>
        <line x1="65" y1="90" x2="65" y2="102" stroke="#94a3b8"/><text x="65" y="118">0410</text>
        <line x1="135" y1="90" x2="135" y2="102" stroke="#94a3b8"/><text x="135" y="118">0430</text>
        <line x1="205" y1="90" x2="205" y2="102" stroke="#94a3b8"/><text x="205" y="118">0450</text>
        <line x1="338" y1="90" x2="338" y2="102" stroke="#94a3b8"/><text x="338" y="118">04AF</text>
        <line x1="590" y1="90" x2="590" y2="102" stroke="#94a3b8"/><text x="590" y="118">04FF</text>
    </g>
    <rect x="65" y="66" width="70" height="20" rx="4" fill="#e0f2fe" stroke="#0ea5e9"/>
    <text x="100" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0369a1">А–Я</text>
    <rect x="135" y="66" width="70" height="20" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="170" y="80" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9f1239">а–я</text>
    <circle cx="209" cy="96" r="5" fill="#f59e0b"/>
    <text x="216" y="60" font-family="Segoe UI, sans-serif" font-size="11" fill="#b45309">ё — 0451</text>
    <circle cx="338" cy="96" r="5" fill="#f59e0b"/>
    <text x="338" y="80" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#b45309">ү — 04AF</text>
    <path d="M 30 142 L 590 142" fill="none" stroke="#16a34a" stroke-width="3"/>
    <text x="310" y="136" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#15803d">[\u0400-\u04FF] — весь блок кириллицы</text>
    <text x="100" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9f1239">[а-я] — только 0430–044F</text>

    <rect x="14" y="158" width="592" height="48" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="178" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Диапазон — промежуток номеров, а не «весь алфавит»: ё и ү в [а-я] не попадают.</text>
    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Туркменская латиница (ä, ç, ň, ö, ş, ü, ý, ž) — тоже вне [a-z]: день 20.</text>
</svg>
