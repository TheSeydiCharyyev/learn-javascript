<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Дерево грамматики шаблона colou?r|цвет: Pattern — это Disjunction из двух Alternative. Первая — цепочка Term: c, o, l, o, затем атом u с квантификатором вопросительный знак, затем r. Вторая — c, в, е, т. Флаг i в шаблон не входит, его хранит объект отдельно">
    <rect x="250" y="12" width="120" height="30" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
    <text x="310" y="32" text-anchor="middle" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#9f1239">Pattern</text>
    <path d="M 310 42 L 310 58" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="240" y="58" width="140" height="30" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="310" y="78" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#9f1239">Disjunction ( | )</text>
    <path d="M 280 88 L 170 108" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 340 88 L 470 108" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="90" y="108" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="170" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">Alternative</text>
    <rect x="390" y="108" width="160" height="30" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="470" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">Alternative</text>

    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
        <rect x="20" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="37" y="180" fill="#334155">c</text>
        <rect x="60" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="77" y="180" fill="#334155">o</text>
        <rect x="100" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="117" y="180" fill="#334155">l</text>
        <rect x="140" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="157" y="180" fill="#334155">o</text>
        <rect x="180" y="160" width="60" height="30" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="210" y="180" fill="#9f1239" font-weight="700">u ?</text>
        <rect x="246" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="263" y="180" fill="#334155">r</text>
        <rect x="400" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="417" y="180" fill="#334155">ц</text>
        <rect x="440" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="457" y="180" fill="#334155">в</text>
        <rect x="480" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="497" y="180" fill="#334155">е</text>
        <rect x="520" y="160" width="34" height="30" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="537" y="180" fill="#334155">т</text>
    </g>
    <path d="M 170 138 L 150 160" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <path d="M 470 138 L 477 160" fill="none" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="150" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">шесть Term: атомы-буквы и атом u с квантификатором ?</text>
    <text x="477" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">четыре Term — буквы</text>
    <text x="310" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">/colou?r|цвет/i — флаг i в грамматику шаблона не входит: его хранит объект.</text>
</svg>
