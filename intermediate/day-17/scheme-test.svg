<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" role="img" aria-label="Поиск /fo+/ в строке table football: движок пробует начать совпадение с позиций 0, 1, 2, 3, 4, 5 — там не f, неудача. С позиции 6 буква f, затем o+ берёт две буквы o, на t повтор останавливается. Совпадение найдено с позиции 6: search возвращает 6, test — true">
    <g font-family="Consolas, monospace" font-size="13" text-anchor="middle">
        <rect x="14" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="32" y="62" fill="#334155">t</text>
        <rect x="54" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="72" y="62" fill="#334155">a</text>
        <rect x="94" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="112" y="62" fill="#334155">b</text>
        <rect x="134" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="152" y="62" fill="#334155">l</text>
        <rect x="174" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="192" y="62" fill="#334155">e</text>
        <rect x="214" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="232" y="62" fill="#334155">␣</text>
        <rect x="254" y="40" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="272" y="62" fill="#9f1239" font-weight="700">f</text>
        <rect x="294" y="40" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="312" y="62" fill="#9f1239" font-weight="700">o</text>
        <rect x="334" y="40" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="352" y="62" fill="#9f1239" font-weight="700">o</text>
        <rect x="374" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="392" y="62" fill="#334155">t</text>
        <rect x="414" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="432" y="62" fill="#334155">b</text>
        <rect x="454" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="472" y="62" fill="#334155">a</text>
        <rect x="494" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="512" y="62" fill="#334155">l</text>
        <rect x="534" y="40" width="36" height="34" rx="4" fill="#f8fafc" stroke="#94a3b8"/><text x="552" y="62" fill="#334155">l</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10" fill="#64748b" text-anchor="middle">
        <text x="32" y="30">0</text><text x="72" y="30">1</text><text x="112" y="30">2</text><text x="152" y="30">3</text>
        <text x="192" y="30">4</text><text x="232" y="30">5</text><text x="272" y="30">6</text><text x="312" y="30">7</text>
        <text x="352" y="30">8</text><text x="392" y="30">9</text><text x="432" y="30">10</text><text x="472" y="30">11</text>
        <text x="512" y="30">12</text><text x="552" y="30">13</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle">
        <text x="32" y="94">✗</text><text x="72" y="94">✗</text><text x="112" y="94">✗</text>
        <text x="152" y="94">✗</text><text x="192" y="94">✗</text><text x="232" y="94">✗</text>
    </g>
    <text x="132" y="114" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">старт с 0–5: первая буква не f</text>
    <path d="M 254 92 L 370 92" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <text x="312" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9f1239">f · o+ берёт «oo»</text>
    <path d="M 392 80 L 392 118" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="398" y="130" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">t — не o, стоп</text>

    <rect x="14" y="138" width="592" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="162" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Шаблон пробуют приложить с каждой позиции слева направо, пока не подойдёт.</text>
    <text x="310" y="183" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Подошло с позиции 6 — дальше не ищут: search вернёт 6, test — true.</text>
    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Ответ «есть где-то в строке», а не «вся строка такая».</text>
</svg>
