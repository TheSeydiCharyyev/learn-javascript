<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 196" role="img" aria-label="Цикл exec с флагом g по строке table football, foosball: первый вызов ищет с lastIndex 0 и находит foo на месте 6, lastIndex становится 9; второй ищет с 9 и находит foo на месте 16, lastIndex 19; третий ищет с 19, не находит, возвращает null и сбрасывает lastIndex в 0">
    <g font-family="Segoe UI, sans-serif" font-size="11.5" text-anchor="middle">
        <rect x="20" y="20" width="170" height="74" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
        <text x="105" y="42" fill="#9f1239" font-weight="700">вызов 1</text>
        <text x="105" y="62" fill="#334155">ищет с lastIndex 0</text>
        <text x="105" y="82" fill="#334155">«foo» на 6 → lastIndex 9</text>
        <rect x="225" y="20" width="170" height="74" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/>
        <text x="310" y="42" fill="#9f1239" font-weight="700">вызов 2</text>
        <text x="310" y="62" fill="#334155">ищет с 9</text>
        <text x="310" y="82" fill="#334155">«foo» на 16 → lastIndex 19</text>
        <rect x="430" y="20" width="170" height="74" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
        <text x="515" y="42" fill="#334155" font-weight="700">вызов 3</text>
        <text x="515" y="62" fill="#334155">ищет с 19 — нет</text>
        <text x="515" y="82" fill="#334155">null, lastIndex → 0</text>
    </g>
    <path d="M 190 57 L 215 57" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 225 57 L 215 52 L 215 62 Z" fill="#f43f5e"/>
    <path d="M 395 57 L 420 57" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 430 57 L 420 52 L 420 62 Z" fill="#f43f5e"/>
    <rect x="14" y="112" width="592" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="134" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">lastIndex — свойство объекта-шаблона, а не строки: оно переживает смену строки.</text>
    <text x="310" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">test(…) с флагом g — это тот же exec: true (9) → false (0) → true (9).</text>
    <text x="310" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Без g lastIndex не читается и не меняется — поиск всегда с начала.</text>
</svg>
