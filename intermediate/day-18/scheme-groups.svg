<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 244" role="img" aria-label="Шаблон из трёх групп для даты: группы нумеруются по открывающим скобкам слева направо — 1, 2, 3. Результат exec для строки Сдача: 12.10.2026 — массив: на месте 0 всё совпадение 12.10.2026, на местах 1, 2, 3 — 12, 10, 2026; index 7, input — исходная строка, groups undefined">
    <g font-family="Consolas, monospace" font-size="16" text-anchor="middle">
        <text x="120" y="50" fill="#9f1239" font-weight="700">(</text><text x="160" y="50" fill="#334155">\d{2}</text><text x="200" y="50" fill="#9f1239" font-weight="700">)</text>
        <text x="225" y="50" fill="#334155">\.</text>
        <text x="250" y="50" fill="#0369a1" font-weight="700">(</text><text x="290" y="50" fill="#334155">\d{2}</text><text x="330" y="50" fill="#0369a1" font-weight="700">)</text>
        <text x="355" y="50" fill="#334155">\.</text>
        <text x="380" y="50" fill="#15803d" font-weight="700">(</text><text x="420" y="50" fill="#334155">\d{4}</text><text x="460" y="50" fill="#15803d" font-weight="700">)</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <text x="120" y="24" fill="#9f1239">1</text><text x="250" y="24" fill="#0369a1">2</text><text x="380" y="24" fill="#15803d">3</text>
    </g>
    <text x="540" y="24" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">номер — по «(»</text>

    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
        <rect x="30" y="90" width="130" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="112" fill="#334155">[0] '12.10.2026'</text>
        <rect x="170" y="90" width="90" height="34" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="215" y="112" fill="#9f1239">[1] '12'</text>
        <rect x="270" y="90" width="90" height="34" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="1.5"/><text x="315" y="112" fill="#0369a1">[2] '10'</text>
        <rect x="370" y="90" width="110" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="425" y="112" fill="#15803d">[3] '2026'</text>
    </g>
    <path d="M 160 58 L 200 88" fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 290 58 L 305 88" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="3 3"/>
    <path d="M 420 58 L 425 88" fill="none" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="3 3"/>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#334155">
        <text x="40" y="152">index: 7</text>
        <text x="140" y="152">input: 'Сдача: 12.10.2026'</text>
        <text x="370" y="152">groups: undefined</text>
    </g>
    <rect x="14" y="172" width="592" height="62" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="194" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Место 0 — всё совпадение, места 1, 2, 3 — группы в порядке открывающих скобок.</text>
    <text x="310" y="214" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">(?:…) группирует, но не запоминает — в массиве для неё места нет.</text>
</svg>
