<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Строка 100 манат. Шаблон d+ забирает цифры 1, 0, 0. Опережающая проверка смотрит вправо на пробел и манат, но не забирает их: совпадение — только 100. Ретроспективная смотрит влево">
    <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
        <rect x="40" y="50" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="58" y="72" fill="#9f1239" font-weight="700">1</text>
        <rect x="80" y="50" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="98" y="72" fill="#9f1239" font-weight="700">0</text>
        <rect x="120" y="50" width="36" height="34" rx="4" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="138" y="72" fill="#9f1239" font-weight="700">0</text>
        <rect x="160" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="178" y="72" fill="#0369a1">␣</text>
        <rect x="200" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="218" y="72" fill="#0369a1">м</text>
        <rect x="240" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="258" y="72" fill="#0369a1">а</text>
        <rect x="280" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="298" y="72" fill="#0369a1">н</text>
        <rect x="320" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="338" y="72" fill="#0369a1">а</text>
        <rect x="360" y="50" width="36" height="34" rx="4" fill="#e0f2fe" stroke="#0ea5e9" stroke-dasharray="4 3"/><text x="378" y="72" fill="#0369a1">т</text>
    </g>
    <line x1="158" y1="36" x2="158" y2="98" stroke="#334155" stroke-width="2"/>
    <text x="158" y="28" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">позиция после \d+</text>
    <path d="M 40 104 L 156 104" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
    <text x="98" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9f1239">\d+ забрал «100»</text>
    <path d="M 160 104 L 396 104" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="5 4"/>
    <path d="M 406 104 L 396 99 L 396 109 Z" fill="#0ea5e9"/>
    <text x="278" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0369a1">(?= манат) смотрит вправо, не забирает</text>
    <text x="500" y="72" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">match → '100'</text>

    <rect x="14" y="142" width="592" height="60" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="164" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">(?=…) и (?!…) смотрят вправо от позиции, (?&lt;=…) и (?&lt;!…) — влево.</text>
    <text x="310" y="184" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Позиция не сдвигается: проверенное в найденное не входит.</text>
</svg>
