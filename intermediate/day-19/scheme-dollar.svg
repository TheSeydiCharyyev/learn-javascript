<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" role="img" aria-label="Строка Сдача: 12.10.2026, ауд. 5 делится на три части: до совпадения — Сдача: , совпадение — 12.10.2026 с группами 12, 10, 2026, после — , ауд. 5. Шаблон $3-$2-$1 даёт 2026-10-12. В результате части до и после копируются без изменений, а на месте совпадения стоит 2026-10-12">
    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle" fill="#475569">
        <text x="100" y="24">$`</text><text x="260" y="24">$&amp;</text><text x="420" y="24">$'</text>
    </g>
    <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
        <rect x="40" y="34" width="120" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="100" y="56" fill="#334155">Сдача: </text>
        <rect x="170" y="34" width="180" height="34" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="260" y="56" fill="#9f1239" font-weight="700">12.10.2026</text>
        <rect x="360" y="34" width="120" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="420" y="56" fill="#334155">, ауд. 5</text>
        <rect x="40" y="132" width="120" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="100" y="154" fill="#334155">Сдача: </text>
        <rect x="170" y="132" width="180" height="34" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="260" y="154" fill="#15803d" font-weight="700">2026-10-12</text>
        <rect x="360" y="132" width="120" height="34" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="420" y="154" fill="#334155">, ауд. 5</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#475569">
        <text x="550" y="56">строка s</text>
        <text x="550" y="154">результат</text>
    </g>
    <path d="M 100 68 L 100 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <path d="M 420 68 L 420 130" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <text x="260" y="90" fill="#9f1239">$1 '12' · $2 '10' · $3 '2026'</text>
        <text x="260" y="114" fill="#15803d">"$3-$2-$1" → '2026-10-12'</text>
    </g>
    <rect x="14" y="184" width="592" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="206">$` — до совпадения, $&amp; — само совпадение, $' — после; $1…$99 и $&lt;имя&gt; — группы.</text>
        <text x="310" y="228">Шаблон замены читается слева направо: $3, «-», $2, «-», $1.</text>
        <text x="310" y="250" font-weight="700">Всё, что вне совпадения, replace переносит в новую строку без изменений.</text>
    </g>
</svg>
