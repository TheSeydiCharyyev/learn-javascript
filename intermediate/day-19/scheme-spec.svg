<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 336" role="img" aria-label="Шесть строковых методов — match, matchAll, replace, replaceAll, search, split — передают работу пяти методам-символам шаблона: Symbol.match, Symbol.matchAll, Symbol.replace для replace и replaceAll, Symbol.search, Symbol.split. Все пять зовут RegExpExec, то есть метод exec. matchAll и split сначала копируют шаблон через Symbol.species">
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle">
        <rect x="16" y="20" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="37" fill="#334155">s.match(re)</text>
        <rect x="16" y="56" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="73" fill="#334155">s.matchAll(re)</text>
        <rect x="16" y="92" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="109" fill="#334155">s.replace(re, x)</text>
        <rect x="16" y="128" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="145" fill="#334155">s.replaceAll(re, x)</text>
        <rect x="16" y="164" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="181" fill="#334155">s.search(re)</text>
        <rect x="16" y="200" width="200" height="26" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="116" y="217" fill="#334155">s.split(re)</text>

        <rect x="262" y="20" width="200" height="26" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="362" y="37" fill="#9f1239">re[Symbol.match](s)</text>
        <rect x="262" y="56" width="200" height="26" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="362" y="73" fill="#9f1239">re[Symbol.matchAll](s) *</text>
        <rect x="262" y="110" width="200" height="26" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="362" y="127" fill="#9f1239">re[Symbol.replace](s, x)</text>
        <rect x="262" y="164" width="200" height="26" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="362" y="181" fill="#9f1239">re[Symbol.search](s)</text>
        <rect x="262" y="200" width="200" height="26" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="362" y="217" fill="#9f1239">re[Symbol.split](s) *</text>
    </g>
    <rect x="504" y="20" width="102" height="206" rx="8" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#0369a1">
        <text x="555" y="112" font-weight="700">RegExpExec</text>
        <text x="555" y="132">→ re.exec(…)</text>
    </g>
    <g fill="none" stroke="#f43f5e" stroke-width="1.5">
        <path d="M 216 33 L 256 33"/><path d="M 216 69 L 256 69"/>
        <path d="M 216 105 L 256 121"/><path d="M 216 141 L 256 125"/>
        <path d="M 216 177 L 256 177"/><path d="M 216 213 L 256 213"/>
    </g>
    <g fill="#f43f5e">
        <path d="M 262 33 L 254 29 L 254 37 Z"/><path d="M 262 69 L 254 65 L 254 73 Z"/>
        <path d="M 262 123 L 254 119 L 254 127 Z"/>
        <path d="M 262 177 L 254 173 L 254 181 Z"/><path d="M 262 213 L 254 209 L 254 217 Z"/>
    </g>
    <g fill="none" stroke="#0ea5e9" stroke-width="1.5">
        <path d="M 462 33 L 498 33"/><path d="M 462 69 L 498 69"/><path d="M 462 123 L 498 123"/>
        <path d="M 462 177 L 498 177"/><path d="M 462 213 L 498 213"/>
    </g>
    <g fill="#0ea5e9">
        <path d="M 504 33 L 496 29 L 496 37 Z"/><path d="M 504 69 L 496 65 L 496 73 Z"/><path d="M 504 123 L 496 119 L 496 127 Z"/>
        <path d="M 504 177 L 496 173 L 496 181 Z"/><path d="M 504 213 L 496 209 L 496 217 Z"/>
    </g>
    <rect x="14" y="242" width="592" height="86" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="262" font-weight="700">Строковый метод только передаёт работу методу шаблона с нужным символом.</text>
        <text x="310" y="281">* matchAll и split сначала копируют шаблон через Symbol.species; split — с флагом y.</text>
        <text x="310" y="300">replaceAll сначала проверяет флаг g.</text>
        <text x="310" y="319">Строку вместо шаблона replace и split ищут буквально, а match и search делают шаблоном.</text>
    </g>
</svg>
