<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 272" role="img" aria-label="Строка Аман,Мерет;Гүлнар: куски Аман, Мерет, Гүлнар и разделители запятая и точка с запятой. split по классу [,;] даёт три куска — разделители выпадают. split по шаблону с группой ([,;]) даёт пять элементов: куски и между ними сами разделители">
    <g font-family="Consolas, monospace" font-size="13" text-anchor="middle">
        <rect x="60" y="30" width="90" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="105" y="51" fill="#334155">Аман</text>
        <rect x="160" y="30" width="36" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="178" y="51" fill="#9f1239" font-weight="700">,</text>
        <rect x="206" y="30" width="100" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="256" y="51" fill="#334155">Мерет</text>
        <rect x="316" y="30" width="36" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="334" y="51" fill="#9f1239" font-weight="700">;</text>
        <rect x="362" y="30" width="110" height="32" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="417" y="51" fill="#334155">Гүлнар</text>

        <rect x="60" y="100" width="90" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="105" y="121" fill="#15803d">'Аман'</text>
        <rect x="206" y="100" width="100" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="256" y="121" fill="#15803d">'Мерет'</text>
        <rect x="362" y="100" width="110" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="417" y="121" fill="#15803d">'Гүлнар'</text>

        <rect x="60" y="162" width="90" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="105" y="183" fill="#15803d">'Аман'</text>
        <rect x="160" y="162" width="36" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="178" y="183" fill="#9f1239">','</text>
        <rect x="206" y="162" width="100" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="256" y="183" fill="#15803d">'Мерет'</text>
        <rect x="316" y="162" width="36" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="334" y="183" fill="#9f1239">';'</text>
        <rect x="362" y="162" width="110" height="32" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="417" y="183" fill="#15803d">'Гүлнар'</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3 3">
        <path d="M 105 62 L 105 98"/><path d="M 256 62 L 256 98"/><path d="M 417 62 L 417 98"/>
        <path d="M 105 132 L 105 160"/><path d="M 256 132 L 256 160"/><path d="M 417 132 L 417 160"/>
    </g>
    <g fill="none" stroke="#f43f5e" stroke-width="1.2" stroke-dasharray="3 3">
        <path d="M 178 62 L 178 160"/><path d="M 334 62 L 334 160"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#334155">
        <text x="548" y="51">строка</text>
        <text x="548" y="121">split(/[,;]/)</text>
        <text x="548" y="183">split(/([,;])/)</text>
    </g>
    <rect x="14" y="210" width="592" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="232">Куски между разделителями — элементы массива; сами разделители в него не входят.</text>
        <text x="310" y="252" font-weight="700">Группа в разделителе возвращает их: её текст встаёт между кусками.</text>
    </g>
</svg>
