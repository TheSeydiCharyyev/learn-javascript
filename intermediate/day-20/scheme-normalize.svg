<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Слева é одной кодовой точкой U+00E9, длина 1. Справа e и знак ударения U+0301, длина 2. Стрелка NFD раскладывает, стрелка NFC собирает. Строгое равенство сравнивает части, поэтому false; после normalize — true. NFKC и NFKD ещё и упрощают совместимые знаки. Поиск без диакритики: разложить и удалить знаки, но й и ё тоже распадутся">
    <rect x="40" y="24" width="200" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <rect x="380" y="24" width="200" height="76" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="26" text-anchor="middle" fill="#334155">
        <text x="140" y="62">&#xE9;</text>
        <text x="480" y="62">e&#x301;</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#475569">
        <text x="140" y="88">U+00E9 · length 1</text>
        <text x="480" y="88">U+0065 U+0301 · length 2</text>
    </g>
    <path d="M 246 48 L 370 48" fill="none" stroke="#f43f5e" stroke-width="2"/>
    <path d="M 378 48 L 368 43 L 368 53 Z" fill="#f43f5e"/>
    <path d="M 374 78 L 250 78" fill="none" stroke="#16a34a" stroke-width="2"/>
    <path d="M 242 78 L 252 73 L 252 83 Z" fill="#16a34a"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <text x="310" y="40" fill="#9f1239">NFD — разложить</text>
        <text x="310" y="96" fill="#15803d">NFC — собрать</text>
    </g>
    <text x="310" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">"\u00E9" === "e\u0301" → false;  после normalize() → true</text>
    <text x="310" y="154" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">NFKC и NFKD приводят ещё и «совместимые» знаки: ﬀ → ff, ① → 1, x² → x2.</text>
    <rect x="14" y="172" width="592" height="82" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="194">Поиск без диакритики: normalize("NFD"), затем replace(/\p{M}/gu, "").</text>
        <text x="310" y="214">Gülnar → Gulnar, çörek → corek, dünýä → dunya.</text>
        <text x="310" y="236" font-weight="700">Но «й» и «ё» тоже распадутся на букву и знак: «йод» → «иод».</text>
    </g>
</svg>
