<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 280" role="img" aria-label="CodePointAt на строке a, смайлик, b: на месте 0 часть 0061 — точка a, одна часть; на месте 1 старшая D83D и следом младшая DE42 — пара, две части; на месте 3 часть 0062 — b. Итог: три точки, строка правильная. На строке из одинокой D83D и b: на месте 0 половинка без пары, isWellFormed даёт false, toWellFormed заменяет её знаком U+FFFD">
    <text x="20" y="20" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">CodePointAt(s, k) — шаг итератора строки, isWellFormed и toWellFormed</text>
    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
        <rect x="40" y="32" width="70" height="32" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="75" y="53" fill="#334155">0061</text>
        <rect x="116" y="32" width="70" height="32" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="151" y="53" fill="#9f1239">D83D</text>
        <rect x="192" y="32" width="70" height="32" rx="5" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/><text x="227" y="53" fill="#9f1239">DE42</text>
        <rect x="268" y="32" width="70" height="32" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="303" y="53" fill="#334155">0062</text>
        <rect x="40" y="132" width="70" height="32" rx="5" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="75" y="153" fill="#b45309">D83D</text>
        <rect x="116" y="132" width="70" height="32" rx="5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="151" y="153" fill="#334155">0062</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#94a3b8">
        <text x="75" y="78">0</text><text x="151" y="78">1</text><text x="227" y="78">2</text><text x="303" y="78">3</text>
        <text x="75" y="178">0</text><text x="151" y="178">1</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.2">
        <path d="M 42 86 L 42 92 L 108 92 L 108 86"/>
        <path d="M 118 86 L 118 92 L 260 92 L 260 86"/>
        <path d="M 270 86 L 270 92 L 336 92 L 336 86"/>
        <path d="M 42 186 L 42 192 L 108 192 L 108 186"/>
        <path d="M 118 186 L 118 192 L 184 192 L 184 186"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">
        <text x="75" y="108">a · 1</text>
        <text x="189" y="108">🙂 · 2 части</text>
        <text x="303" y="108">b · 1</text>
        <text x="75" y="208" fill="#b45309">без пары · 1</text>
        <text x="151" y="208">b · 1</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#334155">
        <text x="372" y="50">[...s] → ['a', '🙂', 'b']</text>
        <text x="372" y="72">isWellFormed() → true</text>
        <text x="372" y="150">isWellFormed() → false</text>
        <text x="372" y="172">toWellFormed() → '&#xFFFD;b'</text>
    </g>
    <rect x="14" y="222" width="592" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="242">Старшая половинка (D800–DBFF) и сразу младшая (DC00–DFFF) — одна точка из двух частей.</text>
        <text x="310" y="261" font-weight="700">Половинка без пары — «точка» с пометкой: её и ловят isWellFormed и toWellFormed.</text>
    </g>
</svg>
