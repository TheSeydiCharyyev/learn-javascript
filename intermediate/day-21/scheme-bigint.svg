<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 210" role="img" aria-label="Ось целых чисел от 9007199254740990 до 9007199254740996. Number хранит точно числа до 9007199254740992 включительно, а дальше только чётные: 994 и 996; 993 и 995 пропускает. BigInt хранит каждое целое">
    <text x="310" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">целые около 2⁵³ = 9 007 199 254 740 992</text>
    <path d="M 50 86 L 580 86" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <g stroke="#94a3b8" stroke-width="1.5">
        <path d="M 80 80 L 80 92"/><path d="M 160 80 L 160 92"/><path d="M 240 80 L 240 92"/><path d="M 320 80 L 320 92"/>
        <path d="M 400 80 L 400 92"/><path d="M 480 80 L 480 92"/><path d="M 560 80 L 560 92"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="80" y="108">…990</text><text x="160" y="108">…991</text><text x="240" y="108">…992</text><text x="320" y="108">…993</text>
        <text x="400" y="108">…994</text><text x="480" y="108">…995</text><text x="560" y="108">…996</text>
    </g>
    <text x="14" y="60" font-family="Segoe UI, sans-serif" font-size="11" fill="#0e7490">Number</text>
    <g fill="#06b6d4">
        <circle cx="80" cy="56" r="6"/><circle cx="160" cy="56" r="6"/><circle cx="240" cy="56" r="6"/><circle cx="400" cy="56" r="6"/><circle cx="560" cy="56" r="6"/>
    </g>
    <g fill="none" stroke="#f43f5e" stroke-width="2">
        <path d="M 314 50 L 326 62 M 326 50 L 314 62"/><path d="M 474 50 L 486 62 M 486 50 L 474 62"/>
    </g>
    <text x="320" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9f1239">…993 → …992</text>
    <text x="14" y="134" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">BigInt</text>
    <g fill="#16a34a">
        <circle cx="80" cy="130" r="6"/><circle cx="160" cy="130" r="6"/><circle cx="240" cy="130" r="6"/><circle cx="320" cy="130" r="6"/>
        <circle cx="400" cy="130" r="6"/><circle cx="480" cy="130" r="6"/><circle cx="560" cy="130" r="6"/>
    </g>
    <text x="160" y="72" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">MAX_SAFE_INTEGER</text>
    <rect x="14" y="152" width="592" height="50" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="172">До 2⁵³ Number хранит каждое целое; дальше — только каждое второе, потом каждое четвёртое.</text>
        <text x="310" y="191" font-weight="700">BigInt хранит любое целое точно — но с Number в одном выражении его не смешать.</text>
    </g>
</svg>
