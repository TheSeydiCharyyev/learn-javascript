<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Один момент — число 1791797415250 миллисекунд от эпохи. По UTC это 09:30:15, в Ашхабаде (UTC+5) 14:30:15 и смещение минус 300 минут, в Нью-Йорке летом (UTC−4) 05:30:15 и смещение 240. Пояс берётся с устройства и в дате не хранится">
    <text x="310" y="22" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" fill="#334155">момент: 1791797415250 мс от 1970-01-01T00:00Z</text>
    <path d="M 40 46 L 580 46" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="310" cy="46" r="7" fill="#06b6d4"/>
    <g fill="none" stroke="#06b6d4" stroke-width="1.3" stroke-dasharray="4 3">
        <path d="M 304 52 L 116 98"/><path d="M 310 53 L 310 98"/><path d="M 316 52 L 504 98"/>
    </g>
    <rect x="20" y="100" width="184" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="218" y="100" width="184" height="80" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <rect x="416" y="100" width="184" height="80" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" font-weight="700">
        <text x="112" y="120" fill="#334155">UTC</text>
        <text x="310" y="120" fill="#0e7490">Ашхабат, UTC+5</text>
        <text x="508" y="120" fill="#334155">Нью-Йорк летом, UTC−4</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11.5" text-anchor="middle" fill="#334155">
        <text x="112" y="140">09:30:15</text><text x="310" y="140">14:30:15</text><text x="508" y="140">05:30:15</text>
        <text x="112" y="158">getUTCHours() → 9</text><text x="310" y="158">getHours() → 14</text><text x="508" y="158">getHours() → 5</text>
        <text x="112" y="174">смещение 0</text><text x="310" y="174">смещение −300</text><text x="508" y="174">смещение 240</text>
    </g>
    <rect x="14" y="196" width="592" height="58" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="310" y="218" font-weight="700">Число в дате одно на весь мир; пояс берётся с устройства и в дате не хранится.</text>
        <text x="310" y="238">get… и set… — местное время, getUTC… и setUTC… — UTC; смещение «минус» — пояс восточнее.</text>
    </g>
</svg>
