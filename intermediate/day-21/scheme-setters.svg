<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="31 января 2026 года, setMonth(1) делает 31 февраля, которого нет; три лишних дня переносятся, получается 3 марта. Функция addMonths сначала ставит 1 число, переходит на февраль и ставит меньшее из 31 и 28 — получается 28 февраля">
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="20" y="30" width="150" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="57" fill="#334155">31 января 2026</text>
        <rect x="235" y="30" width="150" height="44" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2" stroke-dasharray="5 3"/><text x="310" y="57" fill="#9f1239">«31 февраля»</text>
        <rect x="450" y="30" width="150" height="44" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="2"/><text x="525" y="57" fill="#9f1239" font-weight="700">3 марта 2026</text>
        <rect x="20" y="124" width="150" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="151" fill="#334155">31 января 2026</text>
        <rect x="235" y="124" width="150" height="44" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="310" y="151" fill="#0e7490">1 февраля</text>
        <rect x="450" y="124" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="151" fill="#15803d" font-weight="700">28 февраля 2026</text>
    </g>
    <g fill="none" stroke-width="2">
        <path d="M 170 52 L 227 52" stroke="#f43f5e"/><path d="M 385 52 L 442 52" stroke="#f43f5e"/>
        <path d="M 170 146 L 227 146" stroke="#06b6d4"/><path d="M 385 146 L 442 146" stroke="#16a34a"/>
    </g>
    <g>
        <path d="M 235 52 L 225 47 L 225 57 Z" fill="#f43f5e"/><path d="M 450 52 L 440 47 L 440 57 Z" fill="#f43f5e"/>
        <path d="M 235 146 L 225 141 L 225 151 Z" fill="#06b6d4"/><path d="M 450 146 L 440 141 L 440 151 Z" fill="#16a34a"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle">
        <text x="202" y="92" fill="#9f1239">setMonth(1)</text>
        <text x="417" y="92" fill="#9f1239">+3 лишних дня</text>
        <text x="202" y="186" fill="#0e7490">setDate(1), месяц + 1</text>
        <text x="417" y="186" fill="#15803d">min(31, 28)</text>
    </g>
    <text x="20" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">setMonth напрямую</text>
    <text x="20" y="112" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">addMonths</text>
    <rect x="14" y="198" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="218" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">В феврале 2026 года 28 дней: «31 февраля» — это 28 февраля и ещё 3 дня, то есть 3 марта.</text>
</svg>
