<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 238" role="img" aria-label="31 января 2026 плюс один месяц и 31 день: сначала месяцы, 31 февраля нет, число подгоняется до 28 февраля, затем плюс 31 день — 31 марта. Если сначала прибавить 31 день — 3 марта, потом месяц — 3 апреля. Внутри add сначала годы и месяцы с подгонкой числа, потом недели и дни">
    <text x="20" y="18" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">jan31.add({ months: 1, days: 31 })</text>
    <text x="20" y="112" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">jan31.add({ days: 31 }).add({ months: 1 })</text>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="20" y="30" width="150" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="57" fill="#334155">31 января 2026</text>
        <rect x="235" y="30" width="150" height="44" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="310" y="57" fill="#0e7490">28 февраля</text>
        <rect x="450" y="30" width="150" height="44" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="525" y="57" fill="#15803d" font-weight="700">31 марта 2026</text>
        <rect x="20" y="124" width="150" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="95" y="151" fill="#334155">31 января 2026</text>
        <rect x="235" y="124" width="150" height="44" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/><text x="310" y="151" fill="#0e7490">3 марта</text>
        <rect x="450" y="124" width="150" height="44" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><text x="525" y="151" fill="#334155" font-weight="700">3 апреля 2026</text>
    </g>
    <g fill="none" stroke-width="2">
        <path d="M 170 52 L 227 52" stroke="#06b6d4"/><path d="M 385 52 L 442 52" stroke="#16a34a"/>
        <path d="M 170 146 L 227 146" stroke="#94a3b8"/><path d="M 385 146 L 442 146" stroke="#94a3b8"/>
    </g>
    <g>
        <path d="M 235 52 L 225 47 L 225 57 Z" fill="#06b6d4"/><path d="M 450 52 L 440 47 L 440 57 Z" fill="#16a34a"/>
        <path d="M 235 146 L 225 141 L 225 151 Z" fill="#94a3b8"/><path d="M 450 146 L 440 141 L 440 151 Z" fill="#94a3b8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle">
        <text x="202" y="92" fill="#0e7490">месяцы: «31.02» → 28</text>
        <text x="417" y="92" fill="#15803d">дни: +31</text>
        <text x="202" y="186" fill="#475569">дни: +31</text>
        <text x="417" y="186" fill="#475569">месяцы: +1</text>
    </g>
    <rect x="14" y="198" width="592" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="219" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Внутри add: сначала годы и месяцы, число подгоняется к длине месяца, потом недели и дни.</text>
</svg>
