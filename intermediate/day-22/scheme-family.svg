<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 300" role="img" aria-label="Семья классов Temporal. Сегодня: PlainDate (дата 2026-10-12) плюс PlainTime (время 14:30:00) дают PlainDateTime (2026-10-12T14:30:00), и пространство имён Temporal.Now с функциями plainDateISO, plainTimeISO, plainDateTimeISO и timeZoneId. День 23: Duration, PlainYearMonth, PlainMonthDay. День 24: ZonedDateTime и Instant. Plain значит без пояса">
    <text x="310" y="20" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#334155">Temporal — пространство имён: 8 классов и Now</text>
    <rect x="20" y="34" width="180" height="64" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <rect x="220" y="34" width="180" height="64" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <rect x="420" y="34" width="180" height="64" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" font-weight="700" fill="#0e7490">
        <text x="110" y="56">PlainDate</text><text x="310" y="56">PlainTime</text><text x="510" y="56">PlainDateTime</text>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">
        <text x="110" y="76">2026-10-12</text><text x="310" y="76">14:30:00</text><text x="510" y="76">2026-10-12T14:30:00</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="110" y="91">год, месяц, число</text><text x="310" y="91">часы … наносекунды</text><text x="510" y="91">дата и время</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#0e7490">
        <text x="210" y="71">+</text><text x="410" y="71">=</text>
    </g>
    <rect x="20" y="112" width="580" height="48" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="310" y="132" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#0e7490">Temporal.Now — сегодня и сейчас на этом устройстве</text>
    <text x="310" y="150" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#334155">plainDateISO() · plainTimeISO() · plainDateTimeISO() · timeZoneId()</text>
    <text x="20" y="182" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">в следующие дни модуля:</text>
    <rect x="20" y="190" width="285" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="315" y="190" width="285" height="56" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle" fill="#334155">
        <text x="162" y="211" font-weight="700">день 23</text><text x="457" y="211" font-weight="700">день 24</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="162" y="233">Duration · PlainYearMonth · PlainMonthDay</text>
        <text x="457" y="233">ZonedDateTime · Instant</text>
    </g>
    <rect x="14" y="258" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="279" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Plain — «простые»: без пояса, как на листке календаря и на часах; момент с поясом — день 24.</text>
</svg>
