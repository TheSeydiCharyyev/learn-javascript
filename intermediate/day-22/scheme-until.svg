<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Шкала от 12 октября 2026 до 1 января 2027. start.until(end) и end.since(start) дают 81 день, start.since(end) — минус 81. С largestUnit months путь делится на 1 месяц до 12 ноября, ещё 1 месяц до 12 декабря и 20 дней до 1 января — 2 месяца 20 дней">
    <path d="M 40 70 L 568 70" fill="none" stroke="#0e7490" stroke-width="2"/>
    <path d="M 580 70 L 568 64 L 568 76 Z" fill="#0e7490"/>
    <text x="310" y="40" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#0e7490">start.until(end).days → 81 · end.since(start).days → 81</text>
    <text x="310" y="58" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9f1239">start.since(end).days → −81: знак — направление</text>
    <path d="M 40 110 L 580 110" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <g fill="#06b6d4">
        <circle cx="60" cy="110" r="6"/><circle cx="251" cy="110" r="4"/><circle cx="436" cy="110" r="4"/><circle cx="560" cy="110" r="6"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="60" y="96">2026-10-12</text><text x="251" y="96">2026-11-12</text><text x="436" y="96">2026-12-12</text><text x="560" y="96">2027-01-01</text>
    </g>
    <g fill="none" stroke="#0e7490" stroke-width="1.5">
        <path d="M 62 124 L 62 132 L 249 132 L 249 124"/><path d="M 253 124 L 253 132 L 434 132 L 434 124"/><path d="M 438 124 L 438 132 L 558 132 L 558 124"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11.5" text-anchor="middle" fill="#0e7490">
        <text x="155" y="150">1 месяц</text><text x="343" y="150">1 месяц</text><text x="498" y="150">20 дней</text>
    </g>
    <text x="310" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">{ largestUnit: "months" } → 2 месяца 20 дней · { largestUnit: "weeks" } → 11 недель 4 дня</text>
    <rect x="14" y="186" width="592" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="207" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">until — от этой даты до другой, since — от другой до этой; largestUnit — самая крупная единица ответа.</text>
</svg>
