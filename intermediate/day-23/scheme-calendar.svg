<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Сколько дней в P1M: от 2026-01-01 — 31 день, от 2026-02-01 — 28 дней, от 2028-02-01 — 29 дней. Без relativeTo — RangeError. Годы, месяцы и недели — календарные единицы, их длину в днях задаёт дата-опора">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">Temporal.Duration.from({ months: 1 }).total({ unit: "days", relativeTo })</text>
    <rect x="250" y="32" width="120" height="34" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="310" y="54" text-anchor="middle" font-family="Consolas, monospace" font-size="14" font-weight="700" fill="#0e7490">P1M</text>
    <g fill="none" stroke="#06b6d4" stroke-width="1.3" stroke-dasharray="4 3">
        <path d="M 296 66 L 112 100"/><path d="M 310 66 L 310 100"/><path d="M 324 66 L 508 100"/>
    </g>
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
        <rect x="20" y="100" width="184" height="58" rx="8"/><rect x="218" y="100" width="184" height="58" rx="8"/><rect x="416" y="100" width="184" height="58" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#475569">
        <text x="112" y="118">от 2026-01-01</text><text x="310" y="118">от 2026-02-01</text><text x="508" y="118">от 2028-02-01</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0e7490">
        <text x="112" y="137">31 день</text><text x="310" y="137">28 дней</text><text x="508" y="137">29 дней</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="112" y="152">январь</text><text x="310" y="152">февраль</text><text x="508" y="152">февраль високосного года</text>
    </g>
    <text x="310" y="180" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9f1239">без relativeTo — RangeError: месяц сам не знает, сколько в нём дней</text>
    <rect x="14" y="194" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="216" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">Годы, месяцы и недели — календарные единицы: их длину в днях задаёт дата-опора.</text>
</svg>
