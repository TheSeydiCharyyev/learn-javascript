<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 258" role="img" aria-label="Перенос в round: было 100 часов, 100 минут, 100 секунд. 100 секунд — это 1 минута и 40 секунд, минут становится 101 — это 1 час и 41 минута, часов 101 — это 4 суток и 5 часов. Итог P4DT5H41M40S. С largestUnit hours — PT101H41M40S, round до часов — PT102H">
    <text x="310" y="20" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">PT100H100M100S → round({ largestUnit: "days" }) → P4DT5H41M40S</text>
    <g font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#475569">
        <text x="90" y="44">дни</text><text x="230" y="44">часы</text><text x="370" y="44">минуты</text><text x="510" y="44">секунды</text>
    </g>
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
        <rect x="30" y="52" width="120" height="36" rx="8"/><rect x="170" y="52" width="120" height="36" rx="8"/><rect x="310" y="52" width="120" height="36" rx="8"/><rect x="450" y="52" width="120" height="36" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="14" text-anchor="middle" fill="#334155">
        <text x="90" y="75">0</text><text x="230" y="75">100</text><text x="370" y="75">100</text><text x="510" y="75">100</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#0e7490">
        <text x="510" y="108">100 с =</text><text x="510" y="124">1 мин + 40 с</text>
        <text x="370" y="108">100 + 1 = 101 мин =</text><text x="370" y="124">1 ч + 41 мин</text>
        <text x="230" y="108">100 + 1 = 101 ч =</text><text x="230" y="124">4 сут + 5 ч</text>
        <text x="90" y="108">0 + 4</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#06b6d4">
        <text x="440" y="120">←</text><text x="300" y="120">←</text><text x="160" y="120">←</text>
    </g>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="2">
        <rect x="30" y="138" width="120" height="36" rx="8"/><rect x="170" y="138" width="120" height="36" rx="8"/><rect x="310" y="138" width="120" height="36" rx="8"/><rect x="450" y="138" width="120" height="36" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle" fill="#15803d">
        <text x="90" y="161">4</text><text x="230" y="161">5</text><text x="370" y="161">41</text><text x="510" y="161">40</text>
    </g>
    <text x="310" y="200" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">largestUnit: "hours" → PT101H41M40S · round("hours") → PT102H</text>
    <rect x="14" y="216" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="238" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">round переносит лишнее в старшие единицы до largestUnit и округляет младшие до smallestUnit.</text>
</svg>
