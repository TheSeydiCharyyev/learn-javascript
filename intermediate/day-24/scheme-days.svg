<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Ночь 25 октября 2026 года в Берлине: по UTC часы идут подряд 22, 23, 00, 01, 02, 03, 04, а по Берлину — 00:00, 01:00, 02:00, снова 02:00, 03:00, 04:00, 05:00. Час с 02:00 до 02:59 бывает дважды: сначала со смещением +02:00, потом +01:00. hoursInDay даёт 25">
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">
        <text x="14" y="62">Берлин</text><text x="14" y="146">UTC</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle">
        <text x="170" y="34" fill="#0e7490">смещение +02:00</text><text x="450" y="34" fill="#9f1239">смещение +01:00</text>
    </g>
    <g fill="none" stroke-width="1.5">
        <path d="M 80 40 L 280 40" stroke="#06b6d4"/><path d="M 330 40 L 580 40" stroke="#f43f5e"/>
    </g>
    <path d="M 60 76 L 590 76" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <path d="M 60 124 L 590 124" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <g fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
        <path d="M 90 76 L 90 124"/><path d="M 170 76 L 170 124"/><path d="M 250 76 L 250 124"/><path d="M 330 76 L 330 124"/><path d="M 410 76 L 410 124"/><path d="M 490 76 L 490 124"/><path d="M 570 76 L 570 124"/>
    </g>
    <g font-family="Consolas, monospace" font-size="12" text-anchor="middle">
        <text x="90" y="64" fill="#334155">00:00</text><text x="170" y="64" fill="#334155">01:00</text><text x="250" y="64" fill="#9f1239" font-weight="700">02:00</text><text x="330" y="64" fill="#9f1239" font-weight="700">02:00</text><text x="410" y="64" fill="#334155">03:00</text><text x="490" y="64" fill="#334155">04:00</text><text x="570" y="64" fill="#334155">05:00</text>
        <text x="90" y="144" fill="#475569">22:00</text><text x="170" y="144" fill="#475569">23:00</text><text x="250" y="144" fill="#475569">00:00</text><text x="330" y="144" fill="#475569">01:00</text><text x="410" y="144" fill="#475569">02:00</text><text x="490" y="144" fill="#475569">03:00</text><text x="570" y="144" fill="#475569">04:00</text>
    </g>
    <rect x="250" y="84" width="160" height="32" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="330" y="104" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9f1239">02:00–02:59 — дважды</text>
    <text x="310" y="174" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">hoursInDay → 25 · add({ days: 1 }) → те же часы · add({ hours: 24 }) → на час раньше</text>
    <rect x="14" y="188" width="592" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="209" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#334155">В 03:00 по летнему времени часы переводят на 02:00: местный час повторяется, UTC идёт ровно.</text>
</svg>
