<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Мосты между классами: Date через toTemporalInstant становится Instant, Instant через toZonedDateTimeISO с поясом — ZonedDateTime, ZonedDateTime через toPlainDateTime — Plain-классы. Обратно: PlainDateTime через toZonedDateTime с поясом — ZonedDateTime, ZonedDateTime через toInstant — Instant, Instant через new Date(epochMilliseconds) — Date">
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
        <rect x="14" y="84" width="90" height="50" rx="8"/><rect x="494" y="84" width="112" height="50" rx="8"/>
    </g>
    <g fill="#ecfeff" stroke="#06b6d4" stroke-width="2">
        <rect x="154" y="84" width="110" height="50" rx="8"/><rect x="314" y="84" width="130" height="50" rx="8"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" text-anchor="middle">
        <text x="59" y="105" fill="#334155">Date</text><text x="209" y="105" fill="#0e7490">Instant</text><text x="379" y="105" fill="#0e7490">ZonedDateTime</text><text x="550" y="105" fill="#334155">PlainDateTime</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="59" y="123">момент, мс</text><text x="209" y="123">момент, нс</text><text x="379" y="123">момент + пояс</text><text x="550" y="123">часы на стене</text>
    </g>
    <g fill="none" stroke-width="1.8">
        <path d="M 104 98 L 146 98" stroke="#0e7490"/><path d="M 264 98 L 306 98" stroke="#0e7490"/><path d="M 444 98 L 486 98" stroke="#0e7490"/>
        <path d="M 154 120 L 112 120" stroke="#94a3b8"/><path d="M 314 120 L 272 120" stroke="#94a3b8"/><path d="M 494 120 L 452 120" stroke="#94a3b8"/>
    </g>
    <g>
        <path d="M 154 98 L 145 93 L 145 103 Z" fill="#0e7490"/><path d="M 314 98 L 305 93 L 305 103 Z" fill="#0e7490"/><path d="M 494 98 L 485 93 L 485 103 Z" fill="#0e7490"/>
        <path d="M 104 120 L 113 115 L 113 125 Z" fill="#94a3b8"/><path d="M 264 120 L 273 115 L 273 125 Z" fill="#94a3b8"/><path d="M 444 120 L 453 115 L 453 125 Z" fill="#94a3b8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle">
        <text x="129" y="70" fill="#0e7490">toTemporalInstant()</text><text x="289" y="56" fill="#0e7490">toZonedDateTimeISO(пояс)</text><text x="469" y="70" fill="#0e7490">toPlainDateTime()</text>
        <text x="129" y="156" fill="#475569">new Date(epochMilliseconds)</text><text x="289" y="170" fill="#475569">toInstant()</text><text x="469" y="156" fill="#475569">toZonedDateTime(пояс)</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3">
        <path d="M 289 60 L 289 94"/><path d="M 289 124 L 289 160"/>
    </g>
    <rect x="14" y="180" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="199" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Пояс нужен, чтобы перейти от момента к часам на стене и обратно; Instant и Plain-классы его не хранят.</text>
</svg>
