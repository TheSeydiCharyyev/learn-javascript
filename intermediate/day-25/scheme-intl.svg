<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Шаблон Intl: локаль и настройки передаются в конструктор, он создаёт форматировщик, а тот превращает данные в строку методом format или в части методом formatToParts. toLocaleString у числа или даты — короткая запись того же: каждый вызов создаёт форматировщик заново">
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
        <rect x="14" y="30" width="150" height="34" rx="8"/><rect x="14" y="76" width="150" height="34" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">
        <text x="89" y="51">"ru-RU"</text><text x="89" y="97">{ currency: "TMT" }</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="14" y="22">локаль</text><text x="14" y="128">настройки</text>
    </g>
    <rect x="214" y="44" width="170" height="50" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="299" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" font-weight="700" fill="#0e7490">new Intl.NumberFormat</text>
    <text x="299" y="84" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">запоминает правила</text>
    <g fill="none" stroke="#0e7490" stroke-width="1.8">
        <path d="M 164 47 L 206 62"/><path d="M 164 93 L 206 78"/><path d="M 384 69 L 426 69"/>
    </g>
    <g fill="#0e7490">
        <path d="M 214 64 L 204 57 L 203 67 Z"/><path d="M 214 76 L 203 73 L 204 83 Z"/><path d="M 434 69 L 425 64 L 425 74 Z"/>
    </g>
    <rect x="434" y="30" width="172" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="434" y="76" width="172" height="34" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#15803d">
        <text x="520" y="51">format(1250.5)</text><text x="520" y="97">formatToParts(…)</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="520" y="128">строка или части с типами</text>
    </g>
    <rect x="14" y="146" width="592" height="40" rx="8" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="310" y="163" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#9a3412">(1250.5).toLocaleString("ru-RU", { style: "currency", currency: "TMT" })</text>
    <text x="310" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9a3412">короткая запись того же — но форматировщик создаётся заново при каждом вызове</text>
    <rect x="14" y="196" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="215" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Много чисел или дат с одними правилами — один форматировщик и его format в цикле.</text>
</svg>
