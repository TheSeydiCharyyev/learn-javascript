<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 216" role="img" aria-label="Как Intl выбирает локаль: запрошен список, например tk, затем ru. Если tk есть в данных браузера — берётся tk; в Chrome 155 его нет, тогда пробуется следующий тег, ru. Если не подошёл ни один — язык браузера. В Node 22 с полной ICU tk есть, и выводится Oktýabr">
    <rect x="14" y="30" width="130" height="40" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="79" y="55" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#334155">["tk", "ru"]</text>
    <text x="14" y="22" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">запрошено</text>
    <rect x="194" y="30" width="150" height="40" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="269" y="48" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0e7490">tk есть в данных?</text>
    <text x="269" y="63" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">Chrome 155 — нет</text>
    <rect x="394" y="30" width="212" height="40" rx="8" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
    <text x="500" y="55" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#15803d">Node 22: tk → «Oktýabr»</text>
    <rect x="194" y="104" width="150" height="40" rx="8" fill="#ecfeff" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="269" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#0e7490">следующий: ru</text>
    <text x="269" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">есть → «октябрь»</text>
    <rect x="394" y="104" width="212" height="40" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
    <text x="500" y="122" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9f1239">ни один не подошёл —</text>
    <text x="500" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9f1239">язык браузера, без ошибки</text>
    <g fill="none" stroke-width="1.8">
        <path d="M 144 50 L 186 50" stroke="#0e7490"/><path d="M 344 50 L 386 50" stroke="#16a34a"/><path d="M 269 70 L 269 96" stroke="#0e7490"/><path d="M 344 124 L 386 124" stroke="#f43f5e"/>
    </g>
    <g>
        <path d="M 194 50 L 185 45 L 185 55 Z" fill="#0e7490"/><path d="M 394 50 L 385 45 L 385 55 Z" fill="#16a34a"/><path d="M 269 104 L 264 95 L 274 95 Z" fill="#0e7490"/><path d="M 394 124 L 385 119 L 385 129 Z" fill="#f43f5e"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">
        <text x="350" y="42">да</text><text x="275" y="88">нет</text><text x="350" y="116">нет</text>
    </g>
    <text x="310" y="172" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">Intl.DateTimeFormat.supportedLocalesOf(["tk", "ru"]) → ['ru']</text>
    <rect x="14" y="184" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="203" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Неизвестная локаль — не ошибка, а тихая подмена: проверяйте её через supportedLocalesOf.</text>
</svg>
