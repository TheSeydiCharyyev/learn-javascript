<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Цепочка причин: поймана ошибка «колода animals не загружена», её cause — «файл колоды повреждён», а её cause — SyntaxError от JSON.parse. String и stack показывают только верхнюю ошибку">
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#475569">
        <text x="98" y="26">e</text><text x="310" y="26">e.cause</text><text x="522" y="26">e.cause.cause</text>
    </g>
    <rect x="14" y="36" width="168" height="82" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="226" y="36" width="168" height="82" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="438" y="36" width="168" height="82" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle">
        <text x="98" y="56" fill="#b45309">Error</text><text x="310" y="56" fill="#b45309">Error</text><text x="522" y="56" fill="#991b1b">SyntaxError</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#334155">
        <text x="98" y="74">колода «animals»</text><text x="98" y="90">не загружена</text>
        <text x="310" y="74">файл колоды</text><text x="310" y="90">повреждён</text>
        <text x="522" y="74">Unexpected end</text><text x="522" y="90">of JSON input</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">
        <text x="98" y="108">создана в loadDeck</text><text x="310" y="108">создана в parseDeck</text><text x="522" y="108">бросил JSON.parse</text>
    </g>
    <g fill="none" stroke="#b45309" stroke-width="1.8">
        <path d="M 182 77 L 217 77"/><path d="M 394 77 L 429 77"/>
    </g>
    <g fill="#b45309">
        <path d="M 226 77 L 216 72 L 216 82 Z"/><path d="M 438 77 L 428 72 L 428 82 Z"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10" text-anchor="middle" fill="#b45309">
        <text x="204" y="68">cause</text><text x="416" y="68">cause</text>
    </g>
    <rect x="14" y="134" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="153" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">String(e) и e.stack — только про верхнюю ошибку; остальное видно по ссылкам cause</text>
    <rect x="14" y="174" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="193" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Каждый слой добавляет свой смысл, но не теряет того, что было ниже.</text>
</svg>
