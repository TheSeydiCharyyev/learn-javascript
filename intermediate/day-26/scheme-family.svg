<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Семья ошибок: от Error наследуют шесть встроенных видов — TypeError, RangeError, SyntaxError, ReferenceError, EvalError, URIError — и свой класс AppError, от которого наследуют ValidationError и NotFoundError">
    <rect x="250" y="12" width="120" height="34" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="310" y="34" text-anchor="middle" font-family="Consolas, monospace" font-size="12.5" font-weight="700" fill="#b45309">Error</text>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="382" y="26">в Error.prototype:</text><text x="382" y="40">name «Error», message «», toString</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.8">
        <path d="M 310 46 L 310 64"/><path d="M 179 64 L 485 64"/><path d="M 179 64 L 179 84"/><path d="M 485 64 L 485 110"/>
        <path d="M 485 136 L 485 143 L 435 143 L 435 150"/><path d="M 485 143 L 549 143 L 549 150"/>
    </g>
    <rect x="14" y="84" width="330" height="104" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="24" y="102" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">встроенные виды (20.5.5), name — в их прототипах</text>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
        <rect x="26" y="112" width="96" height="26" rx="6"/><rect x="130" y="112" width="96" height="26" rx="6"/><rect x="234" y="112" width="96" height="26" rx="6"/>
        <rect x="26" y="148" width="96" height="26" rx="6"/><rect x="130" y="148" width="96" height="26" rx="6"/><rect x="234" y="148" width="96" height="26" rx="6"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="74" y="129">TypeError</text><text x="178" y="129">RangeError</text><text x="282" y="129">SyntaxError</text>
        <text x="74" y="165">ReferenceError</text><text x="178" y="165">EvalError</text><text x="282" y="165">URIError</text>
    </g>
    <rect x="364" y="84" width="242" height="104" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="374" y="102" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#92400e">свои классы</text>
    <g fill="#ffffff" stroke="#f59e0b" stroke-width="1.5">
        <rect x="430" y="110" width="110" height="26" rx="6"/><rect x="376" y="150" width="118" height="26" rx="6"/><rect x="500" y="150" width="98" height="26" rx="6"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#92400e">
        <text x="485" y="127">AppError</text><text x="435" y="167">ValidationError</text><text x="549" y="167">NotFoundError</text>
    </g>
    <rect x="14" y="200" width="592" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="310" y="219">name: у встроенного вида — в прототипе, у своего класса — в объекте (this.name = new.target.name)</text>
        <text x="310" y="236">instanceof Error — true для всей семьи; Error.isError — для всего, что создал конструктор Error</text>
    </g>
</svg>
