<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Одни и те же три промиса: A выполняется через 300 мс, B отклоняется через 100, C выполняется через 200. Promise.all и Promise.race отклоняются через 100 мс с ошибкой B, Promise.any выполняется через 200 мс значением C, Promise.allSettled выполняется через 300 мс тремя отчётами">
    <g stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4 3">
        <path d="M 250 18 L 250 96"/><path d="M 350 18 L 350 96"/><path d="M 450 18 L 450 96"/>
        <path d="M 250 118 L 250 206"/><path d="M 350 118 L 350 206"/><path d="M 450 118 L 450 206"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#334155">
        <text x="14" y="34">later("A", 300)</text><text x="14" y="58">failLater("B", 100)</text><text x="14" y="82">later("C", 200)</text>
    </g>
    <g stroke-width="4" stroke-linecap="round">
        <path d="M 150 30 L 450 30" stroke="#86efac"/><path d="M 150 54 L 250 54" stroke="#fca5a5"/><path d="M 150 78 L 350 78" stroke="#86efac"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5">
        <text x="460" y="34" fill="#15803d">A</text><text x="260" y="58" fill="#b91c1c">B — отказ</text><text x="360" y="82" fill="#15803d">C</text>
    </g>
    <path d="M 150 96 L 456 96" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
        <text x="150" y="110">0</text><text x="250" y="110">100 мс</text><text x="350" y="110">200 мс</text><text x="450" y="110">300 мс</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#92400e">
        <text x="14" y="134">Promise.all</text><text x="14" y="158">Promise.race</text><text x="14" y="182">Promise.any</text><text x="14" y="206">Promise.allSettled</text>
    </g>
    <g stroke-width="2">
        <path d="M 150 130 L 250 130" stroke="#f59e0b"/><path d="M 150 154 L 250 154" stroke="#f59e0b"/><path d="M 150 178 L 350 178" stroke="#f59e0b"/><path d="M 150 202 L 450 202" stroke="#f59e0b"/>
    </g>
    <g>
        <circle cx="250" cy="130" r="5" fill="#dc2626"/><circle cx="250" cy="154" r="5" fill="#dc2626"/><circle cx="350" cy="178" r="5" fill="#16a34a"/><circle cx="450" cy="202" r="5" fill="#16a34a"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5">
        <text x="262" y="134" fill="#b91c1c">отклонён: B</text><text x="262" y="158" fill="#b91c1c">отклонён: B</text>
        <text x="362" y="182" fill="#15803d">выполнен: C</text><text x="462" y="206" fill="#15803d">три отчёта</text>
    </g>
    <rect x="14" y="218" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="237" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Одни и те же три промиса — четыре ответа на вопрос «когда хватит ждать».</text>
</svg>
