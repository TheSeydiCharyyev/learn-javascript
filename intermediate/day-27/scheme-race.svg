<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Таймаут через Promise.race. Слева загрузка за 100 мс обгоняет таймер на 200 мс, и race выполняется данными. Справа загрузка за 300 мс опаздывает, таймер отказывает первым, и race отклоняется ошибкой «нет ответа за 200 мс». В обоих случаях finally снимает таймер, а опоздавшая загрузка не отменяется">
    <rect x="14" y="10" width="288" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="318" y="10" width="288" height="128" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#334155">
        <text x="26" y="30">загрузка 100 мс, лимит 200</text><text x="330" y="30">загрузка 300 мс, лимит 200</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="26" y="58">загрузка</text><text x="26" y="86">таймер</text><text x="330" y="58">загрузка</text><text x="330" y="86">таймер</text>
    </g>
    <g stroke-width="4" stroke-linecap="round">
        <path d="M 90 54 L 156 54" stroke="#86efac"/><path d="M 90 82 L 222 82" stroke="#e2e8f0"/>
        <path d="M 394 54 L 592 54" stroke="#e2e8f0"/><path d="M 394 82 L 526 82" stroke="#fca5a5"/>
    </g>
    <circle cx="156" cy="54" r="5" fill="#16a34a"/><circle cx="526" cy="82" r="5" fill="#dc2626"/>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b">
        <text x="166" y="58">первая</text><text x="230" y="86">снят</text><text x="536" y="86">первый</text>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5">
        <text x="26" y="122" fill="#15803d">race → "данные"</text><text x="330" y="122" fill="#b91c1c">race → Error: нет ответа за 200 мс</text>
    </g>
    <rect x="14" y="150" width="592" height="56" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">
        <text x="310" y="172">Проигравший не отменяется: опоздавшая загрузка справа всё равно дойдёт до конца.</text>
        <text x="310" y="192">finally(() =&gt; clearTimeout(timer)) снимает таймер, если победила загрузка.</text>
    </g>
</svg>
