<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 248" role="img" aria-label="PerformPromiseAll: для каждого из трёх промисов создаётся своя функция выполнения с номером Index; она кладёт значение на своё место в values и уменьшает счётчик; при нуле Promise.all выполняется массивом; отказ любого промиса идёт в общий reject">
    <rect x="14" y="10" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="29" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#334155">Promise.all([pA, pB, pC]) — values = [ , , ], remainingElementsCount = 1</text>
    <g fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5">
        <rect x="14" y="56" width="188" height="58" rx="8"/><rect x="216" y="56" width="188" height="58" rx="8"/><rect x="418" y="56" width="188" height="58" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#92400e">
        <text x="108" y="76">pA.then(f0, reject)</text><text x="310" y="76">pB.then(f1, reject)</text><text x="512" y="76">pC.then(f2, reject)</text>
        <text x="108" y="94">f0.[[Index]] = 0</text><text x="310" y="94">f1.[[Index]] = 1</text><text x="512" y="94">f2.[[Index]] = 2</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">
        <text x="108" y="108">счётчик + 1</text><text x="310" y="108">счётчик + 1</text><text x="512" y="108">счётчик + 1</text>
    </g>
    <g fill="none" stroke="#b45309" stroke-width="1.5">
        <path d="M 108 114 L 108 136 L 66 136 L 66 146"/><path d="M 310 114 L 310 128 L 116 128 L 116 146"/><path d="M 512 114 L 512 132 L 166 132 L 166 146"/>
    </g>
    <rect x="14" y="146" width="290" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g fill="#dcfce7" stroke="#16a34a" stroke-width="1.2">
        <rect x="44" y="154" width="44" height="22" rx="4"/><rect x="94" y="154" width="44" height="22" rx="4"/><rect x="144" y="154" width="44" height="22" rx="4"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#15803d">
        <text x="66" y="169">A</text><text x="116" y="169">B</text><text x="166" y="169">C</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="9.5" text-anchor="middle" fill="#64748b">
        <text x="66" y="189">0</text><text x="116" y="189">1</text><text x="166" y="189">2</text>
    </g>
    <text x="200" y="169" font-family="Consolas, monospace" font-size="10.5" fill="#334155">values</text>
    <rect x="318" y="146" width="288" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#334155">
        <text x="330" y="166">fi: values[i] = значение, счётчик − 1;</text><text x="330" y="184">при нуле — resolve(values) в порядке входа</text>
    </g>
    <rect x="14" y="208" width="592" height="32" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">reject у всех один: первый отказ отклоняет Promise.all; [[AlreadyCalled]] не даёт fi сработать дважды</text>
</svg>
