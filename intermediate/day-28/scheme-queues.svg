<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Цикл событий: из очереди задач берётся одна задача — скрипт, таймер или щелчок — и выполняется до конца; затем выполняется вся очередь микрозадач — then и продолжения после await, включая добавленные по ходу; потом берётся следующая задача">
    <rect x="14" y="14" width="170" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">очередь задач</text>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.2">
        <rect x="30" y="48" width="138" height="28" rx="6"/><rect x="30" y="84" width="138" height="28" rx="6"/><rect x="30" y="120" width="138" height="28" rx="6"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#334155">
        <text x="99" y="66">скрипт целиком</text><text x="99" y="102">таймер, 0 мс</text><text x="99" y="138">щелчок по кнопке</text>
    </g>
    <rect x="226" y="40" width="168" height="98" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <text x="310" y="64" font-size="11.5" font-weight="700" fill="#92400e">один поток</text>
        <text x="310" y="86" font-size="11" fill="#92400e">задача выполняется</text>
        <text x="310" y="104" font-size="11" fill="#92400e">до конца, стек пуст —</text>
        <text x="310" y="122" font-size="11" fill="#92400e">тогда микрозадачи</text>
    </g>
    <rect x="436" y="14" width="170" height="150" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="521" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">очередь микрозадач</text>
    <g fill="#ffffff" stroke="#16a34a" stroke-width="1.2">
        <rect x="452" y="48" width="138" height="28" rx="6"/><rect x="452" y="84" width="138" height="28" rx="6"/><rect x="452" y="120" width="138" height="28" rx="6"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#166534">
        <text x="521" y="66">then(…)</text><text x="521" y="102">после await</text><text x="521" y="138">новый then по ходу</text>
    </g>
    <g fill="none" stroke-width="1.8">
        <path d="M 184 70 L 218 70" stroke="#64748b"/><path d="M 394 70 L 428 70" stroke="#16a34a"/><path d="M 436 120 L 402 120" stroke="#16a34a"/>
    </g>
    <g>
        <path d="M 226 70 L 217 65 L 217 75 Z" fill="#64748b"/><path d="M 436 70 L 427 65 L 427 75 Z" fill="#16a34a"/><path d="M 394 120 L 403 115 L 403 125 Z" fill="#16a34a"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#475569">
        <text x="188" y="62">1</text><text x="410" y="62">2</text><text x="410" y="136">3</text>
    </g>
    <rect x="14" y="178" width="592" height="54" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#334155">
        <text x="310" y="199">1 — взять одну задачу и выполнить до конца; 2 — выполнить все микрозадачи,</text>
        <text x="310" y="219">3 — и те, что добавились по ходу, пока очередь не опустеет; потом снова 1.</text>
    </g>
</svg>
