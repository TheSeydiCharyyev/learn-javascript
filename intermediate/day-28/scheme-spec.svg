<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 236" role="img" aria-label="Шаги Await: значение превращается в промис через PromiseResolve; PerformPromiseThen подписывает на него продолжение функции и бросок в функцию; функция приостанавливается, управление возвращается вызвавшему; когда промис выполнится, задание NewPromiseReactionJob встаёт в очередь и возвращает функцию на стек со значением">
    <rect x="14" y="12" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="31" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">const words = await value;</text>
    <g fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5">
        <rect x="14" y="58" width="188" height="64" rx="8"/><rect x="216" y="58" width="188" height="64" rx="8"/><rect x="418" y="58" width="188" height="64" rx="8"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">
        <text x="108" y="80" font-weight="700">1. PromiseResolve</text><text x="108" y="98">value → промис;</text><text x="108" y="114">промис остаётся собой</text>
        <text x="310" y="80" font-weight="700">2. PerformPromiseThen</text><text x="310" y="98">продолжить функцию /</text><text x="310" y="114">бросить в функцию</text>
        <text x="512" y="80" font-weight="700">3. приостановка</text><text x="512" y="98">функция снята со стека,</text><text x="512" y="114">вызвавший идёт дальше</text>
    </g>
    <g fill="none" stroke="#b45309" stroke-width="1.8">
        <path d="M 202 90 L 208 90"/><path d="M 404 90 L 410 90"/><path d="M 512 122 L 512 142"/>
    </g>
    <g fill="#b45309">
        <path d="M 216 90 L 207 85 L 207 95 Z"/><path d="M 418 90 L 409 85 L 409 95 Z"/><path d="M 512 150 L 507 141 L 517 141 Z"/>
    </g>
    <rect x="216" y="150" width="390" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="411" y="166" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">промис выполнен → NewPromiseReactionJob в очередь →</text>
    <text x="411" y="182" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#166534">функция снова на стеке, await вернул значение</text>
    <rect x="14" y="150" width="188" height="40" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="108" y="174" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#475569">отклонён — ошибка из await</text>
    <rect x="14" y="200" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="219" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаг 2 — тот же then, что у промисов: поэтому продолжение после await всегда микрозадача.</text>
</svg>
