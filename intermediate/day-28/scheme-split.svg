<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Вызовы foo First и foo Second с одним await. В первой задаче — скрипте — печатаются First start, First middle, Second start, Second middle, и каждый вызов ставит продолжение в очередь микрозадач. Затем микрозадачи по порядку печатают First end и Second end">
    <rect x="14" y="14" width="360" height="148" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="194" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#92400e">задача: скрипт</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#334155">
        <text x="30" y="62">foo("First")</text><text x="30" y="80">  First start</text><text x="30" y="98">  First middle</text>
        <text x="30" y="116">  await → продолжение в очередь</text>
        <text x="210" y="62">foo("Second")</text><text x="210" y="80">  Second start</text><text x="210" y="98">  Second middle</text>
    </g>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">каждый вызов дошёл до await и вернул промис</text>
    <rect x="406" y="14" width="200" height="148" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="506" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">микрозадачи</text>
    <g fill="#ffffff" stroke="#16a34a" stroke-width="1.2">
        <rect x="422" y="50" width="168" height="28" rx="6"/><rect x="422" y="88" width="168" height="28" rx="6"/>
    </g>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#166534">
        <text x="506" y="68">1. First end</text><text x="506" y="106">2. Second end</text>
    </g>
    <text x="506" y="146" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">в порядке постановки</text>
    <path d="M 374 88 L 398 88" fill="none" stroke="#16a34a" stroke-width="1.8"/><path d="M 406 88 L 397 83 L 397 93 Z" fill="#16a34a"/>
    <rect x="14" y="176" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="196" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">До await — сразу, в текущей задаче; после await — микрозадача, после всего текущего кода.</text>
</svg>
