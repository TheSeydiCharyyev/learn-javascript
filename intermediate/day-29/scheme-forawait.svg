<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 252" role="img" aria-label="Шаги for await...of. Сначала цикл ищет у источника Symbol.asyncIterator; если его нет — Symbol.iterator и оборачивает обычный итератор в асинхронный; если нет обоих — TypeError is not async iterable. Затем повторяет: await next(); при done false — значение в переменную и тело цикла; при done true — конец. При break, ошибке или return — await return() и выход">
    <rect x="14" y="12" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="31" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#334155">for await (const x of source) { тело }</text>
    <g fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5">
        <rect x="14" y="62" width="188" height="56" rx="8"/><rect x="216" y="62" width="188" height="56" rx="8"/>
    </g>
    <rect x="418" y="62" width="188" height="56" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle">
        <text x="108" y="84" font-weight="700" fill="#92400e">1. [Symbol.asyncIterator]</text><text x="108" y="104" fill="#92400e">есть — берём его итератор</text>
        <text x="310" y="84" font-weight="700" fill="#92400e">2. нет — [Symbol.iterator]</text><text x="310" y="104" fill="#92400e">и обёртка Async-from-Sync</text>
        <text x="512" y="84" font-weight="700" fill="#991b1b">3. нет обоих</text><text x="512" y="104" fill="#991b1b">TypeError: … is not async iterable</text>
    </g>
    <g fill="none" stroke="#b45309" stroke-width="1.8">
        <path d="M 202 90 L 208 90"/><path d="M 404 90 L 410 90"/><path d="M 108 118 L 108 140"/><path d="M 310 118 L 310 129 L 120 129 L 120 140"/>
    </g>
    <g fill="#b45309">
        <path d="M 216 90 L 207 85 L 207 95 Z"/><path d="M 418 90 L 409 85 L 409 95 Z"/><path d="M 108 148 L 103 139 L 113 139 Z"/><path d="M 120 148 L 115 139 L 125 139 Z"/>
    </g>
    <rect x="14" y="148" width="290" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#166534">
        <text x="159" y="168" font-weight="700">4. await iterator.next()</text><text x="159" y="188">done: false → x = value, тело, снова 4</text>
    </g>
    <rect x="318" y="148" width="288" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#334155">
        <text x="462" y="168">done: true → цикл окончен;</text><text x="462" y="188">break, ошибка, return → await return()</text>
    </g>
    <path d="M 304 173 L 310 173" fill="none" stroke="#64748b" stroke-width="1.8"/><path d="M 318 173 L 309 168 L 309 178 Z" fill="#64748b"/>
    <rect x="14" y="214" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="233" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Шаг 4 — await: следующее значение не запрашивается, пока тело цикла не закончено.</text>
</svg>
