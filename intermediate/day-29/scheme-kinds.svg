<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 262" role="img" aria-label="Четыре вида функций. Одно значение сразу — обычная функция, f() возвращает 1. Много значений сразу — генератор function*, next() возвращает объект value и done. Одно значение потом — async function, вызов возвращает промис. Много значений потом — async function*, next() возвращает промис объекта value и done">
    <g font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">
        <text x="254" y="32">одно значение</text><text x="492" y="32">много значений</text>
        <text x="69" y="84">сразу</text><text x="69" y="172">потом</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">
        <text x="69" y="102">значение</text><text x="69" y="190">через промис</text>
    </g>
    <g fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5">
        <rect x="140" y="48" width="228" height="80" rx="10"/><rect x="378" y="48" width="228" height="80" rx="10"/>
        <rect x="140" y="136" width="228" height="80" rx="10"/>
    </g>
    <rect x="378" y="136" width="228" height="80" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <g font-family="Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#334155">
        <text x="254" y="72">function</text><text x="492" y="72">function*</text><text x="254" y="160">async function</text>
    </g>
    <text x="492" y="160" font-family="Consolas, monospace" font-size="11.5" font-weight="700" text-anchor="middle" fill="#92400e">async function*</text>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="254" y="94">f() → 1</text><text x="492" y="94">g().next() → {value, done}</text><text x="254" y="182">f() → Promise</text>
    </g>
    <text x="492" y="182" font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#92400e">g().next() → Promise {value, done}</text>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#64748b">
        <text x="254" y="114">день 12 Essentials</text><text x="492" y="114">день 12</text><text x="254" y="202">день 31 Essentials, день 28</text>
    </g>
    <text x="492" y="202" font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#92400e">сегодня</text>
    <rect x="14" y="226" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="245" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Асинхронный генератор — генератор, у которого каждый next() возвращает промис.</text>
</svg>
