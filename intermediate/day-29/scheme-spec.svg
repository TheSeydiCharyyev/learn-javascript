<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 230" role="img" aria-label="Очередь запросов асинхронного генератора. Вызывающий код трижды вызывает методы: next, next, return. Каждый вызов создаёт промис и дописывает запрос в очередь AsyncGeneratorQueue. Генератор в состоянии executing берёт первый запрос: yield выполняет его промис и, если очередь не пуста, продолжает без паузы. Когда очередь пуста, генератор встаёт на паузу suspended-yield">
    <rect x="14" y="14" width="170" height="146" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="99" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#334155">вызывающий код</text>
    <g font-family="Consolas, monospace" font-size="11" fill="#334155">
        <text x="30" y="66">g.next()</text><text x="30" y="92">g.next()</text><text x="30" y="118">g.return("стоп")</text>
    </g>
    <text x="30" y="146" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#64748b">не дожидаясь ответов</text>
    <rect x="218" y="14" width="186" height="146" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="311" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" font-weight="700" fill="#92400e">[[AsyncGeneratorQueue]]</text>
    <g fill="#ffffff" stroke="#f59e0b" stroke-width="1.2">
        <rect x="232" y="48" width="158" height="26" rx="6"/><rect x="232" y="80" width="158" height="26" rx="6"/><rect x="232" y="112" width="158" height="26" rx="6"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" text-anchor="middle" fill="#92400e">
        <text x="311" y="65">1. next → промис 1</text><text x="311" y="97">2. next → промис 2</text><text x="311" y="129">3. return → промис 3</text>
    </g>
    <rect x="438" y="14" width="168" height="146" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="522" y="36" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#166534">генератор: executing</text>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#166534">
        <text x="522" y="64">yield выполняет промис</text><text x="522" y="82">первого запроса;</text>
        <text x="522" y="106">очередь не пуста —</text><text x="522" y="124">дальше без паузы;</text><text x="522" y="148">пуста — suspended-yield</text>
    </g>
    <g fill="none" stroke-width="1.8">
        <path d="M 184 87 L 210 87" stroke="#b45309"/><path d="M 404 61 L 430 61" stroke="#16a34a"/>
    </g>
    <g>
        <path d="M 218 87 L 209 82 L 209 92 Z" fill="#b45309"/><path d="M 438 61 L 429 56 L 429 66 Z" fill="#16a34a"/>
    </g>
    <rect x="14" y="176" width="592" height="46" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="11.5" text-anchor="middle" fill="#334155">
        <text x="310" y="195">Пока генератор занят, next, return и throw только встают в очередь (27.6.3.4);</text>
        <text x="310" y="213">каждый yield отвечает на первый запрос, и ответы идут в порядке вызовов.</text>
    </g>
</svg>
