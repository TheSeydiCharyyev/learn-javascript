<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 240" role="img" aria-label="Граф модулей: index.html подключает main.js как модуль; main.js импортирует words и count из words.js. У каждого файла своя область: secret остаётся внутри words.js, а наружу выходит только экспортированное">
    <rect x="14" y="14" width="150" height="56" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#334155">
        <text x="89" y="38">index.html</text><text x="89" y="56">type="module"</text>
    </g>
    <rect x="14" y="100" width="250" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="139" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1e293b">main.js</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#334155">
        <text x="30" y="146">import { words, count }</text><text x="30" y="164">  from "./words.js";</text><text x="30" y="182">console.log(…)</text>
    </g>
    <rect x="356" y="100" width="250" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="481" y="122" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1e293b">words.js</text>
    <g font-family="Consolas, monospace" font-size="10.5" fill="#334155">
        <text x="372" y="146">export const words</text><text x="372" y="164">export function count</text>
    </g>
    <text x="372" y="182" font-family="Consolas, monospace" font-size="10.5" fill="#94a3b8">const secret — внутри</text>
    <g fill="none" stroke-width="1.8">
        <path d="M 89 70 L 89 92" stroke="#94a3b8"/><path d="M 264 145 L 348 145" stroke="#64748b"/>
    </g>
    <g>
        <path d="M 89 100 L 84 91 L 94 91 Z" fill="#94a3b8"/><path d="M 356 145 L 347 140 L 347 150 Z" fill="#64748b"/>
    </g>
    <text x="310" y="137" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">import</text>
    <rect x="14" y="204" width="592" height="30" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="223" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">У каждого модуля своя область; наружу выходит только то, что помечено export.</text>
</svg>
