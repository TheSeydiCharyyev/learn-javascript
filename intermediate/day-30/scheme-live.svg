<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Живая привязка: в counter.js живёт переменная count со значением 2. Импорт count в main.js и в report.js — не копия, а ссылка на эту переменную. increment в counter.js меняет её, оба импортёра видят 2. Присваивание count в main.js — TypeError">
    <rect x="218" y="14" width="186" height="96" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="311" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="11.5" font-weight="700" fill="#1e293b">counter.js</text>
    <rect x="250" y="48" width="122" height="28" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
    <text x="311" y="66" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#1e293b">count: 2</text>
    <text x="311" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#475569">increment() пишет сюда</text>
    <rect x="14" y="126" width="170" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="99" y="148">main.js: count → 2</text><text x="99" y="166" fill="#b91c1c">count = 10 → TypeError</text>
    </g>
    <rect x="436" y="126" width="170" height="52" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Consolas, monospace" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="521" y="148">report.js: count → 2</text><text x="521" y="166">только читает</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.8" stroke-dasharray="5 4">
        <path d="M 140 126 L 250 76"/><path d="M 480 126 L 372 76"/>
    </g>
    <g fill="#64748b">
        <path d="M 250 76 L 238 77 L 243 86 Z"/><path d="M 372 76 L 379 86 L 384 77 Z"/>
    </g>
    <rect x="14" y="190" width="592" height="20" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="204" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">Импорт — не копия, а окно в переменную модуля-владельца (CreateImportBinding, 9.1.1.5.5).</text>
</svg>
