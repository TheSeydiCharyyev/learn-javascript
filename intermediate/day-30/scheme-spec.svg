<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Три этапа модулей. Загрузка: хозяин находит и загружает все файлы графа и разбирает их; ошибки — 404, CORS, тип файла, синтаксис. Связывание Link: создаются области модулей и привязки импортов к экспортам; ошибки — нет такого экспорта, конфликт звёздочек. Выполнение Evaluate: обход в глубину, зависимости первыми, каждый модуль один раз; ошибки — обычные, во время работы. Ошибка на первых двух этапах — не выполнится ни один модуль">
    <g fill="#f8fafc" stroke="#64748b" stroke-width="1.8">
        <rect x="14" y="14" width="188" height="112" rx="10"/><rect x="216" y="14" width="188" height="112" rx="10"/><rect x="418" y="14" width="188" height="112" rx="10"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle" fill="#1e293b">
        <text x="108" y="38">1. Загрузка и разбор</text><text x="310" y="38">2. Связывание (Link)</text><text x="512" y="38">3. Выполнение</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="108" y="62">хозяин грузит все файлы</text><text x="108" y="80">графа и разбирает их</text>
        <text x="310" y="62">области модулей,</text><text x="310" y="80">импорт → экспорт</text>
        <text x="512" y="62">в глубину: зависимости</text><text x="512" y="80">первыми, каждый один раз</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#b91c1c">
        <text x="108" y="104">404, CORS, тип файла,</text><text x="108" y="118">SyntaxError</text>
        <text x="310" y="104">«does not provide an export»,</text><text x="310" y="118">conflicting star exports</text>
        <text x="512" y="104">ошибки кода во время</text><text x="512" y="118">работы, ReferenceError цикла</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.8">
        <path d="M 202 70 L 208 70"/><path d="M 404 70 L 410 70"/>
    </g>
    <g fill="#64748b">
        <path d="M 216 70 L 207 65 L 207 75 Z"/><path d="M 418 70 L 409 65 L 409 75 Z"/>
    </g>
    <rect x="14" y="140" width="592" height="34" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="161" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#334155">[[Status]]: new → unlinked → linking → linked → evaluating → evaluated</text>
    <rect x="14" y="186" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="207" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#334155">Ошибка на этапах 1–2 — не выполнится ни один модуль графа, даже без ошибок в нём.</text>
</svg>
