<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Статический и динамический импорт на шкале времени. Статический import: модули графа грузятся и выполняются при открытии страницы, до кода main.js. Динамический import: quiz.js запрашивается только при первом щелчке, выполняется один раз; второй щелчок берёт тот же объект модуля из кеша без запроса">
    <path d="M 30 186 L 600 186" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M 608 186 L 598 181 L 598 191 Z" fill="#94a3b8"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="30" y="204">открытие страницы</text><text x="300" y="204">1-й щелчок</text><text x="470" y="204">2-й щелчок</text>
    </g>
    <rect x="30" y="20" width="230" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="145" y="42" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" font-weight="700" fill="#1e293b">статический import</text>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="145" y="60">весь граф — до кода main.js,</text><text x="145" y="76">нужен он или нет</text>
    </g>
    <rect x="290" y="100" width="150" height="64" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#92400e">
        <text x="365" y="122" font-weight="700">import("./quiz.js")</text><text x="365" y="140">запрос, разбор,</text><text x="365" y="156">выполнение</text>
    </g>
    <rect x="460" y="100" width="140" height="64" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="530" y="122" font-weight="700">import("./quiz.js")</text><text x="530" y="140">тот же объект модуля,</text><text x="530" y="156">без запроса</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4">
        <path d="M 145 84 L 145 180"/><path d="M 365 164 L 365 180"/><path d="M 530 164 L 530 180"/>
    </g>
</svg>
