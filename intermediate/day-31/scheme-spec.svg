<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 226" role="img" aria-label="Порядок вызовов на объекте name, marks из двух оценок, group с title. replacer в stringify идёт сверху вниз: корень, name, marks, 0, 1, group, title. reviver в parse идёт снизу вверх: name, 0, 1, marks, title, group, корень последним">
    <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
        <rect x="250" y="12" width="120" height="30" rx="8"/>
        <rect x="40" y="76" width="120" height="30" rx="8"/><rect x="250" y="76" width="120" height="30" rx="8"/><rect x="460" y="76" width="120" height="30" rx="8"/>
        <rect x="200" y="140" width="80" height="30" rx="8"/><rect x="340" y="140" width="80" height="30" rx="8"/><rect x="480" y="140" width="80" height="30" rx="8"/>
    </g>
    <g font-family="Consolas, monospace" font-size="11" text-anchor="middle" fill="#1e293b">
        <text x="310" y="31">"" (корень)</text>
        <text x="100" y="95">name</text><text x="310" y="95">marks</text><text x="520" y="95">group</text>
        <text x="240" y="159">0</text><text x="380" y="159">1</text><text x="520" y="159">title</text>
    </g>
    <g fill="none" stroke="#94a3b8" stroke-width="1.5">
        <path d="M 280 42 L 120 76"/><path d="M 310 42 L 310 76"/><path d="M 340 42 L 500 76"/>
        <path d="M 290 106 L 250 140"/><path d="M 330 106 L 370 140"/><path d="M 520 106 L 520 140"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#b45309">
        <text x="374" y="30">replacer 1</text><text x="164" y="94">2</text><text x="374" y="94">3</text><text x="584" y="94">6</text>
        <text x="284" y="158">4</text><text x="424" y="158">5</text><text x="564" y="158">7</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" fill="#15803d">
        <text x="198" y="30">reviver 7</text><text x="22" y="94">1</text><text x="232" y="94">4</text><text x="442" y="94">6</text>
        <text x="188" y="158">2</text><text x="328" y="158">3</text><text x="468" y="158">5</text>
    </g>
    <rect x="14" y="186" width="592" height="34" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="207" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">replacer (stringify) — сверху вниз, корень первым; reviver (parse) — снизу вверх, корень последним.</text>
</svg>
