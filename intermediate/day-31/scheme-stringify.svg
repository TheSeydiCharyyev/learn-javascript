<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 244" role="img" aria-label="Шаги SerializeJSONProperty для одного свойства: 1 взять значение; 2 если есть toJSON — вызвать его с ключом; 3 если есть replacer — вызвать его, this — объект-хозяин; 4 объект из JSON.rawJSON — его текст как есть; обёртки Number, String, Boolean, BigInt — развернуть; 5 null, true, false, строка, конечное число — записать, NaN и Infinity — null, BigInt — TypeError, объект и массив — по свойствам с проверкой цикла; функция, undefined, символ — ничего">
    <g fill="#f8fafc" stroke="#64748b" stroke-width="1.5">
        <rect x="14" y="14" width="140" height="62" rx="8"/><rect x="168" y="14" width="140" height="62" rx="8"/>
        <rect x="322" y="14" width="140" height="62" rx="8"/><rect x="476" y="14" width="130" height="62" rx="8"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="11" font-weight="700" text-anchor="middle" fill="#1e293b">
        <text x="84" y="38">1. Get(holder, key)</text><text x="238" y="38">2. toJSON(key)</text>
        <text x="392" y="38">3. replacer</text><text x="541" y="38">4. rawJSON?</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10" text-anchor="middle" fill="#1e293b">
        <text x="84" y="58">значение свойства</text><text x="238" y="58">если есть: дата, Temporal</text>
        <text x="392" y="58">this — хозяин, (key, value)</text><text x="541" y="58">текст как есть</text>
    </g>
    <g fill="none" stroke="#64748b" stroke-width="1.8">
        <path d="M 154 45 L 160 45"/><path d="M 308 45 L 314 45"/><path d="M 462 45 L 468 45"/><path d="M 541 76 L 541 92"/>
    </g>
    <g fill="#64748b">
        <path d="M 168 45 L 159 40 L 159 50 Z"/><path d="M 322 45 L 313 40 L 313 50 Z"/><path d="M 476 45 L 467 40 L 467 50 Z"/><path d="M 541 100 L 536 91 L 541 91 L 546 91 Z"/>
    </g>
    <rect x="14" y="100" width="592" height="30" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="310" y="119" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">обёртки new Number, new String, new Boolean, Object(1n) — развернуть в примитив</text>
    <g fill="#ffffff" stroke="#94a3b8" stroke-width="1.5">
        <rect x="14" y="142" width="188" height="56" rx="8"/><rect x="216" y="142" width="188" height="56" rx="8"/><rect x="418" y="142" width="188" height="56" rx="8"/>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">
        <text x="108" y="164">null, true, false, строка,</text><text x="108" y="182">конечное число; NaN → null</text>
        <text x="310" y="164">объект, массив — по свойствам,</text><text x="310" y="182">цикл → TypeError</text>
        <text x="512" y="164">BigInt → TypeError;</text><text x="512" y="182">функция, undefined, символ → нет</text>
    </g>
    <rect x="14" y="210" width="592" height="28" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text x="310" y="228" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#334155">«Нет» в объекте — свойство пропущено, в массиве — null (25.5.4.5–25.5.4.6).</text>
</svg>
