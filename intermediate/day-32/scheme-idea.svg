<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 274" role="img" aria-label="Граф модулей расписания. main.js статически импортирует data/groups.json, load.js, format.js и search.js. load.js импортирует lesson.js и errors.js и динамически, через import(), загружает файлы групп data/js-1.json, data/js-2.json, data/cpp-1.json. format.js использует Intl, lesson.js — Temporal, search.js — RegExp.escape. main.js держит состояние: язык, запрос, занятия, и рисует страницу">
