        <text x="432" y="76" fill="#854d0e" font-weight="700">проверка</text><text x="432" y="94" fill="#475569" font-size="10.5">вкладка и руками</text>
        <rect x="498" y="54" width="112" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
