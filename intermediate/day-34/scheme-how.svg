<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 205" role="img" aria-label="Цикл задачи: взять задачу, написать проверки, написать код, проверить на вкладке проверок и руками; если вкладка не молчит — спросить данные и вернуться к коду; если молчит — отметить в плане и взять следующую задачу">
