        </marker>
    </defs>
    <path d="M 30 120 L 600 120" stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#i34-b)"/>
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="31" y="66" width="58" height="36" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="60" y="81" font-size="11.5" font-weight="700" fill="#854d0e">«Знаю»</text><text x="60" y="96" font-size="10" fill="#475569">шаг 1 → 2</text>
        <rect x="102" y="66" width="58" height="36" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
