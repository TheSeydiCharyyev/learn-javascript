        <rect x="245" y="66" width="58" height="36" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="274" y="81" font-size="11.5" font-weight="700" fill="#854d0e">«Знаю»</text><text x="274" y="96" font-size="10" fill="#475569">шаг 4 → 8</text>
        <rect x="516" y="66" width="88" height="36" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="560" y="81" font-size="11.5" font-weight="700" fill="#166534">снова</text><text x="560" y="96" font-size="10" fill="#475569">в due(today)</text>
        <g font-size="11" fill="#334155">
            <text x="60" y="140">26 окт</text><text x="131" y="140">28 окт</text><text x="274" y="140">1 ноя</text><text x="560" y="140">9 ноя</text>
