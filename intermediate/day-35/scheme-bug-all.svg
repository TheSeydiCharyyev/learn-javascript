<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 214" role="img" aria-label="Две загрузки: колода еда отказала с 404, колода дом выполнена. Promise.all отклонён на отказе еды, в opened никого, поиск w пуст и красная строка in promise. Promise.allSettled даёт отчёты rejected и fulfilled, в opened ложится дом, поиск w находит window">
    <defs>
        <marker id="i35-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="10" y="40" width="150" height="46" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <text x="85" y="59" fill="#991b1b" font-weight="700">loadDeck(«еда»)</text><text x="85" y="76" fill="#475569" font-size="10.5">404 — отказ</text>
        <rect x="10" y="124" width="150" height="46" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="85" y="143" fill="#166534" font-weight="700">loadDeck(«дом»)</text><text x="85" y="160" fill="#475569" font-size="10.5">выполнен</text>

        <rect x="232" y="22" width="160" height="56" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="312" y="45" fill="#854d0e" font-weight="700" font-family="Consolas, monospace">Promise.all</text><text x="312" y="64" fill="#475569" font-size="10.5">отклонён: отказ «еды»</text>
        <rect x="232" y="132" width="160" height="56" rx="8" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="312" y="155" fill="#854d0e" font-weight="700" font-family="Consolas, monospace">Promise.allSettled</text><text x="312" y="174" fill="#475569" font-size="10.5" font-family="Consolas, monospace">[rejected, fulfilled]</text>

        <rect x="460" y="22" width="150" height="56" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <text x="535" y="45" fill="#991b1b" font-weight="700">в opened — никого</text><text x="535" y="64" fill="#475569" font-size="10.5">«w»: пусто, in promise</text>
        <rect x="460" y="132" width="150" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="535" y="155" fill="#166534" font-weight="700">в opened — «дом»</text><text x="535" y="174" fill="#475569" font-size="10.5">«w»: window — окно</text>
    </g>
    <g stroke="#a16207" stroke-width="1.6" fill="none">
        <path d="M 162 56 L 228 46" marker-end="url(#i35-b)"/>
        <path d="M 162 70 L 228 148" marker-end="url(#i35-b)"/>
        <path d="M 162 140 L 228 62" marker-end="url(#i35-b)"/>
        <path d="M 162 154 L 228 166" marker-end="url(#i35-b)"/>
        <path d="M 394 50 L 456 50" marker-end="url(#i35-b)"/>
        <path d="M 394 160 L 456 160" marker-end="url(#i35-b)"/>
    </g>
    <text x="310" y="208" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">all ждёт всех, пока нет отказа; allSettled — всех, как бы они ни кончились</text>
</svg>
