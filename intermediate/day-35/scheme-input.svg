<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 232" role="img" aria-label="Три входа данных и их сторожа: хранилище проверяет readProgress, и в программу приходит Map, которому можно верить; файл колоды проверяют loadDeck и конструктор Deck, и колода ложится в opened или на странице ошибка, а тренажёр спрятан; decks.json сторожит страница проверок после каждой правки файлов">
    <defs>
        <marker id="i35-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" font-size="11" fill="#475569" text-anchor="middle">
        <text x="85" y="16">откуда</text><text x="310" y="16">сторож</text><text x="535" y="16">что получает программа</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="12" text-anchor="middle">
        <rect x="10" y="26" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="85" y="47" fill="#334155" font-weight="700">хранилище</text><text x="85" y="65" fill="#475569" font-size="10.5">localStorage</text>
        <rect x="225" y="26" width="170" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="310" y="47" fill="#854d0e" font-weight="700">readProgress</text><text x="310" y="65" fill="#475569" font-size="10.5">Map? в записях дата и шаг?</text>
        <rect x="460" y="26" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="535" y="47" fill="#166534" font-weight="700">progress</text><text x="535" y="65" fill="#475569" font-size="10.5">Map, которому верим</text>

        <rect x="10" y="96" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="85" y="117" fill="#334155" font-weight="700">файл колоды</text><text x="85" y="135" fill="#475569" font-size="10.5">import() при выборе</text>
        <rect x="225" y="96" width="170" height="50" rx="8" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="310" y="117" fill="#854d0e" font-weight="700">loadDeck, new Deck</text><text x="310" y="135" fill="#475569" font-size="10.5">сторож: пусто, повтор номера</text>
        <rect x="460" y="96" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="535" y="117" fill="#166534" font-weight="700">opened или #error</text><text x="535" y="135" fill="#475569" font-size="10.5">тренажёр спрятан</text>

        <rect x="10" y="166" width="150" height="50" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="85" y="187" fill="#334155" font-weight="700">decks.json</text><text x="85" y="205" fill="#475569" font-size="10.5">import наверху</text>
        <rect x="225" y="166" width="170" height="50" rx="8" fill="#ffffff" stroke="#eab308" stroke-width="2" stroke-dasharray="5 3"/>
        <text x="310" y="187" fill="#854d0e" font-weight="700">страница проверок</text><text x="310" y="205" fill="#475569" font-size="10.5">после каждой правки файлов</text>
        <rect x="460" y="166" width="150" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="535" y="187" fill="#166534" font-weight="700">кнопки колод</text><text x="535" y="205" fill="#475569" font-size="10.5">часть программы</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 162 51 L 221 51" marker-end="url(#i35-a)"/>
        <path d="M 397 51 L 456 51" marker-end="url(#i35-a)"/>
        <path d="M 162 121 L 221 121" marker-end="url(#i35-a)"/>
        <path d="M 397 121 L 456 121" marker-end="url(#i35-a)"/>
        <path d="M 162 191 L 221 191" marker-end="url(#i35-a)" stroke-dasharray="5 3"/>
        <path d="M 397 191 L 456 191" marker-end="url(#i35-a)" stroke-dasharray="5 3"/>
    </g>
</svg>
