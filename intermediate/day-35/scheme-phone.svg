<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 205" role="img" aria-label="Слева телефон с overflow-wrap: перевод в две строки, scrollWidth, innerWidth и screen.width — все 360. Справа без overflow-wrap: перевод в одну строку вылезает за экран, страница 376, scrollWidth и innerWidth 376, screen.width 360">
    <g font-family="Segoe UI, sans-serif" font-size="12.5" font-weight="700">
        <text x="20" y="18" fill="#166534">overflow-wrap: anywhere</text>
        <text x="330" y="18" fill="#991b1b">без overflow-wrap</text>
    </g>
    <rect x="20" y="30" width="140" height="165" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="30" y="44" width="120" height="136" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="38" y="70" width="104" height="56" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <rect x="52" y="84" width="76" height="9" rx="2" fill="#94a3b8"/>
    <rect x="62" y="102" width="56" height="9" rx="2" fill="#94a3b8"/>
    <g font-family="Consolas, monospace" font-size="11.5" fill="#166534">
        <text x="174" y="84">scrollWidth  360</text>
        <text x="174" y="104">innerWidth   360</text>
        <text x="174" y="124">screen.width 360</text>
    </g>
    <rect x="330" y="30" width="140" height="165" rx="14" fill="#ffffff" stroke="#475569" stroke-width="2"/>
    <rect x="340" y="44" width="120" height="136" fill="#fef2f2" stroke="#fca5a5"/>
    <rect x="340" y="40" width="156" height="144" fill="none" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="5 3"/>
    <rect x="348" y="70" width="104" height="56" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
    <rect x="362" y="93" width="132" height="9" rx="2" fill="#dc2626"/>
    <g font-family="Consolas, monospace" font-size="11.5">
        <text x="506" y="84" fill="#991b1b">scrollWidth  376</text>
        <text x="506" y="104" fill="#991b1b">innerWidth   376</text>
        <text x="506" y="124" fill="#166534">screen.width 360</text>
    </g>
    <g font-family="Segoe UI, sans-serif" font-size="10.5" fill="#475569">
        <text x="174" y="156">все три равны</text>
        <text x="506" y="156">честна только</text>
        <text x="506" y="170">ширина экрана</text>
    </g>
</svg>
