<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 170" role="img" aria-label="Семь минут защиты: фраза полминуты, показ две минуты, курс 2 в коде минута, решение минута, ошибка минута, вопросы полторы минуты">
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="10" y="40" width="43" height="56" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <rect x="53" y="40" width="171" height="56" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <rect x="224" y="40" width="86" height="56" fill="#f0f9ff" stroke="#0369a1" stroke-width="2"/>
        <rect x="310" y="40" width="86" height="56" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <rect x="396" y="40" width="86" height="56" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
        <rect x="482" y="40" width="128" height="56" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="31" y="73" font-size="10.5" fill="#854d0e">фраза</text>
        <text x="138" y="66" font-size="13" font-weight="700" fill="#854d0e">показ по сценарию</text>
        <text x="138" y="84" font-size="10.5" fill="#475569">действие → что видно</text>
        <text x="267" y="66" font-size="12" font-weight="700" fill="#0369a1">курс 2</text>
        <text x="267" y="84" font-size="10.5" fill="#475569">где в коде</text>
        <text x="353" y="66" font-size="12" font-weight="700" fill="#854d0e">решение</text>
        <text x="353" y="84" font-size="10.5" fill="#475569">почему так</text>
        <text x="439" y="66" font-size="12" font-weight="700" fill="#991b1b">ошибка</text>
        <text x="439" y="84" font-size="10.5" fill="#475569">как нашли</text>
        <text x="546" y="66" font-size="12" font-weight="700" fill="#166534">вопросы</text>
        <text x="546" y="84" font-size="10.5" fill="#475569">от проверяющего</text>
        <g font-size="10.5" fill="#475569">
            <text x="14" y="116">0</text><text x="53" y="116">0:30</text><text x="224" y="116">2:30</text>
            <text x="310" y="116">3:30</text><text x="396" y="116">4:30</text><text x="482" y="116">5:30</text><text x="596" y="116">7:00</text>
        </g>
        <text x="310" y="24" font-size="12" fill="#475569">польза — сначала, устройство — потом, время на вопросы — гарантировано</text>
        <text x="310" y="150" font-size="11" fill="#475569">хронометр — асинхронный генератор: часть за частью</text>
    </g>
</svg>
