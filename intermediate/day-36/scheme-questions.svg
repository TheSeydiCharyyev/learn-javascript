<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 200" role="img" aria-label="Три вида вопросов: где — показать файл и строку; что будет, если — проверить на вкладке проверок или в консоли; почему не — назвать причину или честно отложить">
    <defs>
        <marker id="i36-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a16207"/>
        </marker>
    </defs>
    <g font-family="Segoe UI, sans-serif" text-anchor="middle">
        <rect x="10" y="14" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="36" font-size="13" font-weight="700" fill="#854d0e">«Где …?»</text>
        <text x="115" y="53" font-size="10.5" fill="#475569">в каком файле прогресс</text>
        <rect x="10" y="76" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="98" font-size="13" font-weight="700" fill="#854d0e">«Что будет, если …?»</text>
        <text x="115" y="115" font-size="10.5" fill="#475569">один номер в двух колодах</text>
        <rect x="10" y="138" width="210" height="48" rx="10" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
        <text x="115" y="160" font-size="13" font-weight="700" fill="#854d0e">«Почему не …?»</text>
        <text x="115" y="177" font-size="10.5" fill="#475569">почему не все колоды сразу</text>
        <rect x="360" y="14" width="250" height="48" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="485" y="36" font-size="12.5" font-weight="700" fill="#854d0e">показать файл и строку</text>
        <text x="485" y="53" font-size="10.5" fill="#475569">граф модулей помогает найти</text>
        <rect x="360" y="76" width="250" height="48" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
        <text x="485" y="98" font-size="12.5" font-weight="700" fill="#166534">проверить: вкладка или консоль</text>
        <text x="485" y="115" font-size="10.5" fill="#475569">не гадать: сделать и посмотреть</text>
        <rect x="360" y="138" width="250" height="48" rx="10" fill="#ffffff" stroke="#a16207" stroke-width="2"/>
        <text x="485" y="160" font-size="12.5" font-weight="700" fill="#854d0e">назвать причину</text>
        <text x="485" y="177" font-size="10.5" fill="#475569">или честно: «не проверял — в „потом“»</text>
    </g>
    <g stroke="#a16207" stroke-width="2" fill="none">
        <path d="M 222 38 L 356 38" marker-end="url(#i36-a)"/>
        <path d="M 222 100 L 356 100" marker-end="url(#i36-a)"/>
        <path d="M 222 162 L 356 162" marker-end="url(#i36-a)"/>
    </g>
</svg>
